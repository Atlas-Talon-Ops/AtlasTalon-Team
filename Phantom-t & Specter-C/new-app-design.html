        // ═══ TOOLBAR ═══
        function Toolbar({ breadcrumbs, setCurrentFolder, setView, viewMode, setViewMode, sortBy, setSortBy, sortDir, setSortDir, selected, onCopy, onPaste, onDelete, onRestore, onEmptyTrash, onNewFolder, onUpload, setModal, isTrashView, trashCount }) {
            return (
                <div className="exp-toolbar">
                    <div className="breadcrumbs">
                        <span className="crumb" onClick={() => { setView('drive'); setCurrentFolder('root'); }}>ROOT</span>
                        {breadcrumbs.map(b => (
                            <React.Fragment key={b.id}>
                                <span className="crumb-sep">/</span>
                                <span className="crumb" onClick={() => { setView('drive'); setCurrentFolder(b.id); }}>{b.name.toUpperCase()}</span>
                            </React.Fragment>
                        ))}
                    </div>

                    {!isTrashView && <>
                        <button className="tool-btn" onClick={onNewFolder}>+ FOLDER</button>
                        <button className="tool-btn" onClick={onUpload}>↑ UPLOAD</button>
                        <button className="tool-btn" onClick={onCopy} disabled={selected.length === 0}>COPY</button>
                        <button className="tool-btn" onClick={onPaste}>PASTE</button>
                        <button className="tool-btn danger" onClick={onDelete} disabled={selected.length === 0}>DELETE</button>
                    </>}

                    {isTrashView && <>
                        <button className="tool-btn" onClick={onRestore} disabled={selected.length === 0}>↺ RESTORE</button>
                        <button className="tool-btn danger" onClick={onDelete} disabled={selected.length === 0}>⌫ DELETE</button>
                        <button className="tool-btn danger" onClick={onEmptyTrash} disabled={trashCount === 0}>EMPTY TRASH</button>
                    </>}

                    <select className="tool-btn" style={{ cursor: 'pointer', appearance: 'none', paddingRight: 16 }} value={`${sortBy}-${sortDir}`}
                        onChange={(e) => { const [s, d] = e.target.value.split('-'); setSortBy(s); setSortDir(d); }}>
                        <option value="name-asc">NAME ↑</option>
                        <option value="name-desc">NAME ↓</option>
                        <option value="size-asc">SIZE ↑</option>
                        <option value="size-desc">SIZE ↓</option>
                        <option value="modified-asc">DATE ↑</option>
                        <option value="modified-desc">DATE ↓</option>
                    </select>

                    <div className="view-toggle">
                        <button className={`view-btn ${viewMode === 'list-view' ? 'active' : ''}`} onClick={() => setViewMode('list-view')}>≡</button>
                        <button className={`view-btn ${viewMode === 'grid-view' ? 'active' : ''}`} onClick={() => setViewMode('grid-view')}>▦</button>
                        <button className={`view-btn ${viewMode === 'large-grid' ? 'active' : ''}`} onClick={() => setViewMode('large-grid')}>▣</button>
                        <button className={`view-btn ${viewMode === 'compact-grid' ? 'active' : ''}`} onClick={() => setViewMode('compact-grid')}>▤</button>
                    </div>

                    <button className="tool-btn" onClick={() => setModal({ type: 'settings' })} title="Settings">
                        <Icons.Settings />
                    </button>
                </div>
            );
        }

        // ═══ FILE CARD ═══
        function FileCard({ file, viewMode, selected, onSelect, onOpen, onContext, onDownload, isTrash, onRestore }) {
            const meta = getFileMeta(file);
            const fileType = getFileType(file);
            const IconComponent = getIconComponent(file);
            const isVideo = fileType === 'video';
            const isImage = fileType === 'image';
            const hasThumb = file.url && (isImage || isVideo);
            const [thumbFailed, setThumbFailed] = useState(false);

            const handleDouble = () => {
                if (isTrash) { onRestore && onRestore(); return; }
                if (file.locked) { onDownload && onDownload(file); return; }
                onOpen();
            };

            return (
                <div className={`file-card ${viewMode} ${selected ? 'selected' : ''}`}
                    onClick={onSelect} onDoubleClick={handleDouble} onContextMenu={onContext}>
                    <div className="fc-icon-area">
                        {hasThumb && !thumbFailed ? (
                            isVideo ? (
                                <video src={file.url} className="fc-thumb" muted preload="metadata" onError={() => setThumbFailed(true)} />
                            ) : (
                                <img src={file.url} className="fc-thumb" alt={file.name} onError={() => setThumbFailed(true)} />
                            )
                        ) : (
                            <div className="fc-type-icon" style={{ '--c': meta.color }}>
                                <IconComponent />
                            </div>
                        )}

                        <div className="fc-badges">
                            {file.starred && <div className="fc-badge star"><Icons.Star /></div>}
                            {file.locked && <div className="fc-badge lock"><Icons.Lock /></div>}
                            {file.isLink && <div className="fc-badge link"><Icons.Link /></div>}
                        </div>

                        {isVideo && (
                            <div className="fc-badge video-badge">
                                <Icons.Play />
                                <span>{file.name.split('.').pop()?.toUpperCase() || 'VIDEO'}</span>
                            </div>
                        )}
                    </div>

                    <div className="fc-meta">
                        <div className="fc-name">
                            {file.isLink && <Icons.Link />}
                            {file.name}
                        </div>
                        <div className="fc-info">
                            {file.type !== 'folder' ? formatBytes(file.size) : 'FOLDER'} · {formatDate(file.modified)}
                        </div>
                    </div>
                </div>
            );
        }

        // ═══ CONTEXT MENU ═══
        function ContextMenu({ x, y, file, onOpen, onDownload, onCopy, onPaste, onRename, onStar, onSetPassword, onRemovePassword, onDelete, onRestore }) {
            const isTrash = file.trashed;
            const style = {
                top: Math.min(y, window.innerHeight - 320),
                left: Math.min(x, window.innerWidth - 220)
            };

            return (
                <div className="ctx-menu" style={style} onClick={(e) => e.stopPropagation()}>
                    {!isTrash && <div className="ctx-item" onClick={onOpen}>OPEN</div>}
                    {!isTrash && file.type !== 'folder' && <div className="ctx-item" onClick={onDownload}>DOWNLOAD</div>}
                    {!isTrash && file.type === 'folder' && <div className="ctx-item" onClick={onOpen}>OPEN FOLDER</div>}
                    {!isTrash && <>
                        <div className="ctx-sep"></div>
                        <div className="ctx-item" onClick={onCopy}>COPY</div>
                        <div className="ctx-item" onClick={onPaste}>PASTE</div>
                        <div className="ctx-item" onClick={onRename}>RENAME</div>
                        <div className="ctx-sep"></div>
                        <div className="ctx-item" onClick={onStar}>{file.starred ? 'UNSTAR' : 'STAR'}</div>
                        {file.locked ? (
                            <div className="ctx-item" onClick={onRemovePassword}>REMOVE PASSWORD</div>
                        ) : (
                            <div className="ctx-item" onClick={onSetPassword}>SET PASSWORD</div>
                        )}
                    </>}
                    {isTrash && <div className="ctx-item" onClick={onRestore}>RESTORE</div>}
                    <div className="ctx-sep"></div>
                    <div className="ctx-item danger" onClick={onDelete}>DELETE</div>
                </div>
            );
        }

        // ═══ MEDIA VIEWER ═══
        function MediaViewer({ file, files, onClose, setFile, onDownload }) {
            const idx = files.findIndex(f => f.id === file.id);
            const next = () => {
                for (let i = 1; i <= files.length; i++) {
                    const f = files[(idx + i) % files.length];
                    const t = getFileType(f);
                    if (t === 'image' || t === 'video') { setFile(f); return; }
                }
            };
            const prev = () => {
                for (let i = 1; i <= files.length; i++) {
                    const f = files[(idx - i + files.length) % files.length];
                    const t = getFileType(f);
                    if (t === 'image' || t === 'video') { setFile(f); return; }
                }
            };

            useEffect(() => {
                const handler = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight') next();
                    if (e.key === 'ArrowLeft') prev();
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [idx, files.length]);

            const fileType = getFileType(file);

            return (
                <div className="media-viewer">
                    <div className="mv-header">
                        <div className="mv-title">{file.name}</div>
                        <button className="mv-close" onClick={onClose}>×</button>
                    </div>
                    <div className="mv-content">
                        {fileType === 'image' && <img src={file.url} alt={file.name} />}
                        {fileType === 'video' && <video src={file.url} controls autoPlay />}
                    </div>
                    <div className="mv-nav">
                        <button className="mv-nav-btn" onClick={prev}>←</button>
                        <button className="mv-nav-btn" onClick={next}>→</button>
                    </div>
                    <div className="mv-footer">
                        {formatBytes(file.size)} · {formatDate(file.modified)} ·
                        <button className="btn primary" style={{ marginLeft: '12px', padding: '6px 14px' }} onClick={() => onDownload(file)}>DOWNLOAD</button>
                    </div>
                </div>
            );
        }

        // ═══ MODAL MANAGER ═══
        function ModalManager({ modal, setModal, onNewFolder, onRename, onSetPassword, onUnlockVault, onSetVaultPassword, onSkipVaultPassword, onConfirmDelete, onEmptyTrash, files, handleSaveLink, currentFolder, linkPreview }) {
            if (!modal) return null;
            const close = () => setModal(null);
            const width = modal.type === 'saveLink' ? '820px' : '560px';

            return (
                <div className="modal-overlay open" onClick={(e) => { if (e.target.classList.contains('modal-overlay')) close(); }}>
                    <div className={`modal ${modal.type === 'saveLink' ? 'save-link-modal' : ''}`} style={{ maxWidth: width }}>
                        <div className="modal-corner tl" /><div className="modal-corner tr" />
                        <div className="modal-corner bl" /><div className="modal-corner br" />

                        {modal.type === 'newFolder' && <NewFolderModal close={close} onCreate={onNewFolder} />}
                        {modal.type === 'rename' && <RenameModal close={close} onRename={onRename} data={modal.data} files={files} />}
                        {modal.type === 'password' && <PasswordModal close={close} onSetPassword={onSetPassword} data={modal.data} />}
                        {modal.type === 'authPrompt' && <AuthPromptModal close={close} data={modal.data} />}
                        {modal.type === 'confirm' && <ConfirmModal close={close} onConfirm={() => onConfirmDelete(modal.data.ids)} count={modal.data.ids.length} message={modal.data.message} />}
                        {modal.type === 'emptyTrash' && <EmptyTrashModal close={close} onConfirm={onEmptyTrash} count={modal.data.count} />}
                        {modal.type === 'settings' && <SettingsModal close={close} />}
                        {modal.type === 'vaultPassword' && <VaultPasswordModal close={close} onUnlock={onUnlockVault} onSetPassword={onSetVaultPassword} onSkip={onSkipVaultPassword} />}
                        {modal.type === 'saveLink' && (
                            <SaveLinkModal close={close} folders={modal.data.folders} onSave={handleSaveLink} currentFolder={currentFolder} defaultName={modal.data.defaultName} allFiles={files} linkPreview={linkPreview} />
                        )}
                    </div>
                </div>
            );
        }

        function ModalHeader({ title, onClose }) {
            return (
                <div className="modal-header">
                    <span className="modal-title">{title}</span>
                    {onClose && <button className="modal-close" onClick={onClose}><Icons.Close /></button>}
                </div>
            );
        }

        function NewFolderModal({ close, onCreate }) {
            const [name, setName] = useState('');
            const submit = () => { onCreate(name); close(); };
            return (
                <>
                    <ModalHeader title="CREATE FOLDER" onClose={close} />
                    <div className="modal-body">
                        <div className="modal-input-group">
                            <label className="modal-label">Folder Name</label>
                            <input className="modal-input" value={name} onChange={e => setName(e.target.value)} autoFocus placeholder="e.g. Q4 Reports" onKeyDown={e => e.key === 'Enter' && submit()} />
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn primary" onClick={submit}>CREATE</button>
                    </div>
                </>
            );
        }

        function RenameModal({ close, onRename, data, files }) {
            const current = files?.find(f => f.id === data.id);
            const [name, setName] = useState(current?.name || '');
            const submit = () => { onRename(data.id, name); close(); };
            return (
                <>
                    <ModalHeader title="RENAME ITEM" onClose={close} />
                    <div className="modal-body">
                        <div className="modal-input-group">
                            <label className="modal-label">New Name</label>
                            <input className="modal-input" value={name} onChange={e => setName(e.target.value)} autoFocus placeholder="Enter new name..." onKeyDown={e => e.key === 'Enter' && submit()} />
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn primary" onClick={submit}>SAVE</button>
                    </div>
                </>
            );
        }

        function PasswordModal({ close, onSetPassword, data }) {
            const [pass, setPass] = useState('');
            const submit = () => { onSetPassword(data.id, pass); close(); };
            return (
                <>
                    <ModalHeader title="SET FILE PASSWORD" onClose={close} />
                    <div className="modal-body">
                        <div className="modal-input-group">
                            <label className="modal-label">Password</label>
                            <input type="password" className="modal-input" value={pass} onChange={e => setPass(e.target.value)} autoFocus onKeyDown={e => e.key === 'Enter' && submit()} />
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn primary" onClick={submit}>ENCRYPT</button>
                    </div>
                </>
            );
        }

        function AuthPromptModal({ close, data }) {
            const [pass, setPass] = useState('');
            const [err, setErr] = useState(false);
            const file = data.file;
            const handle = () => {
                if (pass === file.password) close();
                else setErr(true);
            };
            return (
                <>
                    <ModalHeader title="AUTHORIZATION REQUIRED" onClose={close} />
                    <div className="modal-body">
                        <p style={{ fontSize: '12px', color: 'var(--ink-3)', marginBottom: '16px', lineHeight: 1.7, letterSpacing: '0.02em' }}>
                            File <span style={{ color: '#ffffff', fontWeight: 600 }}>{file.name}</span> is protected. Enter password to continue.
                        </p>
                        <div className="modal-input-group">
                            <label className="modal-label">Password</label>
                            <input type="password" className="modal-input" value={pass}
                                onChange={e => { setPass(e.target.value); setErr(false); }} autoFocus
                                onKeyDown={e => e.key === 'Enter' && handle()}
                                style={err ? { borderColor: 'rgba(255,255,255,0.8)' } : {}} />
                            {err && <div style={{ fontFamily: 'Orbitron', fontSize: 8, color: '#ffffff', letterSpacing: '0.16em', marginTop: 6, textTransform: 'uppercase' }}>INCORRECT PASSWORD</div>}
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn primary" onClick={handle}>AUTHENTICATE</button>
                    </div>
                </>
            );
        }

        function ConfirmModal({ close, onConfirm, count, message }) {
            return (
                <>
                    <ModalHeader title="CONFIRM ACTION" onClose={close} />
                    <div className="modal-body">
                        <p style={{ fontSize: '12px', color: 'var(--ink-3)', lineHeight: 1.8, letterSpacing: '0.02em' }}>
                            {message ? message : <>
                                Are you sure you want to move <span style={{ color: '#ffffff', fontWeight: 600 }}>{count} item(s)</span> to the Trash?
                                <br /><br />
                                You can restore it later from the Trash bin.
                            </>}
                        </p>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn danger" onClick={() => { onConfirm(); close(); }}>CONFIRM</button>
                    </div>
                </>
            );
        }

        function EmptyTrashModal({ close, onConfirm, count }) {
            return (
                <>
                    <ModalHeader title="EMPTY TRASH" onClose={close} />
                    <div className="modal-body">
                        <p style={{ fontSize: '12px', color: 'var(--ink-3)', lineHeight: 1.8, letterSpacing: '0.02em' }}>
                            Permanently delete <span style={{ color: '#ffffff', fontWeight: 600 }}>{count} item(s)</span>?
                            <br /><br />
                            This action cannot be undone.
                        </p>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn danger" onClick={() => { onConfirm(); close(); }}>EMPTY TRASH</button>
                    </div>
                </>
            );
        }

        function SettingsModal({ close }) {
            const [compact, setCompact] = useState(false);
            const [triton, setTriton] = useState(false);
            return (
                <>
                    <ModalHeader title="SYSTEM SETTINGS" onClose={close} />
                    <div className="modal-body">
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div>
                                    <div style={{ fontFamily: 'Orbitron', fontSize: 9, color: '#ffffff', fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase' }}>COMPACT VIEW</div>
                                    <div style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 4, letterSpacing: '0.04em' }}>Reduce UI padding and spacing</div>
                                </div>
                                <button className="btn" onClick={() => setCompact(v => !v)}>{compact ? 'ON' : 'OFF'}</button>
                            </div>
                            <div style={{ height: '1px', background: 'var(--line)' }}></div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div>
                                    <div style={{ fontFamily: 'Orbitron', fontSize: 9, color: '#ffffff', fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase' }}>TRITON CONNECT</div>
                                    <div style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 4, letterSpacing: '0.04em' }}>Simulate pairing with Triton-OS</div>
                                </div>
                                <button className="btn primary" onClick={() => setTriton(v => !v)}>{triton ? 'PAIRED' : 'PAIR'}</button>
                            </div>
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CLOSE</button>
                    </div>
                </>
            );
        }

        function VaultPasswordModal({ close, onUnlock, onSetPassword, onSkip }) {
            const [pass, setPass] = useState('');
            const [mode, setMode] = useState('unlock');
            const [err, setErr] = useState(false);

            const handleUnlock = () => {
                if (pass === 'atlas') onUnlock(pass);
                else setErr(true);
            };
            const handleSet = () => {
                if (pass.length >= 4) onSetPassword(pass);
                else alert('Password must be at least 4 characters');
            };

            return (
                <>
                    <ModalHeader title="HIDDEN VAULT" onClose={close} />
                    <div className="modal-body">
                        <p style={{ fontSize: '12px', color: 'var(--ink-3)', marginBottom: '16px', lineHeight: 1.8, letterSpacing: '0.02em' }}>
                            {mode === 'unlock' ? 'Enter the master password to access the Hidden Vault.' : 'Set a new master password for the Hidden Vault.'}
                        </p>
                        <div className="modal-input-group">
                            <label className="modal-label">{mode === 'unlock' ? 'Master Password' : 'New Password (4+ chars)'}</label>
                            <input type="password" className="modal-input" value={pass}
                                onChange={e => { setPass(e.target.value); setErr(false); }} autoFocus
                                onKeyDown={e => e.key === 'Enter' && (mode === 'unlock' ? handleUnlock() : handleSet())}
                                style={err ? { borderColor: 'rgba(255,255,255,0.8)' } : {}} />
                            {err && <div style={{ fontFamily: 'Orbitron', fontSize: 8, color: '#ffffff', letterSpacing: '0.16em', marginTop: 6, textTransform: 'uppercase' }}>ACCESS DENIED · TRY "atlas"</div>}
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        {mode === 'unlock' ? (
                            <>
                                <button className="btn" onClick={() => { setMode('set'); setErr(false); }}>SET PASSWORD</button>
                                <button className="btn primary" onClick={handleUnlock}>UNLOCK</button>
                            </>
                        ) : (
                            <button className="btn primary" onClick={handleSet}>SET PASSWORD</button>
                        )}
                    </div>
                </>
            );
        }

        function SaveLinkModal({ close, folders, onSave, currentFolder, defaultName, allFiles, linkPreview }) {
            const [selectedFolder, setSelectedFolder] = useState(currentFolder || 'root');
            const [fileName, setFileName] = useState(defaultName || '');

            const childFolders = (allFiles || []).filter(f => f.type === 'folder' && f.parent === selectedFolder && !f.trashed);
            const childFiles = (allFiles || []).filter(f => f.type === 'file' && f.parent === selectedFolder && !f.trashed);
            const folderLabel = selectedFolder === 'root' ? 'Root' : (allFiles || []).find(f => f.id === selectedFolder)?.name || 'Folder';
            const submit = () => { onSave(selectedFolder, fileName); close(); };

            return (
                <>
                    <ModalHeader title="SAVE LINK TO FOLDER" onClose={close} />
                    <div className="modal-body">
                        <div className="save-explorer">
                            <div className="folder-tree">
                                <div className="tree-header">DESTINATION</div>
                                <div className={`tree-item ${selectedFolder === 'root' ? 'active' : ''}`} onClick={() => setSelectedFolder('root')}>
                                    <span className="tree-icon"><Icons.Folder /></span>
                                    <span className="tree-name">Root</span>
                                    {selectedFolder === 'root' && <span className="tree-check"><Icons.Check /></span>}
                                </div>
                                {folders.map(f => (
                                    <div key={f.id} className={`tree-item ${selectedFolder === f.id ? 'active' : ''}`} onClick={() => setSelectedFolder(f.id)}>
                                        <span className="tree-icon"><Icons.Folder /></span>
                                        <span className="tree-name">{f.name}</span>
                                        {selectedFolder === f.id && <span className="tree-check"><Icons.Check /></span>}
                                    </div>
                                ))}
                            </div>

                            <div className="folder-preview">
                                <div className="preview-path">
                                    <Icons.Folder />
                                    <span>{folderLabel}</span>
                                    <span style={{ marginLeft: 'auto', color: 'var(--ink-5)' }}>{childFolders.length + childFiles.length} ITEMS</span>
                                </div>
                                {childFolders.length + childFiles.length === 0 ? (
                                    <div className="preview-empty">
                                        <Icons.Folder />
                                        <div>Folder is empty</div>
                                        <div style={{ fontSize: 7, color: 'var(--ink-5)' }}>LINK WILL BE SAVED HERE</div>
                                    </div>
                                ) : (
                                    <>
                                        {childFolders.map(f => (
                                            <div key={f.id} className="preview-item">
                                                <div className="p-icon" style={{ color: '#ffffff' }}><Icons.Folder /></div>
                                                <div className="p-name">{f.name}</div>
                                                <div className="p-size">FOLDER</div>
                                            </div>
                                        ))}
                                        {childFiles.map(f => {
                                            const meta = getFileMeta(f);
                                            const IconComponent = getIconComponent(f);
                                            return (
                                                <div key={f.id} className="preview-item">
                                                    <div className="p-icon" style={{ color: meta.color }}><IconComponent /></div>
                                                    <div className="p-name">{f.name}</div>
                                                    <div className="p-size">{formatBytes(f.size)}</div>
                                                </div>
                                            );
                                        })}
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="save-name-row">
                            <label>File Name</label>
                            <input value={fileName} onChange={e => setFileName(e.target.value)} placeholder="Enter file name..." autoFocus onKeyDown={e => e.key === 'Enter' && submit()} />
                        </div>
                    </div>
                    <div className="modal-actions">
                        <button className="btn" onClick={close}>CANCEL</button>
                        <button className="btn primary" onClick={submit}>SAVE LINK</button>
                    </div>
                </>
            );
        }

        function Toasts({ toasts }) {
            return (
                <div className="toast-wrap">
                    {toasts.map(t => (
                        <div key={t.id} className={`toast ${t.type}`}>
                            <div className="toast-title">{t.title}</div>
                            <div className="toast-msg">{t.msg}</div>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
