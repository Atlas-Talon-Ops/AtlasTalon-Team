<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATLAS · TALON</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --accent: #ffffff;
            --accent-bright: #ffffff;
            --accent-deep: rgba(255, 255, 255, 0.55);
            --accent-soft: rgba(255, 255, 255, 0.08);
            --accent-line: rgba(255, 255, 255, 0.18);
            --accent-glow: rgba(255, 255, 255, 0.55);

            --ink-1: rgba(255, 255, 255, 0.92);
            --ink-2: rgba(255, 255, 255, 0.70);
            --ink-3: rgba(255, 255, 255, 0.48);
            --ink-4: rgba(255, 255, 255, 0.30);
            --ink-5: rgba(255, 255, 255, 0.16);

            --line: rgba(255, 255, 255, 0.07);
            --line-strong: rgba(255, 255, 255, 0.13);

            --glass: rgba(255, 255, 255, 0.025);
            --glass-hover: rgba(255, 255, 255, 0.05);

            --panel-bg: rgba(8, 8, 8, 0.72);
            --panel-bg-solid: rgba(9, 9, 9, 0.90);

            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Orbitron', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            background: #000000;
            color: var(--ink-1);
            font-family: var(--font-ui);
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            cursor: default;
        }
        #root { height: 100%; }
        button { font-family: inherit; font-weight: inherit; cursor: pointer; }
        input, select, textarea { font-family: inherit; color-scheme: dark; }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.45); }

        .atlas-body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 50% -10%, #1c1c1c 0%, #0a0a0a 55%, #000000 100%);
            position: relative;
            z-index: 1;
            box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.95);
            padding: 0;
            overflow: hidden;
        }
        .atlas-body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 70% 8%, rgba(255, 255, 255, 0.022) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: glossRotate 24s linear infinite;
        }
        @keyframes glossRotate {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .atlas-body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 42px 42px;
            pointer-events: none;
            z-index: 0;
        }

        .scanline {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9999;
            background: repeating-linear-gradient(0deg,
                rgba(0, 0, 0, 0.035) 0px,
                rgba(0, 0, 0, 0.035) 2px,
                transparent 2px,
                transparent 6px);
            animation: scanMove 0.8s linear infinite;
        }
        @keyframes scanMove {
            0%   { transform: translateY(0); }
            100% { transform: translateY(6px); }
        }

        .glitch-line {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 1px;
            background: rgba(255, 255, 255, 0.10);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.06);
            z-index: 9998;
            pointer-events: none;
            opacity: 0;
            animation: glitchLine 7s linear infinite;
        }
        @keyframes glitchLine {
            0%, 100% { opacity: 0; transform: translateY(0); }
            4%   { opacity: 0.9; transform: translateY(0); }
            5%   { opacity: 0; }
            14%  { opacity: 0.5; transform: translateY(5px); }
            15%  { opacity: 0; }
            49%  { opacity: 0; }
            54%  { opacity: 0.7; transform: translateY(2px); }
            55%  { opacity: 0; }
            79%  { opacity: 0; }
            84%  { opacity: 0.45; transform: translateY(0); }
            85%  { opacity: 0; }
        }

        .screen-glitch {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9997;
            opacity: 0;
            background:
                linear-gradient(transparent 0%,
                    rgba(255, 255, 255, 0.03) 46%,
                    rgba(255, 255, 255, 0.10) 50%,
                    rgba(255, 255, 255, 0.03) 54%,
                    transparent 100%);
            mix-blend-mode: screen;
        }
        .screen-glitch.active { animation: screenTear 0.22s steps(3, end) 1; }
        @keyframes screenTear {
            0%   { opacity: 0; transform: translateY(-4%) scaleY(1); }
            20%  { opacity: 1; transform: translateY(3%)  scaleY(1.02); }
            45%  { opacity: 0.4; transform: translateY(-2%) scaleY(0.99); }
            70%  { opacity: 0.9; transform: translateY(2%); }
            100% { opacity: 0; transform: translateY(0); }
        }

        /* ══════════════════════════════════════════════
           TOPBAR  (brand left, clock right only)
           ══════════════════════════════════════════════ */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px 20px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid var(--line);
        }
        .topbar-left { display: flex; align-items: center; gap: 20px; }
        .brand {
            display: flex; align-items: center; gap: 12px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
        }
        .brand .badge {
            font-weight: 500;
            font-size: 8px;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 10px;
            border: 1px solid var(--accent-line);
            letter-spacing: 0.12em;
        }
        .brand .dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #ffffff;
            box-shadow: 0 0 22px var(--accent-glow);
            animation: pulseDot 1.6s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.25; transform: scale(0.6); }
        }

        .topbar-right { display: flex; align-items: center; gap: 18px; font-family: var(--font-display); }
        .topbar-right .time-display {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.06em;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.12);
            font-variant-numeric: tabular-nums;
        }
        .topbar-right .date-display {
            color: var(--ink-3);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.12em;
        }

        .glitch-wrapper { position: relative; display: inline-block; will-change: transform; }
        .glitch-text { display: block; position: relative; will-change: transform, opacity; }
        .glitch-active .glitch-text::before,
        .glitch-active .glitch-text::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            white-space: nowrap;
        }
        .glitch-active .glitch-text::before {
            color: #ffffff;
            text-shadow: 2px 0 0 rgba(255, 255, 255, 0.55);
            clip-path: polygon(0 0, 100% 0, 100% 36%, 0 36%);
            animation: glitchBefore 0.16s steps(2, end) infinite;
            opacity: 0.9;
        }
        .glitch-active .glitch-text::after {
            color: #8f959c;
            text-shadow: -2px 0 0 rgba(255, 255, 255, 0.28);
            clip-path: polygon(0 62%, 100% 62%, 100% 100%, 0 100%);
            animation: glitchAfter 0.16s steps(2, end) infinite;
            opacity: 0.9;
        }
        @keyframes glitchBefore {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-6px, -1px); }
            50% { transform: translate(4px, 1px); }
            75% { transform: translate(-3px, 2px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes glitchAfter {
            0% { transform: translate(0, 0); }
            25% { transform: translate(5px, 1px); }
            50% { transform: translate(-5px, -2px); }
            75% { transform: translate(3px, -1px); }
            100% { transform: translate(0, 0); }
        }
        .glitch-active .glitch-text { animation: glitchFlicker 0.12s steps(2, end) infinite; }
        @keyframes glitchFlicker {
            0% { opacity: 1; }
            40% { opacity: 0.72; }
            70% { opacity: 1; }
            100% { opacity: 0.85; }
        }

        /* ══════════════════════════════════════════════
           DASHBOARD  (fills remaining height)
           ══════════════════════════════════════════════ */
        .dashboard {
            display: grid;
            grid-template-columns: 240px 1fr 0px;
            gap: 14px;
            flex: 1;
            min-height: 0;
            padding: 14px 20px 20px 20px;
            position: relative;
            z-index: 2;
        }
        .dashboard.no-detail { grid-template-columns: 240px 1fr 0px; }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--line);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px 11px 18px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        .panel-header h2 {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-2);
        }
        .panel-header .badge {
            font-family: var(--font-display);
            font-size: 7px;
            font-weight: 500;
            color: var(--ink-2);
            background: var(--accent-soft);
            padding: 3px 10px;
            border: 1px solid var(--accent-line);
            letter-spacing: 0.12em;
        }
        .hdr-icon {
            width: 12px; height: 12px;
            fill: none; stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
            opacity: 0.9;
        }

        /* ══════════════════════════════════════════════
           SIDEBAR
           ══════════════════════════════════════════════ */
        .sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--line);
            border-left: 2px solid var(--accent-line);
            backdrop-filter: blur(6px);
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
        }
        .sb-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .sb-logo-sm {
            width: 36px; height: 36px;
            border: 1px solid var(--accent-line);
            background: rgba(255, 255, 255, 0.04);
            display: flex; align-items: center; justify-content: center;
            color: #ffffff;
            flex-shrink: 0;
        }
        .sb-logo-sm svg { width: 22px; height: 22px; display: block; }
        .sb-title {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            color: #ffffff;
        }
        .sb-subtitle {
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.14em;
            color: var(--ink-4);
            margin-top: 2px;
        }
        .sb-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
        .sb-section-title {
            font-family: var(--font-display);
            font-size: 8px;
            color: var(--ink-4);
            letter-spacing: 0.22em;
            padding: 12px 20px 6px;
            text-transform: uppercase;
            font-weight: 600;
            display: flex; align-items: center; justify-content: space-between;
        }
        .sb-section-title .sb-actions { display: flex; gap: 4px; }
        .sb-section-title .sb-actions button {
            background: transparent; border: none;
            color: var(--ink-4); padding: 0 4px;
            cursor: pointer;
            display: flex; align-items: center;
            transition: color 0.15s;
        }
        .sb-section-title .sb-actions button svg {
            width: 12px; height: 12px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .sb-section-title .sb-actions button:hover { color: #ffffff; }

        .sb-item {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 20px;
            color: var(--ink-3);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.15s;
            position: relative;
        }
        .sb-item:hover { color: var(--ink-1); background: rgba(255, 255, 255, 0.03); }
        .sb-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.055);
            border-left-color: #ffffff;
        }
        .sb-item-icon {
            width: 18px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .sb-item-icon svg {
            width: 15px; height: 15px;
            stroke: currentColor; fill: none;
            stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
        }
        .sb-item.active .sb-item-icon svg { stroke: #ffffff; filter: drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
        .sb-item .sb-item-label { flex: 1; }
        .sb-item .sb-item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .sb-item:hover .sb-item-actions { opacity: 1; }
        .sb-item .sb-item-actions button {
            background: transparent; border: none;
            color: var(--ink-4); padding: 0; cursor: pointer;
            display: flex; align-items: center; transition: color 0.15s;
        }
        .sb-item .sb-item-actions button svg {
            width: 13px; height: 13px;
            stroke: currentColor; fill: none;
            stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
        }
        .sb-item .sb-item-actions button:hover { color: #ffffff; }
        .sb-item .sb-item-actions button.danger:hover { color: #ffffff; filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); }
        .sb-item-count {
            margin-left: auto;
            font-family: var(--font-display);
            font-size: 8px; color: var(--ink-4);
            background: var(--glass);
            padding: 2px 7px;
            border: 1px solid var(--line);
            font-weight: 500;
            letter-spacing: 0.08em;
        }
        .sb-item.active .sb-item-count { color: #ffffff; border-color: var(--accent-line); }

        .sb-footer {
            border-top: 1px solid var(--line);
            padding: 14px 20px;
            flex-shrink: 0;
        }
        .sb-storage-meta {
            display: flex; justify-content: space-between;
            font-family: var(--font-display);
            font-size: 8px; color: var(--ink-4);
            letter-spacing: 0.12em;
            margin-bottom: 8px; font-weight: 500;
            text-transform: uppercase;
        }
        .sb-storage-bar { height: 3px; background: rgba(255,255,255,0.06); position: relative; overflow: hidden; }
        .sb-storage-fill {
            position: absolute; top: 0; left: 0; bottom: 0;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            width: 42%;
        }

        /* ══════════════════════════════════════════════
           EXPLORER
           ══════════════════════════════════════════════ */
        .explorer {
            background: var(--panel-bg);
            border: 1px solid var(--line);
            backdrop-filter: blur(6px);
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .explorer::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
        }

        .exp-toolbar {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.012);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .breadcrumbs {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-display);
            font-size: 9px; font-weight: 600;
            color: var(--ink-3);
            margin-right: auto;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .crumb {
            cursor: pointer;
            color: #ffffff;
            font-weight: 700;
            transition: color 0.15s;
        }
        .crumb:hover { color: var(--ink-2); }
        .crumb-sep { color: var(--ink-5); }
        .crumb.current { color: var(--ink-2); cursor: default; }

        .tool-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--glass);
            border: 1px solid var(--line);
            color: var(--ink-3);
            padding: 8px 13px;
            font-family: var(--font-display);
            font-size: 8px; font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tool-btn:hover {
            border-color: var(--accent-line);
            color: #ffffff;
            background: var(--glass-hover);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
        }
        .tool-btn:disabled { opacity: 0.28; cursor: not-allowed; }
        .tool-btn:disabled:hover {
            border-color: var(--line); color: var(--ink-3);
            background: var(--glass); box-shadow: none;
        }
        .tool-btn.danger:hover {
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.18);
        }
        .tool-btn svg {
            width: 12px; height: 12px;
            stroke: currentColor; fill: none;
            stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
        }

        .view-toggle { display: flex; border: 1px solid var(--line); }
        .view-btn {
            background: var(--glass); border: none;
            color: var(--ink-3);
            padding: 8px 11px;
            font-family: var(--font-display);
            font-size: 11px; font-weight: 500;
            transition: all 0.15s;
            letter-spacing: 0.1em;
            border-right: 1px solid var(--line);
            line-height: 1;
        }
        .view-btn:last-child { border-right: none; }
        .view-btn:hover { color: #ffffff; background: var(--glass-hover); }
        .view-btn.active { background: #ffffff; color: #000000; }

        .exp-content {
            flex: 1; overflow-y: auto;
            padding: 18px 20px 26px 20px;
            position: relative;
        }

        /* ══════════════════════════════════════════════
           FILE GRID
           ══════════════════════════════════════════════ */
        .file-grid { display: grid; gap: 12px; }
        .file-grid.grid-view { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        .file-grid.large-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        .file-grid.compact-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
        .file-grid.list-view { grid-template-columns: 1fr; gap: 2px; }

        .file-card {
            background: var(--glass);
            border: 1px solid var(--line);
            cursor: pointer;
            transition: background 0.16s, border-color 0.16s, transform 0.16s, box-shadow 0.16s;
            position: relative;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .file-card:hover {
            border-color: var(--line-strong);
            background: var(--glass-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
        }
        .file-card:active { transform: scale(0.985); }
        .file-card.selected {
            border-color: var(--accent-line);
            background: rgba(255, 255, 255, 0.055);
            box-shadow: 0 0 0 1px var(--accent-line), 0 0 24px rgba(255, 255, 255, 0.05);
        }
        .file-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 2px; background: transparent;
            transition: background 0.2s;
        }
        .file-card:hover::before { background: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); }
        .file-card.selected::before { background: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.7); }

        .file-card.list-view {
            flex-direction: row; align-items: center;
            padding: 8px 14px; border: none;
            border-bottom: 1px solid var(--line);
            background: transparent; min-height: 46px;
        }
        .file-card.list-view:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: none; box-shadow: none;
        }
        .file-card.list-view.selected {
            background: rgba(255, 255, 255, 0.05);
            border-left: 2px solid #ffffff;
        }
        .file-card.list-view::before { display: none; }

        .fc-icon-area {
            height: 110px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--line);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .file-grid.compact-grid .fc-icon-area { height: 76px; }

        /* ══════════════════════════════════════════════
           MODALS
           ══════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 5000;
            display: none;
            align-items: center; justify-content: center;
            padding: 24px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--panel-bg-solid);
            border: 1px solid var(--line-strong);
            width: 100%; max-width: 560px;
            max-height: 90vh;
            position: relative;
            display: flex; flex-direction: column;
            backdrop-filter: blur(16px);
            box-shadow:
                0 34px 90px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: modalIn 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.97) translateY(6px); }
            to { opacity: 1; transform: none; }
        }
        .modal::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        }
        .modal-corner {
            position: absolute; width: 16px; height: 16px;
            z-index: 2; pointer-events: none;
        }
        .modal-corner.tl { top: -1px; left: -1px; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; }
        .modal-corner.tr { top: -1px; right: -1px; border-top: 2px solid #ffffff; border-right: 2px solid #ffffff; }
        .modal-corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid #ffffff; border-left: 2px solid #ffffff; }
        .modal-corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid #ffffff; border-right: 2px solid #ffffff; }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.022);
            flex-shrink: 0;
        }
        .modal-title {
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .modal-title::before {
            content: '';
            width: 5px; height: 5px;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
            flex-shrink: 0;
        }
        .modal-close {
            background: transparent;
            border: 1px solid var(--line-strong);
            color: var(--ink-3);
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            padding: 0;
        }
        .modal-close:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }
        .modal-close svg {
            width: 12px; height: 12px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-actions {
            padding: 14px 18px;
            border-top: 1px solid var(--line);
            display: flex; gap: 8px; justify-content: flex-end;
            background: rgba(255, 255, 255, 0.012);
            flex-shrink: 0; flex-wrap: wrap;
        }

        .modal-input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .modal-label {
            font-family: var(--font-display);
            font-size: 8px; font-weight: 600;
            color: var(--ink-4);
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .modal-input, .modal-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--line-strong);
            padding: 11px 13px;
            font-size: 12px; font-weight: 500;
            color: var(--ink-1);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            font-family: var(--font-ui);
            letter-spacing: 0.02em;
        }
        .modal-input:focus, .modal-select:focus {
            border-color: var(--accent-line);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.06);
        }
        .modal-input::placeholder { color: var(--ink-4); }

        .btn {
            background: var(--glass);
            border: 1px solid var(--line-strong);
            color: var(--ink-3);
            padding: 10px 20px;
            font-family: var(--font-display);
            font-size: 8px; font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover {
            border-color: var(--accent-line);
            color: #ffffff;
            background: var(--glass-hover);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.06);
        }
        .btn.primary {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }
        .btn.primary:hover {
            background: #e6e6e6;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            color: #000;
        }
        .btn.danger {
            border-color: var(--accent-line);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }
        .btn.danger:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.18);
        }
        .btn svg {
            width: 12px; height: 12px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        /* ══════════════════════════════════════════════
           CONTEXT MENU
           ══════════════════════════════════════════════ */
        .ctx-menu {
            position: fixed;
            background: var(--panel-bg-solid);

        /* ══════════════════════════════════════════════
           MEDIA VIEWER
           ══════════════════════════════════════════════ */
        .media-viewer {

        .mv-header {
            position: absolute; top: 0; left: 0; right: 0;

        }
        .mv-title {
            font-family: var(--font-display);
            font-size: 10px; font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .mv-close {

            width: 36px; height: 36px;

        }

        .mv-content img, .mv-content video {

            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }
        .mv-footer {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 18px 24px; text-align: center;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            font-family: var(--font-display);
            color: var(--ink-4);
            font-size: 8px; font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        /* ══════════════════════════════════════════════
           TOASTS
           ══════════════════════════════════════════════ */
        .toast-wrap {
            position: fixed; top: 82px; right: 22px; z-index: 10000;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .toast {
            background: var(--panel-bg-solid);
            border: 1px solid var(--line-strong);
            border-left: 2px solid #ffffff;
            padding: 12px 16px;
            min-width: 240px; max-width: 360px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: toastIn 0.22s ease;
            pointer-events: auto;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
        .toast.warn { border-left-color: rgba(255, 255, 255, 0.65); }
        .toast.error { border-left-color: rgba(255, 255, 255, 0.35); }
        .toast.success { border-left-color: #ffffff; }
        .toast-title {
            font-family: var(--font-display);
            font-size: 8px; font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .toast-msg { font-size: 11px; font-weight: 400; color: var(--ink-2); line-height: 1.5; }

            width: 84px; height: 84px;
            border: 1px solid var(--line-strong);
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-3);
            position: relative;
            background: rgba(255, 255, 255, 0.012);

        .empty-icon::before {
            content: ''; position: absolute; inset: 14px;
            border: 1px solid var(--line);
        }
        .empty-icon svg {
            width: 26px; height: 26px;
            stroke: currentColor; fill: none;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
            z-index: 1;

        .empty-text {
            font-family: var(--font-display);
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .hidden { display: none !important; }

        const extFromUrl = (url) => {

            return {

                vimeoId: vimeo ? vimeo[1] : null,
                isImage: IMG.includes(ext),

        const GLYPHS = '!<>-_\\/[]{}—=+*^?#01%$&@▓▒░█│┤┐└┴┬';

        function scramble(text, intensity) {
            let out = '';
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const hit = Math.random() < intensity;
                if (ch === ':') {
                    out += (Math.random() < intensity * 0.4)
                        ? GLYPHS[(Math.random() * GLYPHS.length) | 0]
                        : ch;
                } else {
                    out += hit ? GLYPHS[(Math.random() * GLYPHS.length) | 0] : ch;
                }
            }
            return out;
        }

        function useClockGlitch() {
            const [time, setTime] = useState({ timeStr: '00:00:00', dateStr: '----.--.--' });
            const [glitching, setGlitching] = useState(false);
            const [displayTime, setDisplayTime] = useState('00:00:00');

            useEffect(() => {
                const tick = () => {
                    const now = new Date();
                    const timeStr = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
                    const dateStr = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
                    setTime({ timeStr, dateStr });
                    setDisplayTime(timeStr);
                };
                tick();
                const id = setInterval(tick, 1000);
                return () => clearInterval(id);
            }, []);

            useEffect(() => {
                const trigger = () => {
                    if (Math.random() > 0.55) {
                        const real = time.timeStr;
                        setGlitching(true);
                        let i = 0;
                        const frames = 3 + Math.round(Math.random() * 6);
                        const step = () => {
                            if (i >= frames) {
                                setDisplayTime(real);
                                setGlitching(false);
                                return;
                            }
                            setDisplayTime(scramble(real, 0.22 + Math.random() * 0.48));
                            i++;
                            setTimeout(step, 32 + Math.random() * 42);
                        };
                        step();
                    }
                };
                const id = setInterval(trigger, 2200);
                return () => clearInterval(id);
            }, [time.timeStr]);

            return { ...time, displayTime, glitching };
        }

                    setLinkFetching(false);
                    pushToast('success', 'LINK FETCHED', kind.name || 'Content ready');
                }, 350);
            };

            const handleDownloadLink = () => {
                if (!linkPreview) return;
                triggerDownload(linkPreview.url, linkPreview.name || 'download');
                pushToast('success', 'DOWNLOAD STARTED', linkPreview.name || 'download');
            };

            const handleOpenLinkExternal = () => {
                if (!linkPreview) return;
                window.open(linkPreview.url, '_blank', 'noopener');
            };

            const handleSaveLink = (folderId, customName) => {
                if (!linkPreview) return;
                const finalName = customName && customName.trim() ? customName.trim() : (linkPreview.name || 'link_content');
                setFiles(prev => [...prev, {
                    id: 'dl_' + Date.now(),
                    name: finalName,
                    type: 'file',
                    parent: folderId || currentFolder,
                    modified: Date.now(),
                    size: linkPreview.size || 0,
                    url: linkPreview.url,
                    isLink: true,
                    linkUrl: linkPreview.url,
                }]);
                pushToast('success', 'LINK SAVED', `${finalName} saved to folder`);
                setLinkUrl('');
                setLinkPreview(null);
                setModal(null);
            };

            const handleResetDownloader = () => {
                setLinkUrl('');
                setLinkPreview(null);
            };

            if (!authed) {
                return (
                    <>
                        <div className="scanline"></div>
                        <div className="glitch-line"></div>
                        <div className="screen-glitch" id="screenGlitch"></div>
                        <div className="atlas-body">
                            <div className="auth-screen">
                                <AuthBox onLogin={handleLogin} onEnroll={handleEnroll} pushToast={pushToast} />
                            </div>
                            <Toasts toasts={toasts} />
                        </div>
                    </>
                );

            const breadcrumbs = [];
            let curr = currentFolder;
            while (curr !== 'root' && curr) {
                const f = files.find(x => x.id === curr);
                if (f) { breadcrumbs.unshift(f); curr = f.parent; } else break;
            }

            const isVaultLocked = currentFolder === 'f3' && !vaultUnlocked;
            const isDownloaderView = view === 'downloader';
            const isTrashView = view === 'trash';

            return (
                <>
                    <div className="scanline"></div>
                    <div className="glitch-line"></div>
                    <div className="screen-glitch" id="screenGlitch"></div>

                    <div className="atlas-body" onClick={() => setCtxMenu(null)}>

                                    <span className="dot"></span>
                                    ATLAS
                                    <span className="badge">TALON</span>
                                </div>
                            </div>
                            <div className="topbar-right">
                                <span className="date-display">{clock.dateStr}</span>
                                <span className={`time-display glitch-wrapper ${clock.glitching ? 'glitch-active' : ''}`}>
                                    <span className="glitch-text" data-text={clock.timeStr}>{clock.displayTime}</span>
                                </span>
                            </div>
                        </header>

                        {/* ═══ DASHBOARD — fills the rest of the window ═══ */}
                        <div className="dashboard">
                            <Sidebar
                                view={view} setView={setView}
                                setCurrentFolder={setCurrentFolder}
                                setFilterType={setFilterType}
                                files={files}
                                user={user}
                                vaultUnlocked={vaultUnlocked} setVaultUnlocked={setVaultUnlocked}
                                onDeleteFolder={handleDeleteFolder}
                                onNewFolder={handleNewFolder}
                                setModal={setModal}
                                currentFolder={currentFolder}
                            />

                            <div className="explorer">
                                <Toolbar
                                    breadcrumbs={breadcrumbs}
                                    setCurrentFolder={setCurrentFolder}
                                    setView={setView}
                                    viewMode={viewMode} setViewMode={setViewMode}
                                    sortBy={sortBy} setSortBy={setSortBy}
                                    sortDir={sortDir} setSortDir={setSortDir}
                                    selected={selected}
                                    onCopy={handleCopy} onPaste={handlePaste}
                                    onDelete={() => handleDelete(selected)}
                                    onRestore={() => handleRestore(selected)}
                                    onEmptyTrash={handleEmptyTrash}
                                    onNewFolder={() => setModal({ type: 'newFolder' })}
                                    onUpload={() => pushToast('success', 'UPLOAD SIMULATED', 'File uploaded to current directory')}
                                    setModal={setModal}
                                    isTrashView={isTrashView}
                                    trashCount={files.filter(f => f.trashed).length}
                                />

                                <div className="exp-content" onClick={() => setSelected([])}>
                                    {isDownloaderView ? (
                                        <DownloaderView
                                            linkUrl={linkUrl} setLinkUrl={setLinkUrl}
                                            linkFetching={linkFetching}
                                            handleLinkFetch={handleLinkFetch}
                                            linkPreview={linkPreview}
                                            handleDownloadLink={handleDownloadLink}
                                            handleOpenLinkExternal={handleOpenLinkExternal}
                                            handleResetDownloader={handleResetDownloader}
                                            files={files} currentFolder={currentFolder}
                                            setModal={setModal} pushToast={pushToast}
                                        />
                                    ) : isVaultLocked ? (
                                        <div className="empty-state">
                                            <div className="empty-icon"><Icons.Lock /></div>
                                            <div className="empty-text">VAULT LOCKED</div>
                                            <button className="btn primary" onClick={() => setModal({ type: 'vaultPassword', data: { folder: { id: 'f3', name: 'vault' } } })}>
                                                UNLOCK VAULT
                                            </button>
                                        </div>
                                    ) : visibleFiles.length === 0 ? (
                                        <div className="empty-state">
                                            <div className="empty-icon"><Icons.File /></div>
                                            <div className="empty-text">NO FILES FOUND</div>
                                            {isTrashView && <div style={{ fontFamily: 'Orbitron', fontSize: 8, letterSpacing: '0.2em', color: 'var(--ink-4)', textTransform: 'uppercase' }}>TRASH IS EMPTY</div>}
                                        </div>
                                    ) : (
                                        <div className={`file-grid ${viewMode}`}>
                                            {visibleFiles.map(file => (
                                                <FileCard
                                                    key={file.id}
                                                    file={file}
                                                    viewMode={viewMode}
                                                    selected={selected.includes(file.id)}
                                                    onSelect={(e) => { e.stopPropagation(); setSelected([file.id]); setDetailItem(file); }}
                                                    onOpen={() => handleOpen(file)}
                                                    onContext={(e) => handleContext(e, file)}
                                                    onDownload={handleDownload}
                                                    isTrash={isTrashView}
                                                    onRestore={() => handleRestore([file.id])}

                                            ))}
                                        </div>

                            </div>

                            <div className="detail-panel"></div>
                        </div>
                    </div>

                    {ctxMenu && (
                        <ContextMenu

                            onOpen={() => handleOpen(ctxMenu.file)}
                            onDownload={() => handleDownload(ctxMenu.file)}
                            onCopy={handleCopy} onPaste={handlePaste}
                            onRename={() => setModal({ type: 'rename', data: { id: ctxMenu.file.id } })}
                            onStar={() => handleStar(ctxMenu.file.id)}
                            onSetPassword={() => setModal({ type: 'password', data: { id: ctxMenu.file.id } })}
                            onRemovePassword={() => handleRemovePassword(ctxMenu.file.id)}
                            onDelete={() => handleDelete([ctxMenu.file.id])}
                            onRestore={() => handleRestore([ctxMenu.file.id])}
                        />
                    )}

                    {mediaViewer && (
                        <MediaViewer
                            file={mediaViewer}
                            files={visibleFiles}
                            onClose={() => setMediaViewer(null)}

                            onDownload={handleDownload}
                        />
                    )}

                    {modal && (
                        <ModalManager
                            modal={modal} setModal={setModal}
                            onNewFolder={handleNewFolder}
                            onRename={handleRename}
                            onSetPassword={handleSetPassword}
                            onUnlockVault={handleUnlockVault}
                            onSetVaultPassword={handleSetVaultPassword}
                            onSkipVaultPassword={handleSkipVaultPassword}
                            onConfirmDelete={executeDelete}
                            onEmptyTrash={executeEmptyTrash}
                            pushToast={pushToast}
                            files={files}
                            handleSaveLink={handleSaveLink}
                            currentFolder={currentFolder}
                            linkPreview={linkPreview}
                        />
                    )}

                    <Toasts toasts={toasts} />
                </>
            );
        }

        // ═══ DOWNLOADER ═══
        function DownloaderView({ linkUrl, setLinkUrl, linkFetching, handleLinkFetch, linkPreview, handleDownloadLink, handleOpenLinkExternal, handleResetDownloader, handleSaveLink, files, currentFolder, setModal, pushToast }) {
            const renderMedia = () => {
                if (!linkPreview) return null;
                const { url, isImage, isVideo, isAudio, isPdf, isYoutube, youtubeId, isVimeo, vimeoId, name } = linkPreview;
                if (isImage) return <img src={url} alt={name} />;
                if (isVideo) return <video src={url} controls preload="metadata" />;
                if (isYoutube) return (
                    <iframe src={`https://www.youtube.com/embed/${youtubeId}`} title={name}
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen />
                );
                if (isVimeo) return (
                    <iframe src={`https://player.vimeo.com/video/${vimeoId}`} title={name}
                        allow="autoplay; fullscreen; picture-in-picture" allowFullScreen />
                );
                if (isPdf) return <iframe src={url} title={name} />;
                if (isAudio) return (
                    <div style={{ padding: '40px 20px', textAlign: 'center', width: '100%' }}>
                        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '24px', color: 'var(--ink-4)' }}>
                            <Icons.Audio />
                        </div>
                        <audio src={url} controls style={{ width: '100%', maxWidth: '440px', filter: 'invert(1) hue-rotate(180deg)', opacity: 0.9 }} />
                    </div>
                );
                return (
                    <div style={{ padding: '60px 20px', textAlign: 'center', color: 'var(--ink-3)' }}>
                        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '18px', color: 'var(--ink-5)' }}>
                            <Icons.LinkBig />
                        </div>
                        <div style={{ fontFamily: 'Orbitron', fontSize: '9px', letterSpacing: '0.2em', textTransform: 'uppercase' }}>LINK READY</div>
                        <div style={{ fontFamily: 'Orbitron', fontSize: '8px', color: 'var(--ink-5)', marginTop: '12px', wordBreak: 'break-all', maxWidth: '520px', margin: '12px auto 0', letterSpacing: '0.08em' }}>
                            {url}
                        </div>
                    </div>
                );
            };

            return (
                <div className="downloader-view">
                    <div className="header-title">
                        <h2>UNIVERSAL LINK DOWNLOAD</h2>
                        <p>Paste any direct link to preview and download</p>
                    </div>

                    <div className="search-row">
                        <input
                            placeholder="https://example.com/image.jpg or video.mp4"
                            value={linkUrl}
                            onChange={e => setLinkUrl(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && handleLinkFetch()}
                        />
                        <button onClick={handleLinkFetch} disabled={linkFetching || !linkUrl.trim()}>
                            {linkFetching ? 'FETCHING…' : 'FETCH'}
                        </button>
                    </div>

                    {linkPreview && (
                        <div className="preview-card">
                            <div className="preview-media">{renderMedia()}</div>
                            <div className="preview-info">
                                <div className="info-left">
                                    <div className="name">{linkPreview.name || 'link_content'}</div>
                                    <div className="meta">
                                        {linkPreview.ext ? linkPreview.ext.toUpperCase() : 'LINK'}
                                        {linkPreview.isYoutube && ' · YOUTUBE'}
                                        {linkPreview.isVimeo && ' · VIMEO'}
                                        {' · '}READY
                                    </div>
                                </div>
                                <div className="info-actions">
                                    <button className="btn" onClick={handleOpenLinkExternal} title="Open in new tab">
                                        <Icons.External />
                                        <span>OPEN</span>
                                    </button>
                                    <button className="btn" onClick={() => {
                                        const folders = files.filter(f => f.type === 'folder' && !f.trashed);
                                        setModal({ type: 'saveLink', data: { folders, defaultName: linkPreview.name } });
                                    }}>
                                        SAVE TO FOLDER
                                    </button>
                                    <button className="btn primary" onClick={handleDownloadLink}>
                                        <Icons.Download />
                                        <span>DOWNLOAD</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {linkPreview && (
                        <div style={{ textAlign: 'center', marginTop: '14px' }}>
                            <button className="btn" onClick={handleResetDownloader} style={{ fontSize: 8, padding: '8px 14px' }}>
                                CLEAR
                            </button>
                        </div>
                    )}

                    {!linkPreview && !linkFetching && (
                        <div className="empty-prompt">
                            <div className="big"><Icons.LinkBig /></div>
                            <div className="text">ENTER A LINK ABOVE TO FETCH CONTENT</div>
                        </div>
                    )}
                </div>
            );
        }

        // ═══ AUTH ═══
        function AuthBox({ onLogin, onEnroll }) {
            const [tab, setTab] = useState('ACCESS');
            const [loginForm, setLoginForm] = useState({ userId: 'PT-8KLM9N2Q', username: 'OPERATOR', pass: '' });
            const [enrollForm, setEnrollForm] = useState({ name: '', dob: '', country: '', pass: '', photo: null, idDoc: null });

            const handlePhoto = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => setEnrollForm({ ...enrollForm, photo: ev.target.result });
                    reader.readAsDataURL(file);
                }
            };
            const handleIdDoc = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => setEnrollForm({ ...enrollForm, idDoc: ev.target.result });
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="auth-box" onClick={(e) => e.stopPropagation()}>
                    <div className="auth-corner tl" /><div className="auth-corner tr" />
                    <div className="auth-corner bl" /><div className="auth-corner br" />

                    <div className="auth-visual">

                        <div className="auth-tagline">

                            YOUR RULES.<br />
                            YOUR <span>SOVEREIGNTY</span>.
                        </div>
                        <div className="auth-meta">
                            ATLASTALON SECURE OS<br />
                            PHANTOM-T / SPECTER-C<br />
                            FIRMWARE v3.1.4

                    <div className="auth-panel">
                        <div className="auth-tabs">

                            <button className={`auth-tab ${tab === 'ENROLL' ? 'active' : ''}`} onClick={() => setTab('ENROLL')}>ENROLL</button>

                        {tab === 'ACCESS' ? (

                                    <label className="auth-label">Password / PIN</label>

                        ) : (
                            <div className="auth-form" style={{ overflowY: 'auto' }}>
                                <div className="auth-title">Identity Enrollment</div>
                                <div className="auth-input-group">
                                    <label className="auth-label">Full Name</label>
                                    <input className="auth-input" value={enrollForm.name} onChange={e => setEnrollForm({ ...enrollForm, name: e.target.value })} />
                                </div>
                                <div className="auth-input-group">
                                    <label className="auth-label">Date of Birth</label>
                                    <input type="date" className="auth-input" value={enrollForm.dob} onChange={e => setEnrollForm({ ...enrollForm, dob: e.target.value })} />
                                </div>
                                <div className="auth-input-group">
                                    <label className="auth-label">Country of Residency</label>
                                    <input className="auth-input" value={enrollForm.country} onChange={e => setEnrollForm({ ...enrollForm, country: e.target.value })} />
                                </div>
                                <div className="auth-input-group">
                                    <label className="auth-label">Profile Photo</label>
                                    <input type="file" className="auth-input" accept="image/*" onChange={handlePhoto} />
                                    {enrollForm.photo && <div className="auth-file-preview"><div className="preview-item"><img src={enrollForm.photo} alt="profile" /><span>Photo uploaded</span></div></div>}
                                </div>
                                <div className="auth-input-group">
                                    <label className="auth-label">ID Document</label>
                                    <input type="file" className="auth-input" accept="image/*,application/pdf" onChange={handleIdDoc} />
                                    {enrollForm.idDoc && <div className="auth-file-preview"><div className="preview-item"><img src={enrollForm.idDoc} alt="ID" /><span>ID uploaded</span></div></div>}
                                </div>
                                <div className="auth-input-group">
                                    <label className="auth-label">Set Password</label>
                                    <input type="password" className="auth-input" value={enrollForm.pass} onChange={e => setEnrollForm({ ...enrollForm, pass: e.target.value })} />

        // ═══ SIDEBAR ═══
        function Sidebar({ view, setView, setCurrentFolder, setFilterType, files, user, vaultUnlocked, setVaultUnlocked, onDeleteFolder, onNewFolder, setModal, currentFolder }) {
            const navItems = [
                { id: 'drive', label: 'Flash Drive', icon: Icons.Drive },
                { id: 'recent', label: 'Recent', icon: Icons.Recent },
                { id: 'starred', label: 'Starred', icon: Icons.StarOutline },
                { id: 'downloader', label: 'Link Download', icon: Icons.Link },
                { id: 'trash', label: 'Trash', icon: Icons.Trash },
            ];
            const filters = [
                { id: 'image', label: 'Images', icon: Icons.Image },
                { id: 'doc', label: 'Documents', icon: Icons.Doc },
                { id: 'video', label: 'Videos', icon: Icons.Video },
            ];
            const folders = files.filter(f => f.type === 'folder' && f.parent === 'root' && !f.trashed && !f.hidden);

            const handleNav = (v) => {
                setView(v);
                if (v === 'drive' || v === 'downloader') setCurrentFolder('root');
                if (v !== 'filter') setFilterType(null);
            };
            const handleFolderClick = (id) => { setView('drive'); setCurrentFolder(id); };
            const handleVaultClick = () => {
                const vault = files.find(f => f.id === 'f3');
                if (vault && vault.locked && !vaultUnlocked) setModal({ type: 'vaultPassword', data: { folder: vault } });
                else { setVaultUnlocked(true); setView('hidden'); setCurrentFolder('f3'); }
            };

            return (
                <div className="sidebar">
                    <div className="sb-header">
                        <div className="sb-logo-sm"><AtlasMark strokeWidth={2} /></div>
                        <div>
                            <div className="sb-title">ATLAS · TALON</div>
                            <div className="sb-subtitle">PHANTOM-T / SPECTER-C</div>
                        </div>
                    </div>

                    <div className="sb-nav">
                        <div className="sb-section-title">NAVIGATION</div>
                        {navItems.map(item => (
                            <div key={item.id} className={`sb-item ${view === item.id ? 'active' : ''}`} onClick={() => handleNav(item.id)}>
                                <span className="sb-item-icon">{item.icon()}</span>
                                <span className="sb-item-label">{item.label}</span>
                            </div>
                        ))}

                        <div className="sb-section-title">FILTERS</div>
                        {filters.map(item => (
                            <div key={item.id} className={`sb-item ${view === 'filter' && filterType === item.id ? 'active' : ''}`}

                                <span className="sb-item-label">{item.label}</span>

                            <div className="sb-actions">
                                <button onClick={() => setModal({ type: 'newFolder' })} title="Add folder">
                                    <Icons.Plus />
                                </button>
                            </div>
                        </div>
                        {folders.map(item => (
                            <div key={item.id} className={`sb-item ${view === 'drive' && currentFolder === item.id ? 'active' : ''}`} onClick={() => handleFolderClick(item.id)}>
                                <span className="sb-item-icon"><Icons.Folder /></span>
                                <span className="sb-item-label">{item.name}</span>
                                <div className="sb-item-actions">
                                    <button onClick={(e) => { e.stopPropagation(); onDeleteFolder(item.id); }} className="danger" title="Delete folder">
                                        <Icons.Trash />
                                    </button>
                                </div>
                            </div>
                        ))}

                        <div className="sb-section-title">SECURE</div>
                        <div className={`sb-item ${view === 'hidden' ? 'active' : ''}`} onClick={handleVaultClick}>
                            <span className="sb-item-icon"><Icons.Hidden /></span>
                            <span className="sb-item-label">Hidden Vault</span>
                            <span className="sb-item-count">{vaultUnlocked ? 'OPEN' : 'LOCKED'}</span>

                    <div className="sb-footer">

                        <div className="sb-storage-bar"><div className="sb-storage-fill"></div></div>

                            <span>USER · {user.name}</span>
                            <span style={{ color: '#ffffff' }}>ACTIVE</span>
                        </div>
