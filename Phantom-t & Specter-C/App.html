<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phantom-T / Specter-C · AtlasTalon</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            background: #050505;
            height: 100%;
            overflow: hidden;
        }
        #root {
            height: 100%;
        }
        button {
            font-family: inherit;
            cursor: pointer;
        }
        input,
        select,
        textarea {
            font-family: inherit;
        }

        /* ===== BASE ===== */
        .atlas-body {
            font-family: 'IBM Plex Mono', monospace;
            background: #050505;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .atlas-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
        }
        .atlas-body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.08) 2px,
                    rgba(0, 0, 0, 0.08) 3px);
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a2a2a;
        }

        /* ===== AUTH SCREEN ===== */
        .auth-screen {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            padding: 24px;
        }
        .auth-box {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
        }
        .auth-corner {
            position: absolute;
            width: 18px;
            height: 18px;
            z-index: 2;
        }
        .auth-corner.tl {
            top: -1px;
            left: -1px;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
        }
        .auth-corner.tr {
            top: -1px;
            right: -1px;
            border-top: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
        }
        .auth-corner.bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
        }
        .auth-corner.br {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
        }

        .auth-visual {
            background: repeating-linear-gradient(45deg, #070707, #070707 10px, #050505 10px, #050505 20px);
            border-right: 1px solid #1a1a1a;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .auth-visual::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03), transparent 70%);
            pointer-events: none;
        }
        .auth-logo {
            width: 60px;
            height: 60px;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 2;
        }
        .auth-tagline {
            font-size: 20px;
            line-height: 1.6;
            color: #c0c0c0;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            position: relative;
            z-index: 2;
            font-family: 'Orbitron', monospace;
        }
        .auth-tagline span {
            color: #ffffff;
        }
        .auth-meta {
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .auth-panel {
            padding: 32px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            overflow-y: auto;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }
        .auth-tab {
            background: transparent;
            border: none;
            padding: 10px 20px;
            color: #555;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .auth-tab.active {
            color: #e0e0e0;
            border-color: #ffffff;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
        }
        .auth-form::-webkit-scrollbar {
            width: 4px;
        }
        .auth-form::-webkit-scrollbar-thumb {
            background: #1a1a1a;
        }
        .auth-title {
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: 'Orbitron', monospace;
            flex-shrink: 0;
        }
        .auth-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .auth-label {
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .auth-input {
            width: 100%;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #c0c0c0;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-input:focus {
            border-color: #ffffff;
        }
        .auth-input[type="file"] {
            padding: 8px;
            font-size: 11px;
        }
        .auth-btn {
            background: #ffffff;
            border: 1px solid #ffffff;
            color: #000000;
            padding: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: 6px;
            flex-shrink: 0;
        }
        .auth-btn:hover {
            background: #e6e6e6;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.15);
        }
        .auth-info {
            font-size: 10px;
            color: #444;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 10px;
            line-height: 1.6;
            font-weight: 500;
            flex-shrink: 0;
        }
        .auth-file-preview {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .auth-file-preview .preview-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 4px 10px 4px 4px;
            font-size: 10px;
            color: #888;
        }
        .auth-file-preview .preview-item img {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border: 1px solid #333;
        }
        .auth-file-preview .preview-item .placeholder {
            width: 28px;
            height: 28px;
            border: 1px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 12px;
        }

        /* ===== DASHBOARD LAYOUT ===== */
        .dashboard {
            display: grid;
            grid-template-columns: 240px 1fr 300px;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: #080808;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sb-header {
            padding: 20px 24px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .sb-logo-sm {
            width: 32px;
            height: 32px;
            border: 1px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            background: rgba(255, 255, 255, 0.02);
        }
        .sb-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #e0e0e0;
            font-family: 'Orbitron', monospace;
        }
        .sb-subtitle {
            font-size: 8px;
            color: #555;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .sb-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }
        .sb-section-title {
            font-size: 9px;
            color: #555;
            letter-spacing: 3px;
            padding: 10px 24px 4px;
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sb-section-title .sb-actions {
            display: flex;
            gap: 4px;
        }
        .sb-section-title .sb-actions button {
            background: transparent;
            border: none;
            color: #444;
            font-size: 12px;
            padding: 0 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .sb-section-title .sb-actions button:hover {
            color: #fff;
        }
        .sb-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 24px;
            color: #666;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.15s;
            position: relative;
        }
        .sb-item:hover {
            color: #c0c0c0;
            background: rgba(255, 255, 255, 0.02);
        }
        .sb-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border-left-color: #ffffff;
        }
        .sb-item-icon {
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sb-item-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .sb-item.active .sb-item-icon svg {
            stroke: #ffffff;
        }
        .sb-item .sb-item-label {
            flex: 1;
        }
        .sb-item .sb-item-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sb-item:hover .sb-item-actions {
            opacity: 1;
        }
        .sb-item .sb-item-actions button {
            background: transparent;
            border: none;
            color: #444;
            font-size: 10px;
            padding: 0 2px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .sb-item .sb-item-actions button:hover {
            color: #fff;
        }
        .sb-item .sb-item-actions button.danger:hover {
            color: #FF3D00;
        }
        .sb-item-count {
            margin-left: auto;
            font-size: 9px;
            color: #444;
            background: #050505;
            padding: 1px 6px;
            border: 1px solid #1a1a1a;
            font-weight: 500;
        }
        .sb-item.active .sb-item-count {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .sb-footer {
            border-top: 1px solid #1a1a1a;
            padding: 16px 24px;
            flex-shrink: 0;
        }
        .sb-storage-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #555;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .sb-storage-bar {
            height: 4px;
            background: #111;
            position: relative;
        }
        .sb-storage-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            width: 42%;
        }

        /* ===== MAIN EXPLORER ===== */
        .explorer {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #050505;
        }
        .exp-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid #1a1a1a;
            background: #080808;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-right: auto;
            letter-spacing: 1px;
        }
        .crumb {
            cursor: pointer;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 700;
        }
        .crumb:hover {
            text-decoration: underline;
        }
        .crumb-sep {
            color: #333;
        }
        .crumb.current {
            color: #c0c0c0;
            cursor: default;
        }
        .crumb.current:hover {
            text-decoration: none;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #666;
            padding: 8px 14px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            border-color: #ffffff;
            color: #fff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }
        .tool-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .tool-btn.danger:hover {
            border-color: #FF3D00;
            color: #FF3D00;
            box-shadow: 0 0 8px rgba(255, 61, 0, 0.2);
        }

        .view-toggle {
            display: flex;
            border: 1px solid #1a1a1a;
        }
        .view-btn {
            background: #0a0a0a;
            border: none;
            color: #555;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .view-btn:hover {
            color: #c0c0c0;
        }
        .view-btn.active {
            background: #ffffff;
            color: #000;
        }

        .exp-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }

        /* ===== FILE GRID ===== */
        .file-grid {
            display: grid;
            gap: 16px;
        }
        .file-grid.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
        .file-grid.large-grid {
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }
        .file-grid.compact-grid {
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .file-grid.list-view {
            grid-template-columns: 1fr;
            gap: 2px;
        }

        .file-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 4px;
        }
        .file-card:hover {
            border-color: #2a2a2a;
            transform: translateY(-1px);
        }
        .file-card.selected {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 0 1px #ffffff;
        }
        .file-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #1a1a1a;
            transition: width 0.2s;
        }
        .file-card:hover::before {
            width: 3px;
            background: #ffffff;
        }
        .file-card.selected::before {
            width: 3px;
            background: #ffffff;
        }

        .file-card.list-view {
            flex-direction: row;
            align-items: center;
            padding: 8px 16px;
            border: none;
            border-bottom: 1px solid #111;
            background: transparent;
            border-radius: 0;
            min-height: 48px;
        }
        .file-card.list-view:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: transparent;
        }
        .file-card.list-view.selected {
            background: rgba(255, 255, 255, 0.03);
            border-color: transparent;
            border-left: 2px solid #ffffff;
        }
        .file-card.list-view::before {
            display: none;
        }
        .file-card.list-view.selected::before {
            display: none;
        }

        .fc-icon-area {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .file-grid.compact-grid .fc-icon-area {
            height: 80px;
        }
        .file-grid.large-grid .fc-icon-area {
            height: 160px;
        }
        .file-card.list-view .fc-icon-area {
            height: 36px;
            width: 36px;
            border: none;
            background: transparent;
            margin-right: 12px;
            flex-shrink: 0;
            min-height: 36px;
        }

        .fc-icon {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .file-card.list-view .fc-icon {
            font-size: 20px;
        }

        .fc-icon.folder {
            color: #FFD60A;
        }
        .fc-icon.image {
            color: #007AFF;
        }
        .fc-icon.video {
            color: #FF3D00;
        }
        .fc-icon.doc {
            color: #e0e0e0;
        }

        .fc-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fc-meta {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }
        .file-card.list-view .fc-meta {
            flex-direction: row;
            flex: 1;
            padding: 0;
            gap: 16px;
            align-items: center;
            min-width: 0;
        }

        .fc-name {
            font-size: 12px;
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .file-card.list-view .fc-name {
            flex: 1;
            min-width: 0;
        }

        .fc-info {
            font-size: 9px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            white-space: nowrap;
        }
        .file-card.list-view .fc-info {
            width: 150px;
            text-align: right;
            flex-shrink: 0;
        }

        .fc-badges {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 4px;
            z-index: 2;
        }
        .file-card.list-view .fc-badges {
            position: static;
            margin-left: auto;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .fc-badge {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fc-badge svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .fc-badge.star svg {
            fill: #FFD60A;
            stroke: #FFD60A;
        }
        .fc-badge.lock svg {
            stroke: #FF3D00;
        }

        /* Video badge */
        .fc-badge.video-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border: 1px solid #333;
            font-size: 8px;
            color: #fff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .fc-badge.video-badge svg {
            width: 12px;
            height: 12px;
            fill: #fff;
            stroke: none;
        }
        .file-card.list-view .fc-badge.video-badge {
            position: static;
        }

        /* ===== DETAIL PANEL ===== */
        .detail-panel {
            background: #080808;
            border-left: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .dp-header {
            padding: 16px 24px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 10px;
            font-weight: 600;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;

            color: #007AFF;
        }

            font-weight: 500;
            color: #c0c0c0;

            to {

            color: #222;
        }
        .empty-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hidden {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 200px 1fr 260px;
            }
            .auth-box {

            .file-grid.large-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));

            .exp-content {
                padding: 12px;
            }
        }
        @media (max-width: 480px) {

            }

            }

                font-size: 10px;
            }
            .auth-box {
                padding: 0;
            }
            .auth-panel {
                padding: 16px;
            }
        }

            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];

            const videoExts = ['mp4', 'mov', 'avi', 'mkv', 'webm', 'flv', 'wmv'];
            const docExts = ['pdf', 'doc', 'docx', 'txt', 'md', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx', 'json', 'dat'];
            if (imageExts.includes(ext)) return 'image';
            if (videoExts.includes(ext)) return 'video';
            if (docExts.includes(ext)) return 'document';
            return 'other';
        };

        const getFileIcon = (file) => {
            const type = getFileType(file);
            if (file.type === 'folder') return 'folder';
            if (type === 'image') return 'image';
            if (type === 'video') return 'video';
            return 'document';
        };

        const getIconComponent = (file) => {
            const type = getFileIcon(file);
            switch (type) {
                case 'folder':
                    return Icons.Folder;
                case 'image':
                    return Icons.Image;
                case 'video':
                    return Icons.Video;
                default:
                    return Icons.File;
            }
        };

        // ==================== SEED DATA ====================
        const seedFiles = [

            { id: 'f3', name: 'vault', type: 'folder', parent: 'root', modified: Date.now() - 3000000, size: 0,

            { id: 'f4', name: 'mission_brief.pdf', type: 'file', parent: 'root', modified: Date.now() - 4000000,

            { id: 'f5', name: 'target_profile.jpg', type: 'file', parent: 'root', modified: Date.now() - 5000000,
                size: 4096000, starred: false,
                url: 'https://images.unsplash.com/photo-1568602471122-7832951cc4c5?q=80&w=1000&auto=format&fit=crop' },
            { id: 'f6', name: 'secret_notes.txt', type: 'file', parent: 'root', modified: Date.now() - 6000000, size: 4096,

            // Hidden Vault items (only visible when vault is unlocked)
            { id: 'h1', name: 'master_keys.dat', type: 'file', parent: 'f3', modified: Date.now() - 20000000, size: 4096,
                locked: true, password: 'atlas', hidden: true },
            { id: 'h2', name: 'black_ops.jpg', type: 'file', parent: 'f3', modified: Date.now() - 21000000, size: 5632000,

        // ==================== MAIN APP ====================
        function App() {
            const [authed, setAuthed] = useState(false);
            const [user, setUser] = useState({ id: 'PT-8KLM9N2Q', name: 'OPERATOR' });

            const [files, setFiles] = useState(seedFiles);
            const [view, setView] = useState('drive');
            const [filterType, setFilterType] = useState(null);
            const [currentFolder, setCurrentFolder] = useState('root');
            const [viewMode, setViewMode] = useState('grid-view');
            const [sortBy, setSortBy] = useState('name');
            const [sortDir, setSortDir] = useState('asc');

            const [selected, setSelected] = useState([]);
            const [clipboard, setClipboard] = useState([]);

            const [settings, setSettings] = useState({

            const [toasts, setToasts] = useState([]);
            const [vaultUnlocked, setVaultUnlocked] = useState(false);

            const pushToast = (type, title, msg) => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, type, title, msg }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
            };

            // ==================== AUTH HANDLING ====================
            const handleLogin = (userId, username, pass) => {
                if (pass === 'phantom' || pass === 'atlas') {
                    setAuthed(true);
                    pushToast('success', 'ACCESS GRANTED', `Welcome, ${username}`);
                } else {
                    pushToast('error', 'ACCESS DENIED', 'Invalid credentials');
                }
            };

            const handleEnroll = (data) => {
                setUser({ id: 'PT-' + Math.random().toString(36).substr(2, 8).toUpperCase(), name: data.name });
                pushToast('success', 'ENROLLMENT COMPLETE', 'Identity verified. Access granted.');
                setAuthed(true);
            };

            // ==================== FILE OPERATIONS ====================
            const getVisibleFiles = () => {
                let result = [...files];

                if (view === 'drive' || view === 'filter') {
                    const parent = currentFolder;
                    result = result.filter(f => f.parent === parent && !f.trashed);
                    // Check if vault is locked
                    if (currentFolder === 'f3' && !vaultUnlocked) {
                        return [];
                    }
                    if (view === 'filter' && filterType) {
                        result = result.filter(f => getFileType(f) === filterType);
                    }
                } else if (view === 'recent') {
                    result = result.filter(f => !f.trashed).sort((a, b) => b.modified - a.modified).slice(0, 8);
                } else if (view === 'starred') {
                    result = result.filter(f => f.starred && !f.trashed);
                } else if (view === 'trash') {
                    result = result.filter(f => f.trashed);
                } else if (view === 'hidden') {
                    if (!vaultUnlocked) return [];
                    result = result.filter(f => f.parent === 'f3' && !f.trashed);
                }

                // Sorting
                result.sort((a, b) => {
                    let valA, valB;
                    if (sortBy === 'name') { valA = a.name.toLowerCase();
                        valB = b.name.toLowerCase(); } else if (sortBy === 'size') { valA = a.size;
                        valB = b.size; } else if (sortBy === 'modified') { valA = a.modified;
                        valB = b.modified; }

                    if (valA < valB) return sortDir === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDir === 'asc' ? 1 : -1;
                    return 0;
                });

                // Folders first
                result.sort((a, b) => (a.type === 'folder' && b.type !== 'folder') ? -1 : 1);

                return result;
            };

            const handleOpen = (file) => {
                if (file.type === 'folder') {
                    if (file.vault) {
                        // Handle vault access
                        if (!vaultUnlocked) {
                            setModal({ type: 'vaultPassword', data: { folder: file } });
                            return;
                        }
                    }
                    setCurrentFolder(file.id);
                    setView('drive');
                    setSelected([]);
                } else if (file.type === 'file') {
                    const ftype = getFileType(file);
                    if (ftype === 'image' || ftype === 'video') {
                        setMediaViewer(file);
                    } else {
                        setDetailItem(file);
                    }

            const handleContext = (e, file) => {
                e.preventDefault();
                e.stopPropagation();
                setSelected([file.id]);
                setDetailItem(file);
                setCtxMenu({ x: e.clientX, y: e.clientY, file });

                window.addEventListener('click', close);
                return () => window.removeEventListener('click', close);
            }, []);

            const handleStar = (id) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, starred: !f.starred } : f));
                const f = files.find(x => x.id === id);
                if (f) pushToast('success', 'STAR TOGGLED', `${f.name} ${f.starred ? 'unstarred' : 'starred'}`);
            };

            const handleDelete = (ids) => {
                if (settings.confirmDelete) {
                    setModal({ type: 'confirm', data: { ids } });
                    return;
                }
                executeDelete(ids);
            };

            const executeDelete = (ids) => {
                setFiles(prev => prev.map(f => {
                    if (ids.includes(f.id)) {
                        return { ...f, trashed: true, parent: 'trash' };
                    }
                    return f;
                }));
                pushToast('warn', 'MOVED TO TRASH', `${ids.length} item(s) deleted`);
                setSelected([]);
                setDetailItem(null);
            };

            const handleRestore = (ids) => {
                setFiles(prev => prev.map(f => {
                    if (ids.includes(f.id)) {
                        return { ...f, trashed: false, parent: 'root' };
                    }
                    return f;
                }));
                pushToast('success', 'ITEM RESTORED', `${ids.length} item(s) restored`);
            };

            const handleCopy = () => {
                setClipboard(selected);
                pushToast('success', 'COPIED', `${selected.length} item(s) in clipboard`);
            };

            const handlePaste = () => {
                if (!clipboard.length) return;
                setFiles(prev => {
                    const newFiles = [...prev];
                    clipboard.forEach(id => {
                        const file = newFiles.find(f => f.id === id);
                        if (file) {
                            const copy = { ...file, id: 'f' + Date.now() + Math.random().toString(36).substr(2,
                                    5), name: `copy_${file.name}`, parent: currentFolder,
                                modified: Date.now() };
                            newFiles.push(copy);
                        }
                    });
                    return newFiles;
                });
                pushToast('success', 'PASTED', `${clipboard.length} item(s) pasted`);
            };

            const handleRename = (id, newName) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, name: newName } : f));
                pushToast('success', 'RENAMED', `File updated to ${newName}`);
            };

            const handleSetPassword = (id, pass) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, locked: true, password: pass } : f));
                pushToast('success', 'SECURED', `Password protection enabled`);
            };

            const handleRemovePassword = (id) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, locked: false, password: null } : f));
                pushToast('warn', 'UNLOCKED', `Password protection removed`);
            };

            const handleDownload = (file) => {
                if (file.locked) {
                    setModal({ type: 'authPrompt', data: { file, action: 'download' } });
                    return;
                }
                pushToast('success', 'DOWNLOAD INITIATED', `${file.name} (${formatBytes(file.size)})`);
            };

            const handleNewFolder = (name) => {
                const id = 'f' + Date.now();
                setFiles(prev => [...prev, {
                    id,
                    name,
                    type: 'folder',
                    parent: currentFolder,
                    modified: Date.now(),
                    size: 0
                }]);
                pushToast('success', 'FOLDER CREATED', `${name} added to directory`);
            };

            const handleDeleteFolder = (folderId) => {
                const folder = files.find(f => f.id === folderId);
                if (folder) {
                    setModal({
                        type: 'confirm',
                        data: { ids: [folderId], message: `Delete folder "${folder.name}" and all its contents?` }
                    });
                }
            };

            const handleUnlockVault = (pass) => {
                if (pass === 'atlas') {
                    setVaultUnlocked(true);
                    setView('hidden');
                    setCurrentFolder('f3');
                    pushToast('success', 'VAULT UNLOCKED', 'Hidden Files Vault access granted');
                    setModal(null);
                } else {
                    pushToast('error', 'ACCESS DENIED', 'Invalid master password');
                }
            };

            const handleSetVaultPassword = (pass) => {
                setFiles(prev => prev.map(f => {
                    if (f.id === 'f3') {
                        return { ...f, locked: true, password: pass };
                    }
                    return f;
                }));
                pushToast('success', 'VAULT SECURED', 'Vault password set successfully');
                setModal(null);
            };

            const handleSkipVaultPassword = () => {
                setFiles(prev => prev.map(f => {
                    if (f.id === 'f3') {
                        return { ...f, locked: false };
                    }
                    return f;
                }));
                setVaultUnlocked(true);
                setView('hidden');
                setCurrentFolder('f3');
                pushToast('warn', 'VAULT UNPROTECTED', 'Vault password skipped');
                setModal(null);
            };

            // ==================== RENDER ====================
            if (!authed) {
                return ( <
                    div className = "auth-screen"
                    id = "auth-overlay" >
                    <
                    AuthBox onLogin = { handleLogin }
                    onEnroll = { handleEnroll }
                    pushToast = { pushToast }
                    /> <
                    Toasts toasts = { toasts }
                    /> <
                    /div>
                );
            }

            const visibleFiles = getVisibleFiles();
            const breadcrumbs = [];
            let curr = currentFolder;
            while (curr !== 'root' && curr) {
                const f = files.find(x => x.id === curr);
                if (f) {
                    breadcrumbs.unshift(f);
                    curr = f.parent;
                } else { break; }
            }

            // Check if vault is locked and we're trying to view it
            const isVaultLocked = currentFolder === 'f3' && !vaultUnlocked;

            return ( <
                    div className = "atlas-body"
                    onClick = {
                        () => setCtxMenu(null) } >

                    div className = "dashboard" >

                    view = { view }
                    setView = { setView }
                    setCurrentFolder = { setCurrentFolder }

                    setSettings = { setSettings }

                    setSortBy = { setSortBy }
                    sortDir = { sortDir }
                    setSortDir = { setSortDir }
                    selected = { selected }

                    onPaste = { handlePaste }
                    onDelete = {

                    onNewFolder = {
                        () => setModal({ type: 'newFolder' }) }
                    onUpload = {

                    onSelect = {

                    <

                            /div>

                            onClose = {

                            onDownload = { handleDownload }
                            />

                    }

                    {
                        modal && ( <
                            ModalManager
                            modal = { modal }
                            setModal = { setModal }
                            onNewFolder = { handleNewFolder }
                            onRename = { handleRename }
                            onSetPassword = { handleSetPassword }
                            onUnlockVault = { handleUnlockVault }
                            onSetVaultPassword = { handleSetVaultPassword }
                            onSkipVaultPassword = { handleSkipVaultPassword }
                            onConfirmDelete = { executeDelete }
                            pushToast = { pushToast }
                            />
                        )
                    }

                    <
                    Toasts toasts = { toasts }
                    /> <
                    /div>
                );
            }

            // ==================== AUTH COMPONENT ====================
            function AuthBox({ onLogin, onEnroll, pushToast }) {
                const [tab, setTab] = useState('ACCESS');
                const [loginForm, setLoginForm] = useState({ userId: 'PT-8KLM9N2Q', username: 'OPERATOR', pass: '' });
                const [enrollForm, setEnrollForm] = useState({ name: '', dob: '', country: '', pass: '', photo: null,
                    idDoc: null });

                const handlePhoto = (e) => {

                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => setEnrollForm({ ...enrollForm, idDoc: ev.target.result });
                        reader.readAsDataURL(file);

                };

                return ( <
                        div className = "auth-box"
                        onClick = {
                            (e) => e.stopPropagation() } >
                        <
                        div className = "auth-corner tl" / > < div className = "auth-corner tr" / >
                        <
                        div className = "auth-corner bl" / > < div className = "auth-corner br" / >

                        <
                        div className = "auth-visual" >
                        <
                        div className = "auth-logo" > A < /div> <
                        div className = "auth-tagline" >
                        YOUR DATA VAULT. < br / >
                        YOUR RULES. < br / >
                        YOUR < span > SOVEREIGNTY < /span>. <
                        /div> <
                        div className = "auth-meta" >
                        ATLASTALON SECURE OS < br / >
                        PHANTOM - T / SPECTER - C < br / >
                        FIRMWARE v3 .1 .4 <
                        /div> <
                        /div>

                        <
                        div className = "auth-panel" >
                        <
                        div className = "auth-tabs" >
                        <
                        button className = { `auth-tab ${tab === 'ACCESS' ? 'active' : ''}` }
                        onClick = {
                            () => setTab('ACCESS') } > ACCESS < /button> <
                        button className = { `auth-tab ${tab === 'ENROLL' ? 'active' : ''}` }
                        onClick = {
                            () => setTab('ENROLL') } > ENROLL < /button> <
                        /div>

                        { tab === 'ACCESS' ? ( <
                                div className = "auth-form" >
                                <
                                div className = "auth-title" > Secure Login < /div> <
                                div className = "auth-input-group" >
                                <
                                label className = "auth-label" > User ID < /label> <
                                input className = "auth-input"
                                value = { loginForm.userId }
                                onChange = { e => setLoginForm({ ...loginForm,
                                    userId: e.target.value }) }
                                / >
                                <
                                /div> <
                                div className = "auth-input-group" >
                                <
                                label className = "auth-label" > Username < /label> <
                                input className = "auth-input"
                                value = { loginForm.username }
                                onChange = { e => setLoginForm({ ...loginForm,
                                    username: e.target.value }) }
                                / >
                                <
                                /div> <
                                div className = "auth-input-group" >
                                <
                                label className = "auth-label" > Password / PIN < /label> <
                                input type = "password"
                                className = "auth-input"
                                placeholder = "••••••"
                                value = { loginForm.pass }
                                onChange = { e => setLoginForm({ ...loginForm,
                                    pass: e.target.value }) }
                                / >
                                <
                                /div> <
                                button className = "auth-btn"
                                onClick = {
                                    () => onLogin(loginForm.userId, loginForm.username, loginForm.pass) } >
                                AUTHENTICATE <
                                /button> <
                                div className = "auth-info" > DEFAULT: phantom / atlas < /div> <
                                /div>
                            ) : ( <
                                div className = "auth-form"
                                style = { { overflowY: 'auto' } } >
                                <
                                div className = "auth-title" > Identity Enrollment < /div> <
                                div className = "auth-input-group" >
                                <
                                label className = "auth-label" > Full Name < /label> <
                                input className = "auth-input"
                                value = { enrollForm.name }
                                onChange = { e => setEnrollForm({ ...enrollForm,
                                    name: e.target.value }) }
                                / >

                                                                                                    // ==================== MEDIA VIEWER

                                                                                                    function MediaViewer({ file,
                                                                                                        files, onClose,
                                                                                                        setFile,
                                                                                                        onDownload }) {
                                                                                                        const idx = files
                                                                                                        .findIndex(f => f
                                                                                                            .id === file
                                                                                                            .id);

                                                                                                        const next = () => {
                                                                                                            const nextFile =
                                                                                                                files[(idx +
                                                                                                                    1) %
                                                                                                                    files
                                                                                                                    .length];
                                                                                                            if (nextFile && (
                                                                                                                    getFileType(
                                                                                                                        nextFile
                                                                                                                    ) ===
                                                                                                                    'image' ||
                                                                                                                    getFileType(
                                                                                                                        nextFile
                                                                                                                    ) ===
                                                                                                                    'video'
                                                                                                                ))
                                                                                                                setFile(
                                                                                                                    nextFile
                                                                                                                    );
                                                                                                        };
                                                                                                        const prev = () => {
                                                                                                            const prevFile =
                                                                                                                files[(idx -
                                                                                                                    1 +
                                                                                                                    files
                                                                                                                    .length) %
                                                                                                                    files
                                                                                                                    .length];
                                                                                                            if (prevFile && (
                                                                                                                    getFileType(
                                                                                                                        prevFile
                                                                                                                    ) ===
                                                                                                                    'image' ||
                                                                                                                    getFileType(
                                                                                                                        prevFile
                                                                                                                    ) ===
                                                                                                                    'video'
                                                                                                                ))
                                                                                                                setFile(
                                                                                                                    prevFile
                                                                                                                    );
                                                                                                        };

                                                                                                        useEffect(() => {
                                                                                                            const handler =
                                                                                                                (e) => {
                                                                                                                    if (e
                                                                                                                        .key ===
                                                                                                                        'Escape'
                                                                                                                        )
                                                                                                                        onClose();
                                                                                                                    if (e
                                                                                                                        .key ===
                                                                                                                        'ArrowRight'
                                                                                                                        )
                                                                                                                        next();
                                                                                                                    if (e
                                                                                                                        .key ===
                                                                                                                        'ArrowLeft'
                                                                                                                        )
                                                                                                                        prev();
                                                                                                                };
                                                                                                            window
                                                                                                            .addEventListener(
                                                                                                                'keydown',
                                                                                                                handler
                                                                                                                );
                                                                                                            return () =>
                                                                                                                window
                                                                                                                .removeEventListener(
                                                                                                                    'keydown',
                                                                                                                    handler
                                                                                                                    );

                                                                                                                                                                                                'unlock' ?
                                                                                                                                                                                                handleUnlock() :
                                                                                                                                                                                                handleSet()
                                                                                                                                                                                                ) }
                                                                                                                                                                                    / >
                                                                                                                                                                                    <
                                                                                                                                                                                    /div> <
                                                                                                                                                                                    /div> <
                                                                                                                                                                                    div className =
                                                                                                                                                                                    "modal-actions" >
                                                                                                                                                                                    <
                                                                                                                                                                                    button className =
                                                                                                                                                                                    "btn"
                                                                                                                                                                                    onClick = { close } >
                                                                                                                                                                                    CANCEL < /button> {
                                                                                                                                                                                        mode ===
                                                                                                                                                                                            'unlock' ? ( <
                                                                                                                                                                                            >
                                                                                                                                                                                            <
                                                                                                                                                                                            button className =
                                                                                                                                                                                            "btn"
                                                                                                                                                                                            onClick = {
                                                                                                                                                                                                () => setMode(
                                                                                                                                                                                                    'set'
                                                                                                                                                                                                    ) } >
                                                                                                                                                                                            SET PASSWORD <
                                                                                                                                                                                            /button> <
                                                                                                                                                                                            button className =
                                                                                                                                                                                            "btn"
                                                                                                                                                                                            onClick = { onSkip } >
                                                                                                                                                                                            SKIP < /button> <
                                                                                                                                                                                            />
                                                                                                                                                                                        ) : ( <
                                                                                                                                                                                            button className =
                                                                                                                                                                                            "btn primary"
                                                                                                                                                                                            onClick = { handleSet } >
                                                                                                                                                                                            SET PASSWORD <
                                                                                                                                                                                            /button>
                                                                                                                                                                                        )
                                                                                                                                                                                    } <
                                                                                                                                                                                    /div> <
                                                                                                                                                                                    />
                                                                                                                                                                                );
                                                                                                                                                                            }

                                                                                                                                                                            // ====================
                                                                                                                                                                            // TOASTS
                                                                                                                                                                            // ====================
                                                                                                                                                                            function Toasts({ toasts }) {
                                                                                                                                                                                return ( <
                                                                                                                                                                                    div className =
                                                                                                                                                                                    "toast-wrap" > {
                                                                                                                                                                                        toasts.map(
                                                                                                                                                                                            t => ( <
                                                                                                                                                                                                div key = { t
                                                                                                                                                                                                        .id }
                                                                                                                                                                                                className = { `toast ${t.type}` } >
                                                                                                                                                                                                <
                                                                                                                                                                                                div className =
                                                                                                                                                                                                "toast-title" >
                                                                                                                                                                                                { t.title } <
                                                                                                                                                                                                /div> <
                                                                                                                                                                                                div className =
                                                                                                                                                                                                "toast-msg" >
                                                                                                                                                                                                { t.msg } <
                                                                                                                                                                                                /div> <
                                                                                                                                                                                                /div>
                                                                                                                                                                                            )
                                                                                                                                                                                        )
                                                                                                                                                                                    } <
                                                                                                                                                                                    /div>
                                                                                                                                                                                );
                                                                                                                                                                            }

                                                                                                                                                                            // Mount
                                                                                                                                                                            const root =
                                                                                                                                                                                ReactDOM
                                                                                                                                                                                .createRoot(
                                                                                                                                                                                    document
                                                                                                                                                                                    .getElementById(
                                                                                                                                                                                        'root'
                                                                                                                                                                                        )
                                                                                                                                                                                    );
                                                                                                                                                                            root.render( <
                                                                                                                                                                                App / >
                                                                                                                                                                                );
    </script>
</body>
</html>
