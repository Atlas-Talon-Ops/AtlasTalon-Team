<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtlasTalon · ACCESS KEYS</title>

    <!-- Google Fonts: Orbitron + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET / BASE ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-blue: #000498;
            --primary-glow: rgba(0, 4, 152, 0.25);
            --bg-dark: #000000;
            --bg-card: #0a0a0a;
            --border-light: rgba(255, 255, 255, 0.06);
            --text-light: #e0e0e0;
            --red-accent: #FF3B30;
            --red-glow: rgba(255, 59, 48, 0.15);
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        * {
            scrollbar-width: none;
        }
        html, body {
            overflow-x: hidden;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        #root {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            position: relative;
        }

        /* ---------- GLITCH ---------- */
        .glitch {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* ---------- KEYS PAGE ---------- */
        .keys-page {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px 40px 40px;
            background: var(--bg-dark);
            min-height: 100vh;
            transition: padding-right 0.35s ease;
            scrollbar-width: none;
        }
        .keys-page::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .keys-page.panel-open {
            padding-right: 460px;
        }

        /* ---------- HEADER ---------- */
        .keys-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 0;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-text {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.15em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.06);
        }

        .brand-text span {
            color: var(--primary-blue);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .access-keys-tag {
            font-size: 11px;
            color: #606060;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.12em;
        }

        .btn-new-key {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cccccc;
            padding: 10px 22px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            transition: all 0.25s ease;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-new-key:hover {
            background: rgba(0, 4, 152, 0.12);
            border-color: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 0 16px var(--primary-glow);
        }

        /* ---- Company Logo (Triangle) ---- */
        .company-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 0 8px rgba(0, 4, 152, 0.2));
            transition: filter 0.3s;
        }

        .company-logo:hover {
            filter: drop-shadow(0 0 16px rgba(0, 4, 152, 0.4));
        }

        .company-logo svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- KEYS GRID ---------- */
        .keys-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .key-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-left: 3px solid var(--primary-blue);
            position: relative;
            transition: all 0.25s ease;
            cursor: pointer;
            border-radius: 4px;
        }

        .key-card:hover {
            border-color: rgba(255, 255, 255, 0.10);
            background: #0e0e0e;
            box-shadow: 0 0 20px rgba(0, 4, 152, 0.06);
        }

        .key-card:active {
            transform: scale(0.99);
        }

        .key-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .key-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .platform-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 14px;
            color: #000;
            background: #ebebeb;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.25s, box-shadow 0.25s;
            position: relative;
        }

        .platform-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .platform-icon .letter {
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
            color: #000;
        }

        .key-card:hover .platform-icon {
            border-color: var(--primary-blue);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .key-card-top h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.05em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .key-card-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .key-card-actions button {
            padding: 5px 10px;
            background: transparent;
            font-size: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.08em;
            transition: all 0.2s;
            border: 1px solid transparent;
            border-radius: 3px;
        }

        .btn-edit-card {
            border-color: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-edit-card:hover {
            background: rgba(0, 4, 152, 0.10);
            border-color: var(--primary-blue);
            color: #ffffff;
        }

        .btn-del-card {
            border-color: rgba(255, 59, 48, 0.15);
            color: rgba(255, 59, 48, 0.5);
        }
        .btn-del-card:hover {
            background: rgba(255, 59, 48, 0.10);
            border-color: rgba(255, 59, 48, 0.4);
            color: #FF3B30;
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.08);
        }

        .key-card-username {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
        }

        .key-card-pw-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .key-card-pw-row .pw-display {
            font-size: 12px;
            color: #d0d0d0;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.02);
            padding: 2px 10px 2px 8px;
            border-radius: 3px;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-view-card {
            border: 1px solid rgba(235, 235, 235, 0.10);
            color: rgba(235, 235, 235, 0.4);
            padding: 4px 10px;
            background: transparent;
            font-size: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border-radius: 3px;
        }
        .btn-view-card:hover {
            background: rgba(0, 4, 152, 0.08);
            border-color: var(--primary-blue);
            color: #ffffff;
        }

        .btn-copy-card {
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 4px 10px;
            background: transparent;
            font-size: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border-radius: 3px;
        }
        .btn-copy-card:hover {
            background: rgba(0, 4, 152, 0.08);
            border-color: var(--primary-blue);
            color: #ffffff;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            text-align: center;
            padding: 100px;
            color: #505050;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
        }

        /* ---------- LOADING ---------- */
        .loading-state {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        .loading-state span {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 2px;
            color: #888;
            font-size: 12px;
        }

        /* ---------- SIDE PANEL ---------- */
        .side-panel {
            position: fixed;
            top: 0;
            right: -480px;
            width: 440px;
            height: 100vh;
            background: #0c0c0c;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 200;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 32px 28px;
            overflow-y: auto;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            scrollbar-width: none;
        }
        .side-panel::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .side-panel.open {
            right: 0;
        }

        .side-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 4, 152, 0.1), var(--primary-blue), rgba(0, 4, 152, 0.1));
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 4, 152, 0.15);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .panel-header-left .platform-icon {
            width: 44px;
            height: 44px;
            font-size: 18px;
            border-radius: 8px;
        }

        .panel-header-left .platform-icon svg {
            width: 24px;
            height: 24px;
        }

        .panel-header-left .platform-icon .letter {
            font-size: 18px;
        }

        .panel-service-name {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.05em;
            word-break: break-word;
        }

        .panel-close {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.12);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }
        .panel-close:hover {
            color: #ffffff;
            transform: rotate(90deg);
        }

        .panel-field {
            margin-bottom: 20px;
        }

        .panel-field label {
            display: block;
            font-size: 9px;
            color: #606060;
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .panel-field .field-value {
            font-size: 13px;
            color: #d0d0d0;
            font-family: 'JetBrains Mono', monospace;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .panel-field .field-value:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .panel-field .field-value .pw-reveal {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .panel-field .field-value .pw-reveal span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-field .field-value .pw-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .panel-field .field-value .pw-actions button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.35);
            padding: 4px 10px;
            font-size: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border-radius: 3px;
        }
        .panel-field .field-value .pw-actions button:hover {
            border-color: var(--primary-blue);
            color: #ffffff;
            background: rgba(0, 4, 152, 0.08);
        }

        .panel-field .field-value .pw-actions .btn-panel-copy {
            border-color: rgba(255, 255, 255, 0.06);
        }
        .panel-field .field-value .pw-actions .btn-panel-copy:hover {
            border-color: var(--primary-blue);
        }

        .panel-actions {
            display: flex;
            gap: 10px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .panel-actions button {
            flex: 1;
            padding: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 4px;
        }

        .panel-btn-edit {
            border-color: rgba(255, 255, 255, 0.08) !important;
            color: rgba(255, 255, 255, 0.5);
        }
        .panel-btn-edit:hover {
            background: rgba(0, 4, 152, 0.10);
            border-color: var(--primary-blue) !important;
            color: #ffffff;
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .panel-btn-delete {
            border-color: rgba(255, 59, 48, 0.12) !important;
            color: rgba(255, 59, 48, 0.5);
        }
        .panel-btn-delete:hover {
            background: rgba(255, 59, 48, 0.08);
            border-color: rgba(255, 59, 48, 0.35) !important;
            color: #FF3B30;
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.08);
        }

        .panel-empty {
            text-align: center;
            padding: 60px 20px;
            color: #404040;
            font-size: 11px;
            letter-spacing: 0.1em;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(8px);
            animation: modalFade 0.25s ease;
        }

        @keyframes modalFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .modal-box {
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px 44px 36px;
            width: 520px;
            max-width: 94vw;
            position: relative;
            animation: modalSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 6px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9);
            filter: drop-shadow(0 0 20px rgba(0, 4, 152, 0.08));
        }

        @keyframes modalSlide {
            0% { transform: translateY(24px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .modal-box::before,
        .modal-box::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--primary-blue);
            border-style: solid;
            pointer-events: none;
            transition: border-color 0.3s;
            opacity: 0.6;
        }
        .modal-box::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }
        .modal-box::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .modal-box h3 {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 28px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-box h3 .badge {
            font-size: 9px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
            padding: 2px 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-weight: 400;
        }

        .modal-field {
            margin-bottom: 18px;
        }

        .modal-field label {
            display: block;
            font-size: 9px;
            color: #606060;
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .modal-field input {
            width: 100%;
            padding: 10px 14px;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            border-radius: 4px;
        }
        .modal-field input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue), 0 0 16px var(--primary-glow);
        }
        .modal-field input::placeholder {
            color: #333;
        }

        /* ---------- DROPDOWN ---------- */
        .dropdown-container {
            position: relative;
            width: 100%;
        }

        .dropdown-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            background: #0e0e0e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            padding: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.08) transparent;
        }

        .dropdown-list.active {
            display: block;
        }

        .dropdown-list::-webkit-scrollbar {
            width: 4px;
        }
        .dropdown-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .dropdown-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.10);
            border-radius: 2px;
        }

        .dropdown-item {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 12px;
            color: #c0c0c0;
            font-family: 'JetBrains Mono', monospace;
            transition: background 0.15s, color 0.15s;
            border-left: 2px solid transparent;
            user-select: none;
        }

        .dropdown-item:hover {
            background: rgba(0, 4, 152, 0.10);
            color: #ffffff;
            border-left-color: var(--primary-blue);
        }

        .dropdown-item.selected {
            background: rgba(0, 4, 152, 0.15);
            color: #ffffff;
            border-left-color: var(--primary-blue);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-ok {
            flex: 1;
            padding: 12px;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            transition: all 0.2s;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .btn-ok:hover {
            background: #0005b3;
            box-shadow: 0 0 24px var(--primary-glow);
            transform: scale(1.02);
        }
        .btn-ok:active {
            transform: scale(0.98);
        }

        .btn-cancel-modal {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #666;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            border-radius: 4px;
        }
        .btn-cancel-modal:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.12);
            color: #aaaaaa;
        }

        /* ---------- CONFIRM DELETE (military style with red accents) ---------- */
        .keys-confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            animation: modalFade 0.2s ease;
        }

        .keys-confirm-box {
            background: #080808;
            border: 1px solid rgba(255, 51, 51, 0.3);
            width: 360px;
            padding: 32px 28px 24px;
            position: relative;

        /* ---------- RESPONSIVE ---------- */

<body>

    <div id="root"></div>

    <script>
        // --------------------------------------------------------------
        //  DATA LAYER (localStorage persistence)
        // --------------------------------------------------------------
        const STORAGE_KEY = 'keys_data_v2';

        let keysData = [];
        let nextId = 1;

        // Predefined list of services for the dropdown
        const SERVICE_OPTIONS = [
            'GitHub', 'AWS Console', 'Google Workspace', 'Microsoft Azure',
            'Slack', 'Dashboard', 'VPN', 'Database', 'Staging Server',
            'Production Server', 'Admin Panel', 'CRM', 'ERP', 'Jira',
            'Confluence', 'Bitbucket', 'GitLab', 'Dropbox', 'Salesforce',
            'HubSpot', 'WordPress', 'Shopify', 'Stripe', 'DigitalOcean'
        ];

        function loadKeys() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    keysData = parsed.keys || [];
                    nextId = parsed.nextId || 1;
                } else {
                    keysData = [
                        { id: 1, service: 'GitHub', username: 'dev_ops', password: 'ghp_secure123',
                        url: 'https://github.com', notes: 'Production access' },
                        { id: 2, service: 'AWS Console', username: 'admin', password: 'aws!Secure#2026',
                            url: 'https://aws.amazon.com', notes: 'Root account' },
                        { id: 3, service: 'Dashboard', username: 'monitor', password: 'dash$view#42',
                            url: 'https://dashboard.internal', notes: 'Monitoring' },
                        { id: 4, service: 'Google Workspace', username: 'admin@company.com', password: 'gws_Admin2025',
                            url: 'https://admin.google.com', notes: 'G Suite admin' },
                        { id: 5, service: 'Slack', username: 'it_team', password: 'slack_secure_123',
                            url: 'https://slack.com', notes: 'Team communication' },
                    ];
                    nextId = 6;
                    saveKeys();
                }
            } catch (_) {
                keysData = [];
                nextId = 1;
            }
        }

        function saveKeys() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ keys: keysData, nextId }));
        }

        function getKeys() {
            return keysData.slice();
        }

        function addKey(entry) {
            const newEntry = { ...entry, id: nextId++ };
            keysData.push(newEntry);
            saveKeys();
            return newEntry;
        }

        function updateKey(id, updates) {
            const idx = keysData.findIndex(k => k.id === id);
            if (idx === -1) return null;
            const updated = { ...keysData[idx], ...updates };
            keysData[idx] = updated;
            saveKeys();
            return updated;
        }

        function deleteKey(id) {
            const idx = keysData.findIndex(k => k.id === id);
            if (idx === -1) return false;
            keysData.splice(idx, 1);
            saveKeys();
            return true;
        }

        // --------------------------------------------------------------
        //  ICON GENERATOR
        // --------------------------------------------------------------
        function getPlatformIcon(service) {
            const s = (service || '').toLowerCase().trim();
            const map = {
                'github': {
                    color: '#f0f6fc',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.15 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.62.24 2.85.12 3.15.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`
                },
                'aws': {
                    color: '#ff9900',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15L17 12.23l-4-2.37V7z"/></svg>`
                },
                'dashboard': {
                    color: '#4fc3f7',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>`
                },
                'google': {
                    color: '#4285f4',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>`
                },
                'microsoft': {
                    color: '#00a4ef',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.4 11.4H2.8V2.8h8.6v8.6zm0 9.8H2.8v-8.6h8.6v8.6zm9.8-9.8h-8.6V2.8h8.6v8.6zm0 9.8h-8.6v-8.6h8.6v8.6z"/></svg>`
                },
                'slack': {
                    color: '#e01e5a',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 01-2.52-2.52 2.528 2.528 0 012.52-2.52h2.52v2.52a2.528 2.528 0 01-2.52 2.52zm2.52 0a2.528 2.528 0 01-2.52-2.52V5.042a2.528 2.528 0 012.52-2.52 2.528 2.528 0 012.52 2.52v7.603a2.528 2.528 0 01-2.52 2.52zm2.52 2.52a2.528 2.528 0 012.52-2.52 2.528 2.528 0 012.52 2.52v2.52a2.528 2.528 0 01-2.52 2.52 2.528 2.528 0 01-2.52-2.52v-2.52zm2.52-9.645a2.528 2.528 0 01-2.52-2.52V5.042a2.528 2.528 0 012.52-2.52 2.528 2.528 0 012.52 2.52v2.52a2.528 2.528 0 01-2.52 2.52zm4.005 2.52a2.528 2.528 0 012.52-2.52 2.528 2.528 0 012.52 2.52 2.528 2.528 0 01-2.52 2.52h-2.52v-2.52zm0-2.52v-2.52a2.528 2.528 0 012.52-2.52 2.528 2.528 0 012.52 2.52v2.52a2.528 2.528 0 01-2.52 2.52 2.528 2.528 0 01-2.52-2.52z"/></svg>`
                },
                'azure': {
                    color: '#0078d4',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.4 11.4H2.8V2.8h8.6v8.6zm0 9.8H2.8v-8.6h8.6v8.6zm9.8-9.8h-8.6V2.8h8.6v8.6zm0 9.8h-8.6v-8.6h8.6v8.6z"/></svg>`
                }
            };

            let matched = null;
            for (const [key, val] of Object.entries(map)) {
                if (s.includes(key)) { matched = val; break; }
            }

            if (matched) {
                const color = matched.color;
                return {
                    color,
                    content: matched.svg,
                    isSvg: true
                };
            }

            const letter = (service || 'K').charAt(0).toUpperCase();
            const colors = ['#ebebeb', '#4fc3f7', '#ff9900', '#f0f6fc', '#4285f4', '#00a4ef', '#e01e5a', '#a8b4c0'];
            const hash = letter.charCodeAt(0) || 0;
            const color = colors[hash % colors.length];
            return {
                color,
                content: letter,
                isSvg: false
            };
        }

        // --------------------------------------------------------------
        //  RENDER ENGINE
        // --------------------------------------------------------------
        let currentState = {
            keys: [],
            loading: true,
            showPasswordModal: false,
            editPassword: null,
            passwordForm: { service: '', username: '', password: '', url: '', notes: '' },
            visiblePasswordId: null,
            deleteTarget: null,
            selectedId: null,
            panelVisible: false,
            copyConfirm: false,
        };

        let rootEl = document.getElementById('root');

        // --- DROPDOWN HELPERS ---
        let dropdownActive = false;

        function renderDropdown(filterText) {
            const input = document.getElementById('modalService');
            const dropdown = document.getElementById('serviceDropdown');
            if (!input || !dropdown) return;

            const value = filterText || input.value || '';
            const lowerValue = value.toLowerCase().trim();

            let matches = [];
            if (lowerValue.length > 0) {
                matches = SERVICE_OPTIONS.filter(opt => opt.toLowerCase().includes(lowerValue));
            } else {
                matches = SERVICE_OPTIONS.slice(0, 12);
            }

            if (matches.length > 0 && dropdownActive) {
                dropdown.innerHTML = matches.map(m =>
                    `<div class="dropdown-item" data-value="${m}">${m}</div>`
                ).join('');
                dropdown.classList.add('active');
            } else {
                dropdown.classList.remove('active');
            }
        }

        function setupDropdownEvents() {
            const input = document.getElementById('modalService');
            const dropdown = document.getElementById('serviceDropdown');
            if (!input || !dropdown) return;

            // Remove old listeners
            const newInput = input.cloneNode(true);
            input.parentNode.replaceChild(newInput, input);
            const newDropdown = dropdown.cloneNode(true);
            dropdown.parentNode.replaceChild(newDropdown, dropdown);

            const freshInput = document.getElementById('modalService');
            const freshDropdown = document.getElementById('serviceDropdown');

            if (!freshInput || !freshDropdown) return;

            // Only open dropdown on click (not on focus)
            freshInput.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdownActive = true;
                renderDropdown(this.value);
            });

            freshInput.addEventListener('input', function(e) {
                if (dropdownActive) {
                    renderDropdown(this.value);
                }
            });

            freshDropdown.addEventListener('mousedown', function(e) {
                const item = e.target.closest('.dropdown-item');
                if (item) {
                    const val = item.dataset.value;
                    freshInput.value = val;
                    freshDropdown.classList.remove('active');
                    dropdownActive = false;
                    freshInput.dispatchEvent(new Event('input', { bubbles: true }));
                    freshInput.focus();
                }
            });

            freshInput.addEventListener('blur', function(e) {
                setTimeout(() => {
                    freshDropdown.classList.remove('active');
                    dropdownActive = false;
                }, 180);
            });

            freshDropdown.addEventListener('mousedown', function(e) {
                e.preventDefault();
            });

            // Ensure scroll works with click and drag
            freshDropdown.addEventListener('wheel', function(e) {
                e.stopPropagation();
            }, { passive: true });
        }

        function render() {
            const state = currentState;

            if (state.loading) {
                rootEl.innerHTML = `
                    <div class="loading-state">
                        <span>LOADING KEYS...</span>
                    </div>
                `;
                return;
            }

            const keys = state.keys;
            const selectedEntry = keys.find(k => k.id === state.selectedId) || null;

            // --- BUILD KEY CARDS ---
            let cardsHtml = '';
            if (keys.length > 0) {
                keys.forEach(pw => {
                    const isVisible = state.visiblePasswordId === pw.id;
                    const pwDisplay = isVisible ? pw.password : '•'.repeat(12);
                    const icon = getPlatformIcon(pw.service);
                    const iconHtml = icon.isSvg ?
                        icon.content :
                        `<span class="letter">${icon.content}</span>`;

                    cardsHtml += `
                        <div class="key-card" data-id="${pw.id}" data-action="openPanel">
                            <div class="key-card-top">
                                <div class="key-card-left">
                                    <div class="platform-icon" style="background:${icon.color};color:#000;">
                                        ${iconHtml}
                                    </div>
                                    <h3 class="glitch">${escHtml(pw.service)}</h3>
                                </div>
                                <div class="key-card-actions">
                                    <button class="btn-edit-card" data-action="edit" data-id="${pw.id}">EDIT</button>
                                    <button class="btn-del-card" data-action="delete" data-id="${pw.id}" data-service="${escHtml(pw.service)}">DEL</button>
                                </div>
                            </div>
                            ${pw.username ? `<div class="key-card-username">USER: ${escHtml(pw.username)}</div>` : ''}
                            <div class="key-card-pw-row">
                                <span class="pw-display glitch">${escHtml(pwDisplay)}</span>
                                <button class="btn-view-card" data-action="toggleView" data-id="${pw.id}">${isVisible ? 'HIDE' : 'VIEW'}</button>
                                <button class="btn-copy-card" data-action="copy" data-password="${escHtml(pw.password)}">COPY</button>
                            </div>
                        </div>
                    `;
                });
            }

            const gridHtml = keys.length > 0 ?
                `<div class="keys-grid">${cardsHtml}</div>` :
                `<div class="empty-state">[ NO KEYS ]</div>`;

            // --- SIDE PANEL ---
            let panelHtml = '';
            if (selectedEntry) {
                const icon = getPlatformIcon(selectedEntry.service);
                const iconHtml = icon.isSvg ?
                    icon.content :
                    `<span class="letter">${icon.content}</span>`;
                const isPwVisible = state.visiblePasswordId === selectedEntry.id;
                const pwDisplay = isPwVisible ? selectedEntry.password : '•'.repeat(12);

                panelHtml = `
                    <div class="side-panel ${state.panelVisible ? 'open' : ''}" id="sidePanel">
                        <div class="panel-header">
                            <div class="panel-header-left">
                                <div class="platform-icon" style="background:${icon.color};color:#000;">
                                    ${iconHtml}
                                </div>
                                <span class="panel-service-name glitch">${escHtml(selectedEntry.service)}</span>
                            </div>
                            <button class="panel-close" data-action="closePanel">✕</button>
                        </div>

                        <div class="panel-field">
                            <label>Username</label>
                            <div class="field-value">${escHtml(selectedEntry.username || '—')}</div>
                        </div>

                        <div class="panel-field">
                            <label>Password</label>
                            <div class="field-value">
                                <div class="pw-reveal">
                                    <span>${escHtml(pwDisplay)}</span>
                                </div>
                                <div class="pw-actions">
                                    <button data-action="panelToggleView" data-id="${selectedEntry.id}">${isPwVisible ? 'HIDE' : 'VIEW'}</button>
                                    <button class="btn-panel-copy" data-action="panelCopy" data-password="${escHtml(selectedEntry.password)}">COPY</button>
                                </div>
                            </div>
                        </div>

                        ${selectedEntry.url ? `
                        <div class="panel-field">
                            <label>URL</label>
                            <div class="field-value" style="color:#6aa;font-size:12px;">${escHtml(selectedEntry.url)}</div>
                        </div>
                        ` : ''}

                        ${selectedEntry.notes ? `
                        <div class="panel-field">
                            <label>Notes</label>
                            <div class="field-value" style="color:#888;font-size:12px;font-style:italic;">${escHtml(selectedEntry.notes)}</div>
                        </div>
                        ` : ''}

                        <div class="panel-field">
                            <label>ID</label>
                            <div class="field-value" style="color:#555;font-size:11px;">#${selectedEntry.id}</div>
                        </div>

                        <div class="panel-actions">
                            <button class="panel-btn-edit" data-action="panelEdit" data-id="${selectedEntry.id}">✎ EDIT</button>
                            <button class="panel-btn-delete" data-action="panelDelete" data-id="${selectedEntry.id}" data-service="${escHtml(selectedEntry.service)}">✕ DELETE</button>
                        </div>
                    </div>
                `;
            } else {
                panelHtml = `
                    <div class="side-panel ${state.panelVisible ? 'open' : ''}" id="sidePanel">
                        <div class="panel-header">
                            <div class="panel-header-left">
                                <span style="color:#404040;font-size:11px;letter-spacing:0.1em;">// DETAILS</span>
                            </div>
                            <button class="panel-close" data-action="closePanel">✕</button>
                        </div>
                        <div class="panel-empty">SELECT A KEY<br/><span style="font-size:9px;color:#2a2a2a;">click any card</span></div>
                    </div>
                `;
            }

            // --- MODAL ---
            let modalHtml = '';
            if (state.showPasswordModal) {
                const modalTitle = state.editPassword ? 'EDIT' : 'NEW';
                modalHtml = `
                    <div class="modal-overlay" data-action="closeModal">
                        <div class="modal-box" data-action="modalBox">
                            <h3 class="glitch">
                                [ ${modalTitle} KEY ]
                                <span class="badge">${state.editPassword ? 'UPDATE' : 'CREATE'}</span>
                            </h3>
                            <div class="modal-field">
                                <label>SERVICE</label>
                                <div class="dropdown-container">
                                    <input type="text" id="modalService" value="${escHtml(state.passwordForm.service)}" placeholder="e.g. GitHub" autocomplete="off" />
                                    <div class="dropdown-list" id="serviceDropdown"></div>
                                </div>
                            </div>
                            <div class="modal-field">
                                <label>USERNAME</label>
                                <input type="text" id="modalUsername" value="${escHtml(state.passwordForm.username)}" placeholder="username / email" />
                            </div>
                            <div class="modal-field">
                                <label>PASSWORD</label>
                                <input type="password" id="modalPassword" value="${escHtml(state.passwordForm.password)}" placeholder="••••••••" />
                            </div>
                            <div class="modal-field">
                                <label>URL <span style="color:#333;font-weight:400;">(optional)</span></label>
                                <input type="text" id="modalUrl" value="${escHtml(state.passwordForm.url || '')}" placeholder="https://..." />
                            </div>
                            <div class="modal-field">
                                <label>NOTES <span style="color:#333;font-weight:400;">(optional)</span></label>
                                <input type="text" id="modalNotes" value="${escHtml(state.passwordForm.notes || '')}" placeholder="additional info" />
                            </div>
                            <div class="modal-actions">
                                <button class="btn-ok" id="modalSaveBtn">${state.editPassword ? 'UPDATE' : 'CREATE'}</button>
                                <button class="btn-cancel-modal" data-action="closeModal">CANCEL</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- CONFIRM DELETE (show immediately, keep panel open) ---
            let confirmHtml = '';
            if (state.deleteTarget) {
                confirmHtml = `
                    <div class="keys-confirm-overlay" data-action="cancelDelete">
                        <div class="keys-confirm-box" data-action="confirmBox">
                            <div class="keys-confirm-icon">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff3333" stroke-width="1.8">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </div>
                            <div class="keys-confirm-label">// PURGE KEY //</div>
                            <div class="keys-confirm-title">"${escHtml(state.deleteTarget.service)}"</div>
                            <div class="keys-confirm-sub">THIS ACTION CANNOT BE UNDONE</div>
                            <div class="keys-confirm-actions">
                                <button class="keys-confirm-btn keys-confirm-btn-cancel" data-action="cancelDelete">ABORT</button>
                                <button class="keys-confirm-btn keys-confirm-btn-delete" data-action="confirmDelete">PURGE</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- COPY CONFIRM ---
            let copyConfirmHtml = '';
            if (state.copyConfirm) {
                copyConfirmHtml = `
                    <div class="copy-confirm-overlay" data-action="dismissCopy">
                        <div class="copy-confirm-box">
                            <div class="copy-confirm-icon">✓</div>
                            <div class="copy-confirm-label">// COPIED //</div>
                            <div class="copy-confirm-sub">PASSWORD SENT TO CLIPBOARD</div>
                        </div>
                    </div>
                `;
            }

            // --- ASSEMBLE PAGE ---
            const panelOpenClass = state.panelVisible ? 'panel-open' : '';

            const logoHtml = `
                <div class="company-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12,2 22,20 2,20" />
                        <polygon points="12,8 18,18 6,18" />
                        <polygon points="12,14 14,18 10,18" />
                    </svg>
                </div>
            `;

            rootEl.innerHTML = `
                <div class="keys-page ${panelOpenClass}">
                    <header class="keys-header">
                        <div class="header-left">
                            ${logoHtml}
                            <span class="brand-text glitch">Atlas<span>Talon</span></span>
                        </div>
                        <div class="header-right">
                            <span class="access-keys-tag glitch">[ ACCESS KEYS ]</span>
                            <button class="btn-new-key" id="newKeyBtn">+ NEW KEY</button>
                        </div>
                    </header>
                    ${gridHtml}
                    ${panelHtml}
                    ${modalHtml}
                    ${confirmHtml}
                    ${copyConfirmHtml}
                </div>
            `;

            // --- ATTACH EVENTS ---

            // NEW KEY
            const newBtn = document.getElementById('newKeyBtn');
            if (newBtn) {
                newBtn.addEventListener('click', () => {
                    currentState.editPassword = null;
                    currentState.passwordForm = { service: '', username: '', password: '', url: '', notes: '' };
                    currentState.showPasswordModal = true;
                    render();
                });
            }

            // OPEN PANEL (click on card)
            document.querySelectorAll('[data-action="openPanel"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    const id = parseInt(el.dataset.id, 10);
                    currentState.selectedId = id;
                    currentState.panelVisible = true;
                    render();
                });
            });

            // CLOSE PANEL
            document.querySelectorAll('[data-action="closePanel"]').forEach(el => {
                el.addEventListener('click', () => {
                    currentState.panelVisible = false;
                    render();
                });
            });

            // EDIT from card
            document.querySelectorAll('[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id, 10);
                    const entry = keys.find(k => k.id === id);
                    if (entry) {
                        currentState.editPassword = entry;
                        currentState.passwordForm = { ...entry };
                        currentState.showPasswordModal = true;
                        currentState.panelVisible = false;
                        render();
                    }
                });
            });

            // DELETE from card - show popup immediately, keep panel
            document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id, 10);
                    const service = btn.dataset.service || 'UNKNOWN';
                    currentState.deleteTarget = { id, service };
                    // Keep panel open - don't close it
                    render();
                });
            });

            // TOGGLE VIEW (card)
            document.querySelectorAll('[data-action="toggleView"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id, 10);
                    currentState.visiblePasswordId = (currentState.visiblePasswordId === id) ? null : id;
                    render();
                });
            });

            // COPY (card)
            document.querySelectorAll('[data-action="copy"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(btn.dataset.password || '');
                });
            });

            // PANEL: toggle view
            document.querySelectorAll('[data-action="panelToggleView"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id, 10);
                    currentState.visiblePasswordId = (currentState.visiblePasswordId === id) ? null : id;
                    render();
                });
            });

            // PANEL: copy
            document.querySelectorAll('[data-action="panelCopy"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(btn.dataset.password || '');
                });
            });

            // PANEL: edit
            document.querySelectorAll('[data-action="panelEdit"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id, 10);
                    const entry = keys.find(k => k.id === id);
                    if (entry) {
                        currentState.editPassword = entry;
                        currentState.passwordForm = { ...entry };
                        currentState.showPasswordModal = true;
                        currentState.panelVisible = false;
                        render();
                    }
                });
            });

            // PANEL: delete - show popup immediately, keep panel
            document.querySelectorAll('[data-action="panelDelete"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id, 10);
                    const service = btn.dataset.service || 'UNKNOWN';
                    currentState.deleteTarget = { id, service };
                    // Keep panel open
                    render();
                });
            });

            // MODAL: close
            document.querySelectorAll('[data-action="closeModal"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target === el || el.dataset.action === 'closeModal') {
                        currentState.showPasswordModal = false;
                        currentState.editPassword = null;
                        render();
                    }
                });
            });

            // MODAL: setup dropdown
            if (state.showPasswordModal) {
                setupDropdownEvents();
                // Reset dropdown state - not open by default
                dropdownActive = false;
                const serviceInput = document.getElementById('modalService');
                const dropdown = document.getElementById('serviceDropdown');
                if (dropdown) {
                    dropdown.classList.remove('active');
                }
            }

            // MODAL: save
            const saveBtn = document.getElementById('modalSaveBtn');
            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const service = document.getElementById('modalService').value.trim();
                    const username = document.getElementById('modalUsername').value.trim();
                    const password = document.getElementById('modalPassword').value.trim();
                    const url = document.getElementById('modalUrl').value.trim();
                    const notes = document.getElementById('modalNotes').value.trim();

                    if (!service || !password) {
                        alert('Service and Password are required.');
                        return;
                    }

                    const formData = { service, username, password, url, notes };

                    if (currentState.editPassword) {
                        updateKey(currentState.editPassword.id, formData);
                    } else {
                        addKey(formData);
                    }

                    currentState.keys = getKeys();
                    currentState.showPasswordModal = false;
                    currentState.editPassword = null;
                    currentState.passwordForm = { service: '', username: '', password: '', url: '', notes: '' };
                    if (currentState.selectedId && !currentState.keys.find(k => k.id === currentState.selectedId)) {
                        currentState.selectedId = null;
                        currentState.panelVisible = false;
                    }
                    render();
                });
            }

            // MODAL: enter key
            document.querySelectorAll('#modalService, #modalUsername, #modalPassword, #modalUrl, #modalNotes').forEach(inp => {
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const btn = document.getElementById('modalSaveBtn');
                        if (btn) btn.click();
                    }
                });
            });

            // CONFIRM: cancel
            document.querySelectorAll('[data-action="cancelDelete"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target === el || el.dataset.action === 'cancelDelete') {
                        currentState.deleteTarget = null;
                        render();
                    }
                });
            });

            // CONFIRM: purge
            document.querySelectorAll('[data-action="confirmDelete"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (currentState.deleteTarget) {
                        deleteKey(currentState.deleteTarget.id);
                        currentState.keys = getKeys();
                        const deletedId = currentState.deleteTarget.id;
                        currentState.deleteTarget = null;
                        if (currentState.selectedId === deletedId) {
                            currentState.selectedId = null;
                            currentState.panelVisible = false;
                        }
                        render();
                    }
                });
            });

            // COPY CONFIRM: dismiss
            document.querySelectorAll('[data-action="dismissCopy"]').forEach(el => {
                el.addEventListener('click', () => {
                    currentState.copyConfirm = false;
                    render();
                });
            });

            // Prevent clicks inside boxes from closing them
            document.querySelectorAll('[data-action="confirmBox"]').forEach(el => {
                el.addEventListener('click', (e) => e.stopPropagation());
            });
            document.querySelectorAll('[data-action="modalBox"]').forEach(el => {
                el.addEventListener('click', (e) => e.stopPropagation());
            });
            document.querySelectorAll('.copy-confirm-box').forEach(el => {
                el.addEventListener('click', (e) => e.stopPropagation());
            });
        }

        // --------------------------------------------------------------
        //  UTILITY
        // --------------------------------------------------------------
        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                currentState.copyConfirm = true;
                render();
                setTimeout(() => {
                    if (currentState.copyConfirm) {
                        currentState.copyConfirm = false;
                        render();
                    }
                }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                currentState.copyConfirm = true;
                render();
                setTimeout(() => {
                    if (currentState.copyConfirm) {
                        currentState.copyConfirm = false;
                        render();
                    }
                }, 1500);
            });
        }

        // --------------------------------------------------------------
        //  INIT
        // --------------------------------------------------------------
        loadKeys();
        currentState.keys = getKeys();
        currentState.loading = false;
        render();
    </script>

</body>
</html>
