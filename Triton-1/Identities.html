<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identities · AIDA</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET / FIX WHITE EDGES ===== */
        html, body {
            margin: 0;
            padding: 0;
            background: #050505;
            height: 100%;
            overflow: hidden; /* avoid scroll on html, body will scroll inside .ids-body */
        }
        #root {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* ===== INJECTED CSS (unchanged) ===== */
        .ids-body {
            font-family: 'IBM Plex Mono', monospace;
            background: #050505;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .ids-class-tabs {
            display: flex;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 24px;
        }
        .ids-class-tab {
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            padding: 10px 28px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: #444;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            top: 1px;
            transition: all 0.2s;
        }
        .ids-class-tab:hover {
            color: #888;
            background: rgba(255, 255, 255, 0.03);
        }
        .ids-class-tab.active {
            color: #e0e0e0;
            background: #0a0a0a;
            border-color: #1a1a1a;
        }
        .ids-identity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            max-width: 1600px;
        }
        .ids-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .ids-card:hover {
            border-color: #333;
            transform: translateY(-1px);
        }
        .ids-card-header {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .ids-card-photo {
            width: 90px;
            height: 115px;
            background: #111;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .ids-card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }
        .ids-card-meta {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .ids-card-id {
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .ids-card-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e0e0e0;
        }
        .ids-card-alias {
            font-size: 12px;
            color: #888;
            font-style: italic;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ids-priority-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border: 1px solid;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 8px;
        }
        .ids-priority-badge.hostile {
            color: #FF3D00;
            border-color: rgba(255, 61, 0, 0.3);
            background: rgba(255, 61, 0, 0.08);
        }
        .ids-priority-badge.protected {
            color: #00E5FF;
            border-color: rgba(0, 229, 255, 0.3);
            background: rgba(0, 229, 255, 0.08);
        }
        .ids-priority-badge.neutral {
            color: #666;
            border-color: rgba(100, 100, 100, 0.3);
            background: rgba(100, 100, 100, 0.08);
        }
        .ids-card-intel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 14px;
            padding-top: 16px;
            border-top: 1px solid #1a1a1a;
        }
        .ids-intel-label {
            color: #555;
            display: block;
            margin-bottom: 2px;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ids-intel-value {
            color: #c0c0c0;
            font-weight: 500;
            font-size: 11px;
        }
        .ids-card-menu {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
        }
        .ids-menu-btn {
            background: transparent;
            border: none;
            color: #444;
            font-size: 9px;
            cursor: pointer;
            padding: 9px;
            letter-spacing: 2px;
            font-weight: bold;
            transform: rotate(0deg);
            line-height: 1;
        }
        .ids-menu-btn:hover {
            color: #e0e0e0;
        }
        .ids-menu-btn:hover {
            background: transparent !important;
            color: #e0e0e0;
        }
        .ids-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #0a0a0a;
            border: 1px solid #222;
            min-width: 100px;
            display: none;
            z-index: 100;
        }
        .ids-dropdown.open {
            display: block;
        }
        .ids-dropdown-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            text-align: left;
            background: transparent;
            border: none;
            color: #888;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .ids-dropdown-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #FF3D00;
        }
        .ids-add-btn {
            background: #0a0a0a;
            border: 1px solid #222;
            color: #bebebe;
            padding: 10px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .ids-add-btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .ids-back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #1a1a1a;
            color: #666;
            padding: 8px 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ids-back-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .ids-action-btn {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #666;
            padding: 8px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .ids-action-btn:hover {
            border-color: #888;
            color: #e0e0e0;
        }
        .ids-action-btn.danger:hover {
            border-color: #FF3D00;
            color: #FF3D00;
        }
        .ids-detail-header {
            display: flex;
            gap: 28px;
            margin-bottom: 28px;
            padding: 28px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
        }
        .ids-detail-photo {
            width: 150px;
            height: 190px;
            background: #111;
            border: 1px solid #1a1a1a;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }
        .ids-detail-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }
        .ids-photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .ids-detail-photo:hover .ids-photo-overlay {
            opacity: 1;
        }
        .ids-detail-name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 4px;
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e0e0e0;
        }
        .ids-detail-alias {
            font-size: 13px;
            color: #666;
            margin-bottom: 18px;
            font-style: italic;
        }
        .ids-detail-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 14px;
        }
        .ids-stat-label {
            font-size: 9px;
            color: #444;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
        }
        .ids-stat-value {
            font-size: 12px;
            color: #c0c0c0;
            font-weight: 500;
        }
        .ids-status-badge {
            display: inline-block;
            padding: 2px 7px;
            font-size: 9px;
            letter-spacing: 1px;
            border: 1px solid #1a1a1a;
            background: #111;
        }
        .ids-status-badge.red-code {
            color: #FF3B30;
            border-color: rgba(255, 59, 48, 0.3);
        }
        .ids-status-badge.cold-state {
            color: #34C759;
            border-color: rgba(52, 199, 89, 0.3);
        }
        .ids-status-badge.dark-mode {
            color: #8E8E93;
            border-color: rgba(142, 142, 147, 0.3);
        }
        .ids-status-badge.signal-lock {
            color: #007AFF;
            border-color: rgba(0, 122, 255, 0.3);
        }
        .ids-tabs-nav {
            display: flex;
            border-bottom: 1px solid #1a1a1a;
            background: #0a0a0a;
            overflow-x: auto;
        }
        .ids-tab-btn {
            padding: 14px 22px;
            background: transparent;
            border: none;
            color: #444;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .ids-tab-btn:hover {
            color: #888;
            background: rgba(255, 255, 255, 0.03);
        }
        .ids-tab-btn.active {
            color: #e0e0e0;
            background: #050505;
        }
        .ids-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: #00ffcc;
        }
        .ids-tab-content {
            display: none;
            padding: 24px;
            animation: idsFadeIn 0.25s ease;
        }
        .ids-tab-content.active {
            display: block;
        }
        @keyframes idsFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .ids-profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }
        .ids-section {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 18px;
        }
        .ids-section-full {
            grid-column: 1/-1;
        }
        .ids-section-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 3px;
            color: #555;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a1a;
            text-transform: uppercase;
        }
        .ids-field-row {
            display: flex;
            margin-bottom: 8px;
            align-items: center;
            gap: 8px;
        }
        .ids-field-label {
            width: 110px;
            min-width: 110px;
            font-size: 9px;
            color: #444;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'IBM Plex Mono', monospace;
            line-height: 1.3;
        }
        .ids-field-input {
            flex: 1;
            min-width: 0;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 7px 10px;
            font-size: 11px;
            color: #c0c0c0;
            font-family: 'IBM Plex Mono', monospace;
            transition: border-color 0.2s;
            outline: none;
        }
        .ids-field-input:focus {
            border-color: #00ffcc;
        }
        .ids-field-select {
            flex: 1;
            min-width: 0;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 7px 10px;
            font-size: 11px;
            color: #c0c0c0;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            outline: none;
        }
        .ids-field-select:focus {
            border-color: #00ffcc;
        }
        .ids-threat-track {
            flex: 1;
            height: 3px;
            background: #111;
            position: relative;
            min-width: 0;
        }
        .ids-threat-fill {
            height: 100%;
            transition: width 0.3s;
        }
        .ids-threat-num {
            width: 50px;
            flex-shrink: 0;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 5px 6px;
            font-size: 11px;
            color: #c0c0c0;
            font-family: 'IBM Plex Mono', monospace;
            text-align: right;
            outline: none;
        }
        .ids-threat-num:focus {
            border-color: #00ffcc;
        }
        .ids-social-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }
        .ids-social-card:hover {
            border-color: #2a2a2a;
            background: #111;
        }
        .ids-social-icon {
            width: 36px;
            height: 36px;
            background: #050505;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-family: 'IBM Plex Mono', monospace;
            color: #555;
            flex-shrink: 0;
        }
        .ids-social-platform {
            font-size: 9px;
            color: #444;
            margin-bottom: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ids-social-handle {
            font-size: 12px;
            color: #c0c0c0;
        }
        .ids-social-status {
            font-size: 9px;
            padding: 3px 7px;
            background: rgba(255, 255, 255, 0.04);
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .ids-social-status.active-s {
            color: #34C759;
        }
        .ids-social-status.suspended {
            color: #FF3D00;
        }
        .ids-add-social-btn {
            background: #0a0a0a;
            border: 1px dashed #222;
            color: #444;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 10px;
            letter-spacing: 2px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ids-add-social-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .ids-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .ids-modal-overlay.open {
            display: flex;
        }
        .ids-modal {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            max-width: 580px;
            width: 90%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .ids-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }
        .ids-modal-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: #00ffcc;
            text-transform: uppercase;
        }
        .ids-modal-close {
            background: transparent;
            border: none;
            color: #444;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }
        .ids-modal-close:hover {
            color: #e0e0e0;
        }
        .ids-modal-body {
            padding: 22px;
            overflow-y: auto;
            flex: 1;
        }
        .ids-modal-label {
            display: block;
            font-size: 9px;
            color: #444;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ids-modal-input {
            width: 100%;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 10px 12px;
            font-size: 12px;
            color: #c0c0c0;
            font-family: 'IBM Plex Mono', monospace;
            outline: none;
            margin-bottom: 4px;
        }
        .ids-modal-input:focus {
            border-color: #00ffcc;
        }
        .ids-modal-actions {
            display: flex;
            gap: 10px;
            padding: 18px 22px;
            border-top: 1px solid #1a1a1a;
            flex-shrink: 0;
        }
        .ids-modal-btn {
            flex: 1;
            padding: 11px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .ids-modal-btn.primary {
            background: #00ffcc;
            border: 1px solid #00ffcc;
            color: #000;
            font-weight: 600;
        }
        .ids-modal-btn.primary:hover {
            background: #00d4aa;
        }
        .ids-modal-btn.secondary {
            background: transparent;
            border: 1px solid #1a1a1a;
            color: #666;
        }
        .ids-modal-btn.secondary:hover {
            border-color: #555;
            color: #c0c0c0;
        }
        .ids-modal-btn.danger-btn {
            background: rgba(255, 61, 0, 0.08);
            border: 1px solid #FF3D00;
            color: #FF3D00;
        }
        .ids-modal-btn.danger-btn:hover {
            background: #FF3D00;
            color: #000;
        }
        .ids-platform-list {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #1a1a1a;
            background: #050505;
        }
        .ids-platform-list::-webkit-scrollbar {
            width: 3px;
        }
        .ids-platform-list::-webkit-scrollbar-thumb {
            background: #222;
        }
        .ids-platform-group-header {
            padding: 5px 12px;
            font-size: 9px;
            color: #00ffcc;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .ids-platform-item {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 11px;
            color: #666;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: background 0.1s;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ids-platform-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #c0c0c0;
        }
        .ids-platform-item.selected {
            background: rgba(0, 255, 204, 0.06);
            color: #00ffcc;
            border-left: 2px solid #00ffcc;
        }
        .ids-empty-state {
            padding: 48px 32px;
            text-align: center;
            color: #333;
        }
        .ids-empty-text {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ids-notes-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }
        .ids-note-editor {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 18px;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }
        .ids-editor-header {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #1a1a1a;
            flex-wrap: wrap;
        }
        .ids-editor-btn {
            background: #050505;
            border: 1px solid #1a1a1a;
            color: #555;
            padding: 6px 10px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ids-editor-btn:hover {
            border-color: #555;
            color: #c0c0c0;
        }
        .ids-editor-btn.danger:hover {
            border-color: #FF3D00;
            color: #FF3D00;
        }
        .ids-note-title-input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 16px;
            color: #e0e0e0;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a1a;
            outline: none;
            flex-shrink: 0;
        }
        .ids-note-title-input::placeholder {
            color: #333;
        }
        .ids-note-content {
            flex: 1;
            min-height: 260px;
            background: transparent;
            border: none;
            font-size: 12px;
            color: #c0c0c0;
            font-family: 'IBM Plex Mono', monospace;
            line-height: 1.8;
            outline: none;
            overflow-y: auto;
        }
        .ids-note-content:empty:before {
            content: attr(data-placeholder);
            color: #333;
            pointer-events: none;
        }
        .ids-note-content img {
            max-width: 100%;
            border: 1px solid #1a1a1a;
            margin: 6px 0;
            display: block;
        }
        .ids-note-content ul {
            padding-left: 20px;
            margin: 6px 0;
        }
        .ids-note-content ol {
            padding-left: 20px;
            margin: 6px 0;
        }
        .ids-note-content li {
            margin-bottom: 2px;
        }
        .ids-notes-list {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            overflow-y: auto;
            max-height: 560px;
        }
        .ids-notes-list::-webkit-scrollbar {
            width: 3px;
        }
        .ids-notes-list::-webkit-scrollbar-thumb {
            background: #222;
        }
        .ids-notes-list-header {
            padding: 14px 16px;
            border-bottom: 1px solid #1a1a1a;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            color: #333;
            text-transform: uppercase;
        }
        .ids-note-item {
            padding: 14px 16px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            transition: background 0.15s;
        }
        .ids-note-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .ids-note-item.active-note {
            background: #111;
            border-left: 2px solid #00ffcc;
        }
        .ids-note-item-title {
            font-size: 12px;
            color: #c0c0c0;
            margin-bottom: 3px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ids-note-item-date {
            font-size: 9px;
            color: #333;
            letter-spacing: 1px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ids-toolbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #555;
            padding: 8px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .ids-toolbar-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .ids-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: #444;
        }
        .ids-breadcrumb-link {
            color: #00ffcc;
            cursor: pointer;
        }
        .ids-breadcrumb-link:hover {
            text-decoration: underline;
        }
        .ids-folder-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ids-folder-card:hover {
            border-color: #00ffcc;
            background: #111;
        }
        .ids-media-card {
            aspect-ratio: 4/3;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .ids-media-card:hover {
            border-color: #00ffcc;
        }
        .ids-media-card img,
        .ids-media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .ids-media-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 6px;
        }
        .ids-media-card:hover .ids-media-overlay {
            opacity: 1;
        }
        .ids-media-name {
            font-size: 9px;
            color: #a0a0a0;
            font-family: 'IBM Plex Mono', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .ids-media-action {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            color: #888;
            font-size: 9px;
            padding: 2px 6px;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 1px;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .ids-media-action:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .ids-media-action.del:hover {
            border-color: #FF3D00;
            color: #FF3D00;
        }
        .ids-update-entry {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            margin-bottom: 12px;
            padding: 18px;
            position: relative;
        }
        .ids-update-entry::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #1a1a1a;
        }
        .ids-update-date {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: #444;
            letter-spacing: 2px;
        }
        .ids-update-type {
            font-size: 9px;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.04);
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: fit-content;
            margin-top: 3px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .ids-update-type.critical {
            background: rgba(255, 61, 0, 0.08);
            color: #FF3D00;
        }
        .ids-update-type.intel {
            background: rgba(52, 199, 89, 0.08);
            color: #34C759;
        }
        .ids-update-title {
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 8px;
            margin-top: 12px;
        }
        .ids-update-content {
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }
        .ids-form-input,
        .ids-form-select,
        .ids-form-textarea {
            width: 100%;
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 9px 12px;
            font-size: 12px;
            color: #c0c0c0;
            font-family: 'IBM Plex Mono', monospace;
            transition: border-color 0.2s;
            outline: none;
        }
        .ids-form-input:focus,
        .ids-form-select:focus,
        .ids-form-textarea:focus {
            border-color: #00ffcc;
        }
        .ids-form-textarea {
            min-height: 90px;
            resize: vertical;
        }
        .ids-submit-btn {
            background: #050505;
            border: 1px solid #222;
            color: #c0c0c0;
            padding: 10px 22px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .ids-submit-btn:hover {
            background: #00ffcc;
            color: #000;
            border-color: #00ffcc;
        }
        .ids-viewer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ids-viewer-box {
            position: relative;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            max-width: 92vw;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
        }
        .ids-viewer-corner {
            position: absolute;
            width: 18px;
            height: 18px;
        }
        .ids-viewer-corner.tl {
            top: -1px;
            left: -1px;
            border-top: 2px solid #00ffcc;
            border-left: 2px solid #00ffcc;
        }
        .ids-viewer-corner.tr {
            top: -1px;
            right: -1px;
            border-top: 2px solid #00ffcc;
            border-right: 2px solid #00ffcc;
        }
        .ids-viewer-corner.bl {
            bottom: -1px;
            left: -1px;
            border-bottom: 2px solid #00ffcc;
            border-left: 2px solid #00ffcc;
        }
        .ids-viewer-corner.br {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid #00ffcc;
            border-right: 2px solid #00ffcc;
        }
        .ids-viewer-header {
            background: repeating-linear-gradient(45deg, #111, #111 10px, #0a0a0a 10px, #0a0a0a 20px);
            border-bottom: 1px solid #1a1a1a;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ids-viewer-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: #00ffcc;
            letter-spacing: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 400px;
        }
        .ids-viewer-close {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .ids-viewer-close:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .ids-viewer-media {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 12px;
        }
        .ids-viewer-media img,
        .ids-viewer-media video {
            max-width: 85vw;
            max-height: 75vh;
            object-fit: contain;
            display: block;
        }
        .ids-viewer-footer {
            padding: 8px 16px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-family: 'IBM Plex Mono', monospace;
            color: #333;
        }
        /* ===== END INJECTED CSS ===== */
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React + ReactDOM + Babel standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // ==================== CONSTANTS ====================
        const priorityOptions = [
            { value: 'K-STATUS', label: 'K-STATUS // TERMINAL', tier: 'hostile' },
            { value: 'VECTOR', label: 'VECTOR // HOSTILE', tier: 'hostile' },
            { value: 'OMEN', label: 'OMEN // HIGH-RISK', tier: 'hostile' },
            { value: 'VOID', label: 'VOID // NEUTRALIZED', tier: 'hostile' },
            { value: 'ECHO', label: 'ECHO // P.O.I.', tier: 'hostile' },
            { value: 'ANCHOR', label: 'ANCHOR // NON-NEGOTIABLE', tier: 'protected' },
            { value: 'BLOODLINE', label: 'BLOODLINE // CORE', tier: 'protected' },
            { value: 'SENTINEL', label: 'SENTINEL // GUARDIAN', tier: 'protected' },
            { value: 'KINDRED', label: 'KINDRED // HIGH-VALUE', tier: 'protected' },
            { value: 'VAULT', label: 'VAULT // SECURE', tier: 'protected' },
        ];

        const statusLogicOptions = [
            { value: 'RED-CODE', label: 'RED-CODE (Danger)', css: 'red-code' },
            { value: 'COLD-STATE', label: 'COLD-STATE (Safe)', css: 'cold-state' },
            { value: 'DARK-MODE', label: 'DARK-MODE (Missing)', css: 'dark-mode' },
            { value: 'SIGNAL-LOCK', label: 'SIGNAL-LOCK (Tracked)', css: 'signal-lock' },
        ];

        const PLATFORM_GROUPS = [
            { group: 'GLOBAL SOCIALS', platforms: ['Facebook', 'Instagram', 'X (Twitter)', 'Threads', 'Snapchat',
                    'Pinterest', 'LinkedIn', 'Tumblr', 'Reddit', 'Mastodon', 'Bluesky', 'WhatsApp', 'Telegram',
                    'Discord', 'YouTube', 'TikTok'
                ] },
            { group: 'DATING & SOCIAL DISCOVERY', platforms: ['Tinder', 'Bumble', 'Hinge', 'OkCupid', 'Badoo', 'Grindr',
                    'Plenty of Fish', 'Facebook Dating', 'The League', 'TimeLeft', 'AdultFriendFinder',
                    'Ashley Madison'
                ] },
            { group: 'GAMING & VIRTUAL', platforms: ['Steam', 'Epic Games', 'Roblox', 'Minecraft', 'Twitch',
                    'PlayStation Network', 'Xbox Live', 'Nintendo Online', 'Osu!', 'League of Legends (OP.GG)',
                    'Fortnite Tracker', 'Counter-Strike (CSGOStats)', 'Call of Duty', 'GTA Online', 'Battle.net'
                ] },
            { group: 'FINANCIAL & CRYPTO', platforms: ['PayPal', 'Venmo', 'CashApp', 'OpenSea', 'Rarible',
                    'Coinbase (Public Profiles)', 'Buy Me a Coffee', 'Ko-fi'
                ] },
            { group: 'REGIONAL — CHINA', platforms: ['WeChat', 'Sina Weibo', 'Douyin', 'Bilibili', 'Xiaohongshu',
                    'Zhihu', 'QQ'
                ] },
            { group: 'REGIONAL — RUSSIA/CIS', platforms: ['VK (Vkontakte)', 'OK.ru'] },
            { group: 'REGIONAL — SOUTH KOREA', platforms: ['Naver', 'KakaoTalk'] },
            { group: 'REGIONAL — JAPAN/SE ASIA', platforms: ['Line', 'Viber'] },
            { group: 'DEVELOPER & TECH', platforms: ['GitHub', 'GitLab', 'Stack Overflow', 'Medium', 'DeviantArt',
                    'Behance', 'Dribbble', 'Replit'
                ] },
            { group: 'OTHER', platforms: ['Other'] },
        ];

        function blankIdentity(classification = 'A') {
            return {
                id: 'SRV-' + Math.floor(Math.random() * 90000 + 10000),
                classification,
                name: 'NEW SUBJECT',
                alias: 'UNNAMED',
                status: 'ACTIVE',
                statusLogic: 'COLD-STATE',
                priority: 'ECHO',
                threat: 0,
                nationality: '',
                dob: '',
                age: '',
                height: '',
                weight: '',
                eyes: '',
                hair: '',
                bloodType: '',
                gender: '',
                marks: '',
                birthPlace: '',
                occupation: '',
                employer: '',
                education: '',
                languages: '',
                religion: '',
                maritalStatus: '',
                children: '',
                lastKnown: '',
                citizenship: '',
                passport: '',
                visa: '',
                criminalRecord: '',
                politicalAffiliation: '',
                financialWorth: '',
                banking: '',
                assets: '',
                photo: '',
                socials: [],
                folders: [],
                notes: [],
                updates: [],
            };
        }

        function getThreatLabel(t) {
            if (t >= 70) return 'CRITICAL';
            if (t >= 50) return 'HIGH';
            if (t >= 30) return 'MODERATE';
            return 'LOW';
        }

        function getSocialIcon(platform) {
            if (!platform) return '?';
            const icons = { 'X (Twitter)': 'X', 'Instagram': 'IG', 'Facebook': 'FB', 'LinkedIn': 'LI', 'Telegram': 'TG',
                'TikTok': 'TT', 'Discord': 'DC', 'WhatsApp': 'WA', 'YouTube': 'YT', 'Reddit': 'RD', 'GitHub': 'GH',
                'Twitch': 'TW' };
            return icons[platform] || platform.substring(0, 2).toUpperCase();
        }

        // ==================== useIdentities (localStorage) ====================
        function useIdentities() {
            const [identities, setIdentities] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const stored = localStorage.getItem('aida_identities');
                if (stored) {
                    try { setIdentities(JSON.parse(stored)); } catch (_) { setIdentities([]); }
                } else {
                    // seed with one sample
                    const sample = blankIdentity('A');
                    sample.name = 'JANE DOE';
                    sample.alias = 'GHOST';
                    sample.priority = 'VECTOR';
                    sample.threat = 45;
                    sample.nationality = 'USA';
                    sample.lastKnown = 'Chicago, IL';
                    sample.age = '34';
                    setIdentities([sample]);
                }
                setLoading(false);
            }, []);

            useEffect(() => {
                if (!loading) {
                    localStorage.setItem('aida_identities', JSON.stringify(identities));
                }
            }, [identities, loading]);

            const addIdentity = (identity) => {
                setIdentities(prev => [...prev, identity]);
            };

            const updateIdentity = (id, data) => {
                setIdentities(prev => prev.map(i => i.id === id ? data : i));
            };

            const deleteIdentity = (id) => {
                setIdentities(prev => prev.filter(i => i.id !== id));
            };

            return { identities, loading, addIdentity, updateIdentity, deleteIdentity };
        }

        // ==================== COMPONENTS ====================

        // --- ConfirmDialog ---
        function ConfirmDialog({ message, onConfirm, onCancel }) {
            return (
                <div className="ids-modal-overlay open" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
                    <div className="ids-modal" style={{ maxWidth: 380 }}>
                        <div className="ids-modal-header">
                            <span className="ids-modal-title">⚠ CONFIRM</span>
                            <button className="ids-modal-close" onClick={onCancel}>×</button>
                        </div>
                        <div className="ids-modal-body">
                            <p style={{ fontSize: 12, color: '#888', lineHeight: 1.7, fontFamily: 'IBM Plex Mono, monospace' }}>{message}</p>
                        </div>
                        <div className="ids-modal-actions">
                            <button className="ids-modal-btn secondary" onClick={onCancel}>CANCEL</button>
                            <button className="ids-modal-btn danger-btn" onClick={onConfirm}>CONFIRM</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- ImageViewer ---
        function ImageViewer({ file, onClose }) {
            useEffect(() => {
                const handler = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, []);
            return (
                <div className="ids-viewer-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="ids-viewer-box">
                        <div className="ids-viewer-corner tl" />
                        <div className="ids-viewer-corner tr" />
                        <div className="ids-viewer-corner bl" />
                        <div className="ids-viewer-corner br" />
                        <div className="ids-viewer-header">
                            <span className="ids-viewer-title">{file.name}</span>
                            <button className="ids-viewer-close" onClick={onClose}>×</button>
                        </div>
                        <div className="ids-viewer-media">
                            {file.type?.startsWith('video') ?
                                <video src={file.data} controls autoPlay style={{ maxWidth: '85vw', maxHeight: '75vh' }} /> :
                                <img src={file.data} alt={file.name} />
                            }
                        </div>
                        <div className="ids-viewer-footer">
                            <span>FILE: {file.name}</span>
                            <span>TYPE: {file.type || 'IMAGE'}</span>
                            <span>STATUS: SECURE</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- ProfileTab ---
        function ProfileTab({ identity, onChange }) {
            const tf = identity.threat;
            const threatColor = tf >= 70 ? '#FF3D00' : tf >= 50 ? '#FFD60A' : '#34C759';

            function field(label, key) {
                return (
                    <div className="ids-field-row" key={key}>
                        <span className="ids-field-label">{label}</span>
                        <input className="ids-field-input" value={identity[key] ?? ''} onChange={e => onChange(key, e
                            .target.value)} />
                    </div>
                );
            }

            function dropdown(label, key, options) {
                return (
                    <div className="ids-field-row" key={key}>
                        <span className="ids-field-label">{label}</span>
                        <select className="ids-field-select" value={identity[key] ?? ''} onChange={e => onChange(key, e
                                .target.value)}>
                            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                        </select>
                    </div>
                );
            }

            return (
                <div className="ids-profile-grid">
                    <div className="ids-section ids-section-full">
                        <div className="ids-section-title">Classification & Threat</div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '8px 24px' }}>
                            <div className="ids-field-row">
                                <span className="ids-field-label">Class</span>
                                <select className="ids-field-select" value={identity.classification ?? 'A'} onChange={e =>
                                        onChange('classification', e.target.value)}>
                                    <option value="A">Class A</option>
                                    <option value="B">Class B</option>
                                </select>
                            </div>
                            {dropdown('Priority', 'priority', priorityOptions)}
                            {dropdown('Status Logic', 'statusLogic', statusLogicOptions)}
                            {field('Admin Status', 'status')}
                            <div className="ids-field-row">
                                <span className="ids-field-label">Threat %</span>
                                <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                                    <div className="ids-threat-track">
                                        <div className="ids-threat-fill" style={{ width: `${tf}%`, background: threatColor }} />
                                    </div>
                                    <input
                                        type="number" min={0} max={100}
                                        className="ids-threat-num"
                                        value={tf}
                                        onChange={e => onChange('threat', Math.min(100, Math.max(0, parseInt(e.target
                                            .value) || 0)))}
                                    />
                                    <span style={{ color: threatColor, fontWeight: 600, fontSize: 11, flexShrink: 0 }}>%</span>
                                </div>
                            </div>
                            {field('Criminal Record', 'criminalRecord')}
                            {field('Political Affiliation', 'politicalAffiliation')}
                        </div>
                    </div>

                    <div className="ids-section">
                        <div className="ids-section-title">Biographic Data</div>
                        {field('Full Name', 'name')}
                        {field('Alias', 'alias')}
                        {field('Date of Birth', 'dob')}
                        {field('Age', 'age')}
                        {field('Gender', 'gender')}
                        {field('Birth Place', 'birthPlace')}
                        {field('Religion', 'religion')}
                        {field('Marital Status', 'maritalStatus')}
                        {field('Children', 'children')}
                    </div>

                    <div className="ids-section">
                        <div className="ids-section-title">Physical</div>
                        {field('Height', 'height')}
                        {field('Weight', 'weight')}
                        {field('Eye Color', 'eyes')}
                        {field('Hair Color', 'hair')}
                        {field('Blood Type', 'bloodType')}
                        {field('Marks', 'marks')}
                    </div>

                    <div className="ids-section">
                        <div className="ids-section-title">Citizenship & Travel</div>
                        {field('Nationality', 'nationality')}
                        {field('Citizenship', 'citizenship')}
                        {field('Passport', 'passport')}
                        {field('Visa Status', 'visa')}
                        {field('Last Known Location', 'lastKnown')}
                    </div>

                    <div className="ids-section">
                        <div className="ids-section-title">Professional</div>
                        {field('Occupation', 'occupation')}
                        {field('Employer', 'employer')}
                        {field('Education', 'education')}
                        {field('Languages', 'languages')}
                    </div>

                    <div className="ids-section">
                        <div className="ids-section-title">Financial</div>
                        {field('Net Worth', 'financialWorth')}
                        {field('Banking', 'banking')}
                        {field('Known Assets', 'assets')}
                    </div>
                </div>
            );
        }

        // --- ImageryTab ---
        function ImageryTab({ identity, onChange }) {
            const [showFolderModal, setShowFolderModal] = useState(false);
            const [folderName, setFolderName] = useState('');
            const [openFolderIdx, setOpenFolderIdx] = useState(null);
            const [viewingFile, setViewingFile] = useState(null);
            const [movingFile, setMovingFile] = useState(null);
            const [confirm, setConfirm] = useState(null);
            const fileRef = useRef();

            function handleFileUpload(e) {
                const files = Array.from(e.target.files);
                let folders = identity.folders.length > 0 ? [...identity.folders] : [{ name: 'General', files: [] }];
                const targetIdx = openFolderIdx !== null ? openFolderIdx : 0;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const newFile = { id: Date.now() + Math.random(), name: file.name, type: file.type,
                            data: ev.target.result };
                        folders = folders.map((f, i) => i === targetIdx ? { ...f, files: [...f.files, newFile] } :
                        f);
                        onChange('folders', folders);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            }

            function addFolder() {
                if (!folderName.trim()) return;
                onChange('folders', [...identity.folders, { name: folderName.toUpperCase(), files: [] }]);
                setFolderName('');
                setShowFolderModal(false);
            }

            function deleteFile(folderIdx, fileId) {
                setConfirm({
                    message: 'Permanently delete this file?',
                    onConfirm: () => {
                        const updated = identity.folders.map((f, i) =>
                            i === folderIdx ? { ...f, files: f.files.filter(fi => fi.id !== fileId) } : f
                        );
                        onChange('folders', updated);
                        setConfirm(null);
                    },
                });
            }

            function doMove(toIdx) {
                if (!movingFile || movingFile.folderIdx === toIdx) return;
                const updated = identity.folders.map((folder, i) => {
                    if (i === movingFile.folderIdx) return { ...folder, files: folder.files.filter(f => f.id !==
                            movingFile.id) };
                    if (i === toIdx) return { ...folder, files: [...folder.files, movingFile] };
                    return folder;
                });
                onChange('folders', updated);
                setMovingFile(null);
            }

            const currentFolder = openFolderIdx !== null ? identity.folders[openFolderIdx] : null;
            const allFiles = identity.folders.flatMap((f, fi) => f.files.map(file => ({ ...file, folderIdx: fi,
                folderName: f.name })));

            function renderGrid(files, folderIdx) {
                return (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 10 }}>
                        {files.map(file => (
                            <div className="ids-media-card" key={file.id}>
                                <div onClick={() => setViewingFile(file)} style={{ width: '100%', height: '100%',
                                        position: 'absolute', inset: 0 }}>
                                    {file.type?.startsWith('video') ? <video src={file.data} muted /> : <img src={file
                                            .data} alt={file.name} />}
                                </div>
                                <div className="ids-media-overlay">
                                    <span className="ids-media-name">{file.name}</span>
                                    <button className="ids-media-action" onClick={e => { e.stopPropagation();
                                            setMovingFile({ ...file, folderIdx: folderIdx ?? file.folderIdx }); }}>MOVE</button>
                                    <button className="ids-media-action del" onClick={e => { e.stopPropagation();
                                            deleteFile(folderIdx ?? file.folderIdx, file.id); }}>DEL</button>
                                </div>
                            </div>
                        ))}
                    </div>
                );
            }

            return (
                <div>
                    <div style={{ display: 'flex', gap: 8, marginBottom: 18, flexWrap: 'wrap' }}>
                        <button className="ids-toolbar-btn" onClick={() => fileRef.current.click()}>+ Upload</button>
                        <button className="ids-toolbar-btn" onClick={() => setShowFolderModal(true)}>+ New Folder</button>
                        {openFolderIdx !== null && (
                            <button className="ids-toolbar-btn" onClick={() => setOpenFolderIdx(null)}>← Back</button>
                        )}
                        <input ref={fileRef} type="file" multiple accept="image/*,video/*" style={{ display: 'none' }}
                            onChange={handleFileUpload} />
                    </div>

                    {openFolderIdx !== null && (
                        <div className="ids-breadcrumb">
                            <span className="ids-breadcrumb-link" onClick={() => setOpenFolderIdx(null)}>ALL ASSETS</span>
                            <span>/</span>
                            <span style={{ color: '#c0c0c0' }}>{currentFolder?.name}</span>
                        </div>
                    )}

                    {openFolderIdx === null && (
                        <>
                            {identity.folders.length > 0 && (
                                <div style={{ marginBottom: 28 }}>
                                    <div style={{ fontSize: 9, color: '#333', letterSpacing: 2, marginBottom: 12,
                                            textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>FOLDERS</div>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))',
                                            gap: 12 }}>
                                        {identity.folders.map((folder, idx) => (
                                            <div className="ids-folder-card" key={idx} onClick={() =>
                                                    setOpenFolderIdx(idx)}>
                                                <svg style={{ width: 48, height: 38, margin: '0 auto 10px',
                                                        color: '#555', display: 'block' }} viewBox="0 0 64 50"
                                                    fill="none" stroke="currentColor" strokeWidth="1.5">
                                                    <path d="M2 10 C2 7,4 5,7 5 L22 5 L26 10 L57 10 C60 10,62 12,62 15 L62 43 C62 46,60 48,57 48 L7 48 C4 48,2 46,2 43 L2 10Z" />
                                                </svg>
                                                <div style={{ fontSize: 11, color: '#c0c0c0', marginBottom: 3,
                                                        fontWeight: 500, fontFamily: 'IBM Plex Mono, monospace' }}>{folder
                                                        .name}</div>
                                                <div style={{ fontSize: 9, color: '#333', fontFamily: 'IBM Plex Mono, monospace' }}>{folder
                                                        .files.length} FILES</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div>
                                <div style={{ fontSize: 9, color: '#333', letterSpacing: 2, marginBottom: 12,
                                        textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>ALL MEDIA ({allFiles
                                        .length})</div>
                                {allFiles.length > 0 ? renderGrid(allFiles, null) : (
                                    <div className="ids-empty-state">
                                        <div style={{ fontSize: 28, marginBottom: 10, opacity: 0.3 }}>📷</div>
                                        <div className="ids-empty-text">No media — click Upload to add</div>
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {openFolderIdx !== null && (
                        <div>
                            <div style={{ fontSize: 9, color: '#333', letterSpacing: 2, marginBottom: 12,
                                    textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>
                                {currentFolder?.files.length || 0} FILES
                            </div>
                            {currentFolder?.files.length > 0 ? renderGrid(currentFolder.files, openFolderIdx) : (
                                <div className="ids-empty-state">
                                    <div className="ids-empty-text">Folder is empty</div>
                                </div>
                            )}
                        </div>
                    )}

                    {viewingFile && <ImageViewer file={viewingFile} onClose={() => setViewingFile(null)} />}

                    {movingFile && (
                        <div className="ids-modal-overlay open" onClick={e => { if (e.target === e.currentTarget)
                                setMovingFile(null); }}>
                            <div className="ids-modal" style={{ maxWidth: 360 }}>
                                <div className="ids-modal-header">
                                    <span className="ids-modal-title">MOVE FILE</span>
                                    <button className="ids-modal-close" onClick={() => setMovingFile(null)}>×</button>
                                </div>
                                <div className="ids-modal-body">
                                    <p style={{ fontSize: 11, color: '#555', marginBottom: 14, fontFamily: 'IBM Plex Mono, monospace',
                                            lineHeight: 1.6 }}>
                                        Moving: <span style={{ color: '#c0c0c0' }}>{movingFile.name}</span>
                                    </p>
                                    <label className="ids-modal-label">Select destination folder</label>
                                    <div className="ids-platform-list">
                                        {identity.folders.map((f, idx) => idx !== movingFile.folderIdx && (
                                            <div key={idx} className="ids-platform-item" onClick={() => doMove(idx)}>{f
                                                    .name}</div>
                                        ))}
                                        {identity.folders.filter((_, i) => i !== movingFile.folderIdx).length === 0 && (
                                            <div style={{ padding: 14, fontSize: 11, color: '#444', fontFamily: 'IBM Plex Mono, monospace' }}>No
                                                other folders exist</div>
                                        )}
                                    </div>
                                </div>
                                <div className="ids-modal-actions">
                                    <button className="ids-modal-btn secondary" onClick={() => setMovingFile(null)}>CANCEL</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showFolderModal && (
                        <div className="ids-modal-overlay open" onClick={e => { if (e.target === e.currentTarget)
                                setShowFolderModal(false); }}>
                            <div className="ids-modal" style={{ maxWidth: 360 }}>
                                <div className="ids-modal-header">
                                    <span className="ids-modal-title">NEW FOLDER</span>
                                    <button className="ids-modal-close" onClick={() => setShowFolderModal(false)}>×</button>
                                </div>
                                <div className="ids-modal-body">
                                    <label className="ids-modal-label">Folder Name</label>
                                    <input className="ids-modal-input" value={folderName} onChange={e => setFolderName(e
                                            .target.value)} onKeyDown={e => e.key === 'Enter' && addFolder()}
                                        placeholder="Enter name..." autoFocus />
                                </div>
                                <div className="ids-modal-actions">
                                    <button className="ids-modal-btn secondary" onClick={() => setShowFolderModal(false)}>CANCEL</button>
                                    <button className="ids-modal-btn primary" onClick={addFolder}>CREATE</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirm && <ConfirmDialog message={confirm.message} onConfirm={confirm.onConfirm} onCancel={() =>
                            setConfirm(null)} />}
                </div>
            );
        }

        // --- SocialsTab ---
        function SocialsTab({ identity, onChange }) {
            const [showModal, setShowModal] = useState(false);
            const [selectedPlatform, setSelectedPlatform] = useState(null);
            const [platformFilter, setPlatformFilter] = useState('');
            const [handle, setHandle] = useState('');
            const [url, setUrl] = useState('');
            const [status, setStatus] = useState('ACTIVE');
            const [customName, setCustomName] = useState('');
            const [confirm, setConfirm] = useState(null);

            const filteredGroups = PLATFORM_GROUPS.map(g => ({
                ...g,
                platforms: g.platforms.filter(p => p.toLowerCase().includes(platformFilter.toLowerCase())),
            })).filter(g => g.platforms.length > 0);

            function addSocial() {
                let platform = selectedPlatform;
                if (platform === 'Other') {
                    if (!customName.trim()) { alert('Please enter a platform name.'); return; }
                    platform = customName;
                } else if (!platform) { alert('Please select a platform.'); return; }
                if (!handle.trim()) { alert('Please enter a username/handle.'); return; }
                onChange('socials', [...identity.socials, { id: Date.now(), platform, handle, url, status }]);
                setShowModal(false);
                setSelectedPlatform(null);
                setHandle('');
                setUrl('');
                setStatus('ACTIVE');
                setCustomName('');
                setPlatformFilter('');
            }

            function removeSocial(id) {
                setConfirm({
                    message: 'Remove this social profile entry?',
                    onConfirm: () => { onChange('socials', identity.socials.filter(s => s.id !== id));
                        setConfirm(null); },
                });
            }

            return (
                <div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(270px, 1fr))', gap: 8,
                            marginBottom: 20 }}>
                        {identity.socials.map(s => (
                            <div className="ids-social-card" key={s.id || s.platform + s.handle}>
                                <div className="ids-social-icon">{getSocialIcon(s.platform)}</div>
                                <div style={{ flex: 1, minWidth: 0 }}>
                                    <div className="ids-social-platform">{s.platform}</div>
                                    <div className="ids-social-handle">{s.handle}</div>
                                </div>
                                <div className={`ids-social-status ${s.status === 'ACTIVE' ? 'active-s' : s.status ===
                                        'SUSPENDED' ? 'suspended' : ''}`}>{s.status}</div>
                                <button
                                    onClick={() => removeSocial(s.id)}
                                    style={{ background: 'transparent', border: 'none', color: '#333', cursor: 'pointer',
                                        fontSize: 16, padding: '0 4px', transition: 'color 0.15s', flexShrink: 0 }}
                                    onMouseEnter={e => e.target.style.color = '#FF3D00'}
                                    onMouseLeave={e => e.target.style.color = '#333'}
                                >×</button>
                            </div>
                        ))}
                        <div className="ids-add-social-btn" onClick={() => setShowModal(true)}>+ Add Social Profile</div>
                    </div>

                    {showModal && (
                        <div className="ids-modal-overlay open" onClick={e => { if (e.target === e.currentTarget)
                                setShowModal(false); }}>
                            <div className="ids-modal">
                                <div className="ids-modal-header">
                                    <span className="ids-modal-title">ADD SOCIAL PROFILE</span>
                                    <button className="ids-modal-close" onClick={() => setShowModal(false)}>×</button>
                                </div>
                                <div className="ids-modal-body">
                                    <div style={{ marginBottom: 14 }}>
                                        <label className="ids-modal-label">Search Platform</label>
                                        <input className="ids-modal-input" style={{ marginBottom: 8 }} value={platformFilter}
                                            onChange={e => setPlatformFilter(e.target.value)} placeholder="Filter platforms..."
                                            autoFocus />
                                        <div className="ids-platform-list">
                                            {filteredGroups.map(g => (
                                                <Fragment key={g.group}>
                                                    <div className="ids-platform-group-header">{g.group}</div>
                                                    {g.platforms.map(p => (
                                                        <div key={p} className={`ids-platform-item ${selectedPlatform ===
                                                                p ? 'selected' : ''}`} onClick={() =>
                                                                setSelectedPlatform(p)}>{p}</div>
                                                    ))}
                                                </Fragment>
                                            ))}
                                        </div>
                                    </div>
                                    {selectedPlatform === 'Other' && (
                                        <div style={{ marginBottom: 14 }}>
                                            <label className="ids-modal-label">Platform Name</label>
                                            <input className="ids-modal-input" value={customName} onChange={e =>
                                                    setCustomName(e.target.value)} placeholder="Enter platform name" />
                                        </div>
                                    )}
                                    <div style={{ marginBottom: 14 }}>
                                        <label className="ids-modal-label">Username / Handle</label>
                                        <input className="ids-modal-input" value={handle} onChange={e => setHandle(e.target
                                                .value)} placeholder="@username" />
                                    </div>
                                    <div style={{ marginBottom: 14 }}>
                                        <label className="ids-modal-label">Profile URL</label>
                                        <input className="ids-modal-input" value={url} onChange={e => setUrl(e.target.value)}
                                            placeholder="https://..." />
                                    </div>
                                    <div style={{ marginBottom: 6 }}>
                                        <label className="ids-modal-label">Status</label>
                                        <select className="ids-modal-input" value={status} onChange={e => setStatus(e.target
                                                .value)}>
                                            {['ACTIVE', 'SUSPENDED', 'DELETED', 'MONITORED'].map(s => <option key={s}
                                                    value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="ids-modal-actions">
                                    <button className="ids-modal-btn secondary" onClick={() => setShowModal(false)}>CANCEL</button>
                                    <button className="ids-modal-btn primary" onClick={addSocial}>ADD PROFILE</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {confirm && <ConfirmDialog message={confirm.message} onConfirm={confirm.onConfirm} onCancel={() =>
                            setConfirm(null)} />}
                </div>
            );
        }

        // --- NotesTab ---
        function NotesTab({ identity, onChange }) {
            const [currentNoteId, setCurrentNoteId] = useState(null);
            const [title, setTitle] = useState('');
            const contentRef = useRef(null);
            const imgInputRef = useRef(null);
            const [confirm, setConfirm] = useState(null);

            useEffect(() => {
                const note = identity.notes.find(n => n.id === currentNoteId);
                setTitle(note ? note.title : '');
                if (contentRef.current) {
                    contentRef.current.innerHTML = note ? note.content : '';
                }
            }, [currentNoteId]);

            function saveNote() {
                const t = title.trim() || 'Untitled Note';
                const content = contentRef.current?.innerHTML || '';
                if (currentNoteId) {
                    onChange('notes', identity.notes.map(n => n.id === currentNoteId ? { ...n, title: t, content,
                            date: new Date().toISOString().split('T')[0] } : n));
                } else {
                    const newId = Date.now();
                    onChange('notes', [{ id: newId, title: t, content, date: new Date().toISOString().split('T')[0] },
                        ...identity.notes
                    ]);
                    setCurrentNoteId(newId);
                }
            }

            function newNote() {
                setCurrentNoteId(null);
                setTitle('');
                if (contentRef.current) contentRef.current.innerHTML = '';
            }

            function deleteNote() {
                if (!currentNoteId) return;
                setConfirm({
                    message: 'Delete this note permanently?',
                    onConfirm: () => {
                        onChange('notes', identity.notes.filter(n => n.id !== currentNoteId));
                        setCurrentNoteId(null);
                        setTitle('');
                        if (contentRef.current) contentRef.current.innerHTML = '';
                        setConfirm(null);
                    },
                });
            }

            function fmt(cmd, val = null) {
                contentRef.current?.focus();
                document.execCommand(cmd, false, val);
            }

            function handleImgAttach(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    contentRef.current?.focus();
                    document.execCommand('insertHTML', false,
                        `<img src="${ev.target.result}" alt="${file.name}" style="max-width:100%;border:1px solid #1a1a1a;margin:6px 0;display:block;">`
                        );
                };
