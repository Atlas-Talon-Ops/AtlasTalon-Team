                reader.readAsDataURL(file);
                e.target.value = '';
            }

            return (
                <div className="ids-notes-container">
                    <div className="ids-note-editor">
                        <div className="ids-editor-header">
                            <button className="ids-editor-btn" onClick={newNote}>+ New</button>
                            <button className="ids-editor-btn" onClick={saveNote}>Save</button>
                            <button className="ids-editor-btn danger" onClick={deleteNote}>Delete</button>
                            <div style={{ width: 1, background: '#1a1a1a', margin: '2px 2px' }} />
                            <button className="ids-editor-btn" onClick={() => fmt('bold')} title="Bold"><b style={{
                                        fontFamily: 'serif' }}>B</b></button>
                            <button className="ids-editor-btn" onClick={() => fmt('italic')} title="Italic"><i style={{
                                        fontFamily: 'serif' }}>I</i></button>
                            <button className="ids-editor-btn" onClick={() => fmt('underline')} title="Underline"><u>U</u></button>
                            <button className="ids-editor-btn" onClick={() => fmt('strikeThrough')} title="Strikethrough"><s>S</s></button>
                            <div style={{ width: 1, background: '#1a1a1a', margin: '2px 2px' }} />
                            <button className="ids-editor-btn" onClick={() => fmt('insertUnorderedList')} title="Bullet list">•
                                List</button>
                            <button className="ids-editor-btn" onClick={() => fmt('insertOrderedList')} title="Numbered list">1.
                                List</button>
                            <div style={{ width: 1, background: '#1a1a1a', margin: '2px 2px' }} />
                            <button className="ids-editor-btn" onClick={() => imgInputRef.current?.click()} title="Attach image">📎
                                IMG</button>
                            <input ref={imgInputRef} type="file" accept="image/*" style={{ display: 'none' }}
                                onChange={handleImgAttach} />
                        </div>

                        <input
                            className="ids-note-title-input"
                            placeholder="Note title..."
                            value={title}
                            onChange={e => setTitle(e.target.value)}
                        />

                        <div
                            ref={contentRef}
                            className="ids-note-content"
                            contentEditable
                            suppressContentEditableWarning
                            data-placeholder="Start typing your note..."
                            style={{ flex: 1 }}
                        />
                    </div>

                    <div className="ids-notes-list">
                        <div className="ids-notes-list-header">SAVED NOTES ({identity.notes.length})</div>
                        {identity.notes.length > 0 ? identity.notes.map(note => (
                            <div key={note.id} className={`ids-note-item ${note.id === currentNoteId ? 'active-note' :
                                    ''}`} onClick={() => setCurrentNoteId(note.id)}>
                                <div className="ids-note-item-title">{note.title}</div>
                                <div className="ids-note-item-date">{note.date}</div>
                            </div>
                        )) : (
                            <div className="ids-empty-state"><div className="ids-empty-text">No notes yet</div></div>
                        )}
                    </div>

                    {confirm && <ConfirmDialog message={confirm.message} onConfirm={confirm.onConfirm} onCancel={() =>
                            setConfirm(null)} />}
                </div>
            );
        }

        // --- UpdatesTab ---
        function UpdatesTab({ identity, onChange }) {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [type, setType] = useState('INTEL');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [confirm, setConfirm] = useState(null);

            function addUpdate() {
                if (!title.trim() || !content.trim()) return;
                onChange('updates', [{ id: Date.now(), date, type, title, content }, ...identity.updates]);
                setTitle('');
                setContent('');
            }

            function deleteUpdate(id) {
                setConfirm({
                    message: 'Delete this update entry?',
                    onConfirm: () => { onChange('updates', identity.updates.filter(u => u.id !== id));
                        setConfirm(null); },
                });
            }

            return (
                <div style={{ maxWidth: 880 }}>
                    <div style={{ background: '#0a0a0a', border: '1px solid #1a1a1a', padding: 20, marginBottom: 24 }}>
                        <div style={{ fontSize: 9, color: '#333', letterSpacing: 2, marginBottom: 14,
                                textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>LOG NEW UPDATE</div>
                        <div style={{ display: 'flex', gap: 14, marginBottom: 12 }}>
                            <div style={{ flex: 1 }}>
                                <label style={{ display: 'block', fontSize: 9, color: '#333', marginBottom: 6,
                                        letterSpacing: 2, textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>Date</label>
                                <input type="date" className="ids-form-input" value={date} onChange={e => setDate(e.target
                                        .value)} />
                            </div>
                            <div style={{ flex: 1 }}>
                                <label style={{ display: 'block', fontSize: 9, color: '#333', marginBottom: 6,
                                        letterSpacing: 2, textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>Type</label>
                                <select className="ids-form-select" value={type} onChange={e => setType(e.target.value)}>
                                    {['INTEL', 'CRITICAL', 'ROUTINE', 'SURVEILLANCE'].map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>
                        </div>
                        <div style={{ marginBottom: 12 }}>
                            <label style={{ display: 'block', fontSize: 9, color: '#333', marginBottom: 6,
                                    letterSpacing: 2, textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>Title</label>
                            <input className="ids-form-input" placeholder="Update title..." value={title} onChange={e =>
                                    setTitle(e.target.value)} />
                        </div>
                        <div style={{ marginBottom: 16 }}>
                            <label style={{ display: 'block', fontSize: 9, color: '#333', marginBottom: 6,
                                    letterSpacing: 2, textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>Content</label>
                            <textarea className="ids-form-textarea" placeholder="Describe the update..." value={content}
                                onChange={e => setContent(e.target.value)} />
                        </div>
                        <button className="ids-submit-btn" onClick={addUpdate}>LOG UPDATE</button>
                    </div>

                    <div style={{ fontSize: 9, color: '#333', letterSpacing: 2, marginBottom: 14,
                            textTransform: 'uppercase', fontFamily: 'IBM Plex Mono, monospace' }}>UPDATE HISTORY</div>
                    {identity.updates.length > 0 ? identity.updates.map(u => (
                        <div className="ids-update-entry" key={u.id}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
                                    marginBottom: 10 }}>
                                <div>
                                    <div className="ids-update-date">{u.date}</div>
                                    <div className={`ids-update-type ${u.type.toLowerCase()}`}>{u.type}</div>
                                </div>
                                <button
                                    style={{ background: 'transparent', border: 'none', color: '#333', cursor: 'pointer',
                                        fontSize: 16, padding: 4, transition: 'color 0.15s' }}
                                    onMouseEnter={e => e.target.style.color = '#FF3D00'}
                                    onMouseLeave={e => e.target.style.color = '#333'}
                                    onClick={() => deleteUpdate(u.id)}
                                >×</button>
                            </div>
                            <div className="ids-update-title">{u.title}</div>
                            <div className="ids-update-content">{u.content}</div>
                        </div>
                    )) : (
                        <div className="ids-empty-state">
                            <div style={{ fontSize: 24, marginBottom: 10, opacity: 0.3 }}>📋</div>
                            <div className="ids-empty-text">No updates logged</div>
                        </div>
                    )}
                    {confirm && <ConfirmDialog message={confirm.message} onConfirm={confirm.onConfirm} onCancel={() =>
                            setConfirm(null)} />}
                </div>
            );
        }

        // ==================== IdentitiesPage ====================
        function IdentitiesPage() {
            const { identities, loading, addIdentity, updateIdentity: updateIdentityDb, deleteIdentity } =
            useIdentities();
            const [currentClass, setCurrentClass] = useState('A');
            const [view, setView] = useState('home');
            const [currentId, setCurrentId] = useState(null);
            const [activeTab, setActiveTab] = useState('profile');
            const [openDropdown, setOpenDropdown] = useState(null);
            const [confirm, setConfirm] = useState(null);

            const currentIdentity = identities.find(i => i.id === currentId);

            function updateIdentity(field, value) {
                if (!currentIdentity) return;
                const updated = { ...currentIdentity, [field]: value };
                updateIdentityDb(currentIdentity.id, updated);
            }

            function createNew() {
                const identity = blankIdentity(currentClass);
                addIdentity(identity);
                setCurrentId(identity.id);
                setActiveTab('profile');
                setView('detail');
            }

            function deleteById(id) {
                setConfirm({
                    message: `Delete identity? This cannot be undone.`,
                    onConfirm: () => {
                        deleteIdentity(id);
                        if (currentId === id) { setView('home');
                            setCurrentId(null); }
                        setConfirm(null);
                    },
                });
            }

            function handlePhotoUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => updateIdentity('photo', ev.target.result);
                reader.readAsDataURL(file);
            }

            const filtered = identities.filter(i => i.classification === currentClass);
            const TABS = ['profile', 'imagery', 'socials', 'notes', 'updates'];
            const priorityInfo = p => priorityOptions.find(o => o.value === p) || { label: 'UNDEFINED', tier: 'neutral' };
            const statusInfo = s => statusLogicOptions.find(o => o.value === s) || { label: 'UNKNOWN', css: '' };

            if (loading) {
                return (
                    <div className="ids-body" style={{ height: '100vh', overflowY: 'auto', display: 'flex',
                            alignItems: 'center', justifyContent: 'center' }}>
                        <div style={{ fontFamily: 'monospace', letterSpacing: '2px', color: '#888' }}>LOADING IDENTITIES...
                        </div>
                    </div>
                );
            }

            return (
                <div className="ids-body" style={{ height: '100vh', overflowY: 'auto' }}>
                    {confirm && <ConfirmDialog message={confirm.message} onConfirm={confirm.onConfirm} onCancel={() =>
                            setConfirm(null)} />}

                    {view === 'home' && (
                        <div className="ids-page" style={{ padding: '28px 36px 48px' }}>
                            <div className="ids-class-tabs">
                                {['A', 'B'].map(cls => (
                                    <button key={cls} className={`ids-class-tab ${currentClass === cls ? 'active' :
                                            ''}`} onClick={() => setCurrentClass(cls)}>
                                        Class {cls}
                                    </button>
                                ))}
                            </div>

                            <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 18 }}>
                                <button className="ids-add-btn" onClick={createNew}>+ Add Identity</button>
                            </div>

                            {filtered.length === 0 ? (
                                <div className="ids-empty-state">
                                    <div style={{ fontSize: 36, marginBottom: 12, opacity: 0.25 }}></div>
                                    <div className="ids-empty-text">No identities in Class {currentClass}</div>
                                </div>
                            ) : (
                                <div className="ids-identity-grid">
                                    {filtered.map(identity => {
                                        const pi = priorityInfo(identity.priority);
                                        return (
                                            <div className="ids-card" key={identity.id} onClick={() => { setCurrentId(
                                                        identity.id);
                                                    setActiveTab('profile');
                                                    setView('detail'); }}>
                                                <div className="ids-card-menu" onClick={e => e.stopPropagation()}>
                                                    <button className="ids-menu-btn" onClick={e => { e
                                                                .stopPropagation();
                                                            setOpenDropdown(prev => prev === identity.id ? null :
                                                                identity.id); }}>...</button>
                                                    <div className={`ids-dropdown ${openDropdown === identity.id ?
                                                            'open' : ''}`}>
                                                        <button className="ids-dropdown-item" onClick={e => { e
                                                                    .stopPropagation();
                                                                deleteById(identity.id); }}>Delete</button>
                                                    </div>
                                                </div>
                                                <div className="ids-card-header">
                                                    <div className="ids-card-photo">
                                                        {identity.photo ? <img src={identity.photo} alt={identity
                                                                .name} /> : <span style={{ fontSize: 24,
                                                                    color: '#333' }}>?</span>}
                                                    </div>
                                                    <div className="ids-card-meta">
                                                        <div className="ids-card-name">{identity.name}</div>
                                                        <div className="ids-card-alias">"{identity.alias}"</div>
                                                        <div className={`ids-priority-badge ${pi.tier}`}>{pi.value}</div>
                                                    </div>
                                                </div>
                                                <div className="ids-card-intel">
                                                    {[
                                                        ['Threat', getThreatLabel(identity.threat)],
                                                        ['Age', identity.age ? `${identity.age} yrs` : '—'],
                                                        ['Nationality', identity.nationality?.split('/')[0]?.trim() ||
                                                            '—'
                                                        ],
                                                        ['Location', identity.lastKnown?.split(',')[0] || '—']
                                                    ].map(([l, v]) => (
                                                        <div key={l}><span className="ids-intel-label">{l}</span><span
                                                                className="ids-intel-value">{v}</span></div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {view === 'detail' && currentIdentity && (
                        <div className="ids-page" style={{ padding: '28px 36px' }}>
                            <div style={{ maxWidth: 1400, margin: '0 auto' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 20 }}>
                                    <button className="ids-back-btn" onClick={() => { setView('home');
                                            setCurrentId(null); }}>← Database</button>
                                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
                                        <button className="ids-action-btn" onClick={() => alert('Identity saved.')}>Save</button>
                                        <button className="ids-action-btn danger" onClick={() => deleteById(
                                            currentIdentity.id)}>Delete</button>
                                    </div>
                                </div>

                                <div className="ids-detail-header">
                                    <div style={{ position: 'relative' }}>
                                        <div className="ids-detail-photo" onClick={() => document.getElementById(
                                                'ids-photo-input').click()}>
                                            {currentIdentity.photo && <img src={currentIdentity.photo} alt={currentIdentity
                                                    .name} />}
                                            <div className="ids-photo-overlay">
                                                <button style={{ background: 'transparent', border: '1px solid #555',
                                                        color: '#888', padding: '4px 10px', fontSize: 9,
                                                        cursor: 'pointer', fontFamily: 'IBM Plex Mono, monospace',
                                                        letterSpacing: 1 }}>CHANGE PHOTO</button>
                                            </div>
                                        </div>
                                        <input type="file" id="ids-photo-input" accept="image/*" style={{ display: 'none' }}
                                            onChange={handlePhotoUpload} />
                                    </div>
                                    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center',
                                            minWidth: 0 }}>
                                        <h1 className="ids-detail-name">{currentIdentity.name}</h1>
                                        <div className="ids-detail-alias">"{currentIdentity.alias}"</div>
                                        <div className="ids-detail-stats">
                                            <div><span className="ids-stat-label">Priority</span><span
                                                    className="ids-stat-value"><span
                                                        className={`ids-priority-badge ${priorityInfo(currentIdentity.priority).tier}`}>{priorityInfo(
                                                            currentIdentity.priority).value}</span></span></div>
                                            <div><span className="ids-stat-label">Status</span><span
                                                    className="ids-stat-value"><span
                                                        className={`ids-status-badge ${statusInfo(currentIdentity.statusLogic).css}`}>{currentIdentity
                                                            .statusLogic}</span></span></div>
                                            <div><span className="ids-stat-label">Threat</span><span
                                                    className="ids-stat-value" style={{ color: currentIdentity.threat >=
                                                            70 ? '#FF3D00' : currentIdentity.threat >= 50 ?
                                                            '#FFD60A' : '#34C759' }}>{currentIdentity.threat}%</span>
                                            </div>
                                            <div><span className="ids-stat-label">Class</span><span
                                                    className="ids-stat-value">{currentIdentity.classification}</span>
                                            </div>
                                            <div><span className="ids-stat-label">Location</span><span
                                                    className="ids-stat-value">{currentIdentity.lastKnown || '—'}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div style={{ background: '#050505', border: '1px solid #1a1a1a' }}>
                                    <div className="ids-tabs-nav">
                                        {TABS.map(tab => (
                                            <button key={tab} className={`ids-tab-btn ${activeTab === tab ? 'active' :
                                                    ''}`} onClick={() => setActiveTab(tab)}>
                                                {tab.charAt(0).toUpperCase() + tab.slice(1)}
                                            </button>
                                        ))}
                                    </div>
                                    {TABS.map(tab => (
                                        <div key={tab} className={`ids-tab-content ${activeTab === tab ? 'active' :
                                                ''}`}>
                                            {tab === 'profile' && <ProfileTab identity={currentIdentity} onChange={
                                                    updateIdentity} />}
                                            {tab === 'imagery' && <ImageryTab identity={currentIdentity} onChange={
                                                    updateIdentity} />}
                                            {tab === 'socials' && <SocialsTab identity={currentIdentity} onChange={
                                                    updateIdentity} />}
                                            {tab === 'notes' && <NotesTab identity={currentIdentity} onChange={
                                                    updateIdentity} />}
                                            {tab === 'updates' && <UpdatesTab identity={currentIdentity} onChange={
                                                    updateIdentity} />}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==================== RENDER ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IdentitiesPage />);
    </script>
</body>
</html>
