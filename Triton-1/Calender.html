/* ------------------------------------------------------------
   MONTH VIEW
   ------------------------------------------------------------ */
function renderMonth() {
    const gridStart = startOfWeek(startOfMonth(viewDate), state.weekStart);
    const gridEnd   = addDays(gridStart, 41);
    const occs = getOccurrences(startOfDay(gridStart), endOfDay(gridEnd));

    let html = '<div class="month-view">';
    html += '<div class="month-dow">';
    for (let i = 0; i < 7; i++) {
        const dow = (i + state.weekStart) % 7;
        const isWk = dow === 0 || dow === 6;
        html += '<span class="' + (isWk ? 'weekend' : '') + '">' +
            DAYS_SHORT[dow].toUpperCase() + '</span>';
    }
    html += '</div>';
    html += '<div class="month-grid" id="monthGrid">';

    for (let w = 0; w < 6; w++) {
        const week = [];
        for (let d = 0; d < 7; d++) week.push(addDays(gridStart, w*7 + d));
        html += renderMonthWeek(week, occs);
    }

    html += '</div></div>';
    return html;
}

function renderMonthWeek(week, occs) {
    const wStart = startOfDay(week[0]);
    const wEnd   = endOfDay(week[6]);
    const weekOccs = occs.filter(o => o.end >= wStart && o.start <= wEnd);

    const spans = [];
    const timedByDay = [[],[],[],[],[],[],[]];

    weekOccs.forEach(o => {
        const s = o.start;
        const e = o.end;
        const sDay = startOfDay(s);
        const eDay = o.ev.allDay ? startOfDay(addDays(e, -1)) : startOfDay(new Date(e.getTime() - 1000));
        const isMulti = eDay.getTime() > sDay.getTime();

        if (o.ev.allDay || isMulti) {
            const startCol = clamp(Math.round((sDay - wStart) / MS_DAY), 0, 6);
            const endCol   = clamp(Math.round((eDay - wStart) / MS_DAY), 0, 6);
            if (endCol < 0 || startCol > 6) return;
            spans.push({ occ: o, startCol, endCol, contL: sDay < wStart, contR: eDay > wEnd });
        } else {
            const col = Math.round((sDay - wStart) / MS_DAY);
            if (col >= 0 && col <= 6) timedByDay[col].push(o);
        }
    });

    spans.sort((a,b) => a.startCol - b.startCol ||
        (b.endCol - b.startCol) - (a.endCol - a.startCol) ||
        (b.occ.end - b.occ.start) - (a.occ.end - a.occ.start));
    const laneEnds = [];
    spans.forEach(s => {
        let lane = 0;
        while (lane < laneEnds.length && laneEnds[lane] >= s.startCol) lane++;
        if (lane === laneEnds.length) laneEnds.push(-1);
        laneEnds[lane] = s.endCol;
        s.lane = lane;
    });
    const laneCount = laneEnds.length;

    const today = startOfDay(new Date());
    const month = viewDate.getMonth();

    let html = '<div class="month-week" style="--lanes:' + laneCount + '">';
    html += '<div class="week-cells">';

    week.forEach((d, i) => {
        const isOther = d.getMonth() !== month;
        const isToday = sameDay(d, today);
        const dow = d.getDay();
        const isWk = dow === 0 || dow === 6;
        const timed = timedByDay[i];
        const maxTimed = Math.max(0, 3 - laneCount);
        const visible = timed.slice(0, maxTimed);
        const overflow = timed.length - visible.length;
        const now = new Date();

        const cls = ['day-cell',
            isOther ? 'other' : '',
            isToday ? 'today' : '',
            isWk ? 'weekend' : ''
        ].filter(Boolean).join(' ');

        html += '<div class="' + cls + '" data-date="' + toDateStr(d) + '">';
        html += '<div class="day-num">' + d.getDate() + '</div>';
        html += '<div class="day-events">';

        visible.forEach(o => {
            const c = colorOf(o.ev);
            const isPast = o.end < now;
            const timeTxt = o.ev.allDay ? '' : fmtTime(o.start, state.h24) + ' ';
            html += '<div class="mini-ev ' + (isPast ? 'past' : '') + '" ' +
                'style="--c:' + c + '" data-ev="' + o.ev.id + '" data-occ="' + o.occKey + '">' +
                (timeTxt ? '<span class="mini-ev-time">' + timeTxt + '</span>' : '') +
                esc(o.ev.title) +
            '</div>';
        });

        if (overflow > 0) {
            html += '<div class="mini-more" data-date="' + toDateStr(d) + '">+' +
                overflow + ' MORE</div>';
        }
        html += '</div></div>';
    });

    html += '</div>';

    if (laneCount > 0) {
        html += '<div class="week-spans">';
        spans.forEach(s => {
            const c = colorOf(s.occ.ev);
            const left  = (s.startCol / 7) * 100;
            const width = ((s.endCol - s.startCol + 1) / 7) * 100;
            const top   = s.lane * 20;
            const isPast = s.occ.end < new Date();
            const cls = ['span',
                s.contL ? 'cont-l' : '',
                s.contR ? 'cont-r' : '',
                isPast ? 'past' : ''
            ].filter(Boolean).join(' ');
            const margin = 2;
            html += '<div class="' + cls + '" ' +
                'style="--c:' + c + ';left:calc(' + left + '% + ' + margin + 'px);width:calc(' + width + '% - ' + (margin*2) + 'px);top:' + top + 'px" ' +
                'data-ev="' + s.occ.ev.id + '" data-occ="' + s.occ.occKey + '" ' +
                'title="' + esc(s.occ.ev.title) + '">' +
                '<span class="span-title">' + esc(s.occ.ev.title) + '</span>' +
            '</div>';
        });
        html += '</div>';
    }

    html += '</div>';
    return html;
}

/* ------------------------------------------------------------
   YEAR VIEW  (with editable year input)
   ------------------------------------------------------------ */
function renderYear() {
    const year = viewDate.getFullYear();
    const yearStart = new Date(year, 0, 1, 0, 0, 0, 0);
    const yearEnd   = new Date(year, 11, 31, 23, 59, 59, 999);

    const occs = getOccurrences(yearStart, yearEnd);

    const dayCounts = new Map();
    occs.forEach(o => {
        let cur = startOfDay(o.start);
        const endD = startOfDay(o.ev.allDay ? addDays(o.end, -1) : o.end);
        while (cur <= endD) {
            const k = toDateStr(cur);
            dayCounts.set(k, (dayCounts.get(k) || 0) + 1);
            cur = addDays(cur, 1);
        }
    });

    let totalOccs = occs.length;
    let daysWithEvents = dayCounts.size;
    let busiestDay = null, busiestCount = 0;
    dayCounts.forEach((count, k) => {
        if (count > busiestCount) { busiestCount = count; busiestDay = k; }
    });
    const monthsWithEvents = new Set();
    occs.forEach(o => { if (o.start.getFullYear() === year) monthsWithEvents.add(o.start.getMonth()); });

    const today = startOfDay(new Date());
    const nowYear = today.getFullYear();
    const nowMonth = today.getMonth();

    let html = '<div class="year-view">';

    /* Header with EDITABLE year */
    html += '<div class="year-header">';
    html += '<div class="year-title-wrap">';
    html += '<div class="year-big">' +
        '<input class="year-input" id="yearInput" type="text" inputmode="numeric" ' +
            'maxlength="4" value="' + year + '" ' +
            'title="Type a year and press Enter" ' +
            'aria-label="Year" spellcheck="false" autocomplete="off" />' +
        '<span class="small">YEAR OVERVIEW</span>' +
    '</div>';
    html += '<div class="year-nav-btns">' +
        '<button id="yearPrevBtn" title="Previous year (←)">‹</button>' +
        '<button id="yearTodayBtn" title="Jump to current year (T)">•</button>' +
        '<button id="yearNextBtn" title="Next year (→)">›</button>' +
    '</div>';
    html += '</div>';

    html += '<div class="year-stats">';
    html += '<div class="year-stat"><span class="year-stat-label">EVENTS</span>' +
        '<span class="year-stat-value"><b>' + totalOccs + '</b></span></div>';
    html += '<div class="year-stat"><span class="year-stat-label">ACTIVE DAYS</span>' +
        '<span class="year-stat-value"><b>' + daysWithEvents + '</b></span></div>';
    html += '<div class="year-stat"><span class="year-stat-label">MONTHS ACTIVE</span>' +
        '<span class="year-stat-value"><b>' + monthsWithEvents.size + '</b>/12</span></div>';
    if (busiestDay) {
        const [by,bm,bd] = busiestDay.split('-').map(Number);
        html += '<div class="year-stat"><span class="year-stat-label">BUSIEST DAY</span>' +
            '<span class="year-stat-value">' + MONTHS_SHORT[bm-1].toUpperCase() + ' ' + bd +
            ' <b style="color:#fff">· ' + busiestCount + '</b></span></div>';
    }
    html += '</div>';
    html += '</div>';

    /* Grid */
    html += '<div class="year-grid">';

    for (let m = 0; m < 12; m++) {
        const monthFirst = new Date(year, m, 1);
        const gridStart = startOfWeek(monthFirst, state.weekStart);
        const isCurrentMonth = (year === nowYear && m === nowMonth);
        const isSelectedMonth = (m === viewDate.getMonth() && year === viewDate.getFullYear());

        let monthCount = 0;
        const mStart = new Date(year, m, 1, 0, 0, 0, 0);
        const mEnd = new Date(year, m+1, 0, 23, 59, 59, 999);
        occs.forEach(o => { if (o.end >= mStart && o.start <= mEnd) monthCount++; });

        const cls = ['year-month',
            isCurrentMonth ? 'current' : '',
            isSelectedMonth ? 'current' : ''
        ].filter((v,i,a) => v && a.indexOf(v) === i).join(' ');

        html += '<div class="' + cls + '" data-month="' + m + '">';
        html += '<div class="year-month-head" data-month-jump="' + m + '" title="View ' + MONTHS[m] + '">' +
            '<span class="year-month-name">' + MONTHS[m] + '</span>' +
            '<span class="year-month-count">' + (monthCount > 0 ? monthCount + ' EV' : '—') + '</span>' +
        '</div>';

        html += '<div class="year-dow">';
        for (let i = 0; i < 7; i++) {
            const dow = (i + state.weekStart) % 7;
            html += '<span>' + DAYS_MINI[dow] + '</span>';
        }
        html += '</div>';

        html += '<div class="year-days">';
        for (let i = 0; i < 42; i++) {
            const d = addDays(gridStart, i);
            const isOther = d.getMonth() !== m;
            const isToday = sameDay(d, today);
            const dow = d.getDay();
            const isWk = dow === 0 || dow === 6;
            const cnt = dayCounts.get(toDateStr(d)) || 0;

            const dcls = ['year-day',
                isOther ? 'other' : '',
                isWk ? 'weekend' : '',
                isToday ? 'today' : '',
                cnt > 0 ? 'has-ev' : '',
                cnt >= 3 ? 'busy' : ''
            ].filter(Boolean).join(' ');

            const title = cnt > 0
                ? (d.getDate() + ' ' + MONTHS_SHORT[m] + ' · ' + cnt + ' event' + (cnt === 1 ? '' : 's'))
                : '';

            html += '<div class="' + dcls + '" data-date="' + toDateStr(d) + '"' +
                (title ? ' title="' + esc(title) + '"' : '') + '>' +
                d.getDate() + '</div>';
        }
        html += '</div>';
        html += '</div>';
    }

    html += '</div></div>';
    return html;
}

/* Bind the editable year input + year-nav buttons */
function bindYearInput() {
    const input = $('#yearInput');
    if (input) {
        /* Select all on focus for quick overwrite */
        input.addEventListener('focus', () => {
            setTimeout(() => input.select(), 10);
        });

        /* Only allow digits */
        input.addEventListener('input', () => {
            const cleaned = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (cleaned !== input.value) input.value = cleaned;
            const n = parseInt(cleaned, 10);
            const invalid = cleaned.length === 4 && (n < 1 || n > 9999);
            input.classList.toggle('invalid', invalid);
        });

        /* Enter / blur to commit */
        const commit = () => {
            const raw = input.value.replace(/[^0-9]/g, '');
            if (raw.length < 1) {
                input.value = viewDate.getFullYear();
                input.classList.remove('invalid');
                return;
            }
            let n = parseInt(raw, 10);
            if (isNaN(n) || n < 1 || n > 9999) {
                input.classList.add('invalid');
                setTimeout(() => input.classList.remove('invalid'), 700);
                input.value = viewDate.getFullYear();
                return;
            }
            n = clamp(n, 1, 9999);
            if (n === viewDate.getFullYear()) {
                input.value = n;
                input.classList.remove('invalid');
                return;
            }
            const oldYear = viewDate.getFullYear();
            viewDate = new Date(n, viewDate.getMonth(), 1);
            input.classList.remove('invalid');
            render();
            toast('success', 'JUMPED TO ' + n,
                'From ' + oldYear + ' → ' + n, 2400);
        };

        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                input.blur();
            } else if (e.key === 'Escape') {
                input.value = viewDate.getFullYear();
                input.classList.remove('invalid');
                input.blur();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const n = clamp((parseInt(input.value, 10) || viewDate.getFullYear()) + 1, 1, 9999);
                input.value = n;
                commit();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const n = clamp((parseInt(input.value, 10) || viewDate.getFullYear()) - 1, 1, 9999);
                input.value = n;
                commit();
            }
        });
    }

    const prev = $('#yearPrevBtn');
    if (prev) prev.addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear() - 1, viewDate.getMonth(), 1);
        render();
    });

    const next = $('#yearNextBtn');
    if (next) next.addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear() + 1, viewDate.getMonth(), 1);
        render();
    });

    const todayBtn = $('#yearTodayBtn');
    if (todayBtn) todayBtn.addEventListener('click', () => {
        viewDate = new Date();
        render();
    });
}

function scrollYearToMonth() {
    const container = $('#viewContainer');
    const months = container.querySelectorAll('.year-month.current');
    if (!months.length) return;
    const firstCurrent = months[0];
    setTimeout(() => {
        const scroller = container.querySelector('.year-view');
        if (!scroller) return;
        const rect = firstCurrent.getBoundingClientRect();
        const parentRect = scroller.getBoundingClientRect();
        if (rect.top < parentRect.top + 40 || rect.bottom > parentRect.bottom - 40) {
            firstCurrent.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
    }, 30);
}

/* ------------------------------------------------------------
   TIME GRID
   ------------------------------------------------------------ */
function renderTimeGrid(numDays) {
    const isWeek = numDays === 7;
    const gridStart = isWeek ? startOfWeek(viewDate, state.weekStart) : startOfDay(viewDate);
    const gridEnd   = addDays(gridStart, numDays - 1);

    const rangeS = startOfDay(gridStart);
    const rangeE = endOfDay(gridEnd);

    const occs = getOccurrences(rangeS, rangeE);
    const today = startOfDay(new Date());
    const now = new Date();

    const allDayByDay = Array.from({length:numDays}, () => []);
    const timedByDay  = Array.from({length:numDays}, () => []);

    occs.forEach(o => {
        const s = o.start;
        const e = o.end;
        const sDay = startOfDay(s);
        const eDay = o.ev.allDay ? startOfDay(addDays(e, -1)) : startOfDay(new Date(e.getTime() - 1000));
        const isMulti = eDay.getTime() > sDay.getTime();

        if (o.ev.allDay || isMulti) {
            for (let i = 0; i < numDays; i++) {
                const day = addDays(gridStart, i);
                const dS = startOfDay(day);
                const dE = endOfDay(day);
                if (e >= dS && s <= dE) allDayByDay[i].push(o);
            }
        } else {
            const col = dayDiff(sDay, gridStart);
            if (col >= 0 && col < numDays) timedByDay[col].push(o);
        }
    });

    let html = '<div class="time-view">';

    html += '<div class="tg-head">';
    html += '<div class="tg-head-gutter">' + (isWeek ? 'WEEK' : 'DAY') + '</div>';
    html += '<div class="tg-head-cols" style="--n:' + numDays + '">';
    for (let i = 0; i < numDays; i++) {
        const d = addDays(gridStart, i);
        const isToday = sameDay(d, today);
        const dow = d.getDay();
        const isWk = dow === 0 || dow === 6;
        const cls = ['tg-head-col', isToday ? 'today' : '', isWk ? 'weekend' : ''].filter(Boolean).join(' ');
        html += '<div class="' + cls + '" data-date="' + toDateStr(d) + '">' +
            '<div class="dow">' + DAYS_SHORT[dow].toUpperCase() + '</div>' +
            '<div class="dom">' + d.getDate() + '</div>' +
        '</div>';
    }
    html += '</div></div>';

    html += '<div class="tg-allday">';
    html += '<div class="tg-allday-gutter">ALL DAY</div>';
    html += '<div class="tg-allday-cols" style="--n:' + numDays + '">';
    for (let i = 0; i < numDays; i++) {
        html += '<div class="tg-allday-col" data-date="' + toDateStr(addDays(gridStart, i)) + '">';
        allDayByDay[i].forEach(o => {
            const c = colorOf(o.ev);
            html += '<div class="ad-pill" style="--c:' + c + '" data-ev="' + o.ev.id + '" data-occ="' + o.occKey + '">' +
                esc(o.ev.title) + '</div>';
        });
        html += '</div>';
    }
    html += '</div></div>';

    html += '<div class="tg-scroll" id="tgScroll"><div class="tg-body" style="--hour-h:' + HOUR_H + 'px">';
    html += '<div class="tg-gutter">';
    for (let h = 0; h < 24; h++) {
        const label = state.h24
            ? pad(h) + ':00'
            : (h === 0 ? '12 AM' : h < 12 ? h + ' AM' : h === 12 ? '12 PM' : (h-12) + ' PM');
        html += '<div class="hour-label">' + label + '</div>';
    }
    html += '</div>';

    html += '<div class="tg-cols" style="--n:' + numDays + '">';
    for (let i = 0; i < numDays; i++) {
        const d = addDays(gridStart, i);
        const isToday = sameDay(d, today);
        const dow = d.getDay();
        const isWk = dow === 0 || dow === 6;
        const cls = ['tg-col', isToday ? 'today' : '', isWk ? 'weekend' : ''].filter(Boolean).join(' ');
        html += '<div class="' + cls + '" data-date="' + toDateStr(d) + '">';

        for (let h = 0; h < 24; h++) {
            html += '<div class="tg-slot" data-date="' + toDateStr(d) + '" data-hour="' + h + '" ' +
                'style="top:' + (h * HOUR_H) + 'px"></div>';
        }

        const dayEvents = timedByDay[i].slice().sort((a,b) => a.start - b.start);
        const packed = packEvents(dayEvents);

        packed.forEach(p => {
            const o = p.o;
            const c = colorOf(o.ev);
            const startMin = o.start.getHours() * 60 + o.start.getMinutes();
            const endMin = o.end.getHours() * 60 + o.end.getMinutes();
            const durMin = Math.max(15, endMin - startMin);
            const top = (startMin / 60) * HOUR_H;
            const height = Math.max(16, (durMin / 60) * HOUR_H - 2);
            const left = (p.col / p.cols) * 100;
            const width = (1 / p.cols) * 100;
            const isPast = o.end < now;
            const shortCls = height < 34 ? ' short' : '';
            const tinyCls = height < 22 ? ' tiny' : '';
            const pastCls = isPast ? ' past' : '';

            html += '<div class="tg-event' + shortCls + tinyCls + pastCls + '" ' +
                'style="--c:' + c + ';top:' + top + 'px;height:' + height + 'px;' +
                'left:calc(' + left + '% + 1px);width:calc(' + width + '% - 3px)" ' +
                'data-ev="' + o.ev.id + '" data-occ="' + o.occKey + '">' +
                '<div class="te-title">' + esc(o.ev.title) + '</div>' +
                '<div class="te-time">' + fmtTime(o.start, state.h24) + ' – ' + fmtTime(o.end, state.h24) + '</div>' +
                (o.ev.location ? '<div class="te-loc">◉ ' + esc(o.ev.location) + '</div>' : '') +
            '</div>';
        });

        if (isToday) {
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const nowTop = (nowMin / 60) * HOUR_H;
            html += '<div class="tg-now" style="top:' + nowTop + 'px"></div>';
        }

        html += '</div>';
    }
    html += '</div>';
    html += '</div></div>';
    html += '</div>';

    return html;
}

function packEvents(events) {
    if (!events.length) return [];
    const sorted = events.slice().sort((a,b) => a.start - b.start);
    const colEnds = [];
    const out = sorted.map(o => {
        let col = 0;
        while (col < colEnds.length && colEnds[col] > o.start.getTime()) col++;
        if (col === colEnds.length) colEnds.push(0);
        colEnds[col] = o.end.getTime();
        return { o, col };
    });
    const total = colEnds.length;
    out.forEach(r => { r.cols = total; });
    return out;
}

function scrollToNow() {
    const scroller = $('#tgScroll');
    if (!scroller) return;
    const now = new Date();
    const min = now.getHours() * 60 + now.getMinutes();
    const y = (min / 60) * HOUR_H - scroller.clientHeight * 0.35;
    scroller.scrollTop = Math.max(0, y);
}

/* ------------------------------------------------------------
   AGENDA VIEW
   ------------------------------------------------------------ */
function renderAgenda() {
    const start = startOfDay(new Date());
    const end = endOfDay(addDays(start, 60));
    const occs = getOccurrences(start, end);

    const byDay = new Map();
    occs.forEach(o => {
        let cur = startOfDay(o.start);
        const endD = startOfDay(o.ev.allDay ? addDays(o.end, -1) : o.end);
        while (cur <= endD) {
            const k = toDateStr(cur);
            if (!byDay.has(k)) byDay.set(k, []);
            byDay.get(k).push({ o, isCont: cur.getTime() !== startOfDay(o.start).getTime() });
            cur = addDays(cur, 1);
        }
    });

    const days = Array.from(byDay.keys()).sort();

    if (!days.length) {
        return '<div class="agenda-view"><div class="ag-empty">NOTHING SCHEDULED IN THE NEXT 60 DAYS</div></div>';
    }

    let html = '<div class="agenda-view">';
    const today = startOfDay(new Date());

    days.forEach(k => {
        const [y,m,d] = k.split('-').map(Number);
        const day = new Date(y, m-1, d);
        const list = byDay.get(k);
        const isToday = sameDay(day, today);
        const rel = relDayLabel(day);

        html += '<div class="ag-day ' + (isToday ? 'today' : '') + '">';
        html += '<div class="ag-day-head">' +
            '<span class="ag-day-title">' + DAYS_LONG[day.getDay()].toUpperCase() + ', ' +
                MONTHS[day.getMonth()].toUpperCase() + ' ' + day.getDate() + '</span>' +
            '<span class="ag-day-sub">' + day.getFullYear() + '</span>' +
            (rel ? '<span class="ag-day-rel">' + rel + '</span>' : '') +
        '</div>';

        list.forEach(({ o, isCont }) => {
            const c = colorOf(o.ev);
            const timeTxt = o.ev.allDay
                ? 'ALL DAY'
                : (isCont ? '↳ ' : '') + fmtTime(o.start, state.h24) + ' – ' + fmtTime(o.end, state.h24);
            const metaParts = [];
            if (o.ev.location) metaParts.push('◉ ' + o.ev.location);
            if (o.ev.recurrence && o.ev.recurrence.freq && o.ev.recurrence.freq !== 'none') {
                metaParts.push('↻ REPEATS');
            }
            const cal = calendarById(o.ev.calendarId);
            if (cal) metaParts.push(cal.name);
            if (o.ev.tags && o.ev.tags.length) metaParts.push(o.ev.tags.map(t => '#' + t).join(' '));

            html += '<div class="ag-ev" style="--c:' + c + '" data-ev="' + o.ev.id + '" data-occ="' + o.occKey + '">' +
                '<div class="ag-ev-time">' + esc(timeTxt) + '</div>' +
                '<div class="ag-ev-bar"></div>' +
                '<div class="ag-ev-body">' +
                    '<div class="ag-ev-title">' + esc(o.ev.title) + '</div>' +
                    (metaParts.length ? '<div class="ag-ev-meta">' +
                        metaParts.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : '') +
                    (o.ev.description ? '<div class="ag-ev-desc">' + esc(o.ev.description) + '</div>' : '') +
                '</div>' +
                '<div class="ag-ev-right">' +
                    '<button class="btn ghost" data-edit="' + o.ev.id + '" style="padding:6px 10px;font-size:8.5px">EDIT</button>' +
                '</div>' +
            '</div>';
        });

        html += '</div>';
    });

    html += '</div>';
    return html;
}

/* ------------------------------------------------------------
   DRAG TO RESCHEDULE
   ------------------------------------------------------------ */
function startEventDrag(el, e) {
    if (e.button !== 0) return;
    if (e.target.closest('[data-edit]')) return;

    const evId = el.dataset.ev;
    const ev = state.events.find(x => x.id === evId);
    if (!ev) return;

    const startX = e.clientX;
    const startY = e.clientY;
    let started = false;
    let ghost = null;
    let pointerId = e.pointerId;
    const originRect = el.getBoundingClientRect();

    const onMove = ev2 => {
        if (ev2.pointerId !== pointerId) return;
        const dx = ev2.clientX - startX;
        const dy = ev2.clientY - startY;
        if (!started && Math.hypot(dx, dy) < 4) return;
        if (!started) {
            started = true;
            el.style.opacity = '.35';
            ghost = el.cloneNode(true);
            ghost.style.position = 'fixed';
            ghost.style.pointerEvents = 'none';
            ghost.style.zIndex = '9999';
            ghost.style.opacity = '.85';
            ghost.style.width = originRect.width + 'px';
            ghost.style.height = originRect.height + 'px';
            ghost.style.left = originRect.left + 'px';
            ghost.style.top = originRect.top + 'px';
            ghost.style.transform = 'scale(1.02)';
            ghost.style.boxShadow = '0 8px 32px rgba(0,0,0,.7)';
            document.body.appendChild(ghost);
            document.body.style.cursor = 'grabbing';
        }
        ghost.style.left = (originRect.left + dx) + 'px';
        ghost.style.top = (originRect.top + dy) + 'px';
    };

    const onUp = ev2 => {
        if (ev2.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        document.body.style.cursor = '';
        if (ghost) ghost.remove();
        el.style.opacity = '';
        if (!started) return;

        const dropX = ev2.clientX;
        const dropY = ev2.clientY;
        const target = document.elementFromPoint(dropX, dropY);
        if (!target) return;

        if (viewMode === 'month') {
            const cell = target.closest('.day-cell');
            if (!cell) return;
            const [y,m,d] = cell.dataset.date.split('-').map(Number);
            const newStartDay = new Date(y, m-1, d);
            const oldStart = new Date(ev.start);
            const deltaDays = dayDiff(newStartDay, startOfDay(oldStart));
            if (deltaDays === 0) return;
            shiftEvent(ev, deltaDays * MS_DAY);
            return;
        }

        if (viewMode === 'week' || viewMode === 'day') {
            const col = target.closest('.tg-col, .tg-allday-col');
            if (!col) return;
            const [y,m,d] = col.dataset.date.split('-').map(Number);
            const newDay = new Date(y, m-1, d);
            const tgScroll = $('#tgScroll');
            const rect = tgScroll.getBoundingClientRect();
            applyDrop(ev, newDay, dropY, rect);
        }
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
}

function applyDrop(ev, newDay, dropY, gridRect) {
    const relY = dropY - gridRect.top;
    const totalH = gridRect.height;
    const minutesPerPx = (24 * 60) / totalH;
    let newMin = Math.max(0, Math.min(24*60 - 15, relY * minutesPerPx));
    newMin = Math.round(newMin / QUARTER) * QUARTER;

    const oldStart = new Date(ev.start);
    const oldEnd = new Date(ev.end);
    const durMs = oldEnd - oldStart;

    const newStart = new Date(newDay);
    newStart.setHours(Math.floor(newMin / 60), newMin % 60, 0, 0);

    ev.start = newStart.toISOString();
    ev.end = new Date(newStart.getTime() + durMs).toISOString();
    ev.updated = Date.now();

    saveState(true);
    render();
    toast('success', 'RESCHEDULED', ev.title + ' → ' +
        DAYS_SHORT[newStart.getDay()] + ' ' + fmtTime(newStart, state.h24));
}

function shiftEvent(ev, msDelta) {
    const s = new Date(ev.start);
    const e = new Date(ev.end);
    ev.start = new Date(s.getTime() + msDelta).toISOString();
    ev.end = new Date(e.getTime() + msDelta).toISOString();
    ev.updated = Date.now();
    saveState(true);
    render();
    const nd = new Date(ev.start);
    toast('success', 'RESCHEDULED', ev.title + ' → ' +
        DAYS_SHORT[nd.getDay()] + ' ' + MONTHS_SHORT[nd.getMonth()] + ' ' + nd.getDate());
}

function bindJumpModal() {
    const yearInput = $('#jumpYearInput');
    const dateInput = $('#jumpDateInput');

    /* Focus year input for quick typing */
    if (yearInput) {
        yearInput.focus();
        yearInput.select();

        yearInput.addEventListener('input', () => {
            const cleaned = yearInput.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (cleaned !== yearInput.value) yearInput.value = cleaned;
        });

        yearInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitJump();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const n = clamp((parseInt(yearInput.value, 10) || new Date().getFullYear()) + 1, 1, 9999);
                yearInput.value = n;
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                const n = clamp((parseInt(yearInput.value, 10) || new Date().getFullYear()) - 1, 1, 9999);
                yearInput.value = n;
            }
        });
    }

    if (dateInput) {
        dateInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitJump();
            }
        });
    }

    /* Clicking the card body focuses the input */
    const yearCard = $('#jumpYearCard');
    if (yearCard && yearInput) {
        yearCard.addEventListener('click', e => {
            if (e.target !== yearInput) {
                yearInput.focus();
                yearInput.select();
            }
        });
    }
    const dateCard = $('#jumpDateCard');
    if (dateCard && dateInput) {
        dateCard.addEventListener('click', e => {
            if (e.target !== dateInput) {
                dateInput.focus();
                if (dateInput.showPicker) {
                    try { dateInput.showPicker(); } catch(err) {}
                }
            }
        });
    }

    /* Quick jumps */
    const row = $('#jumpQuickRow');
    if (row) {
        row.querySelectorAll('[data-jump]').forEach(b => {
            b.addEventListener('click', () => {
                const now = new Date();
                const key = b.dataset.jump;
                let target = null;

                switch (key) {
                    case 'today':    target = now; break;
                    case 'tomorrow': target = addDays(now, 1); break;
                    case 'week':     target = addDays(now, 7); break;
                    case 'month':    target = startOfMonth(now); break;
                    case 'year':     target = new Date(now.getFullYear(), 0, 1); break;
                    case 'q1':       target = new Date(now.getFullYear(), 0, 1); break;
                    case 'q2':       target = new Date(now.getFullYear(), 3, 1); break;
                    case 'q3':       target = new Date(now.getFullYear(), 6, 1); break;
                    case 'q4':       target = new Date(now.getFullYear(), 9, 1); break;
                }
                if (target) {
                    viewDate = target;
                    closeModal();
                    render();
                    toast('success', 'JUMPED', fmtDateLong(target), 2200);
                }
            });
        });
    }
}

function commitJump() {
    const yearInput = $('#jumpYearInput');
    const dateInput = $('#jumpDateInput');

    let target = null;
    let source = '';

    /* Priority: year field if it has a value; else date field */
    const yearRaw = yearInput ? yearInput.value.replace(/[^0-9]/g, '') : '';
    const dateVal = dateInput ? dateInput.value : '';

    if (yearRaw.length >= 1) {
        const n = clamp(parseInt(yearRaw, 10), 1, 9999);
        if (!isNaN(n)) {
            target = new Date(n, 0, 1);
            source = 'YEAR ' + n;
        }
    }

    if (!target && dateVal) {
        const [y, m, d] = dateVal.split('-').map(Number);
        if (y && m && d) {
            target = new Date(y, m-1, d);
            source = MONTHS_SHORT[m-1].toUpperCase() + ' ' + d + ', ' + y;
        }
    }

    if (!target) {
        toast('error', 'NO DATE', 'Enter a year or pick a date');
        return;
    }

    viewDate = target;
    closeModal();
    render();
    toast('success', 'JUMPED', source || fmtDateLong(target), 2200);
}

/* ------------------------------------------------------------
   EVENT EDITOR
   ------------------------------------------------------------ */
function openEventEditor(eventId, defaults) {
    const editing = !!eventId;
    const ev = editing ? state.events.find(x => x.id === eventId) : null;
    if (editing && !ev) return;

    defaults = defaults || {};
    const now = new Date();

    let initStart, initEnd, initAllDay, initCalId;

    if (editing) {
        initStart = new Date(ev.start);
        initEnd = new Date(ev.end);
        initAllDay = !!ev.allDay;
        initCalId = ev.calendarId;
    } else {
        const baseDate = defaults.date ? new Date(defaults.date) : new Date(now);
        if (defaults.allDay) {
            baseDate.setHours(0,0,0,0);
            initStart = baseDate;
            initEnd = baseDate;
            initAllDay = true;
        } else {
            const h = defaults.hour != null ? defaults.hour : Math.max(0, now.getHours() + 1);
            baseDate.setHours(h, 0, 0, 0);
            initStart = baseDate;
            initEnd = new Date(baseDate.getTime() + 60*60000);
            initAllDay = false;
        }
        initCalId = state.calendars[0] ? state.calendars[0].id : '';
    }

    const title    = editing ? ev.title : '';
    const descr    = editing ? (ev.description || '') : '';
    const location = editing ? (ev.location || '') : '';
    const tags     = editing ? (ev.tags || []).slice() : [];
    const color    = editing ? (ev.color || '') : '';
    const reminder = editing && ev.reminder != null ? ev.reminder : 15;
    const rec      = editing ? (ev.recurrence || { freq:'none' }) : { freq:'none' };

    const body = buildEditorHTML({
        title, descr, location, tags, color, reminder,
        rec, start: initStart, end: initEnd, allDay: initAllDay, calId: initCalId
    });

    openModal({
        title: editing ? 'EDIT EVENT' : 'NEW EVENT',
        body,
        width: '620px',
        buttons: [
            { label: editing ? 'DELETE' : 'CANCEL', cls: editing ? 'danger' : 'ghost',
              action: () => {
                if (editing) confirmDeleteEvent(eventId, true);
                else closeModal();
              } },
            { label: 'CANCEL', cls: 'ghost', action: closeModal },
            { label: editing ? 'SAVE CHANGES' : 'CREATE EVENT', cls: 'primary',
              action: () => saveEventFromEditor(editing ? eventId : null) }
        ]
    });

    setTimeout(() => bindEditorEvents(editing ? eventId : null), 40);
}

function bindEditorEvents(eventId) {
    const editing = !!eventId;
    const ev = editing ? state.events.find(x => x.id === eventId) : null;

    const titleInput = $('#evTitle');
    if (titleInput && !editing) titleInput.focus();

    const allDayBtn = $('#evAllDay');
    if (allDayBtn) {
        allDayBtn.addEventListener('click', () => {
            allDayBtn.classList.toggle('on');
            const on = allDayBtn.classList.contains('on');
            $('#startTimeField').style.display = on ? 'none' : '';
            $('#endTimeField').style.display = on ? 'none' : '';
            $('#dtStart').classList.toggle('single', on);
            $('#dtEnd').classList.toggle('single', on);
        });
    }

    $$('.qd-btn').forEach(b => {
        b.addEventListener('click', () => {
            const mins = parseInt(b.dataset.dur, 10);
            const sd = $('#evStartDate').value;
            const st = $('#evStartTime').value || '09:00';
            const start = fromDateTime(sd, st);
            const end = new Date(start.getTime() + mins*60000);
            $('#evEndDate').value = toDateStr(end);
            $('#evEndTime').value = toTimeStr(end);
        });
    });

    $$('#colorSwatches .swatch').forEach(s => {
        s.addEventListener('click', () => {
            $$('#colorSwatches .swatch').forEach(x => x.classList.remove('on'));
            s.classList.add('on');
        });
    });

    const tagWrap = $('#tagWrap');
    const tagInput = $('#tagInput');
    const tags = (editing && ev.tags) ? ev.tags.slice() : [];

    function renderTags() {
        Array.from(tagWrap.querySelectorAll('.tag-chip')).forEach(x => x.remove());
        tags.forEach(t => {
            const chip = document.createElement('span');
            chip.className = 'tag-chip';
            chip.innerHTML = esc(t) + ' <span class="x">×</span>';
            chip.querySelector('.x').addEventListener('click', () => {
                const i = tags.indexOf(t);
                if (i > -1) tags.splice(i, 1);
                renderTags();
            });
            tagWrap.insertBefore(chip, tagInput);
        });
    }
    renderTags();

    if (tagInput) {
        tagInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const v = tagInput.value.trim().toUpperCase();
                if (v && !tags.includes(v)) { tags.push(v); renderTags(); }
                tagInput.value = '';
            } else if (e.key === 'Backspace' && !tagInput.value && tags.length) {
                tags.pop(); renderTags();
            }
        });
    }

    const freqSel = $('#evFreq');
    if (freqSel) {
        freqSel.addEventListener('change', () => {
            $('#dowField').style.display = freqSel.value === 'weekly' ? '' : 'none';
        });
    }

    $$('#dowPick .dow-btn').forEach(b => {
        b.addEventListener('click', () => b.classList.toggle('on'));
    });

    const recEndSel = $('#evRecEnd');
    if (recEndSel) {
        recEndSel.addEventListener('change', () => {
            const v = recEndSel.value;
            $('#evRecUntil').style.display = v === 'on' ? '' : 'none';
            $('#evRecCount').style.display = v === 'after' ? '' : 'none';
        });
    }

    if (titleInput) {
        titleInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); saveEventFromEditor(eventId); }
        });
    }
}

function saveEventFromEditor(eventId) {
    const editing = !!eventId;

    const title = ($('#evTitle').value || '').trim() || 'Untitled event';
    const allDay = $('#evAllDay').classList.contains('on');
    const sd = $('#evStartDate').value;
    const st = $('#evStartTime').value || '09:00';
    const ed = $('#evEndDate').value;
    const et = $('#evEndTime').value || '10:00';

    if (!sd || !ed) {
        toast('error', 'MISSING DATE', 'Please set start and end dates');
        return;
    }

    let start = fromDateTime(sd, allDay ? '00:00' : st);
    let end   = fromDateTime(ed, allDay ? '23:59' : et);

    if (end <= start) {
        if (allDay) end = endOfDay(start);
        else { toast('error', 'INVALID RANGE', 'End must be after start'); return; }
    }

    const calId = $('#evCal').value;
    const location = ($('#evLocation').value || '').trim();
    const descr = ($('#evDesc').value || '').trim();
    const colorSel = $('#colorSwatches .swatch.on');
    const color = colorSel ? colorSel.dataset.color : '';
    const reminder = parseInt($('#evReminder').value, 10) || 0;

    const tagWrap = $('#tagWrap');
    const tags = Array.from(tagWrap.querySelectorAll('.tag-chip')).map(c =>
        c.textContent.replace('×','').trim()
    );

    const freq = $('#evFreq').value;
    const interval = Math.max(1, parseInt($('#evInterval').value, 10) || 1);
    const byDay = freq === 'weekly'
        ? $$('#dowPick .dow-btn.on').map(b => parseInt(b.dataset.dow, 10)).sort()
        : [];
    const recEnd = $('#evRecEnd').value;
    const until = recEnd === 'on' && $('#evRecUntil').value
        ? fromDateTime($('#evRecUntil').value, '23:59').toISOString()
        : null;
    const count = recEnd === 'after'
        ? Math.max(1, parseInt($('#evRecCount').value, 10) || 1)
        : null;

    const recurrence = freq === 'none'
        ? { freq: 'none' }
        : { freq, interval, byDay: freq === 'weekly' && byDay.length ? byDay : null, until, count };

    if (editing) {
        const ev = state.events.find(x => x.id === eventId);
        if (!ev) return;
        ev.title = title;
        ev.description = descr;
        ev.location = location;
        ev.start = start.toISOString();
        ev.end = end.toISOString();
        ev.allDay = allDay;
        ev.calendarId = calId;
        ev.color = color || null;
        ev.tags = tags;
        ev.reminder = reminder;
        ev.recurrence = recurrence;
        ev.updated = Date.now();
        saveState(true);
        closeModal();
        render();
        toast('success', 'EVENT UPDATED', title);
    } else {
        const newEv = {
            id: uid('EV'),
            title, description: descr, location,
            start: start.toISOString(),
            end: end.toISOString(),
            allDay, calendarId: calId,
            color: color || null,
            tags, reminder, recurrence,
            created: Date.now(), updated: Date.now()
        };
        state.events.push(newEv);
        saveState(true);
        closeModal();
        render();
        toast('success', 'EVENT CREATED', title + ' · ' +
            DAYS_SHORT[start.getDay()] + ' ' + fmtTime(start, state.h24));
    }
}

/* ------------------------------------------------------------
   EVENT DETAIL
   ------------------------------------------------------------ */
function openEventDetail(eventId) {
    const ev = state.events.find(x => x.id === eventId);
    if (!ev) return;

    const c = colorOf(ev);
    const cal = calendarById(ev.calendarId);
    const startD = new Date(ev.start);
    const endD = new Date(ev.end);

    const whenRows = [];
    if (ev.allDay) {
        if (sameDay(startD, endD)) {
            whenRows.push('<div class="detail-when-row"><span class="ic">◷</span><b>' +
                fmtDateLong(startD) + '</b> · ALL DAY</div>');
        } else {
            whenRows.push('<div class="detail-when-row"><span class="ic">◷</span><b>' +
                fmtDateLong(startD) + '</b></div>');
            whenRows.push('<div class="detail-when-row"><span class="ic"></span>→ <b>' +
                fmtDateLong(endD) + '</b> · ALL DAY</div>');
        }
    } else if (sameDay(startD, endD)) {
        whenRows.push('<div class="detail-when-row"><span class="ic">◷</span><b>' +
            fmtDateLong(startD) + '</b></div>');
        whenRows.push('<div class="detail-when-row"><span class="ic"></span>' +
            fmtTime(startD, state.h24) + ' – ' + fmtTime(endD, state.h24) +
            ' <span style="color:#555">· ' +
            fmtDur(Math.round((endD - startD) / 60000)) + '</span></div>');
    } else {
        whenRows.push('<div class="detail-when-row"><span class="ic">◷</span><b>' +
            fmtDateLong(startD) + '</b> · ' + fmtTime(startD, state.h24) + '</div>');
        whenRows.push('<div class="detail-when-row"><span class="ic"></span>→ <b>' +
            fmtDateLong(endD) + '</b> · ' + fmtTime(endD, state.h24) + '</div>');
    }

    const rows = [];
    if (cal) rows.push(['CALENDAR',
        '<span style="display:inline-flex;align-items:center;gap:8px">' +
        '<span style="width:8px;height:8px;background:' + c + '"></span>' +
        esc(cal.name) + '</span>']);
    if (ev.location) rows.push(['LOCATION', '<span>◉ ' + esc(ev.location) + '</span>']);
    if (ev.recurrence && ev.recurrence.freq && ev.recurrence.freq !== 'none') {
        rows.push(['REPEATS', esc(recurText(ev.recurrence))]);
    }
    if (ev.reminder != null) {
        const r = REMINDERS.find(x => x.value === ev.reminder);
        if (r) rows.push(['REMINDER', esc(r.label)]);
    }
    if (ev.tags && ev.tags.length) {
        rows.push(['TAGS', '<span class="detail-v tags">' +
            ev.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') +
            '</span>']);
    }
    rows.push(['CREATED', fmtDateFull(ev.created)]);
    if (ev.updated) rows.push(['UPDATED', fmtDateFull(ev.updated)]);

    const body =
        '<div class="detail-hero" style="--c:' + c + '">' +
            '<div class="detail-color-bar"></div>' +
            '<div class="detail-title">' + esc(ev.title) + '</div>' +
            '<div class="detail-when">' + whenRows.join('') + '</div>' +
        '</div>' +
        (ev.description ? '<div style="margin-bottom:18px">' +
            '<div class="fs-title">DESCRIPTION</div>' +
            '<div class="detail-note">' + esc(ev.description) + '</div>' +
        '</div>' : '') +
        '<div>' +
            '<div class="fs-title">DETAILS</div>' +
            rows.map(([k,v]) =>
                '<div class="detail-row">' +
                    '<span class="detail-k">' + esc(k) + '</span>' +
                    '<span class="detail-v">' + v + '</span>' +
                '</div>').join('') +
        '</div>';

    openModal({
        title: 'EVENT DETAILS',
        body,
        width: '560px',
        buttons: [
            { label: 'DELETE', cls: 'danger', action: () => confirmDeleteEvent(eventId, true) },
            { label: 'DUPLICATE', cls: 'ghost', action: () => duplicateEvent(eventId) },
            { label: 'CLOSE', cls: 'ghost', action: closeModal },
            { label: 'EDIT', cls: 'primary', action: () => {
                closeModal();
                setTimeout(() => openEventEditor(eventId), 80);
            } }
        ]
    });
}

function fmtDateFull(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '.' + pad(d.getMonth()+1) + '.' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function duplicateEvent(eventId) {
    const ev = state.events.find(x => x.id === eventId);
    if (!ev) return;
    const copy = JSON.parse(JSON.stringify(ev));
    copy.id = uid('EV');
    copy.title = ev.title + ' (COPY)';
    copy.created = Date.now();
    copy.updated = Date.now();
    state.events.push(copy);
    saveState(true);
    closeModal();
    render();
    toast('success', 'DUPLICATED', copy.title);
}

function confirmDeleteEvent(eventId, closeFirst) {
    const ev = state.events.find(x => x.id === eventId);
    if (!ev) return;

    if (closeFirst) closeModal();

    setTimeout(() => {
        openModal({
            title: 'DELETE EVENT',
            danger: true,
            body: '<p class="confirm-msg">Permanently delete <b>' + esc(ev.title) + '</b>? ' +
                  'This cannot be undone.</p>',
            buttons: [
                { label: 'CANCEL', cls: 'ghost', action: closeModal },
                { label: 'DELETE EVENT', cls: 'danger', action: () => {
                    state.events = state.events.filter(x => x.id !== eventId);
                    saveState(true);
                    closeModal();
                    render();
                    toast('warn', 'EVENT DELETED', ev.title);
                } }
            ]
        });
    }, closeFirst ? 120 : 0);
}

/* ------------------------------------------------------------
   CONTEXT MENU
   ------------------------------------------------------------ */
function openEventContextMenu(x, y, eventId, occKey) {
    const ev = state.events.find(x => x.id === eventId);
    if (!ev) return;

    const menu = $('#ctxMenu');
    const isRecurring = ev.recurrence && ev.recurrence.freq && ev.recurrence.freq !== 'none';

    let html = '<div class="ctx-label">' + esc(ev.title).slice(0,30) + '</div>';
    html += '<button class="ctx-item" data-cmd="open"><span class="ci">◉</span>VIEW DETAILS</button>';
    html += '<button class="ctx-item" data-cmd="edit"><span class="ci">✎</span>EDIT</button>';
    html += '<div class="ctx-sep"></div>';
    html += '<button class="ctx-item" data-cmd="duplicate"><span class="ci">⎘</span>DUPLICATE</button>';
    html += '<button class="ctx-item" data-cmd="copy"><span class="ci">⧉</span>COPY SUMMARY</button>';

    if (isRecurring) {
        html += '<div class="ctx-sep"></div>';
        html += '<button class="ctx-item" data-cmd="deleteSingle"><span class="ci">⌫</span>DELETE THIS OCCURRENCE</button>';
        html += '<button class="ctx-item danger" data-cmd="deleteAll"><span class="ci">⌫</span>DELETE SERIES</button>';
    } else {
        html += '<div class="ctx-sep"></div>';
        html += '<button class="ctx-item danger" data-cmd="delete"><span class="ci">⌫</span>DELETE</button>';
    }

    menu.innerHTML = html;
    menu.classList.add('open');

    const mw = menu.offsetWidth || 220;
    const mh = menu.offsetHeight || 260;
    const px = Math.min(x, window.innerWidth - mw - 10);
    const py = Math.min(y, window.innerHeight - mh - 10);
    menu.style.left = Math.max(6, px) + 'px';
    menu.style.top = Math.max(6, py) + 'px';

    menu.querySelectorAll('[data-cmd]').forEach(btn => {
        btn.addEventListener('click', () => {
            const cmd = btn.dataset.cmd;
            menu.classList.remove('open');
            runEventCommand(cmd, ev, occKey);
        });
    });
}

function runEventCommand(cmd, ev, occKey) {
    switch (cmd) {
        case 'open': openEventDetail(ev.id); break;
        case 'edit': openEventEditor(ev.id); break;
        case 'duplicate': duplicateEvent(ev.id); break;
        case 'copy': {
            const text = ev.title + '\n' + eventWhenText(ev) +
                (ev.location ? '\n◉ ' + ev.location : '') +
                (ev.description ? '\n\n' + ev.description : '');
            navigator.clipboard.writeText(text).then(
                () => toast('success', 'COPIED', 'Event summary on clipboard'),
                () => toast('info', 'SUMMARY', text.slice(0, 80))
            );
            break;
        }
        case 'delete': confirmDeleteEvent(ev.id, false); break;
        case 'deleteSingle': {
            if (!ev.exceptions) ev.exceptions = [];
            const occStart = occKey.split('@')[1];
            if (occStart) {
                ev.exceptions.push(new Date(parseInt(occStart,10)).toISOString());
                saveState(true);
                render();
                toast('warn', 'OCCURRENCE DELETED', ev.title);
            }
            break;
        }
        case 'deleteAll': confirmDeleteEvent(ev.id, false); break;
    }
}

    const cal = editing ? calendarById(calId) : null;

    const color = cal ? cal.color : PALETTE[state.calendars.length % PALETTE.length].hex;

    const body =
        '<div class="field">' +
            '<label>Calendar name</label>' +
            '<input class="input" id="calName" value="' + esc(name) + '" placeholder="E.G. WORK" />' +
        '</div>' +
        '<div class="field">' +
            '<label>Colour</label>' +
            '<div class="swatches" id="calSwatches">' +
                PALETTE.map(p =>
                    '<div class="swatch ' + (color === p.hex ? 'on' : '') + '" ' +
                    'data-color="' + p.hex + '" style="--c:' + p.hex + ';background:' + p.hex + '"></div>'
                ).join('') +
            '</div>' +
        '</div>' +
        (editing ? '<div class="hint">DELETING A CALENDAR ALSO REMOVES ALL ITS EVENTS</div>' : '');

    openModal({
        title: editing ? 'EDIT CALENDAR' : 'NEW CALENDAR',
        body,
        width: '440px',
        buttons: [
            ...(editing ? [{
                label: 'DELETE', cls: 'danger',
                action: () => {
                    const evCount = state.events.filter(e => e.calendarId === calId).length;
                    closeModal();
                    setTimeout(() => {
                        openModal({
                            title: 'DELETE CALENDAR',
                            danger: true,
                            body: '<p class="confirm-msg">Delete <b>' + esc(cal.name) + '</b> and its <b>' +
                                  evCount + '</b> event' + (evCount === 1 ? '' : 's') + '?</p>',
                            buttons: [
                                { label: 'CANCEL', cls: 'ghost', action: closeModal },
                                { label: 'DELETE', cls: 'danger', action: () => {
                                    state.calendars = state.calendars.filter(c => c.id !== calId);
                                    state.events = state.events.filter(e => e.calendarId !== calId);
                                    saveState(true);
                                    closeModal();
                                    render();
                                    toast('warn', 'CALENDAR DELETED', cal.name);
                                } }
                            ]
                        });
                    }, 120);
                }
            }] : []),
            { label: 'CANCEL', cls: 'ghost', action: closeModal },
            { label: editing ? 'SAVE' : 'CREATE', cls: 'primary', action: () => {
                const n = ($('#calName').value || '').trim().toUpperCase();
                if (!n) { toast('error', 'NAME REQUIRED', 'Enter a calendar name'); return; }
                const sel = $('#calSwatches .swatch.on');
                const cHex = sel ? sel.dataset.color : PALETTE[0].hex;

                if (editing) {
                    cal.name = n; cal.color = cHex;
                    saveState(true); closeModal(); render();
                    toast('success', 'CALENDAR UPDATED', n);
                } else {
                    state.calendars.push({ id: uid('CAL'), name: n, color: cHex, visible: true });
                    saveState(true); closeModal(); render();
                    toast('success', 'CALENDAR CREATED', n);
                }
            } }
        ]
    });

    setTimeout(() => {
        const inp = $('#calName');
        if (inp) {
            inp.focus();
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    const btn = $$('#modalFoot .btn').find(b => b.classList.contains('primary'));
                    if (btn) btn.click();
                }
            });
        }
        const wrap = $('#calSwatches');
        if (wrap) {
            wrap.querySelectorAll('.swatch').forEach(s => {
                s.addEventListener('click', () => {
                    wrap.querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));
                    s.classList.add('on');
                });
            });
        }
    }, 50);
}

/* ------------------------------------------------------------
   MODAL SYSTEM
   ------------------------------------------------------------ */
function openModal({ title, body, buttons, danger, width }) {
    $('#modalTitle').textContent = title;
    $('#modalTitle').classList.toggle('danger', !!danger);
    $('#modalBody').innerHTML = body;
    $('#modalBox').style.maxWidth = width || '560px';

    const foot = $('#modalFoot');
    foot.innerHTML = '';
    (buttons || []).forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn ' + (b.cls || 'ghost');
        el.textContent = b.label;
        el.addEventListener('click', b.action);
        foot.appendChild(el);
    });

    $$('#modalBox .corner').forEach(c => c.classList.toggle('red', !!danger));
    $('#modalOverlay').classList.add('open');
}

function closeModal() {
    $('#modalOverlay').classList.remove('open');
    $('#modalBody').innerHTML = '';
    $('#modalFoot').innerHTML = '';
}

/* ------------------------------------------------------------
   NAVIGATION
   ------------------------------------------------------------ */
function setViewMode(mode) {
    viewMode = mode;
    render();
}

function navigate(dir) {
    if (viewMode === 'month') viewDate = addMonths(viewDate, dir);
    else if (viewMode === 'week') viewDate = addDays(viewDate, 7*dir);
    else if (viewMode === 'day') viewDate = addDays(viewDate, dir);
    else if (viewMode === 'year') viewDate = new Date(viewDate.getFullYear() + dir, viewDate.getMonth(), 1);
    else viewDate = addMonths(viewDate, dir);
    render();
}

function goToday() {
    viewDate = new Date();
    render();
}

/* ------------------------------------------------------------
   TOP-LEVEL BINDING
   ------------------------------------------------------------ */
function bindTopLevel() {
    $('#prevBtn').addEventListener('click', () => navigate(-1));
    $('#nextBtn').addEventListener('click', () => navigate(1));
    $('#todayBtn').addEventListener('click', goToday);
    $('#newEventBtn').addEventListener('click', () => openEventEditor(null));
    $('#hamburger').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
    $('#addCalBtn').addEventListener('click', () => openCalendarEditor(null));

    /* GO TO button */
    $('#goToBtn').addEventListener('click', openJumpToDateModal);

    /* Clickable mini-cal title */
    $('#miniTitle').addEventListener('click', openJumpToDateModal);

    $$('#viewSwitch button').forEach(b => {
        b.addEventListener('click', () => setViewMode(b.dataset.view));
    });

    $('#miniPrev').addEventListener('click', e => {
        e.stopPropagation();
        viewDate = addMonths(viewDate, -1);
        render();
    });
    $('#miniNext').addEventListener('click', e => {
        e.stopPropagation();
        viewDate = addMonths(viewDate, 1);
        render();
    });

    $('#searchInput').addEventListener('input', e => {
        searchQuery = e.target.value;
        render();
    });

    $('#printBtn').addEventListener('click', () => window.print());

    $('#modalClose').addEventListener('click', closeModal);
    $('#modalOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('#ctxMenu')) $('#ctxMenu').classList.remove('open');
    });
    document.addEventListener('contextmenu', e => {
        if (!e.target.closest('[data-ev]')) $('#ctxMenu').classList.remove('open');
    });

    document.addEventListener('keydown', e => {
        const tag = (e.target.tagName || '').toLowerCase();
        const typing = tag === 'input' || tag === 'textarea' || tag === 'select';

        if (e.key === 'Escape') {
            if ($('#modalOverlay').classList.contains('open')) { closeModal(); return; }
            $('#ctxMenu').classList.remove('open');
            return;
        }

        if (typing) return;

        const key = e.key.toLowerCase();

        if (key === 't') { goToday(); return; }
        if (key === 'm') { setViewMode('month'); return; }
        if (key === 'w') { setViewMode('week'); return; }
        if (key === 'd') { setViewMode('day'); return; }
        if (key === 'y') { setViewMode('year'); return; }
        if (key === 'a') { setViewMode('agenda'); return; }
        if (key === 'g') { e.preventDefault(); openJumpToDateModal(); return; }
        if (key === 'c' || key === 'n') { openEventEditor(null); return; }
        if (key === 'arrowleft')  { navigate(-1); return; }
        if (key === 'arrowright') { navigate(1); return; }
        if (e.key === '/') {
            e.preventDefault();
            $('#searchInput').focus();
        }
    });
}

/* ------------------------------------------------------------
   SEED
   ------------------------------------------------------------ */
function seed() {
    if (state.seeded) return;
    state.seeded = true;

    const now = new Date();
    const today = startOfDay(now);

    function at(dayOffset, hour, min) {
        const d = addDays(today, dayOffset);
        d.setHours(hour, min || 0, 0, 0);
        return d;
    }
    function mk(o) {
        return {
            id: uid('EV'),
            title: o.title,
            description: o.description || '',
            location: o.location || '',
            start: o.start.toISOString(),
            end: o.end.toISOString(),
            allDay: !!o.allDay,
            calendarId: o.cal || 'cal-work',
            color: o.color || null,
            tags: o.tags || [],
            reminder: o.reminder != null ? o.reminder : 15,
            recurrence: o.recurrence || { freq: 'none' },
            created: Date.now() - 86400000 * 3,
            updated: Date.now() - 86400000
        };
    }

    const events = [
        mk({
            title: 'Daily Standup',
            description: 'Quick sync — blockers, priorities, handoffs.',
            location: 'Huddle Room 2',
            start: at(-14, 9, 30), end: at(-14, 9, 45),
            cal: 'cal-work', tags: ['TEAM'], reminder: 5,
            recurrence: { freq: 'weekly', interval: 1, byDay: [1,2,3,4,5], until: null, count: null }
        }),
        mk({
            title: 'Design Review — AtlasTalon v2',
            description: 'Walk through the new navigation and file preview flow.',
            location: 'Zoom · meeting.atlastalon.io/design',
            start: at(0, 14, 0), end: at(0, 15, 30),
            cal: 'cal-work', tags: ['DESIGN', 'REVIEW'], reminder: 15
        }),
        mk({
            title: '1:1 with K. Raine',
            location: 'Office · 3rd floor',
            start: at(1, 11, 0), end: at(1, 11, 45),
            cal: 'cal-personal', tags: ['1:1'], reminder: 10
        }),
        mk({
            title: 'Product Launch — Secure Sync',
            location: 'HQ · Auditorium',
            start: at(8, 10, 0), end: at(8, 12, 0),
            cal: 'cal-important', tags: ['LAUNCH'],
            reminder: 60, color: '#FF9500'
        }),
        mk({
            title: 'Company Offsite — Lisbon',
            location: 'Lisbon, Portugal',
            start: at(20, 0, 0), end: at(22, 23, 59),
            allDay: true, cal: 'cal-personal',
            tags: ['OFFSITE'], reminder: 1440
        }),
        mk({
            title: 'A. Talon — Birthday',
            start: at(4, 0, 0), end: at(4, 23, 59),
            allDay: true, cal: 'cal-birthdays', reminder: 0,
            recurrence: { freq: 'yearly', interval: 1, until: null, count: null }
        }),
        mk({
            title: 'Weekly Leadership Sync',
            location: 'Boardroom',
            start: at(2, 16, 0), end: at(2, 17, 0),
            cal: 'cal-work', tags: ['LEADERSHIP'],
            recurrence: { freq: 'weekly', interval: 1, byDay: [5], until: null, count: null },
            reminder: 30
        }),
        mk({
            title: 'Quarterly All-Hands',
            location: 'HQ · Auditorium',
            start: at(-3, 15, 0), end: at(-3, 16, 30),
            cal: 'cal-work', tags: ['ALL-HANDS']
        }),
        mk({
            title: 'Lunch with M. Voss',
            location: 'Café Lisboa',
            start: at(1, 12, 30), end: at(1, 13, 30),
            cal: 'cal-personal', reminder: 30
        }),
        mk({
            title: 'Q4 Report — Deadline',
            description: 'Submit final draft to legal for review.',
            start: at(10, 17, 0), end: at(10, 17, 30),
            cal: 'cal-important', tags: ['DEADLINE'],
            reminder: 1440, color: '#FF3D00'
        })
    ];

    state.events = state.events.concat(events);
    saveState(true);
}

/* ------------------------------------------------------------
   BOOT
   ------------------------------------------------------------ */
function boot() {
    seed();
    bindTopLevel();
    render();

    setTimeout(() => {
        toast('info', 'ATLASTALON CALENDAR',
              'G = go to date · M/W/D/Y/A views · C create · / search', 4400);
    }, 500);

    setInterval(() => {
        if (viewMode === 'week' || viewMode === 'day') {
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const nowTop = (nowMin / 60) * HOUR_H;
            $$('.tg-now').forEach(el => { el.style.top = nowTop + 'px'; });
        }
        if (viewMode === 'agenda') render();
    }, 30000);
}

boot();

})();
