<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AtlasTalon · Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
    --bg:#050505;
    --panel:#0a0a0a;
    --panel2:#070707;
    --line:#1a1a1a;
    --line2:#2a2a2a;
    --line3:#333;
    --txt:#e0e0e0;
    --txt2:#c0c0c0;
    --dim:#666;
    --dim2:#444;
    --dim3:#333;
    --white:#ffffff;
    --green:#34C759;
    --blue:#007AFF;
    --yellow:#FFD60A;
    --red:#FF3D00;
    --purple:#BF5AF2;
    --orange:#FF9500;
    --pink:#FF2D55;
    --teal:#5AC8FA;
    --gray:#8E8E93;
    color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden}
body{
    font-family:'IBM Plex Mono',monospace;
    color:var(--txt);
    font-size:12px;
    -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color-scheme:dark}
button{cursor:pointer}

body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center,black 30%,transparent 92%);
    -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 92%);
}
body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.45;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 3px);
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
    position:relative;z-index:2;
    height:100vh;display:flex;overflow:hidden;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
    width:266px;flex-shrink:0;
    background:var(--bg);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:margin-left .22s ease;
}
.side-brand{
    display:flex;align-items:center;gap:13px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
}
.logo{
    width:38px;height:38px;flex-shrink:0;
    border:1px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
    position:relative;background:rgba(255,255,255,.04);
}
.logo::before{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,.15)}
.logo::after{
    content:'';position:absolute;top:-3px;right:-3px;width:6px;height:6px;
    background:#fff;box-shadow:0 0 8px rgba(255,255,255,.3);
    animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.logo-text{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;position:relative;z-index:1}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-title{font-size:13px;font-weight:700;letter-spacing:3.5px;color:var(--txt);white-space:nowrap}
.brand-sub{font-size:8px;color:#555;letter-spacing:2px;margin-top:3px;white-space:nowrap}

.side-new{padding:14px 14px 10px;flex-shrink:0}
.new-btn{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:#fff;border:1px solid #fff;color:#000;
    padding:11px 14px;
    font-size:10px;letter-spacing:2.5px;font-weight:700;
    text-transform:uppercase;
    transition:all .2s;
}
.new-btn:hover{background:#e6e6e6;box-shadow:0 0 0 1px #fff,0 0 22px rgba(255,255,255,.16)}
.new-btn .plus{font-size:14px;line-height:1;font-weight:400}

.side-scroll{flex:1;overflow-y:auto;padding-bottom:20px}
.side-scroll::-webkit-scrollbar{width:5px}
.side-scroll::-webkit-scrollbar-track{background:var(--bg)}
.side-scroll::-webkit-scrollbar-thumb{background:#1a1a1a}
.side-scroll::-webkit-scrollbar-thumb:hover{background:#2a2a2a}

/* Mini calendar */
.mini-cal{padding:14px 14px 8px;user-select:none}
.mini-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
}
.mini-title{
    font-size:10px;color:var(--txt);letter-spacing:2.6px;text-transform:uppercase;
    font-weight:500;
    cursor:pointer;
    padding:2px 4px;
    margin:-2px -4px;
    transition:color .15s;
    border-radius:1px;
}
.mini-title:hover{color:#fff;background:rgba(255,255,255,.05)}
.mini-nav{display:flex;gap:2px}
.mini-nav button{
    background:transparent;border:1px solid var(--line);color:#666;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;transition:all .15s;
}
.mini-nav button:hover{border-color:#fff;color:#fff}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-dow{
    text-align:center;font-size:8px;color:#3a3a3a;
    letter-spacing:.5px;padding:3px 0;
}
.mini-day{
    position:relative;
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#7a7a7a;
    cursor:pointer;transition:all .13s;
    border:1px solid transparent;
}
.mini-day:hover{background:rgba(255,255,255,.06);color:#fff}
.mini-day.other{color:#2e2e2e}
.mini-day.today{color:#fff;font-weight:700}
.mini-day.today::before{
    content:'';position:absolute;inset:2px;
    border:1px solid rgba(255,255,255,.55);
}
.mini-day.selected{
    background:#fff;color:#000;font-weight:700;
}
.mini-day.has-ev::after{
    content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:3px;height:3px;border-radius:50%;background:#fff;
}
.mini-day.selected.has-ev::after{background:#000}
.mini-day.today:not(.selected).has-ev::after{background:#fff}

/* Calendar list */
.side-sec{padding:12px 0 6px}
.side-title{
    font-size:8px;color:#3a3a3a;letter-spacing:2.5px;text-transform:uppercase;
    padding:6px 18px;
    display:flex;align-items:center;justify-content:space-between;
}
.side-title button{
    background:transparent;border:1px solid var(--line);color:#4a4a4a;
    width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;transition:all .15s;
}
.side-title button:hover{border-color:#fff;color:#fff}

.cal-list{display:flex;flex-direction:column}
.cal-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 18px;
    font-size:10.5px;color:#8a8a8a;letter-spacing:1.4px;
    text-transform:uppercase;
    transition:background .13s;
    cursor:pointer;user-select:none;
}
.cal-item:hover{background:rgba(255,255,255,.03);color:#d0d0d0}
.cal-item.hidden{opacity:.4}
.cal-check{
    width:13px;height:13px;flex-shrink:0;
    border:1px solid var(--c);
    background:var(--c);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;color:#000;font-weight:700;
    transition:all .13s;
}
.cal-item.hidden .cal-check{background:transparent}
.cal-item .cal-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item .cal-count{font-size:8.5px;color:#3a3a3a}

/* Upcoming */
.upcoming{display:flex;flex-direction:column;gap:4px;padding:4px 12px}
.up-item{
    background:var(--panel);border:1px solid var(--line);
    border-left:2px solid var(--c,#666);
    padding:9px 11px;
    cursor:pointer;transition:all .15s;
}
.up-item:hover{border-color:var(--line2);background:#0d0d0d}
.up-title{font-size:10.5px;color:var(--txt2);letter-spacing:.5px;margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-meta{font-size:8px;color:#4a4a4a;letter-spacing:1.6px;text-transform:uppercase}
.up-meta b{color:#777;font-weight:400}
.up-empty{font-size:9px;color:#2e2e2e;letter-spacing:2px;text-align:center;padding:14px 0;text-transform:uppercase}

/* ============================================================
   MAIN
   ============================================================ */
.main{
    flex:1;min-width:0;
    display:flex;flex-direction:column;
    overflow:hidden;
}

/* ---------- TOPBAR ---------- */
.topbar{
    flex-shrink:0;
    height:58px;
    display:flex;align-items:center;gap:10px;
    padding:0 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:relative;z-index:20;
}
.hamburger{
    display:none;
    background:transparent;border:1px solid var(--line);color:var(--dim);
    width:34px;height:34px;font-size:14px;line-height:1;
    align-items:center;justify-content:center;
}
.hamburger:hover{border-color:#fff;color:#fff}

.nav-group{display:flex;gap:4px;align-items:center}
.nav-btn{
    background:transparent;border:1px solid var(--line);color:#888;
    padding:0;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;line-height:1;transition:all .15s;
}
.nav-btn:hover{border-color:#fff;color:#fff}
.today-btn{
    background:transparent;border:1px solid var(--line);color:#999;
    padding:0 15px;height:32px;
    font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    transition:all .15s;
}
.today-btn:hover{border-color:#fff;color:#fff}

.view-title{
    font-size:16px;font-weight:300;color:#fff;
    letter-spacing:3px;text-transform:uppercase;
    margin-left:14px;white-space:nowrap;
    min-width:190px;
}
.view-title .yr{color:#555;font-size:12px}

.spacer{flex:1}

.search-wrap{
    display:flex;align-items:center;
    border:1px solid var(--line);background:var(--panel);
    height:32px;max-width:280px;
    transition:border-color .15s;
}
.search-wrap:focus-within{border-color:#fff}
.search-ico{padding:0 10px;color:#3a3a3a;font-size:11px}
.search-input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    padding:0 8px 0 0;height:100%;
    font-size:10.5px;letter-spacing:1px;color:var(--txt2);
}
.search-input::placeholder{color:#3f3f3f;text-transform:uppercase;letter-spacing:1.6px;font-size:9.5px}

.view-switch{display:flex;border:1px solid var(--line);height:32px}
.view-switch button{
    background:transparent;border:none;border-right:1px solid var(--line);
    color:#777;padding:0 11px;height:100%;
    font-size:9px;letter-spacing:1.6px;text-transform:uppercase;
    transition:all .15s;
}
.view-switch button:last-child{border-right:none}
.view-switch button:hover{color:#fff;background:rgba(255,255,255,.03)}
.view-switch button.active{color:#fff;background:rgba(255,255,255,.08)}

.icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    padding:0 12px;height:32px;
    font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;
    transition:all .2s;white-space:nowrap;
    display:flex;align-items:center;gap:6px;
}
.icon-btn:hover{border-color:#fff;color:#fff}
.icon-btn.go-btn{border-color:rgba(255,255,255,.28);color:#c0c0c0}
.icon-btn.go-btn:hover{background:rgba(255,255,255,.06);border-color:#fff;color:#fff}

/* ============================================================
   VIEW CONTAINER
   ============================================================ */
.view-container{
    flex:1;overflow:hidden;
    display:flex;flex-direction:column;
    position:relative;z-index:5;
}

/* ---------- MONTH VIEW ---------- */
.month-view{
    flex:1;display:flex;flex-direction:column;
    overflow:hidden;
}
.month-dow{
    display:grid;grid-template-columns:repeat(7,1fr);
    border-bottom:1px solid var(--line);
    background:var(--bg);
    flex-shrink:0;
}
.month-dow span{
    text-align:center;
    padding:10px 0;
    font-size:9px;color:#4a4a4a;letter-spacing:2.6px;text-transform:uppercase;
    border-right:1px solid var(--line);
}
.month-dow span:last-child{border-right:none}
.month-dow span.weekend{color:#3a3a3a}

.month-grid{
    flex:1;display:flex;flex-direction:column;
    overflow-y:auto;position:relative;
}
.month-grid::-webkit-scrollbar{width:7px}
.month-grid::-webkit-scrollbar-track{background:var(--bg)}
.month-grid::-webkit-scrollbar-thumb{background:#181818}
.month-grid::-webkit-scrollbar-thumb:hover{background:#282828}

.month-week{
    position:relative;
    flex:1;
    min-height:106px;
    border-bottom:1px solid var(--line);
}
.month-week:last-child{border-bottom:none}

.week-cells{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    height:100%;
    min-height:106px;
}
.day-cell{
    position:relative;
    padding:calc(26px + var(--lanes,0) * 20px) 5px 5px;
    border-right:1px solid var(--line);
    overflow:hidden;
    cursor:pointer;
    transition:background .12s;
    min-width:0;
}
.day-cell:last-child{border-right:none}
.day-cell:hover{background:rgba(255,255,255,.02)}
.day-cell.other{background:rgba(0,0,0,.28)}
.day-cell.other .day-num{color:#2e2e2e}
.day-cell.weekend{background:rgba(255,255,255,.012)}
.day-cell.weekend.other{background:rgba(0,0,0,.32)}
.day-cell.today{background:rgba(255,255,255,.028)}

.day-num{
    position:absolute;top:4px;right:7px;
    font-size:11px;color:#888;
    font-variant-numeric:tabular-nums;
    letter-spacing:.5px;
    min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .13s;
}
.day-cell.today .day-num{
    background:#fff;color:#000;
    font-weight:700;letter-spacing:0;
}
.day-cell.today .day-num::before{
    content:'';position:absolute;inset:-3px;
    border:1px solid rgba(255,255,255,.3);
}

.day-events{display:flex;flex-direction:column;gap:2px;min-width:0}

.mini-ev{
    display:flex;align-items:center;gap:5px;
    padding:2px 5px;
    background:color-mix(in srgb,var(--c) 13%,transparent);
    border-left:2px solid var(--c);
    font-size:9.5px;color:#d0d0d0;
    letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;transition:all .12s;
    min-width:0;
    text-transform:uppercase;
}
.mini-ev:hover{background:color-mix(in srgb,var(--c) 22%,transparent);color:#fff}
.mini-ev-time{
    color:color-mix(in srgb,var(--c) 80%,white);
    font-size:8.5px;flex-shrink:0;
    letter-spacing:0;
}
.mini-ev.past{opacity:.55}

.mini-more{
    font-size:8.5px;color:#555;letter-spacing:1.4px;
    padding:2px 5px;
    cursor:pointer;text-transform:uppercase;
    transition:color .13s;
}
.mini-more:hover{color:#fff}

.week-spans{
    position:absolute;
    left:0;right:0;
    top:26px;
    pointer-events:none;
    z-index:2;
}
.span{
    position:absolute;
    height:17px;
    background:var(--c);
    color:#000;
    font-size:9.5px;
    font-weight:500;
    letter-spacing:.5px;
    padding:0 7px;
    display:flex;align-items:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    pointer-events:auto;cursor:pointer;
    text-transform:uppercase;
    opacity:.92;
    transition:opacity .13s;
}
.span:hover{opacity:1}
.span.cont-l{border-top-left-radius:0;border-bottom-left-radius:0}
.span.cont-r{border-top-right-radius:0;border-bottom-right-radius:0}
.span:not(.cont-l):not(.cont-r){border-radius:2px}
.span.cont-l{padding-left:3px}
.span.cont-r{padding-right:3px}
.span .span-title{
    overflow:hidden;text-overflow:ellipsis;
    font-weight:600;
}
.span.past{opacity:.55}

/* ---------- YEAR VIEW ---------- */
.year-view{
    flex:1;overflow-y:auto;
    padding:22px 24px 70px;
}
.year-view::-webkit-scrollbar{width:7px}
.year-view::-webkit-scrollbar-track{background:var(--bg)}
.year-view::-webkit-scrollbar-thumb{background:#181818}
.year-view::-webkit-scrollbar-thumb:hover{background:#282828}

.year-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:22px;
    max-width:1600px;margin-left:auto;margin-right:auto;
}
.year-title-wrap{
    display:flex;align-items:baseline;gap:16px;
    flex-wrap:wrap;
}
.year-big{
    font-size:48px;font-weight:200;color:#fff;
    letter-spacing:6px;line-height:1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 60px rgba(255,255,255,.09);
    display:flex;align-items:baseline;gap:8px;
}
.year-input{
    font-family:inherit;
    font-size:inherit;
    font-weight:inherit;
    color:inherit;
    letter-spacing:inherit;
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    outline:none;
    padding:0 4px 4px;
    width:4.4ch;
    text-align:center;
    font-variant-numeric:tabular-nums;
    transition:border-color .2s,background .2s;
    cursor:text;
    caret-color:#fff;
}
.year-input:hover{border-bottom-color:rgba(255,255,255,.22)}
.year-input:focus{
    border-bottom-color:#fff;
    background:rgba(255,255,255,.05);
}
.year-input.invalid{border-bottom-color:var(--red);color:#ff8a70}

.year-nav-btns{
    display:flex;gap:6px;align-items:center;
    margin-left:8px;
}
.year-nav-btns button{
    background:transparent;border:1px solid var(--line);
    color:#666;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;line-height:1;
    transition:all .15s;
}
.year-nav-btns button:hover{border-color:#fff;color:#fff}

.year-big .small{
    font-size:11px;font-weight:400;color:#555;
    letter-spacing:3px;vertical-align:middle;
}
.year-stats{
    display:flex;gap:22px;flex-wrap:wrap;
}
.year-stat{display:flex;flex-direction:column;gap:4px}
.year-stat-label{
    font-size:8px;color:#444;letter-spacing:2.2px;text-transform:uppercase;
}
.year-stat-value{
    font-size:18px;color:#c0c0c0;font-weight:300;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
}
.year-stat-value b{color:#fff;font-weight:500}

.year-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(228px,1fr));
    gap:16px;
    max-width:1600px;
    margin:0 auto;
}

.year-month{
    background:var(--panel);
    border:1px solid var(--line);
    padding:13px 12px 12px;
    transition:border-color .18s;
    position:relative;
}
.year-month:hover{border-color:var(--line2)}
.year-month.current{
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 0 24px rgba(255,255,255,.03);
}
.year-month-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding-bottom:7px;
    border-bottom:1px solid var(--line);
    margin-bottom:7px;
    cursor:pointer;
    transition:opacity .13s;
}
.year-month-head:hover{opacity:.75}
.year-month-name{
    font-size:10.5px;
    color:#a0a0a0;
    letter-spacing:2.6px;
    text-transform:uppercase;
    font-weight:500;
}
.year-month.current .year-month-name{color:#fff}
.year-month-count{
    font-size:8px;
    color:#3f3f3f;
    letter-spacing:1.4px;
    font-variant-numeric:tabular-nums;
}
.year-month.current .year-month-count{color:#888}

.year-dow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:1px;
    margin-bottom:2px;
}
.year-dow span{
    text-align:center;
    font-size:7.5px;
    color:#363636;
    letter-spacing:.4px;
    padding:2px 0;
    text-transform:uppercase;
}
.year-month.current .year-dow span{color:#555}

.year-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:1px;
}
.year-day{
    position:relative;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:#6a6a6a;
    cursor:pointer;
    transition:all .11s;
    border:1px solid transparent;
    min-width:0;
    font-variant-numeric:tabular-nums;
    user-select:none;
}
.year-day:hover{
    background:rgba(255,255,255,.09);
    color:#fff;
    z-index:1;
}
.year-day.other{
    color:#242424;
    pointer-events:none;
}
.year-day.weekend{color:#4a4a4a}
.year-day.today{
    background:#fff;
    color:#000;
    font-weight:700;
    letter-spacing:0;
}
.year-day.today:hover{
    background:#e6e6e6;
}
.year-day.has-ev::after{
    content:'';
    position:absolute;
    bottom:2px;
    left:50%;
    transform:translateX(-50%);
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(255,255,255,.75);
    pointer-events:none;
}
.year-day.busy::after{
    width:9px;
    height:2px;
    border-radius:1px;
}
.year-day.today.has-ev::after{
    background:#000;
}
.year-day.today.busy::after{
    background:#000;
}

.year-day.busy{ color:#a8a8a8; }
.year-month.current .year-day.busy{color:#c0c0c0}
.year-day.busy.today{color:#000}

/* ---------- TIME GRID ---------- */
.time-view{
    flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.tg-head{
    display:flex;flex-shrink:0;
    border-bottom:1px solid var(--line);
    background:var(--bg);
}
.tg-head-gutter{
    width:66px;flex-shrink:0;
    border-right:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:8px;
    font-size:8px;color:#3a3a3a;letter-spacing:2px;
}
.tg-head-cols{
    flex:1;display:grid;
    grid-template-columns:repeat(var(--n,7),1fr);
    min-width:0;
}
.tg-head-col{
    text-align:center;
    padding:10px 4px 9px;
    border-right:1px solid var(--line);
    min-width:0;
}
.tg-head-col:last-child{border-right:none}
.tg-head-col .dow{
    font-size:9px;color:#4a4a4a;letter-spacing:2.4px;text-transform:uppercase;
    margin-bottom:4px;
}
.tg-head-col .dom{
    font-size:19px;font-weight:300;color:#999;
    letter-spacing:.5px;
    font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;justify-content:center;
    min-width:30px;height:30px;
    transition:all .13s;
}
.tg-head-col.today .dow{color:#fff}
.tg-head-col.today .dom{
    background:#fff;color:#000;font-weight:700;
}

.tg-allday{
    display:flex;flex-shrink:0;
    border-bottom:1px solid var(--line);
    background:var(--panel2);
    min-height:30px;
    max-height:110px;
    overflow-y:auto;
}
.tg-allday::-webkit-scrollbar{width:5px}
.tg-allday::-webkit-scrollbar-thumb{background:#1a1a1a}
.tg-allday-gutter{
    width:66px;flex-shrink:0;
    border-right:1px solid var(--line);
    font-size:7.5px;color:#3a3a3a;letter-spacing:1.6px;
    display:flex;align-items:center;justify-content:center;
    text-transform:uppercase;
    padding:0 4px;text-align:center;
}
.tg-allday-cols{
    flex:1;display:grid;
    grid-template-columns:repeat(var(--n,7),1fr);
    min-width:0;
}
.tg-allday-col{
    border-right:1px solid var(--line);
    padding:3px;
    display:flex;flex-direction:column;gap:2px;
    min-width:0;
}
.tg-allday-col:last-child{border-right:none}
.ad-pill{
    background:var(--c);
    color:#000;
    font-size:9.5px;font-weight:600;
    letter-spacing:.5px;
    padding:3px 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;
    text-transform:uppercase;
    opacity:.92;
}
.ad-pill:hover{opacity:1}

.tg-scroll{
    flex:1;overflow-y:auto;position:relative;
}
.tg-scroll::-webkit-scrollbar{width:7px}
.tg-scroll::-webkit-scrollbar-track{background:var(--bg)}
.tg-scroll::-webkit-scrollbar-thumb{background:#181818}
.tg-scroll::-webkit-scrollbar-thumb:hover{background:#282828}

.tg-body{
    display:flex;position:relative;
    min-height:calc(24 * var(--hour-h));
}
.tg-gutter{
    width:66px;flex-shrink:0;
    border-right:1px solid var(--line);
    position:relative;
}
.tg-gutter .hour-label{
    height:var(--hour-h);
    font-size:9px;color:#3a3a3a;
    letter-spacing:1.4px;
    padding:2px 8px 0 0;
    text-align:right;
    position:relative;
    font-variant-numeric:tabular-nums;
}
.tg-gutter .hour-label::after{
    content:'';
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:5px;height:1px;background:#222;
}

.tg-cols{
    flex:1;display:grid;
    grid-template-columns:repeat(var(--n,7),1fr);
    position:relative;
    min-width:0;
}
.tg-col{
    position:relative;
    border-right:1px solid var(--line);
    min-width:0;
    background-image:repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--hour-h) - 1px),
        var(--line) calc(var(--hour-h) - 1px),
        var(--line) var(--hour-h)
    );
}
.tg-col:last-child{border-right:none}
.tg-col.today{background-color:rgba(255,255,255,.014)}
.tg-col.weekend{background-color:rgba(255,255,255,.008)}

.tg-slot{
    position:absolute;left:0;right:0;
    height:var(--hour-h);
    cursor:pointer;
    transition:background .1s;
    z-index:1;
}
.tg-slot:hover{background:rgba(255,255,255,.03)}

.tg-event{
    position:absolute;
    background:color-mix(in srgb,var(--c) 20%,rgba(0,0,0,.4));
    border-left:3px solid var(--c);
    border-radius:2px;
    padding:3px 6px 3px 8px;
    font-size:10px;color:#e8e8e8;
    letter-spacing:.3px;
    overflow:hidden;
    cursor:pointer;
    z-index:3;
    transition:box-shadow .15s,filter .15s;
    min-height:16px;
    text-overflow:ellipsis;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent);
}
.tg-event:hover{
    box-shadow:inset 0 0 0 1px var(--c),0 3px 12px rgba(0,0,0,.5);
    filter:brightness(1.18);
    z-index:5;
}
.tg-event .te-title{
    font-weight:600;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:1px;
}
.tg-event .te-time{
    font-size:8.5px;color:color-mix(in srgb,var(--c) 65%,white);
    letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;
}
.tg-event .te-loc{
    font-size:8.5px;color:#888;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:2px;
}
.tg-event.short{padding:0 6px 0 8px;display:flex;align-items:center;gap:6px}
.tg-event.short .te-title{margin-bottom:0}
.tg-event.short .te-time,.tg-event.short .te-loc{display:none}
.tg-event.tiny{font-size:9px;padding:0 4px 0 6px}
.tg-event.tiny .te-title{font-size:9px}
.tg-event.past{opacity:.62}

.tg-now{
    position:absolute;left:0;right:0;
    height:1px;
    background:var(--red);
    z-index:4;
    pointer-events:none;
    box-shadow:0 0 8px rgba(255,61,0,.6);
}
.tg-now::before{
    content:'';
    position:absolute;left:-4px;top:-3.5px;
    width:8px;height:8px;border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px rgba(255,61,0,.9);
}

/* ---------- AGENDA VIEW ---------- */
.agenda-view{
    flex:1;overflow-y:auto;
    padding:22px 26px 60px;
}
.agenda-view::-webkit-scrollbar{width:7px}
.agenda-view::-webkit-scrollbar-track{background:var(--bg)}
.agenda-view::-webkit-scrollbar-thumb{background:#181818}

.ag-day{margin-bottom:26px}
.ag-day-head{
    display:flex;align-items:baseline;gap:14px;
    padding:0 0 10px;
    border-bottom:1px solid var(--line);
    margin-bottom:10px;
    position:sticky;top:0;
    background:var(--bg);
    z-index:2;
    padding-top:4px;
}
.ag-day-title{
    font-size:12px;color:#fff;letter-spacing:3px;text-transform:uppercase;
    font-weight:500;
}
.ag-day-sub{
    font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;
}
.ag-day-rel{
    font-size:9px;color:#4a4a4a;letter-spacing:2px;text-transform:uppercase;
    margin-left:auto;
}
.ag-day.today .ag-day-title::before{
    content:'';display:inline-block;width:6px;height:6px;
    background:#fff;margin-right:10px;
    box-shadow:0 0 8px rgba(255,255,255,.5);
    vertical-align:middle;
}

.ag-ev{
    display:grid;
    grid-template-columns:96px 4px 1fr auto;
    gap:14px;align-items:center;
    padding:12px 14px;
    border:1px solid var(--line);
    background:var(--panel);
    margin-bottom:6px;
    cursor:pointer;transition:all .15s;
}
.ag-ev:hover{border-color:var(--line2);background:#0d0d0d;transform:translateX(2px)}
.ag-ev-time{
    font-size:10px;color:#777;letter-spacing:1.4px;
    text-transform:uppercase;font-variant-numeric:tabular-nums;
    text-align:right;
}
.ag-ev-time b{color:#fff;font-weight:500}
.ag-ev-bar{
    width:4px;align-self:stretch;
    background:var(--c);
    min-height:26px;
}
.ag-ev-body{min-width:0}
.ag-ev-title{
    font-size:12px;color:#e0e0e0;letter-spacing:.6px;
    margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ag-ev-meta{
    font-size:9px;color:#555;letter-spacing:1.4px;
    text-transform:uppercase;
    display:flex;gap:10px;flex-wrap:wrap;
    overflow:hidden;
}
.ag-ev-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-ev-desc{
    font-size:10px;color:#666;letter-spacing:.3px;
    margin-top:6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ag-ev-right{display:flex;gap:6px;align-items:center}

.ag-empty{
    text-align:center;padding:70px 30px;
    font-size:10px;color:#2e2e2e;letter-spacing:3px;text-transform:uppercase;
}

/* ============================================================
   MODALS
   ============================================================ */
.overlay{
    position:fixed;inset:0;z-index:3000;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;
    padding:22px;
}
.overlay.open{display:flex}
.modal{
    background:var(--panel);
    border:1px solid var(--line2);
    width:100%;max-width:600px;
    max-height:92vh;
    display:flex;flex-direction:column;
    position:relative;
    animation:modalIn .2s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.corner{position:absolute;width:16px;height:16px;z-index:2;pointer-events:none}
.corner.tl{top:-1px;left:-1px;border-top:2px solid #fff;border-left:2px solid #fff}
.corner.tr{top:-1px;right:-1px;border-top:2px solid #fff;border-right:2px solid #fff}
.corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid #fff;border-left:2px solid #fff}
.corner.br{bottom:-1px;right:-1px;border-bottom:2px solid #fff;border-right:2px solid #fff}
.corner.red{border-color:var(--red)!important}

.modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:15px 20px;border-bottom:1px solid var(--line);
    background:repeating-linear-gradient(45deg,#0a0a0a,#0a0a0a 11px,#080808 11px,#080808 22px);
    flex-shrink:0;
}
.modal-title{
    font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#fff;
    display:flex;align-items:center;gap:10px;min-width:0;
}
.modal-title::before{content:'';width:5px;height:5px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.35);flex-shrink:0}
.modal-title.danger::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.modal-close{
    background:transparent;border:1px solid var(--line3);color:#666;
    width:26px;height:26px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;transition:all .15s;
}
.modal-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{
    padding:20px;overflow-y:auto;flex:1;
}
.modal-body::-webkit-scrollbar{width:5px}
.modal-body::-webkit-scrollbar-thumb{background:#1a1a1a}
.modal-foot{
    display:flex;gap:9px;padding:14px 20px;
    border-top:1px solid var(--line);
    background:var(--bg);flex-shrink:0;flex-wrap:wrap;
}

.btn{
    padding:10px 18px;
    font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    border:1px solid;background:transparent;
    transition:all .18s;white-space:nowrap;
}
.btn.primary{background:#fff;border-color:#fff;color:#000;font-weight:700}
.btn.primary:hover{background:#e6e6e6;box-shadow:0 0 18px rgba(255,255,255,.15)}
.btn.primary:disabled{background:#0a0a0a;color:#444;border-color:var(--line);cursor:not-allowed;box-shadow:none}
.btn.ghost{border-color:var(--line);color:#666}
.btn.ghost:hover{border-color:#666;color:#c0c0c0}
.btn.danger{border-color:rgba(255,61,0,.55);color:var(--red);background:rgba(255,61,0,.06)}
.btn.danger:hover{background:var(--red);color:#000;border-color:var(--red)}
.btn.grow{flex:1;text-align:center}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{
    font-size:8.5px;color:#4a4a4a;letter-spacing:2px;text-transform:uppercase;
}
.input,.select,.textarea{
    width:100%;
    background:var(--bg);border:1px solid var(--line);
    padding:10px 12px;
    font-size:11.5px;color:var(--txt2);letter-spacing:1px;
    outline:none;transition:border-color .18s;
}
.input:focus,.select:focus,.textarea:focus{border-color:#fff}
.input::placeholder,.textarea::placeholder{color:#3a3a3a;text-transform:uppercase;font-size:10px;letter-spacing:1.6px}
.textarea{min-height:80px;resize:vertical;line-height:1.6}
.select{
    cursor:pointer;appearance:none;padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;
    background-size:4px 4px;background-repeat:no-repeat;
}
.hint{font-size:8.5px;color:#3a3a3a;letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}

.title-input{
    width:100%;
    background:transparent;border:none;
    border-bottom:1px solid var(--line);
    padding:6px 0 12px;
    font-size:20px;font-weight:300;color:#fff;
    letter-spacing:1.5px;
    outline:none;
    transition:border-color .2s;
}
.title-input:focus{border-color:#fff}
.title-input::placeholder{color:#2a2a2a;letter-spacing:3px;font-size:16px}

.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{
    width:26px;height:26px;
    border:2px solid transparent;
    background:var(--c);
    cursor:pointer;
    transition:all .15s;
    position:relative;
}
.swatch:hover{transform:scale(1.1)}
.swatch.on{border-color:#fff;box-shadow:0 0 12px var(--c)}

.tag-wrap{
    display:flex;flex-wrap:wrap;gap:5px;
    border:1px solid var(--line);
    background:var(--bg);
    padding:7px 8px;
    min-height:38px;
    transition:border-color .18s;
}
.tag-wrap:focus-within{border-color:#fff}
.tag-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 8px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.16);
    color:#d0d0d0;
    font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;
}
.tag-chip .x{
    cursor:pointer;opacity:.6;
    font-size:11px;line-height:1;
}
.tag-chip .x:hover{opacity:1;color:var(--red)}
.tag-input{
    flex:1;min-width:80px;
    background:transparent;border:none;
    color:var(--txt2);
    font-size:10.5px;letter-spacing:1px;
    outline:none;padding:3px 0;
}
.tag-input::placeholder{color:#3a3a3a;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}

.dt-row{
    display:grid;grid-template-columns:1fr 1fr;
    gap:10px;margin-bottom:12px;
}
.dt-row.single{grid-template-columns:1fr}
.dt-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.dt-field label{font-size:8px;color:#4a4a4a;letter-spacing:2px;text-transform:uppercase}
.dt-field input[type="date"],
.dt-field input[type="time"]{
    background:var(--bg);border:1px solid var(--line);
    color:var(--txt2);padding:9px 10px;
    font-size:11px;letter-spacing:1px;
    outline:none;
    width:100%;
    font-variant-numeric:tabular-nums;
    transition:border-color .18s;
    cursor:pointer;
}
.dt-field input[type="date"]:focus,
.dt-field input[type="time"]:focus{border-color:#fff}
.dt-field input::-webkit-calendar-picker-indicator{
    filter:invert(1) brightness(.5);cursor:pointer;
}
.dt-field input::-webkit-calendar-picker-indicator:hover{filter:invert(1)}

.toggle-row{
    display:flex;align-items:center;gap:12px;
    padding:8px 0;
}
.switch{
    position:relative;
    width:40px;height:22px;
    border:1px solid var(--line2);
    background:var(--bg);
    cursor:pointer;
    transition:all .2s;
    flex-shrink:0;
    padding:0;
}
.switch::after{
    content:'';position:absolute;
    top:3px;left:3px;
    width:14px;height:14px;
    background:#555;
    transition:all .2s;
}
.switch.on{border-color:#fff;background:rgba(255,255,255,.08)}
.switch.on::after{left:21px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}
.toggle-label{
    font-size:10px;color:#888;letter-spacing:1.6px;text-transform:uppercase;
}

.rec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-row .select{flex:1;min-width:110px}
.rec-row .input{flex:0 0 90px}

.dow-pick{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dow-btn{
    background:transparent;border:1px solid var(--line);color:#666;
    width:34px;height:30px;
    font-size:9px;letter-spacing:1px;
    cursor:pointer;transition:all .15s;
    text-transform:uppercase;
}
.dow-btn:hover{border-color:#fff;color:#fff}
.dow-btn.on{background:#fff;border-color:#fff;color:#000;font-weight:700}

.quick-dur{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.qd-btn{
    background:transparent;border:1px solid var(--line);color:#666;
    padding:5px 10px;
    font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;
    cursor:pointer;transition:all .15s;
}
.qd-btn:hover{border-color:#fff;color:#fff}

.fs-title{
    font-size:8.5px;color:#555;letter-spacing:2.6px;text-transform:uppercase;
    padding-bottom:7px;border-bottom:1px solid var(--line);
    margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
}
.fs-title::before{content:'';width:3px;height:9px;background:#fff}

    margin-bottom:16px;

.jump-input:focus{border-color:#fff}

.jump-unit{

.jump-date-input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:300;
    letter-spacing:1.5px;
    padding:4px 0 6px;
    outline:none;
    cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:border-color .2s;

<script>
/* ============================================================
   ATLASTALON CALENDAR
   ============================================================ */
(function(){
'use strict';

/* ------------------------------------------------------------
   UTILITIES
   ------------------------------------------------------------ */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const pad = (n,l=2) => String(Math.abs(Math.floor(n))).padStart(l,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'ID') + '-' + Date.now().toString(36).toUpperCase() +
    '-' + Math.random().toString(36).slice(2,6).toUpperCase();
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const MS_DAY = 86400000;
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfDay   = d => { const x = new Date(d); x.setHours(23,59,59,999); return x; };
const startOfWeek = (d, ws=1) => {
    const x = startOfDay(d);
    const diff = (x.getDay() - ws + 7) % 7;
    x.setDate(x.getDate() - diff);
    return x;
};
const startOfMonth = d => { const x = startOfDay(d); x.setDate(1); return x; };
const addDays  = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths= (d,n) => { const x = new Date(d); x.setMonth(x.getMonth()+n); return x; };
const sameDay  = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dayDiff  = (a,b) => Math.round((startOfDay(a) - startOfDay(b)) / MS_DAY);

const toDateStr = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const toTimeStr = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const fromDateTime = (dateStr, timeStr) => {
    const [y,m,dd] = dateStr.split('-').map(Number);
    const [hh,mm] = (timeStr || '00:00').split(':').map(Number);
    return new Date(y, m-1, dd, hh, mm, 0, 0);
};

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_LONG  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_MINI  = ['S','M','T','W','T','F','S'];

function fmtTime(d, h24) {
    if (!h24) {
        const h = d.getHours();
        const ap = h < 12 ? 'AM' : 'PM';
        let hh = h % 12; if (hh === 0) hh = 12;
        return hh + ':' + pad(d.getMinutes()) + ' ' + ap;
    }
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function fmtDateLong(d) {
    return DAYS_LONG[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function fmtDur(min) {
    if (min < 60) return min + ' MIN';
    const h = Math.floor(min/60), m = min%60;
    if (m === 0) return h + ' HR';
    return h + 'H ' + m + 'M';
}

function relDayLabel(d) {
    const today = startOfDay(new Date());
    const diff = dayDiff(d, today);
    if (diff === 0) return 'TODAY';
    if (diff === 1) return 'TOMORROW';
    if (diff === -1) return 'YESTERDAY';
    if (diff > 0 && diff < 7) return 'IN ' + diff + ' DAYS';
    if (diff < 0 && diff > -7) return Math.abs(diff) + ' DAYS AGO';
    return '';
}

/* ------------------------------------------------------------
   CONSTANTS
   ------------------------------------------------------------ */
const HOUR_H = 48;
const QUARTER = 15;

const PALETTE = [
    { id:'blue',   hex:'#007AFF' },
    { id:'green',  hex:'#34C759' },
    { id:'yellow', hex:'#FFD60A' },
    { id:'red',    hex:'#FF3D00' },
    { id:'purple', hex:'#BF5AF2' },
    { id:'orange', hex:'#FF9500' },
    { id:'pink',   hex:'#FF2D55' },
    { id:'teal',   hex:'#5AC8FA' },
    { id:'gray',   hex:'#8E8E93' }
];

const RECURRENCE_FREQS = [
    { value:'none',    label:'Does not repeat' },
    { value:'daily',   label:'Daily' },
    { value:'weekly',  label:'Weekly' },
    { value:'monthly', label:'Monthly' },
    { value:'yearly',  label:'Yearly' }
];

const REMINDERS = [
    { value:0,    label:'At time of event' },
    { value:5,    label:'5 minutes before' },
    { value:10,   label:'10 minutes before' },
    { value:15,   label:'15 minutes before' },
    { value:30,   label:'30 minutes before' },
    { value:60,   label:'1 hour before' },
    { value:120,  label:'2 hours before' },
    { value:1440, label:'1 day before' },
    { value:2880, label:'2 days before' }
];

/* ------------------------------------------------------------
   STATE
   ------------------------------------------------------------ */
const LS_KEY = 'atlastalon_calendar_v1';

const DEFAULT_CALENDARS = [
    { id:'cal-personal',  name:'PERSONAL',  color:'#007AFF', visible:true },
    { id:'cal-work',      name:'WORK',      color:'#34C759', visible:true },
    { id:'cal-important', name:'IMPORTANT', color:'#FFD60A', visible:true },
    { id:'cal-birthdays', name:'BIRTHDAYS', color:'#BF5AF2', visible:true }
];

const DEFAULT_STATE = {
    calendars: DEFAULT_CALENDARS.map(c => ({...c})),
    events: [],
    h24: true,
    weekStart: 1,
    seeded: false
};

let state = loadState();

function loadState() {
    try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const p = JSON.parse(raw);
        const s = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), p);
        s.calendars = (s.calendars && s.calendars.length) ? s.calendars : DEFAULT_CALENDARS.map(c=>({...c}));
        s.events = s.events || [];
        return s;
    } catch(e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
}

let saveTimer = null;
function saveState(immediate) {
    if (saveTimer) clearTimeout(saveTimer);
    const doSave = () => {
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
    };
    if (immediate) doSave();
    else saveTimer = setTimeout(doSave, 220);
}

let viewDate = new Date();
let viewMode = 'month';
let searchQuery = '';

/* ------------------------------------------------------------
   TOASTS
   ------------------------------------------------------------ */
function toast(type, title, msg, dur) {
    const wrap = $('#toastWrap');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML =
        '<div class="toast-title">' + esc(title) + '</div>' +
        '<div class="toast-msg">' + esc(msg) + '</div>';
    wrap.appendChild(el);
    setTimeout(() => {
        el.classList.add('out');
        setTimeout(() => el.remove(), 240);
    }, dur || 3000);
}

/* ------------------------------------------------------------
   RECURRENCE ENGINE
   ------------------------------------------------------------ */
function getOccurrences(rangeStart, rangeEnd) {
    const out = [];
    const visCals = state.calendars.filter(c => c.visible).map(c => c.id);
    if (!visCals.length) return out;
    const visSet = new Set(visCals);

    const q = searchQuery.trim().toLowerCase();

    state.events.forEach(ev => {
        if (!visSet.has(ev.calendarId)) return;
        if (q) {
            const hay = (ev.title + ' ' + (ev.description||'') + ' ' +
                (ev.location||'') + ' ' + (ev.tags||[]).join(' ')).toLowerCase();
            if (!hay.includes(q)) return;
        }

        const baseStart = new Date(ev.start);
        const baseEnd   = new Date(ev.end);
        const dur = Math.max(60000, baseEnd - baseStart);
        const rec = ev.recurrence || { freq:'none' };
        const freq = rec.freq || 'none';

        /* Exceptions skip this occurrence */
        const isExcepted = (startMs) => {
            if (!ev.exceptions || !ev.exceptions.length) return false;
            return ev.exceptions.some(iso => new Date(iso).getTime() === startMs);
        };

        if (freq === 'none') {
            if (baseEnd >= rangeStart && baseStart <= rangeEnd) {
                if (isExcepted(baseStart.getTime())) return;
                out.push({ ev, start: baseStart, end: baseEnd, occKey: ev.id });
            }
            return;
        }

        const interval = Math.max(1, rec.interval || 1);
        const until = rec.until ? endOfDay(new Date(rec.until)) : null;
        const countLimit = rec.count || null;

        if (freq === 'weekly' && rec.byDay && rec.byDay.length) {
            const bySet = new Set(rec.byDay.map(Number));
            let cursor = startOfWeek(baseStart, state.weekStart);
            let n = 0, iter = 0;
            const guard = 4000;
            let done = false;

            while (!done && iter++ < guard) {
                for (let d = 0; d < 7; d++) {
                    const day = addDays(cursor, d);
                    if (!bySet.has(day.getDay())) continue;
                    const occStart = new Date(day);
                    occStart.setHours(baseStart.getHours(), baseStart.getMinutes(), 0, 0);
                    if (occStart < baseStart) continue;
                    if (until && occStart > until) { done = true; break; }
                    if (countLimit && n >= countLimit) { done = true; break; }
                    if (occStart > rangeEnd) { done = true; break; }

                    const occEnd = new Date(occStart.getTime() + dur);
                    if (occEnd >= rangeStart && !isExcepted(occStart.getTime())) {
                        out.push({ ev, start: occStart, end: occEnd, occKey: ev.id + '@' + occStart.getTime() });
                    }
                    n++;
                }
                cursor = addDays(cursor, 7 * interval);
                if (cursor > rangeEnd && !countLimit && !until) break;
            }
            return;
        }

        let cursor = new Date(baseStart);
        let n = 0, iter = 0;
        const guard = 4000;

        while (iter++ < guard) {
            if (until && cursor > until) break;
            if (countLimit && n >= countLimit) break;
            if (cursor > rangeEnd) break;

            const occEnd = new Date(cursor.getTime() + dur);
            if (occEnd >= rangeStart && cursor <= rangeEnd && !isExcepted(cursor.getTime())) {
                out.push({ ev, start: new Date(cursor), end: occEnd, occKey: ev.id + '@' + cursor.getTime() });
            }
            n++;

            switch (freq) {
                case 'daily':   cursor = addDays(cursor, interval); break;
                case 'weekly':  cursor = addDays(cursor, 7*interval); break;
                case 'monthly': {
                    const day = cursor.getDate();
                    cursor = addMonths(cursor, interval);
                    if (cursor.getDate() !== day) cursor.setDate(0);
                    break;
                }
                case 'yearly': {
                    cursor = new Date(cursor);
                    cursor.setFullYear(cursor.getFullYear() + interval);
                    break;
                }
                default: iter = guard + 1;
            }
        }
    });

    out.sort((a,b) => a.start - b.start || a.end - b.end);
    return out;
}

/* ------------------------------------------------------------
   COLOR HELPERS
   ------------------------------------------------------------ */
function calendarById(id) { return state.calendars.find(c => c.id === id) || null; }
function colorOf(ev) {
    if (ev.color) return ev.color;
    const c = calendarById(ev.calendarId);
    return c ? c.color : '#8E8E93';
}

function eventWhenText(ev) {
    const s = new Date(ev.start);
    const e = new Date(ev.end);
    if (ev.allDay) {
        if (sameDay(s,e)) return fmtDateLong(s) + ' · ALL DAY';
        return fmtDateLong(s) + ' → ' + fmtDateLong(e) + ' · ALL DAY';
    }
    if (sameDay(s,e)) {
        return fmtDateLong(s) + ' · ' + fmtTime(s, state.h24) + ' – ' + fmtTime(e, state.h24);
    }
    return fmtDateLong(s) + ' ' + fmtTime(s, state.h24) + ' → ' +
           fmtDateLong(e) + ' ' + fmtTime(e, state.h24);
}

function recurText(rec) {
    if (!rec || !rec.freq || rec.freq === 'none') return 'Does not repeat';
    const interval = rec.interval || 1;
    const base = { daily:'day', weekly:'week', monthly:'month', yearly:'year' }[rec.freq] || rec.freq;
    let s = interval === 1 ? 'Every ' + base : 'Every ' + interval + ' ' + base + 's';
    if (rec.freq === 'weekly' && rec.byDay && rec.byDay.length) {
        s += ' on ' + rec.byDay.map(d => DAYS_SHORT[d].slice(0,3).toUpperCase()).join(', ');
    }
    if (rec.until) s += ' until ' + toDateStr(new Date(rec.until));
    else if (rec.count) s += ', ' + rec.count + ' times';
    return s;
}

/* ------------------------------------------------------------
   SIDEBAR
   ------------------------------------------------------------ */
function renderSidebar() {
    renderMini();
    renderCalList();
    renderUpcoming();
}

function renderMini() {
    const y = viewDate.getFullYear();
    const m = viewDate.getMonth();
    $('#miniTitle').textContent = MONTHS_SHORT[m].toUpperCase() + ' ' + y;

    const grid = $('#miniGrid');
    let html = '';
    for (let i = 0; i < 7; i++) {
        const dow = (i + state.weekStart) % 7;
        html += '<div class="mini-dow">' + DAYS_MINI[dow] + '</div>';
    }

    const first = startOfMonth(viewDate);
    const gridStart = startOfWeek(first, state.weekStart);
    const today = startOfDay(new Date());

    const rangeS = startOfDay(gridStart);
    const rangeE = endOfDay(addDays(gridStart, 41));
    const occs = getOccurrences(rangeS, rangeE);
    const evDays = new Set();
    occs.forEach(o => {
        let cur = startOfDay(o.start);
        const endD = startOfDay(o.ev.allDay ? addDays(o.end, -1) : o.end);
        while (cur <= endD) { evDays.add(toDateStr(cur)); cur = addDays(cur, 1); }
    });

    for (let i = 0; i < 42; i++) {
        const d = addDays(gridStart, i);
        const isOther = d.getMonth() !== m;
        const isToday = sameDay(d, today);
        const isSel = sameDay(d, viewDate);
        const hasEv = evDays.has(toDateStr(d));
        const cls = ['mini-day',
            isOther ? 'other' : '',
            isToday ? 'today' : '',
            isSel ? 'selected' : '',
            hasEv ? 'has-ev' : ''
        ].filter(Boolean).join(' ');
        html += '<div class="' + cls + '" data-date="' + toDateStr(d) + '">' + d.getDate() + '</div>';
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.mini-day').forEach(el => {
        el.addEventListener('click', () => {
            const [yy,mm,dd] = el.dataset.date.split('-').map(Number);
            viewDate = new Date(yy, mm-1, dd);
            render();
        });
    });
}

function renderCalList() {
    const wrap = $('#calList');
    const activeCounts = {};
    state.events.forEach(ev => {
        activeCounts[ev.calendarId] = (activeCounts[ev.calendarId] || 0) + 1;
    });

    wrap.innerHTML = state.calendars.map(c =>
        '<div class="cal-item ' + (c.visible ? '' : 'hidden') + '" data-cal="' + c.id + '">' +
            '<span class="cal-check" style="--c:' + c.color + '">' +
                (c.visible ? '✓' : '') + '</span>' +
            '<span class="cal-name">' + esc(c.name) + '</span>' +
            '<span class="cal-count">' + (activeCounts[c.id] || 0) + '</span>' +
        '</div>'
    ).join('');

    wrap.querySelectorAll('.cal-item').forEach(el => {
        el.addEventListener('click', e => {
            const id = el.dataset.cal;
            const c = calendarById(id);
            if (!c) return;
            if (e.altKey || e.shiftKey) { openCalendarEditor(id); return; }
            c.visible = !c.visible;
            saveState();
            render();
        });
        el.addEventListener('contextmenu', e => {
            e.preventDefault();
            openCalendarEditor(el.dataset.cal);
        });
    });
}

function renderUpcoming() {
    const wrap = $('#upcomingList');
    const now = new Date();
    const rangeS = now;
    const rangeE = endOfDay(addDays(now, 30));
    const occs = getOccurrences(rangeS, rangeE);

    const seen = new Set();
    const list = [];
    occs.forEach(o => {
        if (seen.has(o.occKey)) return;
        seen.add(o.occKey);
        if (o.end < now) return;
        list.push(o);
    });
    list.sort((a,b) => a.start - b.start);

    const top = list.slice(0, 6);

    if (!top.length) {
        wrap.innerHTML = '<div class="up-empty">NOTHING SCHEDULED</div>';
        return;
    }

    wrap.innerHTML = top.map(o => {
        const c = colorOf(o.ev);
        const isToday = sameDay(o.start, now);
        const timeStr = o.ev.allDay ? 'ALL DAY' :
            (isToday ? fmtTime(o.start, state.h24) :
             DAYS_SHORT[o.start.getDay()] + ' ' + fmtTime(o.start, state.h24));
        return '<div class="up-item" style="--c:' + c + '" data-ev="' + o.ev.id + '">' +
            '<div class="up-title">' + esc(o.ev.title) + '</div>' +
            '<div class="up-meta">' + esc(timeStr) + '</div>' +
        '</div>';
    }).join('');

    wrap.querySelectorAll('.up-item').forEach(el => {
        el.addEventListener('click', () => openEventDetail(el.dataset.ev));
    });
}
