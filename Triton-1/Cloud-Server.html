/* ---- thumbnail hydration ---- */
const thumbCache = new Map();
async function hydrateThumbnails() {
    const targets = $$('[data-thumb]');
    for (const el of targets) {
        const id = el.dataset.thumb;
        const f = state.files.find(x => x.id === id);
        if (!f) continue;
        if (typeOf(f.name) !== 'image') continue;

        try {
            let url = thumbCache.get(id);
            if (!url) {
                const rec = await idbGet('thumb_' + id);
                if (rec) {
                    url = URL.createObjectURL(new Blob([rec.data], { type: 'image/jpeg' }));
                    thumbCache.set(id, url);
                }
            }
            if (url && el.isConnected) {
                el.innerHTML = '<img src="' + url + '" alt="" loading="lazy" />';
            }
        } catch (e) { /* ignore */ }
    }

    // Row icons for images
    const rowTargets = $$('[data-rowthumb]');
    for (const el of rowTargets) {
        const id = el.dataset.rowthumb;
        const f = state.files.find(x => x.id === id);
        if (!f || typeOf(f.name) !== 'image') continue;
        try {
            let url = thumbCache.get(id);
            if (!url) {
                const rec = await idbGet('thumb_' + id);
                if (rec) {
                    url = URL.createObjectURL(new Blob([rec.data], { type: 'image/jpeg' }));
                    thumbCache.set(id, url);
                }
            }
            if (url && el.isConnected) el.innerHTML = '<img src="' + url + '" alt="" />';
        } catch (e) {}
    }
}

/* ------------------------------------------------------------
   CONTENT EVENT BINDING
   ------------------------------------------------------------ */
function bindContentEvents() {
    const content = $('#content');

    // Row / card clicks
    content.querySelectorAll('.card, .row').forEach(el => {
        el.addEventListener('click', e => {
            if (e.target.closest('[data-star]') || e.target.closest('[data-more]')) return;
            const kind = el.dataset.kind;
            const id = el.dataset.id;

            if (e.ctrlKey || e.metaKey) {
                toggleSelect(kind, id);
                render();
            } else {
                clearSelection();
                toggleSelect(kind, id);
                render();
            }
        });

        el.addEventListener('dblclick', e => {
            if (e.target.closest('[data-star]') || e.target.closest('[data-more]')) return;
            const kind = el.dataset.kind;
            const id = el.dataset.id;
            if (kind === 'folder') openFolder(id);
            else openPreview(id);
        });

        el.addEventListener('contextmenu', e => {
            e.preventDefault();
            e.stopPropagation();
            const kind = el.dataset.kind;
            const id = el.dataset.id;
            if (!isSelected(kind, id)) {
                clearSelection();
                toggleSelect(kind, id);
                render();
            }
            openContextMenu(e.clientX, e.clientY, kind, id);
        });
    });

    // Star buttons
    content.querySelectorAll('[data-star]').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            toggleStar(btn.dataset.star, btn.dataset.id);
        });
    });

    // More buttons
    content.querySelectorAll('[data-more]').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            const r = btn.getBoundingClientRect();
            openContextMenu(r.left, r.bottom + 4, btn.dataset.more, btn.dataset.id);
        });
    });

    // Sort headers
    content.querySelectorAll('[data-sort]').forEach(el => {
        el.addEventListener('click', () => {
            const k = el.dataset.sort;
            if (state.sortKey === k) {
                state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortKey = k;
                state.sortDir = 'asc';
            }
            saveState();
            render();
        });
    });

    // Empty-state upload
    const eu = $('#emptyUploadBtn');
    if (eu) eu.addEventListener('click', () => $('#fileInput').click());
}

function bindTrashButtons() {
    const rAll = $('#restoreAllBtn');
    if (rAll) rAll.addEventListener('click', restoreAll);

    const eAll = $('#emptyTrashBtn');
    if (eAll) eAll.addEventListener('click', confirmEmptyTrash);
}

function updateStatusBar(view) {
    const total = view.folders.length + view.files.length;
    $('#statusItems').textContent = total + ' ITEM' + (total === 1 ? '' : 'S');
    const n = selection.size;
    $('#statusSel').textContent = n ? n + ' SELECTED' : '';
    $('#bulkBar').classList.toggle('show', n > 0);
    $('#bulkCount').textContent = n;
}

/* ------------------------------------------------------------
   ACTIONS
   ------------------------------------------------------------ */
function openFolder(id) {
    if (state.section === 'trash') return;
    clearSelection();
    state.section = 'folder';
    state.currentFolder = id;
    state.typeFilter = null;
    searchQuery = '';
    $('#searchInput').value = '';
    $('#searchClear').style.display = 'none';
    saveState();
    render();
}

function toggleStar(kind, id) {
    if (kind === 'file') {
        const f = state.files.find(x => x.id === id);
        if (!f) return;
        f.starred = !f.starred;
        f.modifiedAt = f.modifiedAt || f.createdAt;
        toast(f.starred ? 'success' : 'warn',
              f.starred ? 'STARRED' : 'UNSTARRED', f.name);
    } else {
        const d = state.folders.find(x => x.id === id);
        if (!d) return;
        d.starred = !d.starred;
        toast(d.starred ? 'success' : 'warn',
              d.starred ? 'STARRED' : 'UNSTARRED', d.name);
    }
    saveState();
    render();
    renderSidebar();
}

function moveToTrash() {
    const items = selectedItems();
    if (!items.length) return;
    const now = Date.now();
    let n = 0;

    items.forEach(({ kind, item }) => {
        if (kind === 'file') {
            if (!item.trashed) {
                item.trashed = true;
                item.trashedAt = now;
                item.prevFolderId = item.folderId;
                n++;
            }
        } else {
            if (!item.trashed) {
                item.trashed = true;
                item.trashedAt = now;
                item.prevParentId = item.parentId;
                // Cascade to descendants
                const stack = [item.id];
                while (stack.length) {
                    const cur = stack.pop();
                    state.folders.forEach(f => {
                        if (f.parentId === cur && !f.trashed) {
                            f.trashed = true;
                            f.trashedAt = now;
                            f.prevParentId = f.parentId;
                            stack.push(f.id);
                        }
                    });
                    state.files.forEach(f => {
                        if (f.folderId === cur && !f.trashed) {
                            f.trashed = true;
                            f.trashedAt = now;
                            f.prevFolderId = f.folderId;
                        }
                    });
                }
                n++;
            }
        }
    });

    clearSelection();
    saveState(true);
    render();
    renderSidebar();
    toast('warn', 'MOVED TO TRASH', n + ' ITEM' + (n === 1 ? '' : 'S') + ' CAN BE RESTORED');
}

function restoreAll() {
    const now = Date.now();
    let n = 0;

    state.files.forEach(f => {
        if (f.trashed) {
            f.trashed = false;
            delete f.trashedAt;
            f.folderId = f.prevFolderId || 'root';
            delete f.prevFolderId;
            n++;
        }
    });
    state.folders.forEach(f => {
        if (f.trashed) {
            f.trashed = false;
            delete f.trashedAt;
            f.parentId = f.prevParentId || 'root';
            delete f.prevParentId;
            n++;
        }
    });

    saveState(true);
    render();
    renderSidebar();
    toast('success', 'RESTORED', n + ' ITEM' + (n === 1 ? '' : 'S') + ' RETURNED TO DRIVE');
}

function confirmEmptyTrash() {
    const files = state.files.filter(f => f.trashed);
    const folders = state.folders.filter(f => f.trashed);
    if (!files.length && !folders.length) {
        toast('info', 'TRASH EMPTY', 'Nothing to purge');
        return;
    }

    openModal({
        title: 'PURGE TRASH',
        danger: true,
        body: '<p class="confirm-msg">Permanently destroy <b>' +
              (files.length + folders.length) + ' item' +
              ((files.length + folders.length) === 1 ? '' : 's') +
              '</b>? All stored data will be irrecoverably erased from AtlasTalon servers.</p>',
        buttons: [
            { label: 'CANCEL', cls: 'ghost', action: closeModal },
            { label: 'PURGE FOREVER', cls: 'danger', action: () => { emptyTrash(); closeModal(); } }
        ]
    });
}

async function emptyTrash() {
    const files = state.files.filter(f => f.trashed);
    let n = 0;

    for (const f of files) {
        try {
            await idbDelete(f.id);
            await idbDelete('thumb_' + f.id);
            const u = urlCache.get(f.id);
            if (u) { URL.revokeObjectURL(u); urlCache.delete(f.id); }
            const t = thumbCache.get(f.id);
            if (t) { URL.revokeObjectURL(t); thumbCache.delete(f.id); }
            n++;
        } catch (e) {}
    }

    state.files = state.files.filter(f => !f.trashed);
    state.folders = state.folders.filter(f => !f.trashed);

    clearSelection();
    saveState(true);
    render();
    renderSidebar();
    toast('warn', 'TRASH PURGED', n + ' FILE' + (n === 1 ? '' : 'S') + ' PERMANENTLY ERASED');
}

async function deleteForever(kind, id) {
    if (kind === 'file') {
        const f = state.files.find(x => x.id === id);
        if (!f) return;
        try {
            await idbDelete(id);
            await idbDelete('thumb_' + id);
            const u = urlCache.get(id);
            if (u) { URL.revokeObjectURL(u); urlCache.delete(id); }
            const t = thumbCache.get(id);
            if (t) { URL.revokeObjectURL(t); thumbCache.delete(id); }
        } catch (e) {}
        state.files = state.files.filter(x => x.id !== id);
    } else {
        state.folders = state.folders.filter(x => x.id !== id);
        // Orphan children move to root
        state.folders.forEach(f => { if (f.parentId === id) f.parentId = 'root'; });
        state.files.forEach(f => { if (f.folderId === id) f.folderId = 'root'; });
    }
    saveState(true);
    render();
    renderSidebar();
}

async function restoreItem(kind, id) {
    if (kind === 'file') {
        const f = state.files.find(x => x.id === id);
        if (!f) return;
        f.trashed = false;
        f.folderId = f.prevFolderId || 'root';
        delete f.prevFolderId;
        delete f.trashedAt;
    } else {
        const d = state.folders.find(x => x.id === id);
        if (!d) return;
        d.trashed = false;
        d.parentId = d.prevParentId || 'root';
        delete d.prevParentId;
        delete d.trashedAt;

        // Restore descendants that were trashed at the same time
        const stack = [d.id];
        while (stack.length) {
            const cur = stack.pop();
            state.folders.forEach(f => {
                if (f.parentId === cur && f.trashed && f.trashedAt === d.trashedAt) {
                    f.trashed = false;
                    f.parentId = f.prevParentId || 'root';
                    delete f.prevParentId;
                    delete f.trashedAt;
                    stack.push(f.id);
                }
            });
            state.files.forEach(f => {
                if (f.folderId === cur && f.trashed && f.trashedAt === d.trashedAt) {
                    f.trashed = false;
                    f.folderId = f.prevFolderId || 'root';
                    delete f.prevFolderId;
                    delete f.trashedAt;
                }
            });
        }
    }
    saveState(true);
    render();
    renderSidebar();
    toast('success', 'RESTORED', 'Item returned to My Drive');
}

async function downloadFile(fileId) {
    const f = state.files.find(x => x.id === fileId);
    if (!f) return;
    try {
        const rec = await idbGet(fileId);
        if (!rec) { toast('error', 'FILE MISSING', 'Stored data not found'); return; }
        const blob = new Blob([rec.data], { type: rec.type || 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = f.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast('success', 'EXPORT COMPLETE', f.name + ' · ' + fmtBytes(f.size));
    } catch (e) {
        toast('error', 'EXPORT FAILED', 'Could not read stored data');
    }
}

function renameItem(kind, id) {
    const item = kind === 'file'
        ? state.files.find(x => x.id === id)
        : state.folders.find(x => x.id === id);
    if (!item) return;

    openModal({
        title: 'RENAME ' + (kind === 'file' ? 'FILE' : 'FOLDER'),
        body:
            '<div class="field"><label>Current name</label>' +
            '<input class="input" value="' + esc(item.name) + '" disabled style="opacity:.5" /></div>' +
            '<div class="field"><label>New name</label>' +
            '<input class="input" id="renameInput" value="' + esc(item.name) + '" /></div>' +
            '<div class="hint">PRESS ENTER TO CONFIRM · ESC TO CANCEL</div>',
        buttons: [
            { label: 'CANCEL', cls: 'ghost', action: closeModal },
            { label: 'RENAME', cls: 'primary', action: () => {
                const v = ($('#renameInput').value || '').trim();
                if (!v) { toast('error', 'INVALID NAME', 'Name cannot be empty'); return; }
                item.name = v;
                item.modifiedAt = Date.now();
                saveState(true);
                closeModal();
                render();
                toast('success', 'RENAMED', 'Now: ' + v);
            }}
        ]
    });

    setTimeout(() => {
        const inp = $('#renameInput');
        if (inp) {
            inp.focus();

   ------------------------------------------------------------ */
function moveItems() {
    const items = selectedItems();
    if (!items.length) return;

    const movableIds = new Set(items.map(i => i.item.id));
    const folders = allActiveFolders();

    const rowsHTML = (parentId, depth) => {
        let html = '';
        folders
            .filter(f => (f.parentId || 'root') === parentId)
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(f => {
                if (movableIds.has(f.id)) return;
                html += '<div class="fp-item" data-fp="' + f.id + '" style="padding-left:' + (13 + depth * 16) + 'px">' +
                    '<span class="fp-ico">▪</span>' +
                    '<span>' + esc(f.name) + '</span>' +
                    '<span class="fp-path">' + esc(folderPathLabel(f.id)) + '</span>' +
                '</div>';
                html += rowsHTML(f.id, depth + 1);
            });
        return html;
    };

    openModal({
        title: 'MOVE ' + items.length + ' ITEM' + (items.length === 1 ? '' : 'S'),
        body:
            '<div class="field"><label>Destination</label>' +
            '<div class="folder-pick" id="folderPick">' +
                '<div class="fp-item sel" data-fp="root">' +
                    '<span class="fp-ico">▤</span><span>MY DRIVE</span>' +
                    '<span class="fp-path">ROOT</span>' +
                '</div>' +
                rowsHTML('root', 0) +
            '</div></div>' +
            '<div class="hint">SELECT A DESTINATION FOLDER</div>',
        buttons: [
            { label: 'CANCEL', cls: 'ghost', action: closeModal },
            { label: 'MOVE HERE', cls: 'primary', action: () => {
                const sel = $('#folderPick .fp-item.sel');
                const dest = sel ? sel.dataset.fp : 'root';
                let n = 0;
                items.forEach(({ kind, item }) => {
                    if (kind === 'file') { item.folderId = dest; item.modifiedAt = Date.now(); n++; }
                    else { if (item.id !== dest) { item.parentId = dest; n++; } }
                });
                saveState(true);
                closeModal();
                clearSelection();
                render();
                renderSidebar();
                toast('success', 'MOVED', n + ' ITEM' + (n === 1 ? '' : 'S') + ' → ' + folderPathLabel(dest));
            }}
        ]
    });

    setTimeout(() => {
        const pick = $('#folderPick');
        if (!pick) return;
        pick.querySelectorAll('.fp-item').forEach(el => {
            el.addEventListener('click', () => {
                pick.querySelectorAll('.fp-item').forEach(x => x.classList.remove('sel'));
                el.classList.add('sel');
            });
        });
    }, 60);
}

function detailsPanelHTML(item, kind) {
    const isFile = kind === 'file';
    const info = isFile ? infoOf(item.name) : TYPE_INFO.folder;
    const path = isFile
        ? folderPathLabel(item.folderId || 'root')
        : folderPathLabel(item.parentId || 'root');

    const rows = [
        ['NAME', item.name],
        ['TYPE', isFile ? (extOf(item.name) || 'FILE').toUpperCase() + ' · ' + info.label : 'FOLDER'],
        ['SIZE', isFile ? fmtBytes(item.size) : (childrenOf(item.id).files.length + childrenOf(item.id).folders.length) + ' ITEMS'],
        ['OWNER', item.owner || state.userName],
        ['LOCATION', path],
        ['CREATED', fmtDate(item.createdAt)],
        ['MODIFIED', isFile ? fmtDate(item.modifiedAt || item.createdAt) : fmtDate(item.createdAt)],
        ['ACCESS', item.shared ? 'SHARED' : 'PRIVATE'],
        ['ID', item.id]
    ];

    if (isFile && item.duration) {
        rows.splice(3, 0, ['DURATION', fmtDuration(item.duration)]);
    }

    return '<div class="detail-sec">' +
        '<div class="detail-sec-title">METADATA</div>' +
        rows.map(([k, v]) =>
            '<div class="detail-row">' +
                '<span class="detail-k">' + esc(k) + '</span>' +
                '<span class="detail-v mono">' + esc(v) + '</span>' +
            '</div>'
        ).join('') +
    '</div>' +
    '<div class="detail-sec">' +
        '<div class="detail-sec-title">TAGS</div>' +
        '<div class="detail-tags">' +
            ((item.tags || []).length
                ? item.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('')
                : '<span style="font-size:9px;color:#3a3a3a;letter-spacing:1.6px">NO TAGS</span>') +
        '</div>' +
        '<div style="margin-top:12px">' +
            '<input class="input" id="tagInput" placeholder="ADD TAG + ENTER" style="font-size:10px" />' +
        '</div>' +
    '</div>' +
    '<div class="detail-sec">' +
        '<div class="detail-sec-title">NOTES</div>' +
        '<textarea class="textarea" id="descInput" placeholder="DESCRIPTION…" style="min-height:70px;font-size:10.5px">' +
            esc(item.description || '') +
        '</textarea>' +
    '</div>' +
    '<div class="detail-sec">' +
        '<div class="detail-sec-title">ACTIONS</div>' +
        '<div style="display:flex;flex-direction:column;gap:7px">' +
            (isFile ? '<button class="btn ghost" data-act="download" style="text-align:left">↓ EXPORT FILE</button>' : '') +
            '<button class="btn ghost" data-act="share" style="text-align:left">⇄ SHARE</button>' +
            '<button class="btn ghost" data-act="rename" style="text-align:left">✎ RENAME</button>' +
            '<button class="btn ghost" data-act="move" style="text-align:left">⇱ MOVE</button>' +
        '</div>' +
    '</div>';
}

function fmtDuration(sec) {
    if (!sec || isNaN(sec)) return '—';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(s);
    return pad(m) + ':' + pad(s);
}

/* ------------------------------------------------------------
   PREVIEW
   ------------------------------------------------------------ */
let previewFileId = null;

async function openPreview(fileId) {
    const f = state.files.find(x => x.id === fileId);
    if (!f) return;

    previewFileId = fileId;
    $('#previewTitle').textContent = 'PREVIEW · ' + f.name;
    $('#previewStage').innerHTML =
        '<div class="preview-none"><div class="big">◌</div>DECRYPTING…</div>';
    $('#previewDetail').innerHTML = detailsPanelHTML(f, 'file');
    bindDetailPanel('file', f);

    $('#previewOverlay').classList.add('open');

    const type = typeOf(f.name);
    const stage = $('#previewStage');

    if (!isPreviewable(f.name)) {
        stage.innerHTML =
            '<div class="preview-none">' +
                '<div class="big">' + esc(infoOf(f.name).glyph) + '</div>' +
                'NO INLINE PREVIEW AVAILABLE<br><br>' +
                '<span style="color:#2a2a2a">USE EXPORT TO DOWNLOAD THIS FILE</span>' +
            '</div>';
        return;
    }

    try {
        const rec = await idbGet(fileId);
        if (!rec) {
            stage.innerHTML = '<div class="preview-none"><div class="big">✕</div>STORED DATA NOT FOUND</div>';
            return;
        }

        const mime = rec.type || 'application/octet-stream';
        const blob = new Blob([rec.data], { type: mime });

        if (type === 'image') {
            const url = URL.createObjectURL(blob);
            stage.innerHTML = '<img src="' + url + '" alt="" />';
            stage.dataset.tempUrl = url;

        } else if (type === 'video') {
            const url = URL.createObjectURL(blob);
            stage.innerHTML = '<video src="' + url + '" controls autoplay playsinline></video>';
            stage.dataset.tempUrl = url;

        } else if (type === 'audio') {
            const url = URL.createObjectURL(blob);
            const bars = Array.from({ length: 44 }, (_, i) =>
                '<i style="animation-delay:' + (i * 0.045).toFixed(2) + 's"></i>').join('');
            stage.innerHTML =
                '<div class="audio-stage">' +
                    '<div class="audio-vis">' + bars + '</div>' +
                    '<div style="font-size:11px;color:#666;letter-spacing:2px;margin-bottom:18px;text-transform:uppercase">' +
                        esc(f.name) +
                    '</div>' +
                    '<audio src="' + url + '" controls autoplay></audio>' +
                '</div>';
            stage.dataset.tempUrl = url;

        } else if (type === 'pdf') {
            const url = URL.createObjectURL(blob);
            stage.innerHTML = '<iframe src="' + url + '" title="PDF"></iframe>';
            stage.dataset.tempUrl = url;

        } else if (type === 'text' || type === 'code') {
            const text = await blob.text();
            const clipped = text.length > 200000
                ? text.slice(0, 200000) + '\n\n… FILE TRUNCATED FOR PREVIEW (' + fmtBytes(blob.size) + ' TOTAL)'
                : text;
            stage.innerHTML = '<pre class="preview-pre">' + esc(clipped) + '</pre>';
        }
    } catch (e) {
        console.error(e);
        stage.innerHTML = '<div class="preview-none"><div class="big">✕</div>PREVIEW FAILED</div>';
    }
}

function closePreview() {
    const stage = $('#previewStage');
    // revoke temp object URLs
    if (stage.dataset.tempUrl) {
        URL.revokeObjectURL(stage.dataset.tempUrl);
        delete stage.dataset.tempUrl;
    }
    // Stop any playing media
    const media = stage.querySelector('video, audio');
    if (media) { try { media.pause(); } catch (e) {} }

    stage.innerHTML = '';
    $('#previewOverlay').classList.remove('open');
    $('#previewDetail').classList.remove('show');
    previewFileId = null;
}

function bindDetailPanel(kind, item) {
    const panel = $('#previewDetail');

    // Tag input
    const tagInput = panel.querySelector('#tagInput');
    if (tagInput) {
        tagInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const v = tagInput.value.trim().toUpperCase();
                if (!v) return;
                item.tags = item.tags || [];
                if (!item.tags.includes(v)) item.tags.push(v);
                saveState(true);
                panel.innerHTML = detailsPanelHTML(item, kind);
                bindDetailPanel(kind, item);
                render();
                toast('success', 'TAG ADDED', v);
            }
        });
    }

    // Description
    const desc = panel.querySelector('#descInput');
    if (desc) {
        desc.addEventListener('change', () => {
            item.description = desc.value.trim();
            saveState(true);
            toast('success', 'NOTES SAVED', 'Description updated');
        });
    }

    // Actions
    panel.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
            const act = btn.dataset.act;
            closePreview();
            setTimeout(() => {
                if (act === 'download') downloadFile(item.id);
                else if (act === 'share') shareItem(kind, item.id);
                else if (act === 'rename') renameItem(kind, item.id);
                else if (act === 'move') {
                    clearSelection();
                    toggleSelect(kind, item.id);
                    render();
                    moveItems();
                }
            }, 120);
        });
    });

    // Click tags to remove
    panel.querySelectorAll('.detail-tags .tag').forEach(t => {
        t.style.cursor = 'pointer';
        t.title = 'Click to remove';
        t.addEventListener('click', () => {
            const v = t.textContent.trim();
            item.tags = (item.tags || []).filter(x => x !== v);
            saveState(true);
            panel.innerHTML = detailsPanelHTML(item, kind);
            bindDetailPanel(kind, item);
            render();
            toast('warn', 'TAG REMOVED', v);
        });
    });
}

/* ------------------------------------------------------------
   UPLOAD
   ------------------------------------------------------------ */
const uploads = [];
let uploadTrayVisible = false;

function renderUploadTray() {
    const tray = $('#uploadTray');
    const list = $('#uploadList');

    if (!uploads.length) {
        tray.classList.remove('show');
        uploadTrayVisible = false;
        return;
    }

    tray.classList.add('show');
    uploadTrayVisible = true;

    const done = uploads.filter(u => u.status === 'done').length;
    const active = uploads.filter(u => u.status === 'uploading').length;
    $('#uploadTitle').textContent = active
        ? 'TRANSFERRING · ' + active + ' ACTIVE'
        : 'TRANSFERS · ' + done + ' COMPLETE';

    list.innerHTML = uploads.map(u => {
        const pct = Math.round(u.progress * 100);
        const cls = u.status === 'done' ? 'done' : u.status === 'error' ? 'error' : '';
        return '<div class="upload-item ' + cls + '">' +
            '<div class="upload-item-top">' +
                '<span class="upload-name">' + esc(u.name) + '</span>' +
                '<span class="upload-pct">' +
                    (u.status === 'done' ? 'DONE' : u.status === 'error' ? 'FAILED' : pct + '%') +
                '</span>' +
            '</div>' +
            '<div class="upload-track"><div class="upload-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
    }).join('');
}

function fileToThumbnail(file) {
    return new Promise(resolve => {
        if (!file.type.startsWith('image/')) return resolve(null);
        const url = URL.createObjectURL(file);
        const img = new Image();
        const cleanup = () => URL.revokeObjectURL(url);

        img.onload = () => {
            try {
                const MAX = 320;
                let w = img.width, h = img.height;
                const scale = Math.min(MAX / w, MAX / h, 1);
                w = Math.max(1, Math.round(w * scale));
                h = Math.max(1, Math.round(h * scale));

                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                c.toBlob(b => { cleanup(); resolve(b); }, 'image/jpeg', 0.68);
            } catch (e) {
                cleanup();
                resolve(null);
            }
        };
        img.onerror = () => { cleanup(); resolve(null); };
        img.src = url;
    });
}

function readWithProgress(file, onProgress) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onprogress = e => {
            if (e.lengthComputable) onProgress(e.loaded / e.total);
        };
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('read failed'));
        reader.readAsArrayBuffer(file);
    });
}

async function handleFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    const destFolder = (state.section === 'folder') ? state.currentFolder : 'root';

    // Quota check
    const incoming = files.reduce((a, f) => a + f.size, 0);
    if (usedBytes() + incoming > QUOTA_BYTES) {
        toast('error', 'STORAGE QUOTA EXCEEDED',
              'Not enough space. ' + fmtBytes(QUOTA_BYTES - usedBytes()) + ' remaining.');
        return;
    }

    const batch = files.map(f => ({
        id: uid('UP'),
        name: f.name,
        size: f.size,
        progress: 0,
        status: 'queued'
    }));
    uploads.push(...batch);
    renderUploadTray();

    let okCount = 0;
    let totalBytes = 0;

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const tracker = batch[i];
        tracker.status = 'uploading';
        renderUploadTray();

        try {
            const buffer = await readWithProgress(file, p => {
                tracker.progress = Math.min(0.94, p * 0.94);
                renderUploadTray();
            });

            const fileId = uid('FIL');
            const mime = file.type || 'application/octet-stream';

            await idbPut(fileId, buffer, mime);
            tracker.progress = 0.96;
            renderUploadTray();

            // Generate thumbnail for images
            let hasThumb = false;
            if (file.type.startsWith('image/')) {
                const thumb = await fileToThumbnail(file);
                if (thumb) {
                    await idbPut('thumb_' + fileId, thumb, 'image/jpeg');
                    hasThumb = true;
                }
            }
            tracker.progress = 1;

            const record = {
                id: fileId,
                name: file.name,
                size: file.size,
                mime,
                folderId: destFolder,
                owner: state.userName,
                createdAt: Date.now(),
                modifiedAt: Date.now(),
                starred: false,
                shared: false,
                trashed: false,
                tags: [],
                description: '',
                hasThumb
            };

            state.files.push(record);
            tracker.status = 'done';
            okCount++;
            totalBytes += file.size;
            renderUploadTray();

        } catch (e) {
            console.error(e);
            tracker.status = 'error';
            tracker.progress = 1;
            renderUploadTray();
        }
    }

    saveState(true);
    render();
    renderSidebar();

    if (okCount) {
        toast('success', 'UPLOAD COMPLETE',
              okCount + ' FILE' + (okCount === 1 ? '' : 'S') + ' · ' + fmtBytes(totalBytes) +
              ' → ' + folderPathLabel(destFolder));
    }
    if (okCount < files.length) {
        toast('error', 'PARTIAL FAILURE',
              (files.length - okCount) + ' FILE' + ((files.length - okCount) === 1 ? '' : 'S') + ' FAILED');
    }

    // Auto-hide tray after a while
    setTimeout(() => {
        const stillActive = uploads.some(u => u.status === 'uploading');
        if (!stillActive) {
            uploads.length = 0;
            renderUploadTray();
        }
    }, 4200);
}

        html += '<div class="ctx-label">' + esc(item.name).slice(0, 30) + '</div>';

    if (inTrash) {
        html +=
            '<button class="ctx-item" data-cmd="restore"><span class="ci">↺</span>RESTORE</button>' +
            '<div class="ctx-sep"></div>' +
            '<button class="ctx-item danger" data-cmd="purge"><span class="ci">✕</span>DELETE FOREVER</button>';
    } else {
        if (!multi && isFile) {
            html += '<button class="ctx-item" data-cmd="open"><span class="ci">◉</span>OPEN PREVIEW</button>';
        }
        if (!multi && !isFile) {
            html += '<button class="ctx-item" data-cmd="openfolder"><span class="ci">▸</span>OPEN FOLDER</button>';
        }
        if (!multi && isFile) {
            html += '<button class="ctx-item" data-cmd="download"><span class="ci">↓</span>EXPORT FILE</button>';
        }
        html +=
            '<div class="ctx-sep"></div>' +
            '<button class="ctx-item" data-cmd="star"><span class="ci">★</span>' +
                (multi ? 'STAR ALL' : (item.starred ? 'UNSTAR' : 'STAR')) + '</button>' +
            '<button class="ctx-item" data-cmd="share"><span class="ci">⇄</span>SHARE</button>' +
            '<button class="ctx-item" data-cmd="rename"><span class="ci">✎</span>RENAME</button>' +
            '<button class="ctx-item" data-cmd="move"><span class="ci">⇱</span>MOVE TO…</button>' +
            '<div class="ctx-sep"></div>' +
            '<button class="ctx-item" data-cmd="copyid"><span class="ci">⌗</span>COPY ID</button>' +
            '<div class="ctx-sep"></div>' +
            '<button class="ctx-item danger" data-cmd="trash"><span class="ci">⌫</span>MOVE TO TRASH</button>';
    }

    menu.innerHTML = html;
    menu.classList.add('open');

    // Position with viewport clamping
    const mw = menu.offsetWidth || 200;
    const mh = menu.offsetHeight || 240;
    const px = Math.min(x, window.innerWidth - mw - 10);
    const py = Math.min(y, window.innerHeight - mh - 10);
    menu.style.left = Math.max(6, px) + 'px';
    menu.style.top = Math.max(6, py) + 'px';

    menu.querySelectorAll('[data-cmd]').forEach(btn => {
        btn.addEventListener('click', () => {
            const cmd = btn.dataset.cmd;
            menu.classList.remove('open');
            runContextCommand(cmd, kind, id);
        });
    });
}

function closeContextMenu() {
    $('#ctxMenu').classList.remove('open');
}

function runContextCommand(cmd, kind, id) {
    const items = selectedItems();

    switch (cmd) {
        case 'open':
            openPreview(id);
            break;
        case 'openfolder':
            openFolder(id);
            break;
        case 'download':
            downloadFile(id);
            break;
        case 'star':
            if (items.length > 1) {
                const allStarred = items.every(({ item }) => item.starred);
                items.forEach(({ kind: k, item }) => {
                    item.starred = !allStarred;
                });
                saveState(true);
                render();
                renderSidebar();
                toast(allStarred ? 'warn' : 'success',
                      allStarred ? 'UNSTARRED ALL' : 'STARRED ALL',
                      items.length + ' ITEMS');
            } else {
                toggleStar(kind, id);
            }
            break;
        case 'share':
            shareItem(kind, id);
            break;
        case 'rename':
            renameItem(kind, id);
            break;
        case 'move':
            moveItems();
            break;
        case 'copyid':
            try {
                navigator.clipboard.writeText(id).then(
                    () => toast('success', 'ID COPIED', id),
                    () => toast('info', 'ID', id)
                );
            } catch (e) { toast('info', 'ID', id); }
            break;
        case 'trash':
            moveToTrash();
            break;
        case 'restore':
            items.forEach(({ kind: k, item }) => restoreItem(k, item.id));
            clearSelection();
            break;
        case 'purge':
            openModal({
                title: 'DELETE FOREVER',
                danger: true,
                body: '<p class="confirm-msg">Permanently destroy <b>' + items.length + ' item' +
                      (items.length === 1 ? '' : 's') + '</b>? This cannot be undone.</p>',
                buttons: [
                    { label: 'CANCEL', cls: 'ghost', action: closeModal },
                    { label: 'DELETE FOREVER', cls: 'danger', action: async () => {
                        for (const { kind: k, item } of items) {
                            await deleteForever(k, item.id);
                        }
                        clearSelection();
                        closeModal();
                        render();
                        renderSidebar();
                        toast('warn', 'PERMANENTLY DELETED', items.length + ' ITEM' + (items.length === 1 ? '' : 'S'));
                    }}
                ]
            });
            break;
    }
}

// Drag & drop
let dragDepth = 0;
const dropzone = $('#dropzone');

window.addEventListener('dragenter', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    const target = (state.section === 'folder')
        ? folderPathLabel(state.currentFolder)
        : 'MY DRIVE';
    $('#dropTarget').textContent = target.toUpperCase();
    dropzone.classList.add('show');
});

    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
});

window.addEventListener('dragleave', e => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropzone.classList.remove('show');
});

window.addEventListener('drop', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('show');
    if (e.dataTransfer.files && e.dataTransfer.files.length) {
        handleFiles(e.dataTransfer.files);
    }
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';

    if (e.key === 'Escape') {
        if ($('#previewOverlay').classList.contains('open')) { closePreview(); return; }
        if ($('#modalOverlay').classList.contains('open')) { closeModal(); return; }
        closeContextMenu();
        if (selection.size) { clearSelection(); render(); }
        return;
    }

    if (typing) return;

    if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        $('#searchInput').focus();
        return;
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        const view = resolveView();
        clearSelection();
        view.folders.forEach(f => toggleSelect('folder', f.id));
        view.files.forEach(f => toggleSelect('file', f.id));
        render();
        return;
    }

    if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selection.size) {
            e.preventDefault();
            if (state.section === 'trash') $('#bulkTrash').click();
            else moveToTrash();
        }
        return;
    }

    if (e.key === 'Enter' && selection.size === 1) {
        const { kind, item } = selectedItems()[0];
        if (kind === 'folder') openFolder(item.id);
        else openPreview(item.id);
        return;
    }

    if (e.key.toLowerCase() === 'u' && !e.ctrlKey && !e.metaKey) {
        $('#fileInput').click();
        return;
    }

    if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey) {
        createFolder();
        return;
    }
});

function createTextFile() {
    const parentId = (state.section === 'folder') ? state.currentFolder : 'root';
    openModal({
        title: 'NEW TEXT FILE',
        body:
            '<div class="field"><label>File name</label>' +
            '<input class="input" id="tfName" placeholder="NOTES.TXT" value="untitled.txt" /></div>' +
            '<div class="field"><label>Content</label>' +
            '<textarea class="textarea" id="tfBody" style="min-height:180px" placeholder="START TYPING…"></textarea></div>' +
            '<div class="hint">SAVED TO: ' + esc(folderPathLabel(parentId)) + '</div>',
        buttons: [
            { label: 'CANCEL', cls: 'ghost', action: closeModal },
            { label: 'CREATE FILE', cls: 'primary', action: async () => {
                let name = ($('#tfName').value || '').trim() || 'untitled.txt';
                if (!extOf(name)) name += '.txt';
                const content = $('#tfBody').value || '';

                const blob = new Blob([content], { type: 'text/plain' });
                const buffer = await blob.arrayBuffer();
                const fileId = uid('FIL');

                try {
                    await idbPut(fileId, buffer, 'text/plain');
                    state.files.push({
                        id: fileId,
                        name,
                        size: blob.size,
                        mime: 'text/plain',
                        folderId: parentId,
                        owner: state.userName,
                        createdAt: Date.now(),
                        modifiedAt: Date.now(),
                        starred: false,
                        shared: false,
                        trashed: false,
                        tags: ['NOTE'],
                        description: ''
                    });
                    saveState(true);
                    closeModal();
                    render();
                    renderSidebar();
                    toast('success', 'FILE CREATED', name + ' · ' + fmtBytes(blob.size));
                } catch (err) {
                    toast('error', 'CREATE FAILED', 'Could not store file');
                }
            }}
        ]
    });

    setTimeout(() => {
        const inp = $('#tfName');
        if (inp) { inp.focus(); inp.select(); }
    }, 60);
}

/* ------------------------------------------------------------
   AUTO-PURGE TRASH (30 DAYS)
   ------------------------------------------------------------ */
async function autoPurgeTrash() {
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    const expired = state.files.filter(f => f.trashed && f.trashedAt && f.trashedAt < cutoff);
    if (!expired.length) return;

    for (const f of expired) {
        try { await idbDelete(f.id); await idbDelete('thumb_' + f.id); } catch (e) {}
    }
    state.files = state.files.filter(f => !(f.trashed && f.trashedAt && f.trashedAt < cutoff));
    saveState(true);
    toast('info', 'AUTO-PURGE', expired.length + ' EXPIRED ITEM' + (expired.length === 1 ? '' : 'S') + ' REMOVED');
}

        { name:'roadmap-2026.txt', folderId:'folder-eng', mime:'text/plain',
          body:'ATLASTALON PRODUCT ROADMAP — 2026\n' +
               '=================================\n\n' +
               'H1\n--\n' +
               '- End-to-end encryption for all storage tiers\n' +
               '- Native desktop sync client (macOS, Windows, Linux)\n' +
               '- Granular audit log with export\n\n' +
               'H2\n--\n' +
               '- Real-time collaborative editing\n' +
               '- Third-party SSO (Okta, Azure AD)\n' +
               '- Retention policy engine\n\n' +
               'BACKLOG\n-------\n' +
               '- Mobile offline mode\n' +
               '- Custom metadata schemas\n' +
               '- Client-side deduplication\n',
          tags:['ENGINEERING','PLANNING'] }
    ];

    for (const sf of seedFiles) {
        const fileId = uid('FIL');
        const blob = new Blob([sf.body], { type: sf.mime });
        const buf = await blob.arrayBuffer();
        try {
            await idbPut(fileId, buf, sf.mime);
        } catch (e) { continue; }

        state.files.push({
            id: fileId,
            name: sf.name,
            size: blob.size,
            mime: sf.mime,
            folderId: sf.folderId,
            owner: state.userName,
            createdAt: now - Math.floor(Math.random() * 25) * day,
            modifiedAt: now - Math.floor(Math.random() * 10) * day,
            starred: false,
            shared: Math.random() > 0.7,
            trashed: false,
            tags: sf.tags || [],
            description: ''
        });
    }

    saveState(true);
}

/* ------------------------------------------------------------
   BOOT
   ------------------------------------------------------------ */
async function boot() {
    try {
        await openDB();
    } catch (e) {
        toast('error', 'STORAGE UNAVAILABLE', 'IndexedDB blocked — files will not persist');
    }

    await seed();
    await autoPurgeTrash();

    render();

    setTimeout(() => {
        toast('success', 'ATLASTALON ONLINE',
              'Secure storage initialized · ' + state.files.filter(f => !f.trashed).length + ' FILES INDEXED', 3800);
    }, 420);
}

boot();

})();
</script>
