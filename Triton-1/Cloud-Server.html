<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AtlasTalon · Secure Cloud Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
    --bg:#050505;
    --panel:#0a0a0a;
    --panel2:#070707;
    --line:#1a1a1a;
    --line2:#2a2a2a;
    --line3:#333;
    --txt:#e0e0e0;
    --txt2:#c0c0c0;
    --dim:#666;
    --dim2:#444;
    --dim3:#333;
    --white:#ffffff;
    --green:#34C759;
    --blue:#007AFF;
    --yellow:#FFD60A;
    --red:#FF3D00;
    --purple:#BF5AF2;
    --gray:#8E8E93;
    color-scheme:dark;
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden}
body{
    font-family:'IBM Plex Mono',monospace;
    color:var(--txt);
    font-size:12px;
    -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color-scheme:dark}
button{cursor:pointer}

/* ============================================================
   BACKGROUND FX
   ============================================================ */
body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center,black 30%,transparent 92%);
    -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 92%);
}
body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 3px);
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
    position:relative;z-index:2;
    height:100vh;display:flex;overflow:hidden;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
    width:246px;flex-shrink:0;
    background:var(--bg);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:margin-left .22s ease;
}
.sidebar-brand{
    display:flex;align-items:center;gap:13px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
}
.logo{
    width:38px;height:38px;flex-shrink:0;
    border:1px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
    position:relative;background:rgba(255,255,255,.04);
}
.logo::before{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,.15)}
.logo::after{
    content:'';position:absolute;top:-3px;right:-3px;width:6px;height:6px;
    background:#fff;box-shadow:0 0 8px rgba(255,255,255,.3);
    animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.logo-text{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;position:relative;z-index:1}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-title{font-size:13px;font-weight:700;letter-spacing:3.5px;color:var(--txt);white-space:nowrap}
.brand-sub{font-size:8px;color:#555;letter-spacing:2px;margin-top:3px;white-space:nowrap}

.side-new{
    padding:14px 14px 12px;flex-shrink:0;
}
.new-btn{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:#fff;border:1px solid #fff;color:#000;
    padding:11px 14px;
    font-size:10px;letter-spacing:2.5px;font-weight:700;
    text-transform:uppercase;
    transition:all .2s;
}
.new-btn:hover{background:#e6e6e6;box-shadow:0 0 0 1px #fff,0 0 22px rgba(255,255,255,.16)}
.new-btn .plus{font-size:14px;line-height:1;font-weight:400}

.side-scroll{flex:1;overflow-y:auto;padding-bottom:10px}
.side-scroll::-webkit-scrollbar{width:5px}
.side-scroll::-webkit-scrollbar-track{background:var(--bg)}
.side-scroll::-webkit-scrollbar-thumb{background:#1a1a1a}
.side-scroll::-webkit-scrollbar-thumb:hover{background:#2a2a2a}

.nav-group{padding:8px 0}
.nav-title{
    font-size:8px;color:#3a3a3a;letter-spacing:2.5px;text-transform:uppercase;
    padding:8px 20px 6px;
}
.nav-item{
    width:100%;
    display:flex;align-items:center;gap:11px;
    padding:9px 18px;
    background:transparent;border:none;border-left:2px solid transparent;
    color:var(--dim);
    font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;
    transition:all .16s;
    text-align:left;
    position:relative;
}
.nav-item:hover{color:#bbb;background:rgba(255,255,255,.022)}
.nav-item.active{
    color:#fff;background:rgba(255,255,255,.05);
    border-left-color:#fff;
}
.nav-item .ico{width:15px;text-align:center;font-size:12px;flex-shrink:0;opacity:.85}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{
    font-size:8.5px;color:#555;
    padding:1px 6px;border:1px solid var(--line);background:var(--panel);
    letter-spacing:1px;
}
.nav-item.active .cnt{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06)}

.side-storage{
    flex-shrink:0;
    padding:14px 18px 16px;
    border-top:1px solid var(--line);
}
.storage-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:8.5px;letter-spacing:2px;text-transform:uppercase;
    color:#555;margin-bottom:9px;
}
.storage-head b{color:#fff;font-weight:500}
.storage-bar{
    height:5px;background:#111;border:1px solid var(--line);
    position:relative;overflow:hidden;
}
.storage-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:#fff;box-shadow:0 0 10px rgba(255,255,255,.4);
    transition:width .4s ease,background .3s;
}
.storage-fill.warn{background:var(--yellow);box-shadow:0 0 10px rgba(255,214,10,.4)}
.storage-fill.crit{background:var(--red);box-shadow:0 0 10px rgba(255,61,0,.45)}
.storage-meta{
    display:flex;justify-content:space-between;
    font-size:8px;color:#3a3a3a;letter-spacing:1.5px;
    text-transform:uppercase;margin-top:8px;
}

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main{
    flex:1;min-width:0;
    display:flex;flex-direction:column;
    overflow:hidden;
}

/* ---------- TOPBAR ---------- */
.topbar{
    flex-shrink:0;
    height:56px;
    display:flex;align-items:center;gap:14px;
    padding:0 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:relative;z-index:20;
}
.hamburger{
    display:none;
    background:transparent;border:1px solid var(--line);color:var(--dim);
    width:34px;height:34px;font-size:14px;line-height:1;
    align-items:center;justify-content:center;
}
.hamburger:hover{border-color:#fff;color:#fff}

.search-wrap{
    flex:1;max-width:520px;
    display:flex;align-items:center;
    border:1px solid var(--line);background:var(--panel);
    transition:border-color .2s;
}
.search-wrap:focus-within{border-color:#fff}
.search-ico{padding:0 11px;color:#3a3a3a;font-size:11px}
.search-input{
    flex:1;min-width:0;
    background:transparent;border:none;outline:none;
    padding:9px 0;
    font-size:11px;letter-spacing:1px;color:var(--txt2);
}
.search-input::placeholder{color:#3f3f3f;text-transform:uppercase;letter-spacing:1.6px;font-size:10px}
.search-clear{
    background:transparent;border:none;color:#444;
    padding:0 11px;font-size:13px;line-height:1;
}
.search-clear:hover{color:var(--red)}

.topbar-spacer{flex:1}

.top-chip{
    display:flex;align-items:center;gap:6px;
    padding:5px 10px;border:1px solid var(--line);background:var(--panel);
    font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:#555;
    white-space:nowrap;
}
.dot{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.35)}
.dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.yellow{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}

.icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    padding:9px 13px;font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;
    transition:all .2s;white-space:nowrap;
}
.icon-btn:hover{border-color:#fff;color:#fff}
.icon-btn.on{border-color:#fff;color:#fff;background:rgba(255,255,255,.06)}

.user-chip{
    display:flex;align-items:center;gap:9px;
    padding:5px 5px 5px 12px;
    border:1px solid var(--line);background:var(--panel);
    transition:border-color .2s;
}
.user-chip:hover{border-color:var(--line2)}
.user-meta{display:flex;flex-direction:column;line-height:1.25}
.user-name{font-size:10px;color:var(--txt);letter-spacing:1.4px;font-weight:500}
.user-role{font-size:7.5px;color:#4a4a4a;letter-spacing:1.6px;text-transform:uppercase}
.avatar{
    width:28px;height:28px;flex-shrink:0;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;color:#fff;letter-spacing:1px;
}

/* ---------- CRUMBS ---------- */
.crumbs-bar{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:11px 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:relative;z-index:12;
    flex-wrap:wrap;
}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crumb{
    background:transparent;border:none;padding:3px 2px;
    color:#555;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    transition:color .16s;
    white-space:nowrap;
}
.crumb:hover{color:#fff}
.crumb.here{color:#fff}
.crumb-sep{color:#2e2e2e;font-size:10px}

.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tool-btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    padding:7px 11px;font-size:9px;letter-spacing:1.7px;text-transform:uppercase;
    transition:all .18s;display:flex;align-items:center;gap:6px;
    white-space:nowrap;
}
.tool-btn:hover{border-color:#fff;color:#fff}
.tool-btn.active{border-color:#fff;color:#fff;background:rgba(255,255,255,.06)}
.view-toggle{display:flex;border:1px solid var(--line)}
.view-toggle .tool-btn{border:none;border-right:1px solid var(--line)}
.view-toggle .tool-btn:last-child{border-right:none}

/* ---------- BULK BAR ---------- */
.bulk-bar{
    display:none;
    flex-shrink:0;
    align-items:center;gap:14px;
    padding:10px 20px;
    background:rgba(255,255,255,.045);
    border-bottom:1px solid var(--line);
    position:relative;z-index:11;
    flex-wrap:wrap;
}
.bulk-bar.show{display:flex;animation:slideDown .2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.bulk-count{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#fff}
.bulk-count b{color:var(--white);font-weight:700}
.bulk-actions{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}

/* ---------- CONTENT ---------- */
.content{
    flex:1;overflow-y:auto;
    position:relative;z-index:5;
    padding:18px 20px 60px;
}
.content::-webkit-scrollbar{width:7px}
.content::-webkit-scrollbar-track{background:var(--bg)}
.content::-webkit-scrollbar-thumb{background:#181818}
.content::-webkit-scrollbar-thumb:hover{background:#282828}

.section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:16px;
}
.section-title{
    font-size:10.5px;color:#555;letter-spacing:3px;text-transform:uppercase;
    display:flex;align-items:center;gap:10px;
}
.section-title::before{content:'';width:4px;height:12px;background:#fff}
.section-meta{font-size:9px;color:#3f3f3f;letter-spacing:2px;text-transform:uppercase}
.section-meta b{color:#888;font-weight:400}

/* ---------- GRID ---------- */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(176px,1fr));
    gap:14px;
}
.card{
    background:var(--panel);
    border:1px solid var(--line);
    position:relative;overflow:hidden;
    transition:border-color .18s,transform .18s,background .18s;
    cursor:pointer;
    user-select:none;
}
.card:hover{border-color:var(--line2);transform:translateY(-1px);background:#0c0c0c}
.card.sel{border-color:#fff;background:rgba(255,255,255,.055)}
.card.sel::after{
    content:'';position:absolute;top:0;right:0;
    width:0;height:0;border-top:14px solid #fff;border-left:14px solid transparent;
}
.card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
    background:var(--accent,transparent);opacity:.9;
}

.card-thumb{
    height:112px;
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);
    background:
        linear-gradient(135deg,rgba(255,255,255,.018) 0%,transparent 60%),
        #070707;
    position:relative;overflow:hidden;
}
.card-thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
}
.thumb-box{
    width:54px;height:54px;
    border:1px solid var(--c,#2a2a2a);
    background:color-mix(in srgb,var(--c,#2a2a2a) 10%,transparent);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;letter-spacing:1px;
    color:var(--c,#888);
    position:relative;
}
.thumb-box::before{
    content:'';position:absolute;inset:3px;
    border:1px solid color-mix(in srgb,var(--c,#2a2a2a) 22%,transparent);
}
.thumb-box.folder{
    width:60px;height:46px;border-radius:0;
    background:color-mix(in srgb,var(--c,#007AFF) 9%,transparent);
}
.thumb-box.folder::after{
    content:'';position:absolute;top:-8px;left:-1px;
    width:24px;height:8px;
    border:1px solid var(--c,#007AFF);
    border-bottom:none;
    background:color-mix(in srgb,var(--c,#007AFF) 13%,transparent);
}

.card-star{
    position:absolute;top:7px;right:7px;z-index:2;
    background:rgba(0,0,0,.6);border:1px solid var(--line);
    color:#3a3a3a;width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;
    transition:all .16s;opacity:0;
}
.card:hover .card-star,.card-star.on{opacity:1}
.card-star:hover{border-color:var(--yellow);color:var(--yellow)}
.card-star.on{color:var(--yellow);border-color:rgba(255,214,10,.4);background:rgba(255,214,10,.09)}

.card-more{
    position:absolute;top:7px;left:7px;z-index:2;
    background:rgba(0,0,0,.6);border:1px solid var(--line);
    color:#555;width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;line-height:1;letter-spacing:1px;
    opacity:0;transition:all .16s;
}
.card:hover .card-more{opacity:1}
.card-more:hover{border-color:#fff;color:#fff}

.card-body{padding:11px 12px 10px}
.card-name{
    font-size:11px;color:var(--txt);letter-spacing:.6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    margin-bottom:6px;
}
.card-sub{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:8.5px;color:#484848;letter-spacing:1.4px;text-transform:uppercase;
}
.card-sub .sz{color:#5c5c5c;flex-shrink:0}

/* ---------- LIST ---------- */
.list{display:flex;flex-direction:column;gap:3px}
.list-head{
    display:grid;
    grid-template-columns:minmax(180px,3fr) 130px 130px 90px 92px;
    gap:12px;
    padding:0 14px 8px;
    font-size:8px;color:#3a3a3a;letter-spacing:2px;text-transform:uppercase;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
}
.list-head span{cursor:pointer;transition:color .16s;user-select:none}
.list-head span:hover{color:#888}
.list-head span.sorted{color:#fff}
.list-head span.sorted::after{content:' ▾';font-size:7px}
.list-head span.sorted.asc::after{content:' ▴'}

.row{
    display:grid;
    grid-template-columns:minmax(180px,3fr) 130px 130px 90px 92px;
    gap:12px;align-items:center;
    padding:9px 14px;
    background:var(--panel);
    border:1px solid transparent;
    border-left:2px solid var(--accent,transparent);
    cursor:pointer;
    transition:background .14s,border-color .14s;
    user-select:none;
}
.row:hover{background:#0d0d0d;border-color:var(--line)}
.row.sel{background:rgba(255,255,255,.06);border-color:var(--line2);border-left-color:#fff}
.row-name{display:flex;align-items:center;gap:11px;min-width:0}
.row-ico{
    width:30px;height:30px;flex-shrink:0;
    border:1px solid var(--c,#2a2a2a);
    background:color-mix(in srgb,var(--c,#2a2a2a) 10%,transparent);
    display:flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;color:var(--c,#888);letter-spacing:.5px;
    overflow:hidden;
}
.row-ico img{width:100%;height:100%;object-fit:cover}
.row-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{
    font-size:11px;color:var(--txt);letter-spacing:.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-tags{display:flex;gap:4px;flex-wrap:wrap}
.row-cell{
    font-size:9.5px;color:#5a5a5a;letter-spacing:1.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-transform:uppercase;
}
.row-actions{display:flex;gap:5px;justify-content:flex-end;opacity:0;transition:opacity .16s}
.row:hover .row-actions,.row.sel .row-actions{opacity:1}
.mini-btn{
    background:transparent;border:1px solid var(--line);color:#555;
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;
    transition:all .15s;
}
.mini-btn:hover{border-color:#fff;color:#fff}
.mini-btn.star.on{color:var(--yellow);border-color:rgba(255,214,10,.4)}
.mini-btn.danger:hover{border-color:var(--red);color:var(--red)}

.tag{
    display:inline-flex;align-items:center;
    padding:2px 6px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.16);
    color:#c8c8c8;
    font-size:7.5px;letter-spacing:1.2px;text-transform:uppercase;
    white-space:nowrap;
}
.tag.green{color:var(--green);border-color:rgba(52,199,89,.3);background:rgba(52,199,89,.07)}
.tag.blue{color:var(--blue);border-color:rgba(0,122,255,.3);background:rgba(0,122,255,.07)}
.tag.yellow{color:var(--yellow);border-color:rgba(255,214,10,.3);background:rgba(255,214,10,.07)}
.tag.red{color:var(--red);border-color:rgba(255,61,0,.32);background:rgba(255,61,0,.08)}

/* ---------- EMPTY ---------- */
.empty{
    padding:84px 30px;text-align:center;
}
.empty-icon{
    width:84px;height:84px;margin:0 auto 22px;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    position:relative;
}
.empty-icon::before{
    content:'';position:absolute;inset:14px;
    border:1px solid #222;
}
.empty-icon::after{
    content:'';width:20px;height:20px;
    border:1px solid #333;
    border-top-color:#555;
}
.empty-title{
    font-size:11px;color:#5a5a5a;letter-spacing:3px;
    text-transform:uppercase;margin-bottom:8px;
}
.empty-sub{
    font-size:9px;color:#3a3a3a;letter-spacing:2px;
    text-transform:uppercase;margin-bottom:24px;
}

/* ---------- DROPZONE ---------- */
.dropzone{
    position:fixed;inset:0;z-index:800;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    padding:30px;
}
.dropzone.show{display:flex}
.dropzone-inner{
    border:2px dashed #333;
    padding:70px 90px;
    text-align:center;
    background:rgba(255,255,255,.02);
    animation:dzPulse 1.6s ease-in-out infinite;
    max-width:640px;
}
@keyframes dzPulse{0%,100%{border-color:#333}50%{border-color:#fff}}
.dropzone-title{
    font-size:15px;color:#fff;letter-spacing:5px;text-transform:uppercase;
    margin-bottom:10px;
}
.dropzone-sub{font-size:10px;color:#555;letter-spacing:2.5px;text-transform:uppercase}

/* ---------- UPLOAD TRAY ---------- */
.upload-tray{
    position:fixed;right:22px;bottom:22px;z-index:900;
    width:352px;max-width:calc(100vw - 44px);
    background:var(--panel);
    border:1px solid var(--line2);
    display:none;flex-direction:column;
    max-height:340px;
    box-shadow:0 14px 46px rgba(0,0,0,.75);
}
.upload-tray.show{display:flex;animation:slideUp .24s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.upload-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;border-bottom:1px solid var(--line);
    background:repeating-linear-gradient(45deg,#0a0a0a,#0a0a0a 10px,#080808 10px,#080808 20px);
    flex-shrink:0;
}
.upload-head-title{
    font-size:9px;color:#fff;letter-spacing:2.5px;text-transform:uppercase;
    display:flex;align-items:center;gap:9px;
}
.upload-head-title::before{content:'';width:5px;height:5px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.35)}
.upload-close{
    background:transparent;border:1px solid var(--line);color:#555;
    width:22px;height:22px;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
}
.upload-close:hover{border-color:var(--red);color:var(--red)}
.upload-list{overflow-y:auto;padding:6px}
.upload-list::-webkit-scrollbar{width:4px}
.upload-list::-webkit-scrollbar-thumb{background:#1a1a1a}
.upload-item{padding:9px 9px 10px;border-bottom:1px solid #101010}
.upload-item:last-child{border-bottom:none}
.upload-item-top{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    margin-bottom:6px;
}
.upload-name{
    font-size:10px;color:var(--txt2);letter-spacing:.6px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.upload-pct{
    font-size:8.5px;color:#555;letter-spacing:1.4px;flex-shrink:0;
    text-transform:uppercase;
}
.upload-item.done .upload-pct{color:var(--green)}
.upload-item.error .upload-pct{color:var(--red)}
.upload-track{height:3px;background:#111;position:relative;overflow:hidden}
.upload-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:#fff;transition:width .18s linear;
    box-shadow:0 0 8px rgba(255,255,255,.35);
}
.upload-item.done .upload-fill{background:var(--green);box-shadow:0 0 8px rgba(52,199,89,.4)}
.upload-item.error .upload-fill{background:var(--red);box-shadow:0 0 8px rgba(255,61,0,.4)}

/* ---------- STATUS BAR ---------- */
.statusbar{
    flex-shrink:0;height:28px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:0 20px;
    border-top:1px solid var(--line);
    background:var(--bg);
    font-size:8.5px;color:#3d3d3d;letter-spacing:1.6px;text-transform:uppercase;
    position:relative;z-index:10;
}
.statusbar .grp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.statusbar b{color:#777;font-weight:400}

/* ============================================================
   MODALS
   ============================================================ */
.overlay{
    position:fixed;inset:0;z-index:3000;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;
    padding:22px;
}
.overlay.open{display:flex}
.modal{
    background:var(--panel);
    border:1px solid var(--line2);
    width:100%;max-width:560px;
    max-height:92vh;
    display:flex;flex-direction:column;
    position:relative;
    animation:modalIn .2s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.corner{position:absolute;width:16px;height:16px;z-index:2;pointer-events:none}
.corner.tl{top:-1px;left:-1px;border-top:2px solid #fff;border-left:2px solid #fff}
.corner.tr{top:-1px;right:-1px;border-top:2px solid #fff;border-right:2px solid #fff}
.corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid #fff;border-left:2px solid #fff}
.corner.br{bottom:-1px;right:-1px;border-bottom:2px solid #fff;border-right:2px solid #fff}
.corner.red{border-color:var(--red)!important}

.modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:15px 20px;border-bottom:1px solid var(--line);
    background:repeating-linear-gradient(45deg,#0a0a0a,#0a0a0a 11px,#080808 11px,#080808 22px);
    flex-shrink:0;
}
.modal-title{
    font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#fff;
    display:flex;align-items:center;gap:10px;min-width:0;
}
.modal-title::before{content:'';width:5px;height:5px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.35);flex-shrink:0}
.modal-title.danger::before{background:var(--red);box-shadow:0 0 6px var(--red)}
.modal-close{
    background:transparent;border:1px solid var(--line3);color:#666;
    width:26px;height:26px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;transition:all .15s;
}
.modal-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{
    padding:20px;overflow-y:auto;flex:1;
}
.modal-body::-webkit-scrollbar{width:5px}
.modal-body::-webkit-scrollbar-thumb{background:#1a1a1a}
.modal-foot{
    display:flex;gap:9px;padding:14px 20px;
    border-top:1px solid var(--line);
    background:var(--bg);flex-shrink:0;flex-wrap:wrap;
}

.btn{
    padding:10px 20px;
    font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    border:1px solid;background:transparent;
    transition:all .18s;white-space:nowrap;
}
.btn.primary{background:#fff;border-color:#fff;color:#000;font-weight:700}
.btn.primary:hover{background:#e6e6e6;box-shadow:0 0 18px rgba(255,255,255,.15)}
.btn.primary:disabled{background:#0a0a0a;color:#444;border-color:var(--line);cursor:not-allowed;box-shadow:none}
.btn.ghost{border-color:var(--line);color:#666}
.btn.ghost:hover{border-color:#666;color:#c0c0c0}
.btn.danger{border-color:rgba(255,61,0,.55);color:var(--red);background:rgba(255,61,0,.06)}
.btn.danger:hover{background:var(--red);color:#000;border-color:var(--red)}
.btn.grow{flex:1;text-align:center}

/* ---------- FORMS ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{
    font-size:8.5px;color:#4a4a4a;letter-spacing:2px;text-transform:uppercase;
}
.input,.select,.textarea{
    width:100%;
    background:var(--bg);border:1px solid var(--line);
    padding:10px 12px;
    font-size:11.5px;color:var(--txt2);letter-spacing:1px;
    outline:none;transition:border-color .18s;
}
.input:focus,.select:focus,.textarea:focus{border-color:#fff}
.input::placeholder,.textarea::placeholder{color:#3a3a3a;text-transform:uppercase;font-size:10px;letter-spacing:1.6px}
.textarea{min-height:80px;resize:vertical;line-height:1.6}
.select{
    cursor:pointer;appearance:none;padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;
    background-size:4px 4px;background-repeat:no-repeat;
}
.hint{font-size:8.5px;color:#3a3a3a;letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}

/* ---------- CONFIRM ---------- */
.confirm-msg{
    font-size:12px;color:#8a8a8a;line-height:1.75;margin:0;
}
.confirm-msg b{color:#fff;font-weight:500}

/* ---------- PREVIEW MODAL ---------- */
.preview-modal{max-width:1080px;width:100%;height:88vh;max-height:88vh}
.preview-body{
    display:grid;grid-template-columns:1fr 296px;
    flex:1;min-height:0;overflow:hidden;
}
.preview-stage{
    background:#030303;
    display:flex;align-items:center;justify-content:center;
    overflow:auto;position:relative;
    border-right:1px solid var(--line);
    padding:22px;
}
.preview-stage::-webkit-scrollbar{width:6px}
.preview-stage::-webkit-scrollbar-thumb{background:#1a1a1a}
.preview-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.preview-stage video{max-width:100%;max-height:100%;display:block;background:#000}
.preview-stage iframe{width:100%;height:100%;border:none;background:#fff}
.preview-pre{
    width:100%;height:100%;
    margin:0;padding:20px;
    background:#070707;border:1px solid var(--line);
    color:#c8c8c8;font-size:11.5px;line-height:1.85;
    overflow:auto;white-space:pre-wrap;word-break:break-word;
    font-family:'IBM Plex Mono',monospace;
}
.preview-pre::-webkit-scrollbar{width:6px}
.preview-pre::-webkit-scrollbar-thumb{background:#1a1a1a}
.preview-none{
    text-align:center;color:#3a3a3a;
    font-size:10px;letter-spacing:2.6px;text-transform:uppercase;
}
.preview-none .big{
    font-size:46px;color:#1e1e1e;margin-bottom:18px;letter-spacing:2px;
}
.audio-stage{width:100%;max-width:520px;text-align:center}
.audio-vis{
    height:96px;display:flex;align-items:center;justify-content:center;gap:3px;
    margin-bottom:24px;padding:0 10px;
    border:1px solid var(--line);background:#070707;
}
.audio-vis i{
    display:block;width:3px;background:#fff;opacity:.75;
    animation:eq 1.1s ease-in-out infinite;
    box-shadow:0 0 6px rgba(255,255,255,.3);
}
@keyframes eq{0%,100%{height:8%}50%{height:88%}}
.audio-stage audio{width:100%;filter:invert(1) hue-rotate(180deg);opacity:.85}

/* ---------- DETAIL PANEL ---------- */
.detail-panel{
    background:var(--panel);
    display:flex;flex-direction:column;overflow-y:auto;
}
.detail-panel::-webkit-scrollbar{width:5px}
.detail-panel::-webkit-scrollbar-thumb{background:#1a1a1a}
.detail-sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.detail-sec:last-child{border-bottom:none}
.detail-sec-title{
    font-size:8.5px;color:#555;letter-spacing:2.6px;text-transform:uppercase;
    margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;
}
.detail-sec-title::before{content:'';width:3px;height:9px;background:#fff}
.detail-row{
    display:flex;gap:10px;margin-bottom:9px;align-items:flex-start;
}
.detail-row:last-child{margin-bottom:0}
.detail-k{
    width:74px;flex-shrink:0;
    font-size:8px;color:#3f3f3f;letter-spacing:1.6px;text-transform:uppercase;
    padding-top:2px;
}
.detail-v{
    flex:1;min-width:0;
    font-size:10.5px;color:#a8a8a8;letter-spacing:.5px;
    word-break:break-word;line-height:1.5;
}
.detail-v.mono{font-variant-numeric:tabular-nums}
.detail-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}

/* ---------- FOLDER PICKER ---------- */
.folder-pick{
    max-height:280px;overflow-y:auto;
    border:1px solid var(--line);background:var(--bg);
}
.folder-pick::-webkit-scrollbar{width:5px}
.folder-pick::-webkit-scrollbar-thumb{background:#1a1a1a}
.fp-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 13px;
    border-bottom:1px solid #0f0f0f;
    cursor:pointer;transition:background .14s;
    font-size:10.5px;color:#8a8a8a;letter-spacing:1px;
}
.fp-item:last-child{border-bottom:none}
.fp-item:hover{background:rgba(255,255,255,.045);color:#fff}
.fp-item.sel{background:rgba(255,255,255,.08);color:#fff;border-left:2px solid #fff}
.fp-ico{font-size:12px;color:var(--blue);flex-shrink:0}
.fp-path{font-size:8px;color:#3a3a3a;letter-spacing:1.2px;margin-left:auto;text-transform:uppercase}

/* ---------- SHARE ---------- */
.share-link{
    display:flex;gap:8px;align-items:center;
    border:1px solid var(--line);background:var(--bg);
    padding:9px 12px;margin-bottom:6px;
}
.share-link input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    font-size:10.5px;color:#8a8a8a;letter-spacing:.6px;
    font-family:'IBM Plex Mono',monospace;
}
.perm-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 0;border-bottom:1px solid #101010;
}
.perm-row:last-child{border-bottom:none}
.perm-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.perm-name{font-size:10.5px;color:var(--txt2);letter-spacing:.8px}
.perm-sub{font-size:8.5px;color:#3f3f3f;letter-spacing:1.4px;text-transform:uppercase}
.perm-badge{
    font-size:8px;letter-spacing:1.6px;text-transform:uppercase;
    padding:4px 9px;border:1px solid var(--line2);color:#666;
}

/* ---------- CONTEXT MENU ---------- */
.ctx{
    position:fixed;z-index:3500;
    background:var(--panel);
    border:1px solid var(--line2);
    min-width:196px;
    padding:5px;
    display:none;
    box-shadow:0 12px 40px rgba(0,0,0,.8);
}
.ctx.open{display:block;animation:ctxIn .12s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.ctx-item{
    display:flex;align-items:center;gap:11px;
    width:100%;padding:8px 11px;
    background:transparent;border:none;
    color:#8a8a8a;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    transition:all .12s;text-align:left;
}
.ctx-item:hover{background:rgba(255,255,255,.07);color:#fff}
.ctx-item.danger{color:#a04a3a}
.ctx-item.danger:hover{background:rgba(255,61,0,.12);color:var(--red)}
.ctx-item .ci{width:14px;text-align:center;font-size:11px;opacity:.8}
.ctx-sep{height:1px;background:var(--line);margin:5px 4px}
.ctx-label{
    font-size:7.5px;color:#333;letter-spacing:2px;text-transform:uppercase;
    padding:7px 11px 4px;
}

/* ============================================================
   TOASTS
   ============================================================ */
.toast-wrap{
    position:fixed;top:72px;right:22px;z-index:5000;
    display:flex;flex-direction:column;gap:9px;
    pointer-events:none;
}
.toast{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid #fff;
    padding:11px 16px;
    min-width:236px;max-width:352px;
    animation:toastIn .22s ease;
    pointer-events:auto;
}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.success{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--yellow)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--blue)}
.toast-title{
    font-size:8.5px;color:#fff;letter-spacing:2.2px;text-transform:uppercase;
    margin-bottom:4px;
}
.toast.success .toast-title{color:var(--green)}
.toast.warn .toast-title{color:var(--yellow)}
.toast.error .toast-title{color:var(--red)}
.toast.info .toast-title{color:var(--blue)}
.toast-msg{font-size:10.5px;color:var(--txt2);line-height:1.55;letter-spacing:.4px}
.toast.out{animation:toastOut .22s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1100px){
    .preview-body{grid-template-columns:1fr}
    .detail-panel{
        position:absolute;right:0;top:0;bottom:0;width:296px;
        border-left:1px solid var(--line);
        background:var(--panel);
        z-index:3;
        transform:translateX(100%);
        transition:transform .24s ease;
    }
    .detail-panel.show{transform:none}
}
@media (max-width:900px){
    .sidebar{
        position:fixed;left:0;top:0;bottom:0;z-index:600;
        margin-left:-246px;
        box-shadow:12px 0 40px rgba(0,0,0,.7);
    }
    .sidebar.open{margin-left:0}
    .hamburger{display:flex}
    .topbar-spacer{display:none}
    .top-chip{display:none}
    .search-wrap{max-width:none}
    .list-head{display:none}
    .row{grid-template-columns:1fr 78px;gap:8px}
    .row > .row-cell{display:none}
    .row-actions{opacity:1}
}
@media (max-width:640px){
    .topbar{padding:0 12px;gap:8px}
    .content{padding:14px 12px 60px}
    .crumbs-bar{padding:9px 12px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .user-meta{display:none}
    .user-chip{padding:5px}
    .statusbar{padding:0 12px;font-size:7.5px}
    .upload-tray{right:10px;bottom:10px;width:calc(100vw - 20px)}
    .preview-modal{height:94vh}
    .detail-panel{width:100%}
}
</style>
</head>
<body>

<div class="app">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo"><span class="logo-text">A</span></div>
            <div class="brand-text">
                <span class="brand-title">ATLASTALON</span>
                <span class="brand-sub">SECURE STORAGE</span>
            </div>
        </div>

        <div class="side-new">
            <button class="new-btn" id="newMenuBtn">
                <span class="plus">+</span> NEW
            </button>
        </div>

        <div class="side-scroll">
            <div class="nav-group">
                <div class="nav-title">Workspace</div>
                <button class="nav-item active" data-nav="drive">
                    <span class="ico">▤</span><span class="lbl">My Drive</span>
                    <span class="cnt" id="cntDrive">0</span>
                </button>
                <button class="nav-item" data-nav="recent">
                    <span class="ico">◷</span><span class="lbl">Recent</span>
                    <span class="cnt" id="cntRecent">0</span>
                </button>
                <button class="nav-item" data-nav="starred">
                    <span class="ico">★</span><span class="lbl">Starred</span>
                    <span class="cnt" id="cntStarred">0</span>
                </button>
                <button class="nav-item" data-nav="shared">
                    <span class="ico">⇄</span><span class="lbl">Shared</span>
                    <span class="cnt" id="cntShared">0</span>
                </button>
                <button class="nav-item" data-nav="trash">
                    <span class="ico">⌫</span><span class="lbl">Trash</span>
                    <span class="cnt" id="cntTrash">0</span>
                </button>
            </div>

            <div class="nav-group">
                <div class="nav-title">Departments</div>
                <div id="deptList"></div>
            </div>

            <div class="nav-group">
                <div class="nav-title">By Type</div>
                <button class="nav-item" data-type="image">
                    <span class="ico">◨</span><span class="lbl">Images</span>
                    <span class="cnt" id="cntImage">0</span>
                </button>
                <button class="nav-item" data-type="video">
                    <span class="ico">▶</span><span class="lbl">Video</span>
                    <span class="cnt" id="cntVideo">0</span>
                </button>
                <button class="nav-item" data-type="audio">
                    <span class="ico">♪</span><span class="lbl">Audio</span>
                    <span class="cnt" id="cntAudio">0</span>
                </button>
                <button class="nav-item" data-type="doc">
                    <span class="ico">▥</span><span class="lbl">Documents</span>
                    <span class="cnt" id="cntDoc">0</span>
                </button>
                <button class="nav-item" data-type="archive">
                    <span class="ico">▦</span><span class="lbl">Archives</span>
                    <span class="cnt" id="cntArchive">0</span>
                </button>
            </div>
        </div>

        <div class="side-storage">
            <div class="storage-head">
                <span>STORAGE</span>
                <b id="storagePct">0%</b>

            <div class="storage-bar"><div class="storage-fill" id="storageFill"></div></div>
            <div class="storage-meta">
                <span id="storageUsed">0 B</span>
                <span id="storageTotal">OF 15 GB</span>
            </div>
        </div>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <button class="hamburger" id="hamburger">☰</button>

            <div class="search-wrap">
                <span class="search-ico">⌕</span>
                <input class="search-input" id="searchInput" placeholder="SEARCH FILES, FOLDERS, TAGS…" />
                <button class="search-clear" id="searchClear" style="display:none">✕</button>
            </div>

            <div class="topbar-spacer"></div>

            <div class="top-chip"><span class="dot green"></span><span>ENCRYPTED</span></div>
            <div class="top-chip"><span id="topClock">--:--:--</span></div>

            <button class="icon-btn" id="uploadBtn">↑ UPLOAD</button>
            <button class="icon-btn" id="newFolderBtn">+ FOLDER</button>

            <div class="user-chip">
                <div class="user-meta">
                    <span class="user-name" id="userName">A. TALON</span>
                    <span class="user-role">ADMINISTRATOR</span>
                </div>
                <div class="avatar" id="userAvatar">AT</div>
            </div>
        </header>

        <!-- CRUMBS + TOOLBAR -->
        <div class="crumbs-bar">
            <div class="crumbs" id="crumbs"></div>

                <div class="view-toggle">
                    <button class="tool-btn active" data-view="grid" title="Grid view">▦</button>

<script>
/* ============================================================
   ATLASTALON · Secure Cloud Storage
   Single-file application
   ============================================================ */
(function () {
'use strict';

/* ------------------------------------------------------------
   UTILITIES
   ------------------------------------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = (n, l = 2) => String(Math.abs(Math.floor(n))).padStart(l, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = p => (p || 'ID') + '-' + Date.now().toString(36).toUpperCase() +
    '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function fmtBytes(b) {
    if (b == null || isNaN(b)) return '0 B';
    if (b < 1024) return b + ' B';
    const kb = b / 1024;
    if (kb < 1024) return kb.toFixed(kb < 10 ? 1 : 0) + ' KB';
    const mb = kb / 1024;
    if (mb < 1024) return mb.toFixed(mb < 10 ? 1 : 0) + ' MB';
    const gb = mb / 1024;
    if (gb < 1024) return gb.toFixed(2) + ' GB';
    return (gb / 1024).toFixed(2) + ' TB';
}

function fmtDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function fmtDateShort(ts) {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return 'TODAY ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    const y = new Date(now.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return 'YESTERDAY ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.getFullYear() === now.getFullYear()) return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
}

function relTime(ts) {
    const diff = Date.now() - ts;
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'JUST NOW';
    if (m < 60) return m + 'M AGO';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'H AGO';
    const d = Math.floor(h / 24);
    if (d < 7) return d + 'D AGO';
    const w = Math.floor(d / 7);
    if (w < 5) return w + 'W AGO';
    return Math.floor(d / 30) + 'MO AGO';
}

function extOf(name) {
    const i = String(name).lastIndexOf('.');
    if (i < 0 || i === name.length - 1) return '';
    return name.slice(i + 1).toLowerCase();
}

function baseName(name) {
    const i = String(name).lastIndexOf('.');
    return i > 0 ? name.slice(0, i) : name;
}

/* ------------------------------------------------------------
   FILE TYPE SYSTEM
   ------------------------------------------------------------ */
const EXT_MAP = {
    png:'image', jpg:'image', jpeg:'image', gif:'image', webp:'image',
    svg:'image', bmp:'image', ico:'image', avif:'image', tiff:'image', heic:'image',
    mp4:'video', webm:'video', mov:'video', avi:'video', mkv:'video', m4v:'video', wmv:'video',
    mp3:'audio', wav:'audio', ogg:'audio', m4a:'audio', flac:'audio', aac:'audio', wma:'audio',
    pdf:'pdf',
    doc:'doc', docx:'doc', rtf:'doc', odt:'doc', pages:'doc',
    txt:'text', md:'text', log:'text',
    xls:'sheet', xlsx:'sheet', csv:'sheet', ods:'sheet', numbers:'sheet',
    ppt:'slide', pptx:'slide', odp:'slide', key:'slide',
    zip:'archive', rar:'archive', '7z':'archive', tar:'archive', gz:'archive', bz2:'archive',
    js:'code', ts:'code', jsx:'code', tsx:'code', html:'code', htm:'code', css:'code',
    scss:'code', json:'code', xml:'code', yml:'code', yaml:'code', py:'code', rb:'code',
    java:'code', c:'code', cpp:'code', h:'code', cs:'code', go:'code', rs:'code',
    php:'code', swift:'code', kt:'code', sh:'code', bat:'code', sql:'code', toml:'code', ini:'code'
};

const TYPE_INFO = {
    folder:  { color:'#007AFF', label:'FOLDER',  glyph:'▸' },
    image:   { color:'#34C759', label:'IMAGE',   glyph:'◨' },
    video:   { color:'#FF3D00', label:'VIDEO',   glyph:'▶' },
    audio:   { color:'#FFD60A', label:'AUDIO',   glyph:'♪' },
    pdf:     { color:'#FF3D00', label:'PDF',     glyph:'PDF' },
    doc:     { color:'#007AFF', label:'DOC',     glyph:'DOC' },
    text:    { color:'#8E8E93', label:'TEXT',    glyph:'TXT' },
    sheet:   { color:'#34C759', label:'SHEET',   glyph:'XLS' },
    slide:   { color:'#FFD60A', label:'SLIDE',   glyph:'PPT' },
    archive: { color:'#8E8E93', label:'ARCHIVE', glyph:'ZIP' },
    code:    { color:'#BF5AF2', label:'CODE',    glyph:'{ }' },
    file:    { color:'#8E8E93', label:'FILE',    glyph:'▢' }
};

function typeOf(name) {
    const e = extOf(name);
    return EXT_MAP[e] || 'file';
}
function infoOf(name) {
    return TYPE_INFO[typeOf(name)] || TYPE_INFO.file;
}
function isPreviewable(name) {
    const t = typeOf(name);
    return ['image','video','audio','pdf','text','code'].includes(t);
}

const DEPARTMENTS = [
    { id:'folder-finance',   name:'FINANCE',    color:'#34C759' },
    { id:'folder-legal',     name:'LEGAL',      color:'#FF3D00' },
    { id:'folder-eng',       name:'ENGINEERING',color:'#007AFF' },
    { id:'folder-ops',       name:'OPERATIONS', color:'#FFD60A' },
    { id:'folder-hr',        name:'PEOPLE',     color:'#BF5AF2' },
    { id:'folder-archive',   name:'ARCHIVE',    color:'#8E8E93' }
];

const QUOTA_BYTES = 15 * 1024 * 1024 * 1024; // 15 GB

/* ------------------------------------------------------------
   INDEXEDDB
   ------------------------------------------------------------ */
const DB_NAME = 'atlastalon_db';
const DB_VER  = 1;
const STORE   = 'blobs';

let dbPromise = null;
function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) {
                db.createObjectStore(STORE, { keyPath: 'id' });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
    return dbPromise;
}

async function idbPut(id, data, type) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({ id, data, type });
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
    });
}

async function idbGet(id) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readonly');
        const r = tx.objectStore(STORE).get(id);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => rej(r.error);
    });
}

async function idbDelete(id) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
    });
}

async function idbClear() {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear();
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
    });
}

/* Blob URL cache */
const urlCache = new Map();
async function objectUrlFor(fileId, mimeHint) {
    if (urlCache.has(fileId)) return urlCache.get(fileId);
    const rec = await idbGet(fileId);
    if (!rec) return null;
    const blob = new Blob([rec.data], { type: rec.type || mimeHint || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    urlCache.set(fileId, url);
    return url;
}

/* ------------------------------------------------------------
   STATE
   ------------------------------------------------------------ */
const LS_KEY = 'atlastalon_state_v2';

const DEFAULT_STATE = {
    folders: [],
    files: [],
    section: 'drive',
    typeFilter: null,
    currentFolder: 'root',
    view: 'grid',
    sortKey: 'name',
    sortDir: 'asc',
    userName: 'A. TALON',
    userRole: 'ADMINISTRATOR',
    seeded: false
};

let state = loadState();
let selection = new Set();
let searchQuery = '';

function loadState() {
    try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const p = JSON.parse(raw);
        const s = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), p);
        s.folders = s.folders || [];
        s.files = s.files || [];
        return s;
    } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
}

let saveTimer = null;
function saveState(immediate) {
    if (saveTimer) clearTimeout(saveTimer);
    const doSave = () => {
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
        catch (e) { console.warn('State save failed', e); }
    };
    if (immediate) doSave();
    else saveTimer = setTimeout(doSave, 220);
}

/* ------------------------------------------------------------
   TOASTS
   ------------------------------------------------------------ */
function toast(type, title, msg, dur) {
    const wrap = $('#toastWrap');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML =
        '<div class="toast-title">' + esc(title) + '</div>' +
        '<div class="toast-msg">' + esc(msg) + '</div>';
    wrap.appendChild(el);
    setTimeout(() => {
        el.classList.add('out');
        setTimeout(() => el.remove(), 240);
    }, dur || 3000);
}

/* ------------------------------------------------------------
   SELECTION HELPERS
   ------------------------------------------------------------ */
function selKey(kind, id) { return kind + ':' + id; }
function isSelected(kind, id) { return selection.has(selKey(kind, id)); }
function toggleSelect(kind, id) {
    const k = selKey(kind, id);
    if (selection.has(k)) selection.delete(k);
    else selection.add(k);
}
function clearSelection() { selection.clear(); }
function selectedItems() {
    const out = [];
    selection.forEach(k => {
        const [kind, id] = k.split(':');
        if (kind === 'file') {
            const f = state.files.find(x => x.id === id);
            if (f) out.push({ kind:'file', item:f });
        } else {
            const d = state.folders.find(x => x.id === id);
            if (d) out.push({ kind:'folder', item:d });
        }
    });
    return out;
}

/* ------------------------------------------------------------
   DATA QUERIES
   ------------------------------------------------------------ */
function folderById(id) { return state.folders.find(f => f.id === id) || null; }

function folderPath(id) {
    const chain = [];
    let cur = folderById(id);
    let guard = 0;
    while (cur && guard++ < 32) {
        chain.unshift(cur);
        cur = cur.parentId ? folderById(cur.parentId) : null;
    }
    return chain;
}

function folderPathLabel(id) {
    const p = folderPath(id);
    return p.length ? p.map(f => f.name).join(' / ') : 'MY DRIVE';
}

function childrenOf(folderId) {
    const folders = state.folders.filter(f =>
        !f.trashed && (f.parentId || 'root') === folderId
    );
    const files = state.files.filter(f =>
        !f.trashed && (f.folderId || 'root') === folderId
    );
    return { folders, files };
}

function allActiveFolders() {
    return state.folders.filter(f => !f.trashed);
}

function usedBytes() {
    return state.files
        .filter(f => !f.trashed)
        .reduce((a, f) => a + (f.size || 0), 0);
}

function trashedBytes() {
    return state.files
        .filter(f => f.trashed)
        .reduce((a, f) => a + (f.size || 0), 0);
}

function matchesSearch(item, q) {
    if (!q) return true;
    const hay = [
        item.name,
        item.owner || '',
        item.description || '',
        (item.tags || []).join(' '),
        item.dept || ''
    ].join(' ').toLowerCase();
    return hay.includes(q);
}

function sortItems(folders, files) {
    const dir = state.sortDir === 'asc' ? 1 : -1;
    const key = state.sortKey;

    const cmp = (a, b) => {
        let av, bv;
        switch (key) {
            case 'modified': av = a.modifiedAt || 0; bv = b.modifiedAt || 0; break;
            case 'size':     av = a.size || 0;        bv = b.size || 0;        break;
            case 'type':     av = (a.name.split('.').pop() || '').toLowerCase();
                             bv = (b.name.split('.').pop() || '').toLowerCase(); break;
            default:         av = (a.name || '').toLowerCase();
                             bv = (b.name || '').toLowerCase();
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return 0;
    };

    folders.sort(cmp);
    files.sort(cmp);
    return { folders, files };
}

/* ------------------------------------------------------------
   CURRENT VIEW RESOLUTION
   ------------------------------------------------------------ */
function resolveView() {
    const sec = state.section;
    const q = searchQuery.trim().toLowerCase();

    // Global search overrides everything
    if (q) {
        const folders = allActiveFolders().filter(f => matchesSearch(f, q));
        const files = state.files.filter(f => !f.trashed && matchesSearch(f, q));
        return {
            folders, files,
            title: 'SEARCH RESULTS',
            subtitle: 'QUERY: "' + searchQuery.trim().toUpperCase() + '"',
            showCrumbs: false
        };
    }

    if (state.typeFilter) {
        const t = state.typeFilter;
        const files = state.files.filter(f => !f.trashed && typeOf(f.name) === t);
        return {
            folders: [], files,
            title: (TYPE_INFO[t] ? TYPE_INFO[t].label : t) + ' FILES',
            subtitle: 'FILTERED BY TYPE',
            showCrumbs: false
        };
    }

    switch (sec) {
        case 'recent': {
            const files = state.files
                .filter(f => !f.trashed)
                .sort((a, b) => (b.modifiedAt || 0) - (a.modifiedAt || 0))
                .slice(0, 60);
            return {
                folders: [], files,
                title: 'RECENT ACTIVITY',
                subtitle: 'LAST 60 MODIFIED FILES',
                showCrumbs: false
            };
        }
        case 'starred': {
            const folders = allActiveFolders().filter(f => f.starred);
            const files = state.files.filter(f => !f.trashed && f.starred);
            return {
                folders, files,
                title: 'STARRED ITEMS',
                subtitle: 'PINNED FOR QUICK ACCESS',
                showCrumbs: false
            };
        }
        case 'shared': {
            const files = state.files.filter(f => !f.trashed && f.shared);
            return {
                folders: [], files,
                title: 'SHARED WITH OTHERS',
                subtitle: 'EXTERNAL ACCESS GRANTED',
                showCrumbs: false
            };
        }
        case 'trash': {
            const folders = state.folders.filter(f => f.trashed);
            const files = state.files.filter(f => f.trashed);
            return {
                folders, files,
                title: 'TRASH',
                subtitle: 'ITEMS AUTO-PURGE AFTER 30 DAYS',
                showCrumbs: false,
                isTrash: true
            };
        }
        case 'folder': {
            const folder = folderById(state.currentFolder);
            const { folders, files } = childrenOf(state.currentFolder);
            return {
                folders, files,
                title: folder ? folder.name : 'FOLDER',
                subtitle: folder ? folderPathLabel(folder.id) : '',
                showCrumbs: true
            };
        }
        default: {
            const { folders, files } = childrenOf('root');
            return {
                folders, files,
                title: 'MY DRIVE',
                subtitle: 'ROOT DIRECTORY',
                showCrumbs: true
            };
        }
    }
}

/* ------------------------------------------------------------
   RENDER · SIDEBAR
   ------------------------------------------------------------ */
function renderSidebar() {
    const active = state.files.filter(f => !f.trashed);
    const activeFolders = allActiveFolders();

    $('#cntDrive').textContent   = active.length + activeFolders.length;
    $('#cntRecent').textContent  = Math.min(60, active.length);
    $('#cntStarred').textContent = active.filter(f => f.starred).length +
                                   activeFolders.filter(f => f.starred).length;
    $('#cntShared').textContent  = active.filter(f => f.shared).length;
    $('#cntTrash').textContent   = state.files.filter(f => f.trashed).length +
                                   state.folders.filter(f => f.trashed).length;

    ['image','video','audio','doc','archive'].forEach(t => {
        const el = $('#cnt' + t.charAt(0).toUpperCase() + t.slice(1));
        if (el) el.textContent = active.filter(f => typeOf(f.name) === t).length;
    });

    // Department list
    const deptWrap = $('#deptList');
    if (deptWrap) {
        deptWrap.innerHTML = DEPARTMENTS.map(d => {
            const count = active.filter(f => f.folderId === d.id).length;
            const isActive = state.section === 'folder' && state.currentFolder === d.id;
            return '<button class="nav-item ' + (isActive ? 'active' : '') + '" data-dept="' + d.id + '">' +
                '<span class="ico" style="color:' + d.color + '">▪</span>' +
                '<span class="lbl">' + esc(d.name) + '</span>' +
                '<span class="cnt">' + count + '</span>' +
            '</button>';
        }).join('');
    }

    // Active nav state
    $$('.nav-item').forEach(el => {
        if (el.dataset.nav) {
            el.classList.toggle('active',
                state.section === el.dataset.nav && !state.typeFilter);
        }
        if (el.dataset.type) {
            el.classList.toggle('active', state.typeFilter === el.dataset.type);
        }
    });

    // Storage meter
    const used = usedBytes();
    const trashed = trashedBytes();
    const pct = clamp((used / QUOTA_BYTES) * 100, 0, 100);
    const fill = $('#storageFill');
    fill.style.width = Math.max(pct, pct > 0 ? 1.5 : 0) + '%';
    fill.className = 'storage-fill' + (pct > 90 ? ' crit' : pct > 70 ? ' warn' : '');
    $('#storagePct').textContent = pct < 0.1 && used > 0 ? '<0.1%' : pct.toFixed(1) + '%';
    $('#storageUsed').textContent = fmtBytes(used);
    $('#storageTotal').textContent = 'OF ' + fmtBytes(QUOTA_BYTES);
    $('#statusStorage').textContent = fmtBytes(used) + ' / ' + fmtBytes(QUOTA_BYTES) +
        (trashed ? ' · ' + fmtBytes(trashed) + ' IN TRASH' : '');
}

/* ------------------------------------------------------------
   RENDER · CRUMBS
   ------------------------------------------------------------ */
function renderCrumbs(view) {
    const wrap = $('#crumbs');

    if (!view.showCrumbs) {
        wrap.innerHTML = '<span class="crumb here">' + esc(view.title) + '</span>' +
            (searchQuery ? ' <span class="crumb-sep">·</span> <span class="crumb" id="crumbClear">CLEAR SEARCH</span>' : '');
        const clear = $('#crumbClear');
        if (clear) clear.addEventListener('click', () => {
            searchQuery = '';
            $('#searchInput').value = '';
            $('#searchClear').style.display = 'none';
            render();
        });
        return;
    }

    let html = '<button class="crumb" data-goto="root">MY DRIVE</button>';
    if (state.section === 'folder' && state.currentFolder !== 'root') {
        const chain = folderPath(state.currentFolder);
        chain.forEach((f, i) => {
            html += '<span class="crumb-sep">/</span>';
            const last = i === chain.length - 1;
            html += '<button class="crumb ' + (last ? 'here' : '') + '" data-goto="' + f.id + '">' +
                esc(f.name) + '</button>';
        });
    } else if (state.section === 'drive') {
        html = '<span class="crumb here">MY DRIVE</span>';
    }
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-goto]').forEach(b => {
        b.addEventListener('click', () => {
            const id = b.dataset.goto;
            clearSelection();
            if (id === 'root') {
                state.section = 'drive';
                state.currentFolder = 'root';
            } else {
                state.section = 'folder';
                state.currentFolder = id;
            }
            saveState();
            render();
        });
    });
}

/* ------------------------------------------------------------
   RENDER · CONTENT
   ------------------------------------------------------------ */
function renderContent(view) {
    const content = $('#content');

    let folders = view.folders.slice();
    let files = view.files.slice();

    if (state.section === 'trash') {
        folders.sort((a, b) => (b.trashedAt || 0) - (a.trashedAt || 0));
        files.sort((a, b) => (b.trashedAt || 0) - (a.trashedAt || 0));
    } else {
        const s = sortItems(folders, files);
        folders = s.folders;
        files = s.files;
    }

    const total = folders.length + files.length;

    // Section head
    let html = '<div class="section-head">' +
        '<div class="section-title">' + esc(view.title) + '</div>' +
        '<div class="section-meta">' +
            (view.subtitle ? esc(view.subtitle) + ' · ' : '') +
            '<b>' + total + '</b> ITEM' + (total === 1 ? '' : 'S') +
        '</div>' +
    '</div>';

    if (state.section === 'trash' && total > 0) {
        html += '<div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="tool-btn" id="restoreAllBtn">↺ RESTORE ALL</button>' +
            '<button class="tool-btn" id="emptyTrashBtn" style="border-color:rgba(255,61,0,.4);color:#FF3D00">⌫ EMPTY TRASH</button>' +
        '</div>';
    }

    if (total === 0) {
        html += renderEmpty(view);
        content.innerHTML = html;
        bindTrashButtons();
        return;
    }

    if (state.view === 'grid') {
        html += '<div class="grid">';
        folders.forEach(f => { html += folderCardHTML(f); });
        files.forEach(f => { html += fileCardHTML(f); });
        html += '</div>';
    } else {
        html += '<div class="list">';
        html += '<div class="list-head">' +
            '<span data-sort="name" class="' + sortCls('name') + '">NAME</span>' +
            '<span data-sort="modified" class="' + sortCls('modified') + '">MODIFIED</span>' +
            '<span>OWNER</span>' +
            '<span data-sort="size" class="' + sortCls('size') + '">SIZE</span>' +
            '<span style="text-align:right">ACTIONS</span>' +
        '</div>';
        folders.forEach(f => { html += folderRowHTML(f); });
        files.forEach(f => { html += fileRowHTML(f); });
        html += '</div>';
    }

    content.innerHTML = html;

    bindContentEvents();
    bindTrashButtons();
    hydrateThumbnails();
    updateStatusBar(view);
}

function sortCls(key) {
    if (state.sortKey !== key) return '';
    return 'sorted' + (state.sortDir === 'asc' ? ' asc' : '');
}

function renderEmpty(view) {
    const isTrash = state.section === 'trash';
    const isSearch = !!searchQuery.trim();
    let title, sub;

    if (isSearch) {
        title = 'NO MATCHES FOUND';
        sub = 'REFINE YOUR QUERY OR CLEAR FILTERS';
    } else if (isTrash) {
        title = 'TRASH IS EMPTY';
        sub = 'DELETED ITEMS WILL APPEAR HERE';
    } else if (state.typeFilter) {
        title = 'NO FILES OF THIS TYPE';
        sub = 'UPLOAD SOMETHING TO GET STARTED';
    } else if (state.section === 'starred') {
        title = 'NOTHING STARRED YET';
        sub = 'STAR IMPORTANT FILES FOR QUICK ACCESS';
    } else if (state.section === 'shared') {
        title = 'NOTHING SHARED';
        sub = 'SHARE A FILE TO SEE IT HERE';
    } else if (state.section === 'recent') {
        title = 'NO RECENT ACTIVITY';
        sub = 'UPLOAD OR EDIT A FILE TO BEGIN';
    } else {
        title = 'THIS FOLDER IS EMPTY';
        sub = 'DROP FILES HERE OR USE THE UPLOAD BUTTON';
    }

    let extra = '';
    if (!isSearch && !isTrash) {
        extra = '<button class="btn primary" id="emptyUploadBtn" style="margin-top:4px">↑ UPLOAD FILES</button>';
    }

    return '<div class="empty">' +
        '<div class="empty-icon"></div>' +
        '<div class="empty-title">' + esc(title) + '</div>' +
        '<div class="empty-sub">' + esc(sub) + '</div>' +
        extra +
    '</div>';
}
