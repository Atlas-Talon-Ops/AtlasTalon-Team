/* ============================================================
   INTERACTIONS
   ============================================================ */
document.addEventListener('click', e=>{
  // ============ BULK SELECT: clicking a message toggles selection ============
  const msgEl = e.target.closest('.mrow');
  if(msgEl && state.bulkMode && !e.target.closest('.mtools')){
    const mid = msgEl.dataset.mid;
    if(mid){
      if(state.bulkSelected.has(mid)) state.bulkSelected.delete(mid);
      else state.bulkSelected.add(mid);
      renderMessages();
      renderComposer();
      return;
    }
  }

  const t = e.target.closest('[data-act]');
  if(!t) { closeCtx(); return; }
  const act = t.dataset.act;

  switch(act){
    case 'view': state.view = t.dataset.view; state.activeConvo = null; state.profileId = null; state.bulkMode = false; state.bulkSelected.clear(); closeCtx(); renderAll(); break;
    case 'folder': state.folder = t.dataset.folder; renderSidebar(); break;
    case 'open': {
      const id = t.dataset.id;
      state.activeConvo = id; state.profileId = null;
      state.bulkMode = false; state.bulkSelected.clear();
      const c = convo(id);
      if(c){ c.unread = 0; }
      renderAll();
      break;
    }
    case 'open-profile': {
      e.stopPropagation();
      const id = t.dataset.id;
      if(!id) return;
      state.profileId = id;
      state.profileTab = 'media';
      renderAll();
      break;
    }
    case 'close-profile': state.profileId = null; renderAll(); break;
    case 'profile-tab': state.profileTab = t.dataset.t; renderProfile(); break;
    case 'profile-dm': {
      const id = t.dataset.id;
      const cv = CONVOS.find(x=>x.type==='dm' && x.members.includes(id));
      if(cv){ state.activeConvo = cv.id; state.profileId = null; state.view='chats'; cv.unread=0; renderAll(); }
      else toast('NO CHAT','',{icon:'chat'});
      break;
    }
    case 'profile-call': startCallWith(t.dataset.id, t.dataset.mode || 'voice'); break;
    case 'close-chat': state.activeConvo = null; state.replyTo = null; state.editing = null; state.bulkMode = false; state.bulkSelected.clear(); renderAll(); break;

    /* 3-dot menu — simple click */
    case 'convo-menu': {
      e.stopPropagation();
      const rect = t.getBoundingClientRect();
      openConvoCtx(t.dataset.id, rect.left - 210, rect.bottom + 4);
      break;
    }
    case 'contact-menu': {
      e.stopPropagation();
      const rect = t.getBoundingClientRect();
      openContactCtx(t.dataset.id, rect.left - 210, rect.bottom + 4);
      break;
    }
    case 'mark-all-read': CONVOS.forEach(c=>c.unread=0); renderSidebar(); toast('ALL CAUGHT UP','',{icon:'checks'}); break;

    /* bulk actions */
    case 'toggle-bulk': toggleBulkMode(); break;
    case 'bulk-cancel': exitBulk(); break;
    case 'bulk-forward': bulkForward(); break;
    case 'bulk-star': bulkStar(); break;
    case 'bulk-delete': bulkDelete(); break;

    case 'send': doSend(); break;
    case 'emoji': popEmoji(); break;
    case 'attach': popAttach(); break;
    case 'gif': popGif(); break;
    case 'camera': toast('CAMERA','',{icon:'camera'}); break;
    case 'record': toggleRecord(); break;
    case 'fmt': applyFmt(t.dataset.f); break;
    case 'mention': insertText('@'); break;
    case 'poll': openPollModal(); break;
    case 'cancel-reply': state.replyTo = null; renderComposer(); break;
    case 'cancel-edit': state.editing = null; renderComposer(); break;
    case 'insert': insertText(t.dataset.text); closePop(); break;
    case 'tts': toast('READING ALOUD','',{icon:'volume'}); break;
    case 'stt': toast('LISTENING','',{icon:'mic'}); break;

    case 'reply': state.replyTo = t.dataset.id; state.editing = null; renderComposer(); $('#composerInput') && $('#composerInput').focus(); break;
    case 'edit': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      if(m && m.sender==='u0'){ state.editing = m.id; state.replyTo = null; renderComposer(); }
      else toast('CANNOT EDIT','',{icon:'info'}); break;
    }
    case 'pin-msg': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      m.pinned = !m.pinned; renderMessages(); renderChat();
      toast(m.pinned?'PINNED':'UNPINNED','',{icon:'pin'}); break;
    }
    case 'star-msg': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      m.starred = !m.starred; renderMessages();
      break;
    }
    case 'forward': state.forwardMsg = t.dataset.id; openForwardModal(); break;
    case 'quick-react': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      addReaction(m, '👍'); break;
    }
    case 'react': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      addReaction(m, t.dataset.e); break;
    }
    case 'vote': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      const i = +t.dataset.i;
      if(m.voted === i) return;
      if(m.voted != null) m.opts[m.voted][1]--;
      m.opts[i][1]++; m.voted = i;
      renderMessages(); break;
    }
    case 'play-voice': {
      const el = t.closest('.voice');
      const bars = el.querySelector('.wave').querySelectorAll('i');
      let n = 0;
      bars.forEach(b=>b.classList.remove('p'));
      const iv = setInterval(()=>{
        if(n >= bars.length){ clearInterval(iv); bars.forEach(b=>b.classList.remove('p')); return; }
        bars[n].classList.add('p'); n++;
      }, 90);
      break;
    }
    case 'voice-speed': {
      const speeds = ['0.5x','1x','1.5x','2x'];
      const cur = speeds.indexOf(t.textContent);
      t.textContent = speeds[(cur+1)%speeds.length]; break;
    }
    case 'msg-menu': {
      e.stopPropagation();
      const msgEl = t.closest('.mrow');
      if(!msgEl) break;
      const bubble = msgEl.querySelector('.bub');
      const rect = (bubble || msgEl).getBoundingClientRect();
      let x, y;
      if(msgEl.classList.contains('out')){
        x = rect.left - 240;
        y = rect.top - 4;
      } else {
        x = rect.right + 8;
        y = rect.top - 4;
      }
      openMsgCtx(t.dataset.id, x, y);
      break;
    }
    case 'open-media': openMediaViewer(t.dataset.label); break;
    case 'download': toast('DOWNLOAD STARTED','',{icon:'download'}); break;

    case 'start-call': startCall(t.dataset.mode); break;
    case 'demo-incoming-voice': simulateIncomingCall('voice'); break;
    case 'demo-incoming-video': simulateIncomingCall('video'); break;
    case 'account': openAccountSwitcher(); break;
    case 'toast-close': {
      const el = t.closest('.toast');
      el.classList.add('dismiss');
      setTimeout(()=>el.remove(), 250);
      break;
    }
    case 'copy-invite': {
      const link = 'AtlasTalon.app/join/krenner-4a2f';
      navigator.clipboard && navigator.clipboard.writeText(link);
      toast('COPIED', link, {icon:'link'}); break;
    }
    case 'report': openReportModal(t.dataset.id); break;
    case 'my-qr': toast('QR CODE','',{icon:'qr'}); break;
    case 'add-member': openAddMember(); break;
    case 'group-settings': openGroupSettings(); break;
    case 'edit-note': openNoteModal(t.dataset.id); break;
    case 'edit-tags': openTagsModal(t.dataset.id); break;
    case 'toggle-block': {
      const c = contact(t.dataset.id);
      c.blocked = !c.blocked;
      if(c.blocked) state.blocked.push(c.id); else state.blocked = state.blocked.filter(x=>x!==c.id);
      renderProfile();
      toast(c.blocked?'BLOCKED':'UNBLOCKED', c.name, {icon:'lock'});
      break;
    }
    case 'new-group': openNewGroup(); break;
    case 'chat-search': openChatSearch(); break;
    case 'chat-menu': openChatCtx(e.clientX, e.clientY); break;

    case 'restore-convo': {
      const id = t.dataset.id;
      const item = state.deletedConvos.find(x=>x.convo.id===id);
      if(item){
        CONVOS.push(item.convo);
        state.deletedConvos = state.deletedConvos.filter(x=>x.convo.id!==id);
        renderAll();
        toast('RESTORED', item.convo.name, {icon:'restore'});
      }
      break;
    }
    case 'purge-convo': {
      const id = t.dataset.id;
      const item = state.deletedConvos.find(x=>x.convo.id===id);
      if(item){
        purgeConfirm(item.convo.name, ()=>{
          state.deletedConvos = state.deletedConvos.filter(x=>x.convo.id!==id);
          delete state.messages[id];
          renderAll();
          toast('PERMANENTLY DELETED', item.convo.name, {icon:'trash'});
        });
      }
      break;
    }
    case 'restore-msg': {
      const id = t.dataset.id;
      const item = state.deletedMsgs.find(x=>x.msg.id===id);
      if(item){
        const target = convo(item.convoId);
        if(target && state.messages[item.convoId]){
          state.messages[item.convoId].push(item.msg);
          state.messages[item.convoId].sort((a,b)=>a.ts-b.ts);
        }
        state.deletedMsgs = state.deletedMsgs.filter(x=>x.msg.id!==id);
        renderAll();
        toast('RESTORED', 'Restored to ' + item.convoName, {icon:'restore'});
      }
      break;
    }
    case 'purge-msg': {
      const id = t.dataset.id;
      purgeConfirm('This message', ()=>{
        state.deletedMsgs = state.deletedMsgs.filter(x=>x.msg.id!==id);
        renderAll();
        toast('PERMANENTLY DELETED','',{icon:'trash'});
      });
      break;
    }
    case 'empty-deleted': {
      purgeConfirm('All recently deleted items', ()=>{
        state.deletedConvos = [];
        state.deletedMsgs = [];
        renderAll();
        toast('ALL PURGED','',{icon:'trash'});
      }, {label:'PURGE ALL', confirmLabel:'PURGE ALL'});
      break;
    }
    case 'change-photo': toast('UPLOAD','',{icon:'image'}); break;
    case 'remove-photo': toast('REMOVED','',{icon:'trash'}); break;
    case 'toggle-generic': t.classList.toggle('on'); break;
  }
});

const TOGGLES = {
  'toggle-notif': ()=> state.notifications = !state.notifications,
  'toggle-dnd': ()=> state.dnd = !state.dnd,
  'toggle-mention-only': ()=> state.mentionOnly = !state.mentionOnly,
  'toggle-receipts': ()=> state.readReceipts = !state.readReceipts,
  'toggle-typing': ()=> state.typingIndicator = !state.typingIndicator,
  'toggle-links': ()=> state.linkPreviews = !state.linkPreviews,
  'toggle-contrast': ()=> state.highContrast = !state.highContrast,
  'toggle-cb': ()=> state.colorblind = !state.colorblind,
  'toggle-enter': ()=> state.enterToSend = !state.enterToSend,
  'toggle-autoreply': ()=> state.autoReply = !state.autoReply,
  'toggle-away': ()=> state.awayStatus = !state.awayStatus,
  'toggle-rtl': ()=> state.rtl = !state.rtl
};
Object.entries(TOGGLES).forEach(([act, fn])=>{
  document.addEventListener('click', e=>{
    const t = e.target.closest('[data-act="'+act+'"]');
    if(!t) return;
    fn();
    applyRootSettings();
    if(state.view === 'settings') renderSettings();
    if(state.activeConvo) renderComposer();
  }, true);
});

function applyRootSettings(){
  const r = document.documentElement;
  r.dataset.density = state.density;
  r.dataset.contrast = state.highContrast ? 'high' : 'normal';
  r.dataset.cb = state.colorblind ? 'on' : 'off';
  r.dir = state.rtl ? 'rtl' : 'ltr';
  r.style.fontSize = (state.fontScale * 100) + '%';
}

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.input === 'search'){ state.search = t.value; renderSidebar(); setTimeout(()=>{ const s=$('#globalSearch'); if(s){ s.focus(); s.selectionStart=s.selectionEnd=s.value.length; } },0); }
  if(t.dataset.input === 'sort'){ state.sort = t.value; renderSidebar(); }
  if(t.dataset.input === 'set-density'){ state.density = t.value; applyRootSettings(); }
  if(t.dataset.input === 'set-font'){ state.fontScale = parseFloat(t.value); applyRootSettings(); renderSettings(); }
  if(t.dataset.input === 'set-name'){ me().name = t.value; }
  if(t.dataset.input === 'set-handle'){ me().handle = t.value; }
  if(t.dataset.input === 'set-bio'){ me().bio = t.value; }
});

function closeCtx(){ const c = $('.ctx'); if(c) c.remove(); }

/* ============ RIGHT CLICK ============ */
document.addEventListener('contextmenu', e=>{
  // Message right-click — anchor to the message bubble
  const msgEl = e.target.closest('.mrow');
  if(msgEl && msgEl.dataset.mid){
    e.preventDefault();
    const bubble = msgEl.querySelector('.bub');
    const rect = (bubble || msgEl).getBoundingClientRect();
    let x, y;
    if(msgEl.classList.contains('out')){
      x = rect.left - 240;
      y = rect.top - 4;
    } else {
      x = rect.right + 8;
      y = rect.top - 4;
    }
    openMsgCtx(msgEl.dataset.mid, x, y);
    return;
  }
  const row = e.target.closest('[data-ctx="convo"]');
  const chat = e.target.closest('[data-ctx="chat"]');
  if(row){ e.preventDefault(); openConvoCtx(row.dataset.id, e.clientX, e.clientY); }
  else if(chat){ e.preventDefault(); openChatCtx(e.clientX, e.clientY); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.ctx')) closeCtx(); });

function ctxMenu(x, y, items){
  closeCtx();
  const el = document.createElement('div');

function addReaction(m, e){
  if(!m.reactions) m.reactions = {};
  if(m.mineReact === e){ m.reactions[e]--; if(m.reactions[e]<=0) delete m.reactions[e]; m.mineReact = null; }
  else {
    if(m.mineReact && m.reactions[m.mineReact]) { m.reactions[m.mineReact]--; if(m.reactions[m.mineReact]<=0) delete m.reactions[m.mineReact]; }
    m.reactions[e] = (m.reactions[e]||0)+1;
    m.mineReact = e;
  }
  renderMessages();
}

function insertText(txt){
  const ta = $('#composerInput'); if(!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0,s) + txt + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + txt.length;
  autosize(ta);
  state.drafts[state.activeConvo] = ta.value;
  const sb = $('#sendBtn'); if(sb) sb.disabled = !ta.value.trim();
  ta.focus();
  closePop();
}
function applyFmt(f){
  const ta = $('#composerInput'); if(!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s,e) || 'text';
  const rep = f === '> ' ? f + sel : f + sel + f;
  ta.value = ta.value.slice(0,s) + rep + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + rep.length;
  ta.focus();
  state.drafts[state.activeConvo] = ta.value;
}
let recTimer = null;
function toggleRecord(){
  const c = convo(state.activeConvo); if(!c) return;
  const btn = $('#recBtn');
  if(!recTimer){
    recTimer = {sec:0};
    btn.classList.add('on');
    btn.innerHTML = ic('phoneoff');
    btn.style.animation = 'recPulse 1.4s ease-in-out infinite';
    toast('RECORDING','',{icon:'mic'});
    recTimer.iv = setInterval(()=>{ recTimer.sec++; }, 1000);
  } else {
    clearInterval(recTimer.iv);
    const dur = Math.max(1, recTimer.sec);
    recTimer = null;
    btn.classList.remove('on');
    btn.style.animation = '';
    btn.innerHTML = ic('mic');
    state.messages[c.id].push({
      id: c.id+'_'+Date.now(), sender:'u0', text:'', ts:Date.now(), status:'sent',
      edited:false, deleted:false, type:'voice', reactions:{}, replyTo:null,
      pinned:false, starred:false, mentions:[], dur
    });
    renderMessages();
    toast('VOICE MESSAGE SENT', dur + 's', {icon:'mic'});
  }
}

function openModal(title, body, buttons, wide){
  const layer = document.createElement('div');
  layer.className = 'scrim';
  layer.innerHTML = `

      const idx = CONVOS.indexOf(c);
      if(idx >= 0) CONVOS.splice(idx, 1);
      state.deletedConvos.push({convo: c, deletedAt: Date.now()});
      if(state.activeConvo === c.id) state.activeConvo = null;
      state.view = 'groups';
      renderAll();
      toast('GROUP DELETED', c.name, {icon:'trash'});
    }, {label:'PURGE GROUP'});
  };
}

function openNewGroup(){
  openModal('Create New Group', `
    <div class="field"><label>GROUP NAME</label><input type="text" id="ngN" placeholder="e.g. Ops Cell — SOUTH"/></div>
    <div class="field"><label>DESCRIPTION (OPTIONAL)</label><input type="text" id="ngD"/></div>
    <div class="field"><label>SELECT MEMBERS</label>
      <div style="max-height:260px;overflow-y:auto">
        ${CONTACTS.map(x=>`
          <label style="display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;border-bottom:1px solid var(--line)">
            <input type="checkbox" value="${x.id}"/>
            <span class="av sm" style="background:${x.color}18;border-color:${x.color}50;color:${x.color}">${av(x.name,x.color)}</span>
            <div style="flex:1">
              <div style="font-size:12px">${esc(x.name)}</div>
              <div style="font-size:9px;color:var(--ink-4);font-family:'Orbitron'">${esc(x.handle)}</div>
            </div>
          </label>`).join('')}
      </div>
    </div>
    <div class="btnrow">
      <button class="btn" data-mclose>CANCEL</button>
      <button class="btn primary" id="ngGo">${ic('plus','sm')} CREATE GROUP</button>
    </div>`, [], true)
  .querySelector('#ngGo').onclick = ()=>{
    const name = document.getElementById('ngN').value.trim();
    const desc = document.getElementById('ngD').value.trim();
    if(!name){ toast('NAME REQUIRED','',{icon:'alert'}); return; }
    const picks = Array.from(document.querySelectorAll('.scrim input[type=checkbox]:checked')).map(x=>x.value);
    if(picks.length < 1){ toast('ADD MEMBERS','',{icon:'users'}); return; }
    const id = 'g' + Date.now();
    const colors = ['#e8b64c','#7fb8d8','#6dbf8a','#d89ab0','#b8b0d8','#8ec9a8','#d8a878','#7fc4b8'];
    const color = colors[Math.floor(Math.random()*colors.length)];
    CONVOS.unshift({
      id, type:'group', name, color, presence:'offline', lastSeen:picks.length+' members',
      pinned:false, muted:false, archived:false, unread:0, priority:false, folders:['work'],
      members:['u0', ...picks], verified:false, admins:['u0'], desc, invite:'AtlasTalon.app/join/'+id
    });
    state.messages[id] = [{
      id:id+'_sys', sender:'u0', text:`Group "${name}" created.`, ts:Date.now(), status:null,
      edited:false, deleted:false, type:'text', reactions:{}, replyTo:null, pinned:false, starred:false, mentions:[]
    }];
    state.activeConvo = id;
    state.view = 'groups';
    state.profileId = null;
    closeModal();
    renderAll();
    toast('GROUP CREATED', name, {icon:'users'});
  };
}

function openAccountSwitcher(){
  openModal('Accounts', `
    <div style="display:flex;flex-direction:column;gap:0">
      ${ACCOUNTS.map(a=>`
        <div class="listrow" data-acc="${a.id}" style="padding:12px 0">
          <span class="av" style="background:${a.color}18;border-color:${a.color}50;color:${a.color}">${a.init}</span>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600">${esc(a.name)}</div>
            <div style="font-size:9.5px;color:var(--ink-4);font-family:'Orbitron';letter-spacing:.08em">${esc(a.handle)} · ${esc(a.role).toUpperCase()}</div>
          </div>
          ${state.account===a.id?`<span style="color:var(--amber)">${ic('check','sm')}</span>`:''}
        </div>`).join('')}
    </div>
    <div class="btnrow"><button class="btn" data-mclose>CLOSE</button></div>`, [], true);
  document.querySelectorAll('[data-acc]').forEach(r=>{
    r.onclick = ()=>{
      state.account = r.dataset.acc;
      closeModal(); renderAll();
      toast('SWITCHED', me().name, {icon:'users'});
    };
  });
}

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', e=>{
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === 'f'){ e.preventDefault(); const s = $('#globalSearch'); if(s){ s.focus(); s.select(); } return; }
  if(e.key === 'Escape'){
    closePop(); closeCtx(); closeModal();
    if(callSystem.active){ endCall(); return; }
    const s = $('.scrim'); if(s) s.remove();
    if(state.bulkMode){ exitBulk(); return; }
    if(state.profileId){ state.profileId = null; renderAll(); return; }
    if(state.activeConvo && document.activeElement && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement === document.body){
      state.activeConvo = null; renderAll();
    }
  }
});

/* ============================================================
   AMBIENT GLITCH
   ============================================================ */
const screenGlitch = document.getElementById('screenGlitch');
setInterval(()=>{
  if(Math.random() > 0.85){
    screenGlitch.classList.remove('active');
    void screenGlitch.offsetWidth;
    screenGlitch.classList.add('active');
  }
}, 13000);

/* ============================================================
   BOOT
   ============================================================ */
function renderAll(){
  renderSidebar();
  renderMain();
  applyRootSettings();
}

renderAll();

console.log('%c[AtlasTalon · TALON] ACTIVE', 'color:#e8b64c;font-weight:700;letter-spacing:.1em;');
</script>
