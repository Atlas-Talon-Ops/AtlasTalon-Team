<!DOCTYPE html>
<html lang="en" data-theme="amoled" data-density="comfortable">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SENTINEL · TALON</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --amber:#e8b64c;
  --amber-bright:#ffcf72;
  --amber-soft:rgba(232,182,76,.10);
  --amber-line:rgba(232,182,76,.28);

  --ink-1:rgba(255,255,255,.92);
  --ink-2:rgba(255,255,255,.66);
  --ink-3:rgba(255,255,255,.42);
  --ink-4:rgba(255,255,255,.26);
  --ink-5:rgba(255,255,255,.12);

  --line:rgba(255,255,255,.06);
  --line-strong:rgba(255,255,255,.12);

  --ok:#6dbf8a;
  --warn:#e8b64c;
  --bad:#e05858;
  --info:#7fb8d8;

  --fs:13px;
  --ease:cubic-bezier(.2,.8,.3,1);
}
html[data-density="compact"]{ --fs:12.5px; }
html[data-density="spacious"]{ --fs:13.5px; }

*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10)}
::-webkit-scrollbar-thumb:hover{background:rgba(232,182,76,.4)}
html,body{height:100%}
body{
  background:#000;color:var(--ink-1);
  font:var(--fs)/1.55 'Inter',system-ui,-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;
}
input,textarea,select{user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
select{cursor:pointer;color:var(--ink-2);font-size:10px;font-family:'Orbitron',monospace;letter-spacing:.06em;padding:2px 0}
select option{background:#0a0a0a;color:#fff}
a{color:var(--amber);text-decoration:none}

.ic{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.sm{width:14px;height:14px}
.ic.lg{width:22px;height:22px}
.lbl{font-family:'Orbitron',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* ============================================================
   MOTION LIBRARY
   ============================================================ */
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes badgePulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(232,182,76,.55); }
  50%{ box-shadow:0 0 0 5px rgba(232,182,76,0); }
}
@keyframes badgePop{
  0%{ transform:scale(.4); opacity:0; }
  60%{ transform:scale(1.2); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
@keyframes dotBreathe{
  0%,100%{ box-shadow:0 0 0 0 currentColor; }
  50%{ box-shadow:0 0 0 4px transparent; }
}
@keyframes msgIn{
  from{ opacity:0; transform:translateY(8px) scale(.985); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
@keyframes msgInOut{
  from{ opacity:0; transform:translateY(6px) translateX(8px) scale(.985); }
  to{ opacity:1; transform:translateY(0) translateX(0) scale(1); }
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes modalIn{
  from{ opacity:0; transform:scale(.94) translateY(8px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes scrimIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes ctxIn{
  from{ opacity:0; transform:scale(.94) translateY(-4px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes toastIn{
  from{ transform:translateX(110%) scale(.96); opacity:0; }
  to{ transform:translateX(0) scale(1); opacity:1; }
}
@keyframes toastOut{
  to{ transform:translateX(110%); opacity:0; }
}
@keyframes sendReady{
  0%,100%{ box-shadow:0 0 0 0 rgba(232,182,76,.35); }
  50%{ box-shadow:0 0 0 7px rgba(232,182,76,0); }
}
@keyframes sendPress{
  0%{ transform:scale(1); }
  40%{ transform:scale(.88); }
  100%{ transform:scale(1); }
}
@keyframes phPulse{
  0%,100%{ opacity:.45; transform:translateY(0); }
  50%{ opacity:.85; transform:translateY(-2px); }
}
@keyframes chatIn{
  from{ opacity:0; transform:translateY(4px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes chatOut{
  from{ opacity:1; transform:translateY(0); }
  to{ opacity:0; transform:translateY(4px); }
}
@keyframes underlineSlide{
  from{ transform:scaleX(0); }
  to{ transform:scaleX(1); }
}
@keyframes wavePlay{
  0%,100%{ transform:scaleY(1); }
  50%{ transform:scaleY(1.6); }
}
@keyframes recPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(224,88,88,.6); }
  50%{ box-shadow:0 0 0 8px rgba(224,88,88,0); }
}
@keyframes liveTick{
  0%{ opacity:0; transform:translateX(-4px); }
  100%{ opacity:1; transform:translateX(0); }
}

/* ============================================================
   AMBIENT OVERLAYS
   ============================================================ */
.scanline{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.030) 0px,rgba(0,0,0,.030) 2px,transparent 2px,transparent 7px);
}
.glitch-line{
  position:fixed;top:0;left:0;width:100%;height:1px;background:rgba(255,255,255,.09);
  box-shadow:0 0 8px rgba(255,255,255,.05);z-index:9998;pointer-events:none;opacity:0;
  animation:glitchLine 8s linear infinite;
}
@keyframes glitchLine{
  0%,100%{opacity:0}4%{opacity:.85}5%{opacity:0}
  39%{opacity:0}43%{opacity:.5}44%{opacity:0}
  72%{opacity:0}77%{opacity:.4}78%{opacity:0}
}
.screen-glitch{
  position:fixed;inset:0;pointer-events:none;z-index:9997;opacity:0;
  background:linear-gradient(transparent 0%,rgba(255,255,255,.03) 46%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 54%,transparent 100%);
  mix-blend-mode:screen;
}
.screen-glitch.active{animation:screenTear .22s steps(3,end) 1}
@keyframes screenTear{
  0%{opacity:0;transform:translateY(-4%)}
  20%{opacity:1;transform:translateY(3%)}
  45%{opacity:.4;transform:translateY(-2%)}
  70%{opacity:.9;transform:translateY(2%)}
  100%{opacity:0;transform:translateY(0)}
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  display:flex;height:100vh;width:100vw;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%,#101010 0%,#050505 55%,#000 100%);
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:320px;flex:0 0 320px;display:flex;flex-direction:column;min-width:0;
  position:relative;
}
.sidebar::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--line);
}

.sb-top{padding:16px 18px 0;flex-shrink:0}
.sb-brand{
  display:flex;align-items:center;gap:9px;font-family:'Orbitron',monospace;
  font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#fff;
  margin-bottom:16px;
}
.sb-brand .dot{
  width:6px;height:6px;background:var(--amber);
  box-shadow:0 0 12px rgba(232,182,76,.6);animation:pulseDot 1.6s ease-in-out infinite;
}

.sb-nav{display:flex;gap:2px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sb-nav-btn{
  padding:6px 9px;font-size:8.5px;font-weight:600;letter-spacing:.14em;
  font-family:'Orbitron',monospace;text-transform:uppercase;color:var(--ink-4);
  transition:color .2s var(--ease), background .2s var(--ease);
  position:relative;border-radius:2px;
}
.sb-nav-btn:hover{color:var(--ink-2);background:rgba(255,255,255,.03)}
.sb-nav-btn.on{color:var(--amber)}
.sb-nav-btn.on::after{
  content:'';position:absolute;left:9px;right:9px;bottom:-14px;height:1px;background:var(--amber);
  transform-origin:left;animation:underlineSlide .35s var(--ease) both;
}

.searchwrap{margin:14px 18px 10px;position:relative}
.searchwrap .ic{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--ink-4);transition:color .2s var(--ease)}
.searchwrap:focus-within .ic{color:var(--amber)}
.searchwrap input{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:6px 40px 6px 24px;font-size:11px;font-family:'Orbitron',monospace;
  letter-spacing:.08em;transition:border-color .25s var(--ease), padding .25s var(--ease);
}
.searchwrap input::placeholder{color:var(--ink-4);font-size:9.5px;letter-spacing:.14em;transition:.2s}
.searchwrap input:focus{border-bottom-color:var(--amber)}
.searchwrap input:focus::placeholder{color:var(--ink-3);transform:translateX(2px)}
.searchwrap .kbd{position:absolute;right:0;top:50%;transform:translateY(-50%)}

.kbd{
  font-size:7.5px;padding:2px 6px;color:var(--ink-4);
  border:1px solid var(--line);font-family:'Orbitron',monospace;letter-spacing:.06em;
  transition:.2s var(--ease);
}

.tabs{
  display:flex;gap:14px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 0;font-size:8.5px;font-weight:600;color:var(--ink-4);
  white-space:nowrap;position:relative;transition:color .2s var(--ease);
  font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase;
}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--amber)}
.tab.on::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--amber);
  transform-origin:left;animation:underlineSlide .35s var(--ease) both;
}
.tab .n{opacity:.6;margin-left:4px;font-size:8px;transition:opacity .2s}

.sortrow{
  display:flex;align-items:center;gap:10px;padding:9px 18px;
  font-size:8.5px;color:var(--ink-4);font-family:'Orbitron',monospace;
  letter-spacing:.12em;text-transform:uppercase;flex-shrink:0;
}

.convolist{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0 12px}

/* conversation row — hover lift + menu fade */
.crow{
  position:relative;display:flex;gap:11px;padding:11px 18px;cursor:pointer;
  background:transparent;transition:background .2s var(--ease), transform .25s var(--ease), padding-left .25s var(--ease);
  align-items:flex-start;border-left:2px solid transparent;
  animation:cardIn .35s var(--ease) both;
}
.crow:hover{background:rgba(255,255,255,.025);padding-left:22px}
.crow.on{
  background:var(--amber-soft);border-left-color:var(--amber);
  box-shadow:inset 0 0 24px rgba(232,182,76,.035);
}
.crow.on::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber);
  box-shadow:0 0 12px rgba(232,182,76,.6);animation:cardIn .3s var(--ease) both;
}

.crow-menu-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%) scale(.8);
  width:26px;height:26px;display:grid;place-items:center;color:var(--ink-4);
  opacity:0;transition:opacity .2s var(--ease), transform .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
  border-radius:2px;
}
.crow:hover .crow-menu-btn{opacity:1;transform:translateY(-50%) scale(1)}
.crow-menu-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.crow-menu-btn:active{transform:translateY(-50%) scale(.9)}

.av{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
  font-weight:700;font-size:11.5px;position:relative;letter-spacing:.06em;
  border:1px solid var(--line-strong);font-family:'Orbitron',monospace;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.crow:hover .av{transform:scale(1.04)}
.av.sm{width:26px;height:26px;flex-basis:26px;font-size:9.5px}
.av.lg{width:60px;height:60px;flex-basis:60px;font-size:20px}
.av.xl{width:84px;height:84px;flex-basis:84px;font-size:28px}
.av .dot{
  position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border:2px solid #000;
  transition:transform .25s var(--ease);
}
.av .dot.online{background:var(--ok);color:var(--ok);animation:dotBreathe 2.4s ease-in-out infinite}
.av .dot.offline{background:var(--ink-4)}
.av .dot.away{background:var(--amber);color:var(--amber);animation:dotBreathe 2.4s ease-in-out infinite}

.cmain{flex:1;min-width:0;padding-right:22px}
.crow1{display:flex;align-items:center;gap:6px}
.cname{
  font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  transition:color .2s var(--ease);
}
.crow:hover .cname{color:#fff}
.ctime{font-size:8.5px;color:var(--ink-4);flex:0 0 auto;font-family:'Orbitron',monospace;letter-spacing:.06em}
.crow2{display:flex;align-items:center;gap:5px;margin-top:1px}
.cprev{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cprev .who{color:var(--ink-4);font-family:'Orbitron',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:3px}
.cmeta{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.pill{
  min-width:16px;height:16px;padding:0 5px;background:var(--amber);color:#000;
  font-size:9px;font-weight:800;display:grid;place-items:center;font-family:'Orbitron',monospace;
  animation:badgePop .4s var(--ease) both, badgePulse 2.4s ease-in-out 0.4s infinite;
}
.pill.muted{background:var(--ink-4)}
.flagstar{color:var(--amber);transition:transform .25s var(--ease)}
.crow:hover .flagstar{transform:scale(1.15)}
.flagmute{color:var(--ink-4)}
.typing{color:var(--amber);font-family:'Orbitron',monospace;font-size:9px;letter-spacing:.1em}
.typing::after{content:'';animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

.sb-foot{
  border-top:1px solid var(--line);padding:10px 18px;
  display:flex;gap:14px;align-items:center;flex-shrink:0;
}
.sb-foot-btn{
  font-size:8.5px;font-weight:600;letter-spacing:.14em;color:var(--ink-4);
  font-family:'Orbitron',monospace;text-transform:uppercase;
  transition:color .2s var(--ease), transform .2s var(--ease);
  position:relative;
}
.sb-foot-btn:hover{color:#fff;transform:translateY(-1px)}
.sb-foot-btn.on{color:var(--amber)}
.sb-foot-btn.ml{margin-left:auto}
.sb-foot-btn:active{transform:translateY(0) scale(.96)}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
}

.placeholder{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;color:var(--ink-4);text-align:center;padding:40px;
  animation:cardIn .5s var(--ease) both;
}
.placeholder .ph-art{
  width:72px;height:72px;display:grid;place-items:center;
  border:1px solid var(--line-strong);color:var(--amber);opacity:.5;
  animation:phPulse 3.2s ease-in-out infinite;
}
.placeholder .ph-art .ic{width:30px;height:30px}
.placeholder .ph-title{
  font-family:'Orbitron',monospace;font-size:11px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);
}
.placeholder .ph-sub{font-size:11.5px;color:var(--ink-4);max-width:280px;line-height:1.6}

/* chat header */
.mhead{
  height:52px;flex:0 0 52px;display:flex;align-items:center;gap:11px;padding:0 18px;
  border-bottom:1px solid var(--line);z-index:20;
  animation:chatIn .3s var(--ease) both;
}
.mhead .closebtn{
  width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);
  transition:color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease);
  margin-right:2px;border-radius:2px;
}
.mhead .closebtn:hover{color:#fff;background:rgba(255,255,255,.05)}
.mhead .closebtn:active{transform:scale(.9)}
.mhead .t{flex:1;min-width:0}
.mhead .t h3{
  font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;font-family:'Orbitron',monospace;
  letter-spacing:.14em;text-transform:uppercase;
}
.mhead .t p{
  font-size:9px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;
}
.mhead .acts{display:flex;gap:2px;align-items:center}
.mhead .acts .iconbtn{transition:color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease)}
.mhead .acts .iconbtn:hover{transform:translateY(-1px)}
.mhead .acts .iconbtn:active{transform:scale(.9)}

.pinbar{
  padding:8px 18px;display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--ink-2);
  font-family:'Orbitron',monospace;letter-spacing:.06em;border-bottom:1px solid var(--line);
  animation:cardIn .35s var(--ease) both;
}
.pinbar .ic{color:var(--amber);animation:pulseDot 2.4s ease-in-out infinite}

/* messages */
.msgs{flex:1;overflow-y:auto;padding:20px 18px 10px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.daysep{
  align-self:center;font-size:8px;color:var(--ink-4);
  padding:3px 10px;margin:16px 0 12px;
  font-family:'Orbitron',monospace;letter-spacing:.22em;text-transform:uppercase;
  animation:cardIn .4s var(--ease) both;
}
.mrow{
  display:flex;gap:9px;max-width:72%;position:relative;padding:1px 0;align-items:flex-end;
  animation:msgIn .32s var(--ease) both;
}
.mrow.out{animation-name:msgInOut}
.mrow.out{align-self:flex-end;flex-direction:row-reverse}
.mrow.grouped{margin-top:0}
.mrow:not(.grouped){margin-top:10px}
.mrow .av{opacity:0;pointer-events:none;transition:opacity .2s var(--ease), transform .2s var(--ease)}
.mrow:not(.grouped) .av{opacity:1}
.mbody{min-width:0;display:flex;flex-direction:column}
.mname{
  font-size:8.5px;font-weight:700;color:var(--ink-3);margin:0 0 3px 4px;
  font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase;
}
.bub{
  background:rgba(255,255,255,.03);padding:8px 12px;font-size:13px;line-height:1.55;
  word-wrap:break-word;overflow-wrap:anywhere;position:relative;
  transition:background .25s var(--ease), transform .2s var(--ease), box-shadow .25s var(--ease);
}
.mrow.in .bub{border-left:2px solid var(--line-strong)}
.mrow.out .bub{background:var(--amber-soft);border-right:2px solid var(--amber);color:#fff}
.mrow.out .bub a{color:var(--amber-bright);text-decoration:underline}
.mrow:hover .bub{background:rgba(255,255,255,.05)}
.mrow.out:hover .bub{background:rgba(232,182,76,.14)}
.mrow.hl .bub{background:var(--amber-soft);box-shadow:0 0 0 1px var(--amber-line), 0 0 24px rgba(232,182,76,.15)}
.meta{
  display:flex;align-items:center;gap:5px;font-size:8.5px;color:var(--ink-4);margin:4px 4px 0;
  font-family:'Orbitron',monospace;letter-spacing:.08em;text-transform:uppercase;
}
.mrow.out .meta{justify-content:flex-end}
.meta .edited{font-style:italic}
.tick{color:var(--ink-4);transition:color .3s var(--ease)}
.tick.read{color:var(--amber)}
.quote{
  border-left:2px solid var(--amber);padding:3px 0 3px 9px;margin-bottom:6px;
  font-size:11.5px;color:var(--ink-3);
}
.mrow.out .quote{border-left-color:var(--amber-bright);color:rgba(255,255,255,.75)}
.quote b{
  display:block;font-size:8.5px;color:var(--amber);margin-bottom:2px;
  font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase;
}
.reacts{display:flex;gap:4px;margin:5px 4px 0;flex-wrap:wrap}
.mrow.out .reacts{justify-content:flex-end}
.react{
  background:rgba(255,255,255,.03);padding:2px 8px;font-size:11px;
  display:flex;align-items:center;gap:4px;cursor:pointer;
  transition:background .2s var(--ease), transform .2s var(--ease);
  animation:cardIn .3s var(--ease) both;
}
.react:hover{background:rgba(255,255,255,.08);transform:scale(1.06)}
.react:active{transform:scale(.94)}
.react.mine{background:var(--amber-soft);box-shadow:0 0 0 1px var(--amber-line)}
.react .n{font-size:9px;color:var(--ink-3);font-family:'Orbitron',monospace}
.mtools{
  position:absolute;top:-14px;display:flex;gap:2px;background:#0d0d0d;border:1px solid var(--line-strong);
  padding:2px;opacity:0;pointer-events:none;transform:translateY(4px) scale(.96);
  transition:opacity .18s var(--ease), transform .18s var(--ease);z-index:5;
}
.mrow:hover .mtools{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.mrow.out .mtools{left:0}
.mrow.in .mtools{right:0}
.mtools button{
  width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3);
  transition:color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
}
.mtools button:hover{color:#fff;background:rgba(255,255,255,.06)}
.mtools button:active{transform:scale(.88)}

.att-img{
  width:230px;height:135px;margin:2px 0 4px;display:grid;place-items:center;
  font-size:9px;color:rgba(255,255,255,.65);font-weight:600;letter-spacing:.16em;cursor:pointer;
  font-family:'Orbitron',monospace;text-transform:uppercase;background:linear-gradient(135deg,#1a1814,#0a0a0a);
  transition:transform .3s var(--ease), filter .3s var(--ease);
}
.att-img:hover{transform:scale(1.015);filter:brightness(1.1)}
.att-file{
  display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:4px;min-width:200px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  transition:padding-left .2s var(--ease);
}
.att-file:hover{padding-left:4px}
.att-file .fi{width:28px;height:28px;display:grid;place-items:center;color:var(--amber)}
.att-file .fn{font-size:11px;font-weight:500;font-family:'Orbitron',monospace;letter-spacing:.04em}
.att-file .fs{font-size:9px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.08em}

.voice{display:flex;align-items:center;gap:10px;min-width:200px}
.voice .play{
  width:28px;height:28px;background:var(--amber);color:#000;display:grid;place-items:center;flex:0 0 28px;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.voice .play:hover{transform:scale(1.08);box-shadow:0 0 12px rgba(232,182,76,.4)}
.voice .play:active{transform:scale(.92)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:2.5px;background:currentColor;opacity:.3;display:block;transition:opacity .15s}
.wave i.p{opacity:1;animation:wavePlay .5s ease-in-out infinite}
.spd{
  font-size:9px;font-weight:800;padding:2px 6px;cursor:pointer;
  font-family:'Orbitron',monospace;letter-spacing:.06em;color:var(--ink-3);
  transition:color .2s var(--ease), background .2s var(--ease);
}
.spd:hover{color:#fff;background:rgba(255,255,255,.05)}

.poll{min-width:230px}
.poll .q{font-weight:500;margin-bottom:9px;font-size:12.5px}
.poll .opt{
  padding:7px 10px;margin-bottom:5px;position:relative;overflow:hidden;cursor:pointer;
  font-size:11.5px;transition:border-color .2s var(--ease), transform .15s var(--ease);border:1px solid var(--line);
}
.poll .opt:hover{border-color:var(--line-strong);transform:translateX(2px)}
.poll .opt:active{transform:scale(.985)}
.poll .opt .bar{position:absolute;inset:0;background:var(--amber-soft);z-index:0;transition:width .55s var(--ease)}
.poll .opt .lab{position:relative;z-index:1;display:flex;justify-content:space-between}
.poll-bar{
  display:flex;gap:8px;margin-top:4px;font-size:8.5px;color:var(--ink-4);
  font-family:'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;
}

.mapcard{
  height:110px;position:relative;margin-bottom:6px;overflow:hidden;
  background:#060606;border-left:2px solid var(--amber-line);
}
.mapcard .pt{position:absolute;width:7px;height:7px;background:var(--amber);animation:pulseDot 2.2s ease-in-out infinite}
.mapcard .g{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:24px 24px;
}

.typingrow{display:flex;gap:9px;align-items:center;padding:6px 18px 0;height:22px}
.tdots{display:flex;gap:3px}
.tdots i{width:5px;height:5px;background:var(--amber);animation:bnc 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.16s}
.tdots i:nth-child(3){animation-delay:.32s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* composer */
.composer{padding:8px 18px 16px;position:relative;animation:cardIn .3s var(--ease) both}
.fmtbar{display:flex;gap:2px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.fmtbar button{
  width:24px;height:24px;display:grid;place-items:center;color:var(--ink-4);font-size:10.5px;
  font-weight:700;transition:color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
  border-radius:2px;
}
.fmtbar button:hover{color:#fff;background:rgba(255,255,255,.05)}
.fmtbar button:active{transform:scale(.88)}
.fmtbar .sep{width:1px;height:14px;background:var(--line);margin:0 5px}
.replystrip{
  display:flex;align-items:center;gap:10px;padding:6px 0 6px 10px;margin-bottom:8px;font-size:11.5px;
  border-left:2px solid var(--amber);
  animation:cardIn .25s var(--ease) both;
}
.replystrip .x{margin-left:auto}
.inputrow{display:flex;align-items:flex-end;gap:8px}
.inputbox{
  flex:1;display:flex;align-items:flex-end;padding:4px 0;gap:2px;
  border-bottom:1px solid var(--line-strong);
  transition:border-color .25s var(--ease);
}
.inputbox:focus-within{border-bottom-color:var(--amber)}
.inputbox textarea{
  flex:1;resize:none;max-height:150px;min-height:24px;padding:6px 4px;font-size:13px;
  line-height:1.5;background:transparent;
}
.inputbox .iconbtn{transition:color .15s var(--ease), transform .15s var(--ease)}
.inputbox .iconbtn:hover{transform:translateY(-1px)}
.inputbox .iconbtn:active{transform:scale(.9)}

.sendbtn{
  width:36px;height:36px;background:var(--amber);color:#000;display:grid;place-items:center;
  flex:0 0 36px;transition:background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
}
.sendbtn:not(:disabled){animation:sendReady 2.4s ease-in-out infinite}
.sendbtn:hover{background:var(--amber-bright);transform:scale(1.06)}
.sendbtn:active{transform:scale(.9);animation:sendPress .3s var(--ease)}
.sendbtn:disabled{opacity:.22;cursor:not-allowed;animation:none}

.iconbtn{
  width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);
  transition:color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
  border-radius:2px;
}
.iconbtn:hover{color:#fff;background:rgba(255,255,255,.05)}
.iconbtn:active{transform:scale(.88)}
.iconbtn.on{color:var(--amber);background:var(--amber-soft)}

/* ============================================================
   POPOVERS
   ============================================================ */
.pop{
  position:absolute;bottom:calc(100% + 8px);background:#0a0a0a;border:1px solid var(--line-strong);
  z-index:60;overflow:hidden;transform-origin:bottom left;
  animation:cardIn .22s var(--ease) both;
}
.pop.emoji{left:18px;width:310px;padding:10px}
.emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-height:200px;overflow-y:auto}
.emoji-grid button{
  font-size:19px;height:32px;display:grid;place-items:center;
  transition:background .15s var(--ease), transform .15s var(--ease);
}
.emoji-grid button:hover{background:rgba(255,255,255,.05);transform:scale(1.15)}
.emoji-grid button:active{transform:scale(.9)}
.pop.attach{left:18px;width:210px;padding:6px}
.pop.attach button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;font-size:11px;
  text-align:left;transition:background .15s var(--ease), padding-left .2s var(--ease), color .15s var(--ease);
  font-family:'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
}
.pop.attach button:hover{background:rgba(255,255,255,.05);color:#fff;padding-left:14px}
.pop.attach .ic{color:var(--amber)}
.pop.suggest{left:18px;right:18px;max-height:220px;overflow-y:auto;padding:5px}
.pop.suggest button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;text-align:left;font-size:12px;
  transition:background .15s var(--ease), padding-left .2s var(--ease);
}
.pop.suggest button:hover{background:rgba(255,255,255,.05);padding-left:14px}
.pop.suggest .sub{font-size:10px;color:var(--ink-4);display:block;font-family:'Orbitron',monospace;letter-spacing:.06em;text-transform:uppercase}
.pophead{
  padding:6px 10px 4px;font-size:8px;letter-spacing:.2em;color:var(--ink-4);
  font-weight:700;font-family:'Orbitron',monospace;text-transform:uppercase;
}

/* ============================================================
   FULL VIEWS
   ============================================================ */
.view{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;animation:chatIn .3s var(--ease) both}
.vhead{
  padding:18px 28px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;
}
.vhead h2{
  font-size:14px;font-weight:700;letter-spacing:.22em;flex:1;text-transform:uppercase;
  font-family:'Orbitron',monospace;
}
.vbody{flex:1;overflow-y:auto;padding:22px 28px 40px}
.grid{display:grid;gap:0}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

.card{
  padding:14px 0;position:relative;border-bottom:1px solid var(--line);
  animation:cardIn .4s var(--ease) both;
}
.card:last-child{border-bottom:none}
.card h4{
  font-size:9px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;
  font-family:'Orbitron',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.card h4 .ic{color:var(--amber);transition:transform .25s var(--ease)}
.card:hover h4 .ic{transform:scale(1.1)}
.stat{font-size:22px;font-weight:700;letter-spacing:-.4px;font-family:'Orbitron',monospace}
.stat small{
  font-size:8.5px;color:var(--ink-4);font-weight:600;display:block;letter-spacing:.14em;
  font-family:'Orbitron',monospace;margin-top:3px;text-transform:uppercase;
}
.spark{display:flex;align-items:flex-end;gap:2px;height:32px;margin-top:10px}
.spark i{
  flex:1;background:var(--amber);opacity:.68;
  transform-origin:bottom;animation:cardIn .5s var(--ease) both;
}
.spark i:nth-child(1){animation-delay:.02s}
.spark i:nth-child(2){animation-delay:.04s}
.spark i:nth-child(3){animation-delay:.06s}
.spark i:nth-child(4){animation-delay:.08s}
.spark i:nth-child(5){animation-delay:.10s}
.spark i:nth-child(6){animation-delay:.12s}
.spark i:nth-child(7){animation-delay:.14s}
.spark i:nth-child(8){animation-delay:.16s}
.spark i:nth-child(9){animation-delay:.18s}
.spark i:nth-child(10){animation-delay:.20s}
.spark i:nth-child(11){animation-delay:.22s}
.spark i:nth-child(12){animation-delay:.24s}
.spark i:nth-child(13){animation-delay:.26s}
.spark i:nth-child(14){animation-delay:.28s}
.spark i:nth-child(15){animation-delay:.30s}
.spark i:nth-child(16){animation-delay:.32s}
.spark i:nth-child(17){animation-delay:.34s}
.spark i:nth-child(18){animation-delay:.36s}
.spark i:nth-child(19){animation-delay:.38s}
.spark i:nth-child(20){animation-delay:.40s}

.inteltabs{display:flex;gap:18px;padding:12px 28px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0}

.itable{width:100%;border-collapse:collapse;font-size:11.5px}
.itable th{
  text-align:left;padding:8px 0;color:var(--ink-4);font-size:8.5px;text-transform:uppercase;
  letter-spacing:.16em;border-bottom:1px solid var(--line);font-weight:700;
  font-family:'Orbitron',monospace;
}
.itable td{padding:10px 0;border-bottom:1px solid var(--line);transition:background .18s var(--ease)}
.itable tr{transition:transform .18s var(--ease)}
.itable tbody tr:hover td{background:rgba(255,255,255,.015)}
.itable tbody tr:hover{transform:translateX(2px)}
.sev{
  font-size:7.5px;font-weight:800;padding:2px 7px;text-transform:uppercase;letter-spacing:.12em;
  font-family:'Orbitron',monospace;
}
.sev.high{color:var(--bad);border:1px solid rgba(224,88,88,.4);animation:pulseDot 2.4s ease-in-out infinite}
.sev.med{color:var(--amber);border:1px solid var(--amber-line)}
.sev.low{color:var(--info);border:1px solid rgba(127,184,216,.4)}

.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:8px;font-weight:700;padding:3px 8px;
  color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;
  transition:color .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
  border:1px solid var(--line);
}
.chip:hover{color:#fff;border-color:var(--line-strong);transform:translateY(-1px)}
.chip:active{transform:translateY(0) scale(.96)}
.chip.on{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}

.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:8px;color:var(--ink-4);font-family:'Orbitron',monospace}
.heat i{aspect-ratio:1;background:var(--amber);display:block;transition:transform .2s var(--ease), filter .2s var(--ease)}
.heat i:hover{transform:scale(1.35);filter:brightness(1.3);z-index:2;position:relative}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.tlitem{position:relative;padding:0 0 16px;animation:cardIn .45s var(--ease) both}
.tlitem:nth-child(1){animation-delay:.03s}
.tlitem:nth-child(2){animation-delay:.06s}
.tlitem:nth-child(3){animation-delay:.09s}
.tlitem:nth-child(4){animation-delay:.12s}
.tlitem:nth-child(5){animation-delay:.15s}
.tlitem:nth-child(6){animation-delay:.18s}
.tlitem:nth-child(7){animation-delay:.21s}
.tlitem:nth-child(8){animation-delay:.24s}
.tlitem:nth-child(9){animation-delay:.27s}
.tlitem::before{
  content:"";position:absolute;left:-19px;top:6px;width:7px;height:7px;background:var(--amber);
  transition:transform .25s var(--ease);border-radius:50%;
}
.tlitem:hover::before{transform:scale(1.4);box-shadow:0 0 12px rgba(232,182,76,.6)}
.tlitem b{font-size:11px;font-family:'Orbitron',monospace;letter-spacing:.04em}
.tlitem p{font-size:11px;color:var(--ink-4);margin-top:2px}

.empty{display:grid;place-items:center;height:100%;color:var(--ink-4);text-align:center;gap:12px;animation:cardIn .4s var(--ease) both}
.empty .ic{width:40px;height:40px;opacity:.28}

.listrow{
  display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;
  transition:padding-left .2s var(--ease), background .2s var(--ease);border-bottom:1px solid var(--line);
}
.listrow:hover{padding-left:6px}
.listrow:last-child{border-bottom:none}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:11.5px;border-bottom:1px solid var(--line);transition:background .18s var(--ease)}
.kv:hover{background:rgba(255,255,255,.015)}
.kv:last-child{border:none}
.kv span:first-child{color:var(--ink-4);font-family:'Orbitron',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}

.qr{width:130px;height:130px;background:#fff;padding:7px;display:grid;grid-template-columns:repeat(21,1fr);gap:1px}
.qr i{background:#000;animation:cardIn .4s var(--ease) both}

/* settings rows */
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:11.5px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .k{color:var(--ink-4);flex:1;font-family:'Orbitron',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
.prow .v{color:var(--ink-1);text-align:right;font-weight:500}
.switch{
  width:32px;height:16px;background:rgba(255,255,255,.06);position:relative;transition:background .25s var(--ease), border-color .25s var(--ease);
  flex:0 0 32px;border:1px solid var(--line-strong);cursor:pointer;
}
.switch.on{background:var(--amber-soft);border-color:var(--amber-line)}
.switch i{
  position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--ink-4);
  transition:left .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
}
.switch.on i{left:17px;background:var(--amber);box-shadow:0 0 10px rgba(232,182,76,.6)}
.switch:hover i{box-shadow:0 0 8px rgba(232,182,76,.4)}

.field{margin-bottom:16px}
.field label{
  display:block;font-size:8.5px;color:var(--ink-4);margin-bottom:6px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;font-family:'Orbitron',monospace;
}
.field input[type=text],.field input[type=time],.field input[type=date],.field textarea,.field select{
  width:100%;background:transparent;border-bottom:1px solid var(--line-strong);
  padding:8px 0;font-size:12.5px;transition:border-color .25s var(--ease);
}
.field input:focus,.field textarea:focus,.field select:focus{border-bottom-color:var(--amber)}
.field textarea{resize:vertical;min-height:70px}
.field input[type=range]{width:100%;accent-color:var(--amber)}

.btn{
  padding:8px 14px;font-size:9px;font-weight:700;
  transition:color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
  font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
  border:1px solid var(--line-strong);
}
.btn:hover{color:#fff;border-color:var(--amber-line);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.btn.primary:hover{background:rgba(232,182,76,.18);color:var(--amber-bright)}
.btn.danger{color:var(--bad);border-color:rgba(224,88,88,.4)}
.btn.danger:hover{background:rgba(224,88,88,.1)}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

.mediagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.mediagrid div{
  aspect-ratio:1;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .3s var(--ease), filter .3s var(--ease);
}
.mediagrid div:hover{transform:scale(1.04);filter:brightness(1.15);z-index:2}
.fileitem{
  display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;
  transition:padding-left .2s var(--ease), background .2s var(--ease);border-bottom:1px solid var(--line);
}
.fileitem:hover{padding-left:4px}

/* ============================================================
   MODALS
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(3px);
  z-index:200;display:grid;place-items:center;padding:20px;
  animation:scrimIn .22s var(--ease) both;
}
.modal{
  background:#080808;border:1px solid var(--line-strong);
  width:min(520px,100%);max-height:86vh;overflow-y:auto;position:relative;
  animation:modalIn .28s var(--ease) both;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--amber-line),transparent);
}
.modal.wide{width:min(780px,100%)}
.modal header{
  display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#080808;z-index:2;
}
.modal header h3{
  font-size:11px;font-weight:700;flex:1;font-family:'Orbitron',monospace;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-1);
}
.modal .mbody{padding:18px}

.palette{
  width:min(580px,100%);background:#080808;border:1px solid var(--line-strong);
  overflow:hidden;align-self:flex-start;margin-top:10vh;position:relative;
  animation:modalIn .26s var(--ease) both;
}
.palette::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--amber-line),transparent);
}
.palette input{
  width:100%;padding:16px 20px;font-size:12.5px;border-bottom:1px solid var(--line);
  font-family:'Orbitron',monospace;letter-spacing:.08em;
}
.palette input::placeholder{color:var(--ink-4);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.palette .plist{max-height:52vh;overflow-y:auto;padding:6px}
.palette .pitem{
  display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;font-size:11.5px;
  transition:background .15s var(--ease), padding-left .2s var(--ease);
}
.palette .pitem.sel{background:var(--amber-soft);color:var(--amber)}
.palette .pitem:hover{padding-left:16px}
.palette .pitem .ic{color:var(--amber)}

.ctx{
  position:fixed;background:#0a0a0a;border:1px solid var(--line-strong);padding:4px;z-index:300;
  min-width:200px;box-shadow:0 20px 50px rgba(0,0,0,.8);
  transform-origin:top right;
  animation:ctxIn .16s var(--ease) both;
}
.ctx button{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;font-size:11px;
  text-align:left;transition:background .15s var(--ease), padding-left .18s var(--ease), color .15s var(--ease);
  font-family:'Orbitron',monospace;letter-spacing:.08em;text-transform:uppercase;
}
.ctx button:hover{background:rgba(255,255,255,.05);color:#fff;padding-left:14px}
.ctx button.danger{color:var(--bad)}
.ctx .div{height:1px;background:var(--line);margin:4px 6px}

.toasts{
  position:fixed;top:14px;right:14px;z-index:400;display:flex;flex-direction:column;gap:8px;
  width:320px;max-width:calc(100vw - 28px);
}
.toast{
  background:#080808;border:1px solid var(--line-strong);border-left:2px solid var(--amber);
  padding:12px 14px;display:flex;gap:11px;position:relative;overflow:hidden;
  animation:toastIn .32s var(--ease) both;
}
.toast::after{
  content:'';position:absolute;left:0;bottom:0;height:1px;background:var(--amber-line);
  width:100%;transform-origin:left;animation:toastProgress 4.6s linear forwards;
}
@keyframes toastProgress{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
.toast.dismiss{animation:toastOut .25s var(--ease) both}
.toast .ic{color:var(--amber);margin-top:2px;animation:pulseDot 1.6s ease-in-out infinite}
.toast .tt{flex:1;min-width:0}
.toast .tt b{
  font-size:9.5px;display:block;margin-bottom:3px;font-family:'Orbitron',monospace;
  letter-spacing:.12em;text-transform:uppercase;
}
.toast .tt p{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .qreply{display:flex;gap:6px;margin-top:9px}
.toast .qreply input{
  flex:1;background:transparent;border-bottom:1px solid var(--line);padding:5px 0;font-size:11.5px;
}

/* call overlay */
.callui{
  position:fixed;inset:0;background:#030303;z-index:350;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;color:#fff;
  animation:scrimIn .3s var(--ease) both;
}
.callui .ring{position:absolute;border:1px solid rgba(232,182,76,.3);animation:ring 2.6s infinite;border-radius:50%}
@keyframes ring{0%{width:120px;height:120px;opacity:.9}100%{width:520px;height:520px;opacity:0}}
.callui .cav{
  width:120px;height:120px;display:grid;place-items:center;font-size:38px;font-weight:700;z-index:2;
  font-family:'Orbitron',monospace;border:1px solid var(--amber-line);
  animation:cardIn .4s var(--ease) both;
}
.callbar{display:flex;gap:14px;z-index:2}
.cbtn{
  width:54px;height:54px;display:grid;place-items:center;color:#fff;
  transition:background .2s var(--ease), transform .2s var(--ease);
  border:1px solid var(--line-strong);border-radius:50%;background:rgba(255,255,255,.05);
}
.cbtn:hover{background:rgba(255,255,255,.12);transform:scale(1.06)}
.cbtn:active{transform:scale(.9)}
.cbtn.end{background:var(--bad);animation:recPulse 1.8s ease-in-out infinite}
.cbtn.end:hover{background:#ef6b6b}
.cbtn.on{background:var(--amber);color:#000;border-color:var(--amber)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:720px){
  .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:80;background:#000;width:290px}
  .sidebar.hide{display:none}
  .main{padding-left:0}
}

function buildMessages(convo){
  const seed = SEEDS[convo.id] || [];
  const base = Date.now();
  const out = [];
  seed.forEach((s, i)=>{
    const [sender, text, mins, extra] = s;
    const ex = extra || {};
    out.push({
      id: convo.id + '_m' + i, sender, text, ts: base - mins*60000,
      status: ex.status || (sender === 'u0' ? (i % 3 === 0 ? 'read' : i % 3 === 1 ? 'delivered' : 'sent') : null),
      edited: !!ex.edited, deleted:false, type: ex.type || 'text',
      reactions: ex.reactions || {}, replyTo: ex.replyTo || null,
      pinned: !!ex.pinned, starred:false, dur: ex.dur || null,
      fname: ex.fname || null, fsize: ex.fsize || null, label: ex.label || null,
      mentions: ex.mentions || [], q: ex.q || null, opts: ex.opts || null, voted:null
    });
  });
  return out;
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function contact(id){ return CONTACTS.find(c=>c.id===id) || {id, name:'Unknown', init:'?', color:'#6b7280'}; }
function convo(id){ return CONVOS.find(c=>c.id===id); }

function fmtTime(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDay(ts){
  const d = new Date(ts), n = new Date();
  const same = (a,b)=>a.toDateString()===b.toDateString();
  if(same(d,n)) return 'TODAY';
  const y = new Date(n.getTime()-86400000);
  if(same(d,y)) return 'YESTERDAY';
  return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'}).toUpperCase();
}
function fmtRel(ts){
  const s = (Date.now()-ts)/1000;
  if(s < 60) return 'now';
  if(s < 3600) return Math.floor(s/60)+'m';
  if(s < 86400) return Math.floor(s/3600)+'h';
  if(s < 604800) return Math.floor(s/86400)+'d';
  return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'}).toUpperCase();
}
function fmtFull(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + ' · ' + fmtTime(ts);
}

function lastMsg(cid){ const arr = state.messages[cid]||[]; return arr.length ? arr[arr.length-1] : null; }
function previewOf(cid){
  const m = lastMsg(cid);
  if(!m) return {text:'No messages yet', who:''};
  const c = convo(cid);
  const who = m.sender === 'u0' ? 'You:' : (c.type==='group' ? contact(m.sender).name.split(' ')[0] + ':' : '');
  let t = m.text;
  if(m.deleted) t = 'This message was deleted';
  else if(m.type === 'voice') t = '🎤 Voice · ' + m.dur + 's';
  else if(m.type === 'file') t = '📎 ' + m.fname;
  else if(m.type === 'image') t = '🖼 ' + m.label;
  else if(m.type === 'poll') t = '📊 ' + m.q;
  return {text:t, who};
}

function toast(title, body, opts){
  opts = opts || {};
  if(!state.notifications && !opts.force) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    ${ic(opts.icon||'chat')}
    <div class="tt">
      <b>${esc(title)}</b>
      <p>${esc(body||'')}</p>
      ${opts.quickReply ? `<div class="qreply"><input placeholder="Quick reply…" data-qr="1"/><button class="btn primary" data-act="qr-send">Send</button></div>` : ''}
    </div>
    <button class="iconbtn" data-act="toast-close">${ic('x','sm')}</button>`;
  el.dataset.convo = opts.convo || '';
  $('#toasts').appendChild(el);
  const timeout = opts.sticky ? 9000 : 4600;
  setTimeout(()=>{
    if(el.parentNode){
      el.classList.add('dismiss');
      setTimeout(()=>el.remove(), 250);
    }
  }, timeout);
}

function sortedConvos(){
  let list = CONVOS.slice();
  if(state.folder === 'archived') list = list.filter(c=>c.archived);
  else {
    list = list.filter(c=>!c.archived);
    if(state.folder === 'unread')   list = list.filter(c=>c.unread>0);
    if(state.folder === 'priority') list = list.filter(c=>c.priority);
    if(state.folder === 'work')     list = list.filter(c=>c.folders.includes('work'));
    if(state.folder === 'personal') list = list.filter(c=>c.folders.includes('personal'));
    if(state.folder === 'groups')   list = list.filter(c=>c.type==='group');
  }
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    list = list.filter(c=>{
      const msgs = state.messages[c.id]||[];
      return c.name.toLowerCase().includes(q) ||
             (c.handle||'').toLowerCase().includes(q) ||
             msgs.some(m=>!m.deleted && (m.text||'').toLowerCase().includes(q));
    });
  }
  const cmp = {
    recent: (a,b)=> (lastMsg(b.id)?.ts||0) - (lastMsg(a.id)?.ts||0),
    unread: (a,b)=> b.unread - a.unread,
    alpha:  (a,b)=> a.name.localeCompare(b.name),
    priority:(a,b)=> (b.priority?1:0)-(a.priority?1:0) || (lastMsg(b.id)?.ts||0)-(lastMsg(a.id)?.ts||0)
  }[state.sort];
  list.sort(cmp);
  const pinned = list.filter(c=>c.pinned);
  const rest   = list.filter(c=>!c.pinned);
  return pinned.concat(rest);
}

function linkify(t){
  return t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/(@[a-z0-9_.]+)/gi, '<span style="color:var(--amber);font-weight:600">$1</span>');
}

function renderMessages(){
  const box = $('#msgs'); if(!box) return;
  const c = convo(state.activeConvo);
  const list = state.messages[c.id] || [];
  let html = '', lastDay = '', prev = null;
  list.forEach((m, i)=>{
    const d = fmtDay(m.ts);
    if(d !== lastDay){ html += `<div class="daysep">${d}</div>`; lastDay = d; prev = null; }
    const delay = Math.min(i*0.015, 0.25);
    html += msgHTML(m, prev, c).replace('class="mrow', `style="animation-delay:${delay}s" class="mrow`);
    prev = m;
  });
  if(!list.length) html = `<div class="empty">${ic('chat')}<div style="font-family:'Orbitron';font-size:9px;letter-spacing:.14em">NO MESSAGES</div></div>`;
  box.innerHTML = html;
  requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
}

      handleSuggest(ta.value);
    });
    ta.addEventListener('keydown', e=>{
      const suggestOpen = $('#popRoot') && $('#popRoot').querySelector('.pop.suggest');
      if(suggestOpen && (e.key==='Tab' || (e.key==='Enter' && !e.shiftKey))){
        const first = $('#popRoot .pop.suggest button');
        if(first){ e.preventDefault(); first.click(); return; }
      }
      if(e.key === 'Escape'){ closePop(); return; }
      if(e.key === 'Enter'){

        else if(!state.enterToSend && (e.ctrlKey||e.metaKey)){ e.preventDefault(); doSend(); }
      }
    });
    ta.focus();
    ta.selectionStart = ta.selectionEnd = ta.value.length;
  }

function autosize(ta){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight, 150) + 'px'; }
function closePop(){ const r = $('#popRoot'); if(r) r.innerHTML=''; }

const SLASH = [
  {c:'/mute',    d:'Mute this conversation'},
  {c:'/archive', d:'Archive this conversation'},
  {c:'/poll',    d:'Create a poll'},
  {c:'/event',   d:'Schedule an event'},
  {c:'/call',    d:'Start a voice call'},
  {c:'/dnd',     d:'Toggle Do Not Disturb'},
  {c:'/export',  d:'Export this conversation'},
  {c:'/help',    d:'Show all commands'}
];

function handleSuggest(val){
  const root = $('#popRoot'); if(!root) return;
  const ta = $('#composerInput');
  const caret = ta.selectionStart;
  const before = val.slice(0, caret);

  const slashM = before.match(/(^|\s)(\/[a-z]*)$/i);
  if(slashM){
    const q = slashM[2].toLowerCase();
    const hits = SLASH.filter(s=>s.c.startsWith(q));
    if(hits.length){
      root.innerHTML = `<div class="pop suggest">
        <div class="pophead">SLASH COMMANDS</div>
        ${hits.map(s=>`<button data-act="insert" data-text="${esc(s.c)} ">${ic('slash','sm')}<span>${esc(s.c)}<span class="sub">${esc(s.d)}</span></span></button>`).join('')}
      </div>`;
      return;
    }
  }
  const atM = before.match(/(^|\s)@([a-z0-9_]*)$/i);
  if(atM){
    const q = atM[2].toLowerCase();
    const c = convo(state.activeConvo);
    const hits = c.members.map(contact).filter(m=>m.name.toLowerCase().includes(q) || (m.handle||'').toLowerCase().includes(q));
    const all = [{id:'everyone',name:'everyone',handle:'@everyone',color:'#e8b64c'},{id:'admins',name:'admins',handle:'@admins',color:'#e8b64c'}].concat(hits);
    root.innerHTML = `<div class="pop suggest">
      <div class="pophead">MENTION</div>
      ${all.slice(0,8).map(m=>`<button data-act="insert" data-text="${esc(m.handle)} ">
        <span class="av sm" style="background:${m.color||'#555'}18;border-color:${m.color||'#555'}50;color:${m.color||'#555'}">${av(m.name,m.color||'#555')}</span>
        <span>${esc(m.name)}<span class="sub">${esc(m.handle)}</span></span></button>`).join('')}
    </div>`;
    return;
  }
  closePop();
}

/* ============================================================
   SEND
   ============================================================ */
function doSend(){
  const ta = $('#composerInput'); if(!ta) return;
  const c = convo(state.activeConvo);
  if(!c) return;
  let text = ta.value.trim();
  if(!text && !state.editing) return;

  if(state.editing){
    const m = state.messages[c.id].find(x=>x.id===state.editing);
    if(m){ m.text = text; m.edited = true; }
    state.editing = null;
    ta.value = ''; renderMessages(); renderComposer();
    toast('MESSAGE EDITED','The "edited" indicator is now shown.', {icon:'edit'});
    return;
  }

  if(text.startsWith('/')){
    const cmd = text.split(' ')[0].toLowerCase();
    const handled = runSlash(cmd, text);
    if(handled){ ta.value=''; state.drafts[c.id]=''; renderComposer(); return; }
  }

  const msg = {
    id: c.id + '_' + Date.now(), sender:'u0', text, ts: Date.now(),
    status:'sent', edited:false, deleted:false, type:'text', reactions:{},
    replyTo: state.replyTo || null, pinned:false, starred:false,
    mentions: (text.match(/@[a-z0-9_.]+/gi)||[])
  };
  state.messages[c.id].push(msg);
  state.replyTo = null;
  ta.value = ''; state.drafts[c.id] = '';
  renderMessages(); renderComposer();
  simulateDelivery(c, msg);
  if(state.autoReply && Math.random() > .55) scheduleReply(c);
}

function simulateDelivery(c, msg){
  setTimeout(()=>{ if(msg.status==='sent'){ msg.status='delivered'; if(state.activeConvo===c.id) renderMessages(); } }, 900);
  setTimeout(()=>{ if(msg.status==='delivered'){ msg.status='read'; if(state.activeConvo===c.id) renderMessages(); } }, 2400);
  setTimeout(()=>{
    if(c.type==='dm' && !c.blocked && Math.random() > .35){
      state.typing[c.id] = contact(c.members.find(m=>m!=='u0')).name.split(' ')[0];
      if(state.activeConvo===c.id) renderTypingRow();
      setTimeout(()=>{ delete state.typing[c.id]; if(state.activeConvo===c.id) renderTypingRow(); autoReply(c); }, 2200);
    }
  }, 1800);
}

const AUTOREPLIES = [
  'Copy that.', 'Understood — will action.', 'Thanks, reviewing now.',
  'Can you confirm the timestamp?', 'Noted. Standing by.', 'Acknowledged.',
  'Give me 10 minutes.', 'That matches what I have.'
];
function autoReply(c){
  const other = c.members.find(m=>m!=='u0');
  if(!other) return;
  const m = {
    id: c.id+'_'+Date.now(), sender: other,
    text: AUTOREPLIES[Math.floor(Math.random()*AUTOREPLIES.length)],
    ts: Date.now(), status:null, edited:false, deleted:false, type:'text',
    reactions:{}, replyTo:null, pinned:false, starred:false, mentions:[]
  };
  state.messages[c.id].push(m);
  if(state.activeConvo === c.id && state.view==='chats') renderMessages();
  else { c.unread++; renderSidebar(); }
  if(state.notifications && !state.dnd && !c.muted){
    toast(c.name, m.text, {convo:c.id, quickReply:true, icon:'chat'});
  }
}
function scheduleReply(c){ setTimeout(()=>autoReply(c), 4000); }

function runSlash(cmd, full){
  const c = convo(state.activeConvo);
  if(!c) return false;
  switch(cmd){
    case '/mute':    c.muted = true; renderSidebar(); toast('MUTED', c.name + ' notifications silenced.', {icon:'belloff'}); return true;
    case '/archive': c.archived = true; renderSidebar(); state.activeConvo = null; renderAll(); toast('ARCHIVED', c.name + ' moved to archive.', {icon:'archive'}); return true;
    case '/poll':    openPollModal(); return true;
    case '/event':   openEventModal(); return true;
    case '/call':    startCall('voice'); return true;
    case '/dnd':     state.dnd = !state.dnd; toast('DO NOT DISTURB', state.dnd?'ENABLED':'DISABLED', {icon:'belloff'}); return true;
    case '/export':  exportCSV(c.id); return true;
    case '/help':    openHelpModal(); return true;
    default: return false;
  }
}

function drawNetwork(){
  const cv = $('#netCanvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);

  const nodes = CONTACTS.slice(0,9).map((c,i)=>{
    const a = (i/9)*Math.PI*2 - Math.PI/2;
    const r = 130 + (i%3)*26;
    return {
      id:c.id, name:c.name.split(' ')[0].toUpperCase(), color:c.color,
      x: W/2 + Math.cos(a)*r*1.55,
      y: H/2 + Math.sin(a)*r*0.82,
      size: 11 + (i%4)*5,
      flagged: c.tags.includes('flagged'),
      phase: i * 0.9
    };
  });

  const edges = [];
  nodes.forEach((n,i)=>{
    edges.push([i,(i+1)%nodes.length, 1 + (i%3)*0.6]);
    if(i%2===0) edges.push([i,(i+4)%nodes.length, 0.6]);
  });

  let t = 0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t += 0.015;
    edges.forEach(([a,b,w])=>{
      ctx.beginPath();
      ctx.moveTo(nodes[a].x, nodes[a].y);
      ctx.lineTo(nodes[b].x, nodes[b].y);
      ctx.strokeStyle = 'rgba(232,182,76,'+(0.08 + w*0.10 + Math.sin(t*1.5 + a)*0.02)+')';
      ctx.lineWidth = 0.6 + w;
      ctx.stroke();
    });
    nodes.forEach(n=>{
      const breathe = 1 + Math.sin(t + n.phase)*0.06;
      const s = n.size * breathe;
      ctx.beginPath(); ctx.arc(n.x,n.y,s,0,7);
      ctx.fillStyle = n.color; ctx.globalAlpha = .8; ctx.fill(); ctx.globalAlpha = 1;
      if(n.flagged){ ctx.strokeStyle = '#e05858'; ctx.lineWidth = 2; ctx.stroke(); }
      else { ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.fillStyle = 'rgba(230,230,240,.7)';
      ctx.font = '9px Orbitron, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, n.x, n.y + s + 14);
    });
    if(state.view === 'intel' && state.intelTab === 'network') requestAnimationFrame(frame);
  }
  frame();
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) { closeCtx(); return; }
  const act = t.dataset.act;

  switch(act){
    case 'view': state.view = t.dataset.view; closeCtx(); renderAll(); break;
    case 'folder': state.folder = t.dataset.folder; renderSidebar(); break;
    case 'open': {
      const id = t.dataset.id;
      state.activeConvo = id; state.view = 'chats';
      const c = convo(id);
      if(c){ c.unread = 0; if(c.blocked) toast('BLOCKED','This user is blocked.',{icon:'lock'}); }
      renderAll(); break;
    }
    case 'dm': {
      const id = t.dataset.id;
      let c = CONVOS.find(x=>x.type==='dm' && x.members.includes(id));
      if(c){ state.activeConvo = c.id; state.view='chats'; c.unread=0; renderAll(); }
      break;
    }
    case 'close-chat': state.activeConvo = null; state.replyTo = null; state.editing = null; renderAll(); break;

    case 'convo-menu': {
      e.stopPropagation();
      const rect = t.getBoundingClientRect();
      openConvoCtx(t.dataset.id, rect.left - 180, rect.bottom + 4);
      break;
    }

    case 'mark-all-read': CONVOS.forEach(c=>c.unread=0); renderSidebar(); toast('ALL CAUGHT UP','Every conversation marked read.',{icon:'checks'}); break;

    case 'send': doSend(); break;
    case 'emoji': popEmoji(); break;
    case 'attach': popAttach(); break;
    case 'gif': popGif(); break;
    case 'camera': openCamera(); break;
    case 'record': toggleRecord(); break;
    case 'fmt': applyFmt(t.dataset.f); break;
    case 'mention': insertText('@'); break;
    case 'slash': insertText('/'); break;
    case 'schedule': openSchedule(); break;
    case 'template': openTemplates(); break;
    case 'poll': openPollModal(); break;
    case 'event': openEventModal(); break;
    case 'cancel-reply': state.replyTo = null; renderComposer(); break;
    case 'cancel-edit': state.editing = null; renderComposer(); break;
    case 'insert': insertText(t.dataset.text); closePop(); break;
    case 'tts': ttsRead(); break;
    case 'stt': sttStart(); break;

    case 'reply': state.replyTo = t.dataset.id; state.editing = null; renderComposer(); $('#composerInput') && $('#composerInput').focus(); break;
    case 'edit': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      if(m && m.sender==='u0'){ state.editing = m.id; state.replyTo = null; renderComposer(); }
      else toast('CANNOT EDIT','Only your own messages.',{icon:'info'}); break;
    }
    case 'pin-msg': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      m.pinned = !m.pinned; renderMessages(); renderChat();
      toast(m.pinned?'PINNED':'UNPINNED','Message updated.',{icon:'pin'}); break;
    }
    case 'star-msg': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      m.starred = !m.starred;
      if(m.starred) state.saved.push(m.id); else state.saved = state.saved.filter(x=>x!==m.id);
      renderMessages();
      toast(m.starred?'SAVED':'REMOVED','Saved messages updated.',{icon:'star'}); break;
    }
    case 'forward': state.forwardMsg = t.dataset.id; openForwardModal(); break;
    case 'quick-react': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      addReaction(m, '👍'); break;
    }
    case 'react': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      addReaction(m, t.dataset.e); break;
    }
    case 'vote': {
      const m = state.messages[state.activeConvo].find(x=>x.id===t.dataset.id);
      const i = +t.dataset.i;
      if(m.voted === i) return;
      if(m.voted != null) m.opts[m.voted][1]--;
      m.opts[i][1]++; m.voted = i;
      renderMessages(); break;
    }
    case 'play-voice': {
      const el = t.closest('.voice');
      const bars = el.querySelector('.wave').querySelectorAll('i');
      let n = 0;
      bars.forEach(b=>b.classList.remove('p'));
      const iv = setInterval(()=>{
        if(n >= bars.length){ clearInterval(iv); bars.forEach(b=>b.classList.remove('p')); return; }
        bars[n].classList.add('p'); n++;
      }, 90);
      break;
    }
    case 'voice-speed': {
      const speeds = ['0.5x','1x','1.5x','2x'];
      const cur = speeds.indexOf(t.textContent);
      t.textContent = speeds[(cur+1)%speeds.length]; break;
    }
    case 'msg-menu': openMsgCtx(t.dataset.id, e.clientX, e.clientY); break;
    case 'open-media': openMediaViewer(t.dataset.label); break;
    case 'download': toast('DOWNLOAD STARTED','File saved to Downloads.',{icon:'download'}); break;

    case 'intel-tab': state.intelTab = t.dataset.t; renderIntel(); break;
    case 'start-call': startCall(t.dataset.mode); break;
    case 'account': openAccountSwitcher(); break;

    case 'toast-close': {
      const el = t.closest('.toast');
      el.classList.add('dismiss');
      setTimeout(()=>el.remove(), 250);
      break;
    }
    case 'qr-send': {
      const wrap = t.closest('.toast');
      const input = wrap.querySelector('input');
      const cid = wrap.dataset.convo;
      if(input.value.trim() && cid){
        state.messages[cid].push({
          id: cid+'_'+Date.now(), sender:'u0', text:input.value.trim(), ts:Date.now(),
          status:'sent', edited:false, deleted:false, type:'text', reactions:{}, replyTo:null,
          pinned:false, starred:false, mentions:[]
        });
        if(state.activeConvo===cid) renderMessages();
        renderSidebar();
      }
      wrap.classList.add('dismiss');
      setTimeout(()=>wrap.remove(), 250);
      break;
    }
    case 'watch': if(state.activeConvo) state.watchlist.push(state.activeConvo); toast('WATCHLIST','Added.', {icon:'eye'}); break;
    case 'unwatch': state.watchlist = state.watchlist.filter(x=>x!==t.dataset.id); renderIntel(); break;
    case 'add-watch': {
      const sel = $('[data-input="watchpick"]');
      if(sel){ state.watchlist.push(sel.value); renderIntel(); toast('WATCHLIST','Contact added.',{icon:'eye'}); }
      break;
    }
    case 'unblock': state.blocked = state.blocked.filter(x=>x!==t.dataset.id); renderContacts(); break;
    case 'copy-invite': {
      const c = state.activeConvo ? convo(state.activeConvo) : null;
      const link = (c && c.invite) || 'sentinel.app/join/krenner-4a2f';
      navigator.clipboard && navigator.clipboard.writeText(link);
      toast('COPIED', link, {icon:'link'}); break;
    }
    case 'export-csv':  exportCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'export-txt':  exportTXT(); break;
    case 'export-report': exportReport(); break;
    case 'export-convo': exportCSV(state.activeConvo); break;
    case 'notif-history': openNotifHistory(); break;
    case 'saved': openSaved(); break;
    case 'reminders': openReminders(); break;
    case 'followups': openFollowups(); break;
    case 'block': toast('BLOCKED','Contact moved to block list.',{icon:'lock'}); break;
    case 'report': openReportModal(); break;
    case 'my-qr': toast('QR CODE','Your profile QR is ready to scan.',{icon:'qr'}); break;
    case 'ack-alert': t.textContent='ACKED'; t.disabled = true; break;
    case 'add-member': openAddMember(); break;
    case 'remove-member': toast('REMOVE MEMBER','Select a member from the list.',{icon:'users'}); break;
    case 'group-settings': openGroupSettings(); break;
    case 'group-poll': openPollModal(); break;
    case 'group-event': openEventModal(); break;
    case 'edit-note': openNoteModal(); break;
    case 'edit-tags': openTagsModal(); break;
    case 'share-contact': toast('CONTACT SHARED','QR code displayed.',{icon:'qr'}); break;
    case 'new-group': openNewGroup(); break;
    case 'chat-search': openChatSearch(); break;
    case 'jump-date': openJumpDate(); break;
    case 'chat-menu': openChatCtx(e.clientX, e.clientY); break;
    case 'contact-menu': openContactCtx(t.dataset.id, e.clientX, e.clientY); break;
    case 'upload': toast('UPLOAD','Choose files to upload.',{icon:'plus'}); break;
    case 'clear-cache': toast('CACHE CLEARED','486 MB freed.',{icon:'trash'}); break;
    case 'flag-followup': if(state.activeConvo) state.followups.push(state.activeConvo); toast('FOLLOW-UP FLAGGED','Added to follow-up list.',{icon:'flag'}); break;
    case 'change-photo': toast('UPLOAD','Choose an image from your device.',{icon:'image'}); break;
    case 'remove-photo': toast('REMOVED','Profile photo removed.',{icon:'trash'}); break;
    case 'add-contact': toast('ADD CONTACT','Search by username, phone, or QR.',{icon:'plus'}); break;
    case 'filter-tag': break;
    case 'toggle-generic': t.classList.toggle('on'); break;
  }
});

const TOGGLES = {
  'toggle-notif': ()=> state.notifications = !state.notifications,
  'toggle-dnd': ()=> state.dnd = !state.dnd,
  'toggle-mention-only': ()=> state.mentionOnly = !state.mentionOnly,
  'toggle-receipts': ()=> state.readReceipts = !state.readReceipts,
  'toggle-typing': ()=> state.typingIndicator = !state.typingIndicator,
  'toggle-links': ()=> state.linkPreviews = !state.linkPreviews,
  'toggle-contrast': ()=> state.highContrast = !state.highContrast,
  'toggle-cb': ()=> state.colorblind = !state.colorblind,
  'toggle-captions': ()=> state.captions = !state.captions,
  'toggle-enter': ()=> state.enterToSend = !state.enterToSend,
  'toggle-autoreply': ()=> state.autoReply = !state.autoReply,
  'toggle-away': ()=> state.awayStatus = !state.awayStatus,
  'toggle-rtl': ()=> state.rtl = !state.rtl
};
Object.entries(TOGGLES).forEach(([act, fn])=>{
  document.addEventListener('click', e=>{
    const t = e.target.closest('[data-act="'+act+'"]');
    if(!t) return;
    fn();
    applyRootSettings();
    if(state.view === 'settings') renderSettings();
    if(state.activeConvo) renderComposer();
  }, true);
});

function applyRootSettings(){
  const r = document.documentElement;
  r.dataset.theme = state.theme;
  r.dataset.density = state.density;
  r.dataset.contrast = state.highContrast ? 'high' : 'normal';
  r.dataset.cb = state.colorblind ? 'on' : 'off';
  r.dir = state.rtl ? 'rtl' : 'ltr';
  r.style.fontSize = (state.fontScale * 100) + '%';
}

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.input === 'search'){ state.search = t.value; renderSidebar(); setTimeout(()=>{ const s=$('#globalSearch'); if(s){ s.focus(); s.selectionStart=s.selectionEnd=s.value.length; } },0); }
  if(t.dataset.input === 'sort'){ state.sort = t.value; renderSidebar(); }
  if(t.dataset.input === 'set-density'){ state.density = t.value; applyRootSettings(); }
  if(t.dataset.input === 'set-font'){ state.fontScale = parseFloat(t.value); applyRootSettings(); renderSettings(); }
  if(t.dataset.input === 'set-name'){ me().name = t.value; }
  if(t.dataset.input === 'set-handle'){ me().handle = t.value; }
  if(t.dataset.input === 'set-bio'){ me().bio = t.value; }
});

function closeCtx(){ const c = $('.ctx'); if(c) c.remove(); }
document.addEventListener('contextmenu', e=>{
  const row = e.target.closest('[data-ctx="convo"]');
  const chat = e.target.closest('[data-ctx="chat"]');
  if(row){ e.preventDefault(); openConvoCtx(row.dataset.id, e.clientX, e.clientY); }
  else if(chat){ e.preventDefault(); openChatCtx(e.clientX, e.clientY); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.ctx')) closeCtx(); });

function ctxMenu(x, y, items){
  closeCtx();
  const el = document.createElement('div');
  el.className = 'ctx';
  el.style.left = Math.max(8, Math.min(x, window.innerWidth-230)) + 'px';
  el.style.top = Math.max(8, Math.min(y, window.innerHeight-300)) + 'px';
  el.innerHTML = items.map(i=> i === '---' ? '<div class="div"></div>' :
    `<button class="${i.danger?'danger':''}" data-cact="${i.id}">${ic(i.icon,'sm')}${esc(i.label)}</button>`).join('');
  document.body.appendChild(el);
  el.querySelectorAll('[data-cact]').forEach(b=>{
    b.onclick = ()=>{ const item = items.find(i=>i.id===b.dataset.cact); closeCtx(); item && item.run(); };
  });
}

function openConvoCtx(id, x, y){
  const c = convo(id);
  ctxMenu(x, y, [
    {id:'pin', icon:'pin', label: c.pinned?'UNPIN':'PIN', run:()=>{ c.pinned=!c.pinned; renderSidebar(); }},
    {id:'mute', icon:'belloff', label: c.muted?'UNMUTE':'MUTE', run:()=>{ c.muted=!c.muted; renderSidebar(); }},
    {id:'arch', icon:'archive', label: c.archived?'UNARCHIVE':'ARCHIVE', run:()=>{ c.archived=!c.archived; if(state.activeConvo===c.id) state.activeConvo=null; renderAll(); }},
    {id:'star', icon:'star', label: c.priority?'REMOVE PRIORITY':'MARK PRIORITY', run:()=>{ c.priority=!c.priority; renderSidebar(); }},
    '---',
    {id:'read', icon:'checks', label:'MARK READ', run:()=>{ c.unread=0; renderSidebar(); }},
    {id:'unread', icon:'eye', label:'MARK UNREAD', run:()=>{ c.unread=1; renderSidebar(); }},
    '---',
    {id:'del', icon:'trash', label:'DELETE', danger:true, run:()=>{
      const i = CONVOS.indexOf(c); CONVOS.splice(i,1);
      if(state.activeConvo===c.id) state.activeConvo = null;
      renderAll();
    }}
  ]);
}

function openChatCtx(x, y){
  const c = convo(state.activeConvo);
  if(!c) return;
  ctxMenu(x, y, [
    {id:'search', icon:'search', label:'SEARCH IN CHAT', run:openChatSearch},
    {id:'jump', icon:'calendar', label:'JUMP TO DATE', run:openJumpDate},
    '---',
    {id:'mute', icon:'belloff', label: c.muted?'UNMUTE':'MUTE', run:()=>{ c.muted=!c.muted; renderChat(); renderSidebar(); }},
    {id:'export', icon:'download', label:'EXPORT', run:()=>exportCSV(c.id)},
    '---',
    {id:'clear', icon:'trash', label:'CLEAR HISTORY', danger:true, run:()=>{ state.messages[c.id]=[]; renderChat(); }}
  ]);
}

function openMsgCtx(id, x, y){
  const c = convo(state.activeConvo);
  if(!c) return;
  const m = state.messages[c.id].find(x=>x.id===id);
  ctxMenu(x, y, [
    {id:'reply', icon:'reply', label:'REPLY', run:()=>{ state.replyTo=id; renderComposer(); }},
    {id:'forward', icon:'forward', label:'FORWARD', run:()=>{ state.forwardMsg=id; openForwardModal(); }},
    {id:'copy', icon:'copy', label:'COPY TEXT', run:()=>{ navigator.clipboard && navigator.clipboard.writeText(m.text||''); toast('COPIED','Message copied.',{icon:'copy'}); }},
    '---',
    {id:'pin', icon:'pin', label: m.pinned?'UNPIN':'PIN', run:()=>{ m.pinned=!m.pinned; renderMessages(); }},
    {id:'star', icon:'star', label: m.starred?'UNSAVE':'SAVE', run:()=>{ m.starred=!m.starred; renderMessages(); }},
    {id:'remind', icon:'clock', label:'REMIND ME', run:()=>{ state.reminders.push(id); toast('REMINDER SET','You will be reminded in 1 hour.',{icon:'clock'}); }},
    {id:'follow', icon:'flag', label:'FOLLOW-UP', run:()=>{ state.followups.push(id); toast('FLAGGED','Added to follow-ups.',{icon:'flag'}); }},
    '---',
    {id:'edit', icon:'edit', label:'EDIT', run:()=>{ if(m.sender==='u0'){ state.editing=id; renderComposer(); } else toast('CANNOT EDIT','Only your own messages.',{icon:'info'}); }},
    {id:'delme', icon:'trash', label:'DELETE FOR ME', danger:true, run:()=>{ state.messages[c.id] = state.messages[c.id].filter(x=>x.id!==id); renderMessages(); }},
    {id:'delall', icon:'trash', label:'DELETE FOR EVERYONE', danger:true, run:()=>{ m.deleted=true; m.text=''; renderMessages(); }}
  ]);
}

function openContactCtx(id, x, y){
  const c = contact(id);
  ctxMenu(x, y, [
    {id:'msg', icon:'chat', label:'MESSAGE', run:()=>{ const cv = CONVOS.find(x=>x.members.includes(id)); if(cv){ state.activeConvo=cv.id; state.view='chats'; renderAll(); } }},
    {id:'call', icon:'phone', label:'VOICE CALL', run:()=>startCall('voice')},
    {id:'video', icon:'video', label:'VIDEO CALL', run:()=>startCall('video')},
    '---',
    {id:'note', icon:'edit', label:'EDIT NOTE', run:openNoteModal},
    {id:'tag', icon:'flag', label:'EDIT TAGS', run:openTagsModal},
    {id:'watch', icon:'eye', label:'ADD TO WATCHLIST', run:()=>{ state.watchlist.push(id); toast('WATCHLIST', c.name+' added.',{icon:'eye'}); }},
    '---',
    {id:'block', icon:'lock', label: c.blocked?'UNBLOCK':'BLOCK', danger:!c.blocked, run:()=>{ c.blocked=!c.blocked; if(c.blocked) state.blocked.push(id); else state.blocked=state.blocked.filter(x=>x!==id); renderAll(); }},
    {id:'report', icon:'alert', label:'REPORT', danger:true, run:openReportModal}
  ]);
}

function addReaction(m, e){
  if(!m.reactions) m.reactions = {};
  if(m.mineReact === e){ m.reactions[e]--; if(m.reactions[e]<=0) delete m.reactions[e]; m.mineReact = null; }
  else {
    if(m.mineReact && m.reactions[m.mineReact]) { m.reactions[m.mineReact]--; if(m.reactions[m.mineReact]<=0) delete m.reactions[m.mineReact]; }
    m.reactions[e] = (m.reactions[e]||0)+1;
    m.mineReact = e;
  }
  renderMessages();
}

function insertText(txt){
  const ta = $('#composerInput'); if(!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0,s) + txt + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + txt.length;
  autosize(ta);
  state.drafts[state.activeConvo] = ta.value;
  const sb = $('#sendBtn'); if(sb) sb.disabled = !ta.value.trim();
  ta.focus();
  closePop();
}

function applyFmt(f){
  const ta = $('#composerInput'); if(!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s,e) || 'text';
  const rep = f === '> ' ? f + sel : f + sel + f;
  ta.value = ta.value.slice(0,s) + rep + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + rep.length;
  ta.focus();
  state.drafts[state.activeConvo] = ta.value;
}

let recTimer = null;
function toggleRecord(){
  const c = convo(state.activeConvo); if(!c) return;
  const btn = $('#recBtn');
  if(!recTimer){
    recTimer = {sec:0};
    btn.classList.add('on');
    btn.innerHTML = ic('phoneoff');
    btn.style.animation = 'recPulse 1.4s ease-in-out infinite';
    toast('RECORDING','Hold and slide to cancel.',{icon:'mic'});
    recTimer.iv = setInterval(()=>{ recTimer.sec++; }, 1000);
  } else {
    clearInterval(recTimer.iv);
    const dur = Math.max(1, recTimer.sec);
    recTimer = null;
    btn.classList.remove('on');
    btn.style.animation = '';
    btn.innerHTML = ic('mic');
    state.messages[c.id].push({
      id: c.id+'_'+Date.now(), sender:'u0', text:'', ts:Date.now(), status:'sent',
      edited:false, deleted:false, type:'voice', reactions:{}, replyTo:null,
      pinned:false, starred:false, mentions:[], dur
    });
    renderMessages();
    toast('VOICE MESSAGE SENT', dur + 's', {icon:'mic'});
  }
}

function ttsRead(){
  const c = convo(state.activeConvo); if(!c) return;
  const msgs = (state.messages[c.id]||[]).slice(-3).map(m=>m.text).join('. ');
  if(!('speechSynthesis' in window)){ toast('TEXT-TO-SPEECH','Not supported.',{icon:'volume'}); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(msgs);
  window.speechSynthesis.speak(u);
  toast('READING ALOUD','Last 3 messages.',{icon:'volume'});
}
function sttStart(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('SPEECH-TO-TEXT','Not supported.',{icon:'mic'}); return; }
  const r = new SR();
  r.lang = 'en-US'; r.interimResults = true;
  r.onresult = ev=>{
    const txt = Array.from(ev.results).map(x=>x[0].transcript).join('');
    const ta = $('#composerInput');
    if(ta){ ta.value = txt; autosize(ta); state.drafts[state.activeConvo] = txt; }
  };
  r.start();
  toast('LISTENING','Dictate your message…',{icon:'mic'});
}

function openModal(title, body, buttons, wide){
  const layer = document.createElement('div');
  layer.className = 'scrim';
  layer.innerHTML = `
    <div class="modal ${wide?'wide':''}">
      <header>
        <h3>${esc(title)}</h3>
        <button class="iconbtn" data-mclose>${ic('x')}</button>
      </header>
      <div class="mbody">${body}</div>
    </div>`;
  layer.addEventListener('click', e=>{
    if(e.target === layer || e.target.closest('[data-mclose]')) layer.remove();
  });
  document.getElementById('layers').appendChild(layer);
  return layer;
}

function openChatSearch(){
  const c = convo(state.activeConvo); if(!c) return;
  openModal('Search in conversation', `
    <div class="field"><input type="text" id="csQ" placeholder="Search this conversation…" autofocus/></div>
    <div id="csResults" style="max-height:320px;overflow-y:auto"></div>
    <div class="btnrow"><button class="btn" data-mclose>CLOSE</button></div>`);
  const q = document.getElementById('csQ');
  const res = document.getElementById('csResults');
  const run = ()=>{
    const v = q.value.toLowerCase().trim();
    const hits = (state.messages[c.id]||[]).filter(m=>!m.deleted && (m.text||'').toLowerCase().includes(v));
    res.innerHTML = v ? (hits.length ? hits.map(m=>`
      <div class="listrow" data-goto="${m.id}">
        <div style="flex:1;min-width:0">
          <div style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.text)}</div>
          <div style="font-size:9px;color:var(--ink-4);font-family:'Orbitron';letter-spacing:.08em">${fmtDay(m.ts)} · ${fmtTime(m.ts)}</div>
        </div>
      </div>`).join('') : '<div class="lbl" style="padding:10px">No matches.</div>')
      : '<div class="lbl" style="padding:10px">Type to search.</div>';
    res.querySelectorAll('[data-goto]').forEach(r=>{
      r.onclick = ()=>{ closeModal(); const el = document.querySelector(`.mrow[data-mid="${r.dataset.goto}"]`); if(el){ el.classList.add('hl'); el.scrollIntoView({block:'center',behavior:'smooth'}); setTimeout(()=>el.classList.remove('hl'), 1600); } };

  };
  q.addEventListener('input', run);
  run();
  setTimeout(()=>q.focus(), 50);
}

    };
  });
