<!DOCTYPE html>
<html lang="en" data-theme="amoled" data-density="comfortable">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AtlasTalon · TALON</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --amber:#e8b64c;
  --amber-bright:#ffcf72;
  --amber-soft:rgba(232,182,76,.10);
  --amber-line:rgba(232,182,76,.28);
  --ink-1:rgba(255,255,255,.92);
  --ink-2:rgba(255,255,255,.66);
  --ink-3:rgba(255,255,255,.42);
  --ink-4:rgba(255,255,255,.26);
  --ink-5:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.06);
  --line-strong:rgba(255,255,255,.12);
  --ok:#6dbf8a;
  --warn:#e8b64c;
  --bad:#e05858;
  --danger:#e05858;
  --info:#7fb8d8;
  --fs:13px;
  --ease:cubic-bezier(.2,.8,.3,1);
}
html[data-density="compact"]{ --fs:12.5px; }
html[data-density="spacious"]{ --fs:13.5px; }

*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:0px;height:0px;background:transparent}
*{scrollbar-width:none}
html,body{height:100%;overflow-x:hidden}
body{
  background:#000;color:var(--ink-1);
  font:var(--fs)/1.55 'Inter',system-ui,-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;
}
input,textarea,select{user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
select{cursor:pointer;color:var(--ink-2);font-size:10px;font-family:'Orbitron',monospace;letter-spacing:.06em;padding:2px 0}
select option{background:#0a0a0a;color:#fff}
a{color:var(--amber);text-decoration:none}

.ic{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.sm{width:14px;height:14px}
.ic.lg{width:22px;height:22px}
.lbl{font-family:'Orbitron',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* ============================================================
   MOTION
   ============================================================ */
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes dotBreathe{0%,100%{box-shadow:0 0 0 0 currentColor}50%{box-shadow:0 0 0 4px transparent}}
@keyframes badgePop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes ctxIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes toastIn{from{transform:translateX(110%) scale(.96);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
@keyframes toastOut{to{transform:translateX(110%);opacity:0}}
@keyframes phPulse{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:.85;transform:translateY(-2px)}}
@keyframes underlineSlide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wavePlay{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,88,88,.6)}50%{box-shadow:0 0 0 8px rgba(224,88,88,0)}}
@keyframes sendReady{0%,100%{box-shadow:0 0 0 0 rgba(232,182,76,.35)}50%{box-shadow:0 0 0 7px rgba(232,182,76,0)}}
@keyframes sendPress{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes modalFade{0%{opacity:0}100%{opacity:1}}
@keyframes modalSlide{0%{transform:translateY(24px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ringOut{0%{transform:translate(-50%,-50%) scale(.85);opacity:.55}70%{opacity:.10}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes callShake{0%,100%{transform:translateX(0) rotate(0)}10%{transform:translateX(-5px) rotate(-3deg)}20%{transform:translateX(5px) rotate(3deg)}30%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(4px) rotate(2deg)}50%{transform:translateX(0) rotate(0)}}
@keyframes videoFlicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.85}49%{opacity:1}}
@keyframes callTopIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes callBottomIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pipIn{from{opacity:0;transform:scale(.85) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ============================================================
   AMBIENT
   ============================================================ */
.scanline{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.030) 0px,rgba(0,0,0,.030) 2px,transparent 2px,transparent 7px);
}
.glitch-line{
  position:fixed;top:0;left:0;width:100%;height:1px;background:rgba(255,255,255,.09);
  box-shadow:0 0 8px rgba(255,255,255,.05);z-index:9998;pointer-events:none;opacity:0;
  animation:glitchLine 8s linear infinite;
}
@keyframes glitchLine{
  0%,100%{opacity:0}4%{opacity:.85}5%{opacity:0}
  39%{opacity:0}43%{opacity:.5}44%{opacity:0}
  72%{opacity:0}77%{opacity:.4}78%{opacity:0}
}
.screen-glitch{
  position:fixed;inset:0;pointer-events:none;z-index:9997;opacity:0;
  background:linear-gradient(transparent 0%,rgba(255,255,255,.03) 46%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 54%,transparent 100%);
  mix-blend-mode:screen;
}
.screen-glitch.active{animation:screenTear .22s steps(3,end) 1}
@keyframes screenTear{
  0%{opacity:0;transform:translateY(-4%)}
  20%{opacity:1;transform:translateY(3%)}
  45%{opacity:.4;transform:translateY(-2%)}
  70%{opacity:.9;transform:translateY(2%)}
  100%{opacity:0;transform:translateY(0)}
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  display:flex;height:100vh;width:100vw;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%,#101010 0%,#050505 55%,#000 100%);
}

/* SIDEBAR */
.sidebar{width:320px;flex:0 0 320px;display:flex;flex-direction:column;min-width:0;position:relative}
.sidebar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--line)}
.sb-top{padding:16px 18px 0;flex-shrink:0}
.sb-brand{
  display:flex;align-items:center;gap:9px;font-family:'Orbitron',monospace;
  font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#fff;
  margin-bottom:16px;
}
.sb-brand .dot{
  width:6px;height:6px;background:var(--amber);
  box-shadow:0 0 12px rgba(232,182,76,.6);animation:pulseDot 1.6s ease-in-out infinite;
}
.sb-nav{display:flex;gap:2px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sb-nav-btn{
  padding:6px 9px;font-size:8.5px;font-weight:600;letter-spacing:.14em;
  font-family:'Orbitron',monospace;text-transform:uppercase;color:var(--ink-4);
  transition:color .2s var(--ease), background .2s var(--ease);
  position:relative;border-radius:2px;
}
.sb-nav-btn:hover{color:var(--ink-2);background:rgba(255,255,255,.03)}
.sb-nav-btn.on{color:var(--amber)}
.sb-nav-btn.on::after{
  content:'';position:absolute;left:9px;right:9px;bottom:-14px;height:1px;background:var(--amber);
  transform-origin:left;animation:underlineSlide .35s var(--ease) both;
}
.searchwrap{margin:14px 18px 10px;position:relative}
.searchwrap .ic{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--ink-4);transition:color .2s var(--ease)}
.searchwrap:focus-within .ic{color:var(--amber)}
.searchwrap input{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:6px 40px 6px 24px;font-size:11px;font-family:'Orbitron',monospace;
  letter-spacing:.08em;transition:border-color .25s var(--ease);
}
.searchwrap input::placeholder{color:var(--ink-4);font-size:9.5px;letter-spacing:.14em}
.searchwrap input:focus{border-bottom-color:var(--amber)}
.searchwrap .kbd{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.kbd{font-size:7.5px;padding:2px 6px;color:var(--ink-4);border:1px solid var(--line);font-family:'Orbitron',monospace;letter-spacing:.06em}
.tabs{display:flex;gap:14px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{padding:6px 0;font-size:8.5px;font-weight:600;color:var(--ink-4);white-space:nowrap;position:relative;transition:color .2s var(--ease);font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--amber)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--amber);transform-origin:left;animation:underlineSlide .35s var(--ease) both}
.sortrow{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:8.5px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;flex-shrink:0}
.convolist{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 0 12px}

/* Conversation row */
.crow{
  position:relative;display:flex;gap:11px;padding:11px 18px;cursor:pointer;
  background:transparent;transition:background .2s var(--ease), padding-left .25s var(--ease);
  align-items:flex-start;border-left:2px solid transparent;
}
.crow:hover{background:rgba(255,255,255,.025);padding-left:22px}
.crow.on{background:var(--amber-soft);border-left-color:var(--amber);box-shadow:inset 0 0 24px rgba(232,182,76,.035)}
.crow-menu-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%) scale(.85);
  width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);
  opacity:.55;transition:opacity .2s var(--ease), transform .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
  border-radius:4px;
}
.crow:hover .crow-menu-btn{opacity:1;transform:translateY(-50%) scale(1)}
.crow-menu-btn:hover{background:var(--amber-soft);color:var(--amber)}
.crow-menu-btn:active{transform:translateY(-50%) scale(.9)}
.av{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
  font-weight:700;font-size:11.5px;position:relative;letter-spacing:.06em;
  border:1px solid var(--line-strong);font-family:'Orbitron',monospace;
  transition:transform .25s var(--ease);
}
.crow:hover .av{transform:scale(1.04)}
.av.sm{width:26px;height:26px;flex-basis:26px;font-size:9.5px}
.av.lg{width:60px;height:60px;flex-basis:60px;font-size:20px}
.av.xl{width:84px;height:84px;flex-basis:84px;font-size:28px}
.av.huge{width:120px;height:120px;flex-basis:120px;font-size:38px}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border:2px solid #000}
.av .dot.online{background:var(--ok);color:var(--ok);animation:dotBreathe 2.4s ease-in-out infinite}
.av .dot.offline{background:var(--ink-4)}
.av .dot.away{background:var(--amber);color:var(--amber);animation:dotBreathe 2.4s ease-in-out infinite}
.cmain{flex:1;min-width:0;padding-right:22px}
.crow1{display:flex;align-items:center;gap:6px}
.cname{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;transition:color .2s var(--ease)}
.crow:hover .cname{color:#fff}
.ctime{font-size:8.5px;color:var(--ink-4);flex:0 0 auto;font-family:'Orbitron',monospace;letter-spacing:.06em}
.crow2{display:flex;align-items:center;gap:5px;margin-top:1px}
.cprev{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cprev .who{color:var(--ink-4);font-family:'Orbitron',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:3px}
.cmeta{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.pill{min-width:16px;height:16px;padding:0 5px;background:var(--amber);color:#000;font-size:9px;font-weight:800;display:grid;place-items:center;font-family:'Orbitron',monospace;animation:badgePop .4s var(--ease) both}
.pill.muted{background:var(--ink-4)}
.flagstar{color:var(--amber)}
.flagmute{color:var(--ink-4)}
.typing{color:var(--amber);font-family:'Orbitron',monospace;font-size:9px;letter-spacing:.1em}
.typing::after{content:'';animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.sb-foot{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:14px;align-items:center;flex-shrink:0}
.sb-foot-btn{font-size:8.5px;font-weight:600;letter-spacing:.14em;color:var(--ink-4);font-family:'Orbitron',monospace;text-transform:uppercase;transition:color .2s var(--ease), transform .2s var(--ease);position:relative;display:flex;align-items:center;gap:6px}
.sb-foot-btn:hover{color:#fff;transform:translateY(-1px)}
.sb-foot-btn.on{color:var(--amber)}
.sb-foot-btn.ml{margin-left:auto}
.sb-foot-btn .cnt{min-width:14px;height:14px;padding:0 4px;font-size:8px;font-weight:800;background:rgba(255,255,255,.08);color:var(--ink-2);display:grid;place-items:center;font-family:'Orbitron',monospace}
.sb-foot-btn.on .cnt{background:var(--amber);color:#000}
.sb-create{margin:8px 18px 10px;padding:9px 12px;display:flex;align-items:center;gap:9px;border:1px dashed var(--line-strong);color:var(--ink-3);transition:all .2s var(--ease);font-family:'Orbitron',monospace;font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.sb-create:hover{border-color:var(--amber-line);color:var(--amber);background:var(--amber-soft)}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink-4);text-align:center;padding:40px}
.placeholder .ph-art{width:72px;height:72px;display:grid;place-items:center;border:1px solid var(--line-strong);color:var(--amber);opacity:.5;animation:phPulse 3.2s ease-in-out infinite}
.placeholder .ph-art .ic{width:30px;height:30px}
.placeholder .ph-title{font-family:'Orbitron',monospace;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.placeholder .ph-sub{font-size:11.5px;color:var(--ink-4);max-width:300px;line-height:1.6}

.mhead{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--line);z-index:20;position:relative}
.mhead::before, .mhead::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--amber-line);border-style:solid;pointer-events:none}
.mhead::before{top:5px;left:5px;border-width:1px 0 0 1px}
.mhead::after{bottom:5px;right:5px;border-width:0 1px 1px 0}
.mhead .back{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);transition:color .2s var(--ease), background .2s var(--ease);margin-right:2px;border-radius:2px}
.mhead .back:hover{color:#fff;background:rgba(255,255,255,.05)}
.mhead .av{cursor:pointer;transition:transform .2s var(--ease)}
.mhead .av:hover{transform:scale(1.06)}
.mhead .t{flex:1;min-width:0;cursor:pointer}
.mhead .t h3{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase}
.mhead .t p{font-size:9px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.mhead .acts{display:flex;gap:2px;align-items:center}

.pinbar{padding:8px 18px;display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--ink-2);font-family:'Orbitron',monospace;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.pinbar .ic{color:var(--amber)}
.msgs{flex:1;overflow-y:auto;padding:20px 18px 10px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.daysep{align-self:center;font-size:8px;color:var(--ink-4);padding:3px 10px;margin:16px 0 12px;font-family:'Orbitron',monospace;letter-spacing:.22em;text-transform:uppercase}

/* MESSAGES — no entrance animation */
.mrow{display:flex;gap:9px;max-width:72%;position:relative;padding:1px 0;align-items:flex-end;transition:transform .2s var(--ease)}
.mrow.out{align-self:flex-end;flex-direction:row-reverse}
.mrow.grouped{margin-top:0}
.mrow:not(.grouped){margin-top:10px}
.mrow .av{opacity:0;pointer-events:none}
.mrow:not(.grouped) .av{opacity:1}
.mbody{min-width:0;display:flex;flex-direction:column;position:relative}
.mname{font-size:8.5px;font-weight:700;color:var(--ink-3);margin:0 0 3px 4px;font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase}
.bub{background:rgba(255,255,255,.03);padding:8px 12px;font-size:13px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere;position:relative;transition:background .25s var(--ease), box-shadow .25s var(--ease)}
.mrow.in .bub{border-left:2px solid var(--line-strong)}
.mrow.out .bub{background:var(--amber-soft);border-right:2px solid var(--amber);color:#fff}
.mrow.out .bub a{color:var(--amber-bright);text-decoration:underline}
.mrow:hover .bub{background:rgba(255,255,255,.05)}
.mrow.out:hover .bub{background:rgba(232,182,76,.14)}
.mrow.hl .bub{background:var(--amber-soft);box-shadow:0 0 0 1px var(--amber-line), 0 0 24px rgba(232,182,76,.15)}
.meta{display:flex;align-items:center;gap:5px;font-size:8.5px;color:var(--ink-4);margin:4px 4px 0;font-family:'Orbitron',monospace;letter-spacing:.08em;text-transform:uppercase}
.mrow.out .meta{justify-content:flex-end}
.meta .edited{font-style:italic}
.tick{color:var(--ink-4);transition:color .3s var(--ease)}
.tick.read{color:var(--amber)}
.quote{border-left:2px solid var(--amber);padding:3px 0 3px 9px;margin-bottom:6px;font-size:11.5px;color:var(--ink-3)}
.mrow.out .quote{border-left-color:var(--amber-bright);color:rgba(255,255,255,.75)}
.quote b{display:block;font-size:8.5px;color:var(--amber);margin-bottom:2px;font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase}
.reacts{display:flex;gap:4px;margin:5px 4px 0;flex-wrap:wrap}
.mrow.out .reacts{justify-content:flex-end}
.react{background:rgba(255,255,255,.03);padding:2px 8px;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:background .2s var(--ease), transform .2s var(--ease)}
.react:hover{background:rgba(255,255,255,.08);transform:scale(1.06)}
.react.mine{background:var(--amber-soft);box-shadow:0 0 0 1px var(--amber-line)}
.react .n{font-size:9px;color:var(--ink-3);font-family:'Orbitron',monospace}

/* === ACTION TOOLS — appear right beside the message === */
.mtools{
  position:absolute;
  top:50%;
  display:flex;gap:2px;
  background:#0d0d0d;
  border:1px solid var(--line-strong);
  padding:3px;
  border-radius:10px;
  opacity:0;pointer-events:none;
  transition:opacity .18s var(--ease), transform .18s var(--ease);
  z-index:5;
  box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
}
.mrow.in .mtools{
  left:100%;margin-left:8px;
  transform:translateY(-50%) translateX(-6px);
}
.mrow.out .mtools{
  right:100%;margin-right:8px;
  transform:translateY(-50%) translateX(6px);
}
.mrow.in:hover .mtools{
  opacity:1;pointer-events:auto;
  transform:translateY(-50%) translateX(0);
}
.mrow.out:hover .mtools{
  opacity:1;pointer-events:auto;
  transform:translateY(-50%) translateX(0);
}
.mtools button{
  width:26px;height:26px;display:grid;place-items:center;
  color:var(--ink-3);border-radius:6px;
  transition:color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
}
.mtools button:hover{
  color:var(--amber);background:var(--amber-soft);transform:translateY(-1px);
}
.mtools button:active{transform:translateY(0) scale(.9)}

/* === BULK SELECT MODE === */
.mrow.bulk{cursor:pointer}
.mrow.bulk .mtools{display:none}
.mrow.bulk .reacts{pointer-events:none;opacity:.6}
.mrow.bulk .bulk-check{
  position:absolute;
  top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:6px;
  border:1.5px solid var(--line-strong);background:#0a0a0a;
  display:grid;place-items:center;color:transparent;
  z-index:6;transition:all .2s var(--ease);
}
.mrow.bulk.in .bulk-check{right:-32px}
.mrow.bulk.out .bulk-check{left:-32px}
.mrow.bulk:hover .bulk-check{border-color:var(--amber-line)}
.mrow.bulk.selected .bulk-check{background:var(--amber);border-color:var(--amber);color:#000;box-shadow:0 0 14px rgba(232,182,76,.4)}
.mrow.bulk.selected .bub{
  box-shadow:0 0 0 1px var(--amber-line), inset 0 0 0 1px rgba(232,182,76,.12);
}
.mrow.bulk.selected:hover .bub{background:rgba(232,182,76,.16)}

/* Bulk bar (replaces composer) */
.bulk-bar{
  display:flex;gap:12px;align-items:center;
  padding:14px 4px 6px;
  animation:cardIn .25s var(--ease) both;
  flex-wrap:wrap;
}
.bulk-bar .bulk-count{
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--amber);
  padding:8px 14px;border:1px solid var(--amber-line);background:var(--amber-soft);
  border-radius:4px;
}
.bulk-bar .bulk-actions{
  display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;
}
.bulk-bar .bulk-actions .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Attachments, voice, poll — unchanged */
.att-img{width:230px;height:135px;margin:2px 0 4px;display:grid;place-items:center;font-size:9px;color:rgba(255,255,255,.65);font-weight:600;letter-spacing:.16em;cursor:pointer;font-family:'Orbitron',monospace;text-transform:uppercase;background:linear-gradient(135deg,#1a1814,#0a0a0a);transition:transform .3s var(--ease), filter .3s var(--ease)}
.att-img:hover{transform:scale(1.015);filter:brightness(1.1)}
.att-file{display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:4px;min-width:200px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.att-file .fi{width:28px;height:28px;display:grid;place-items:center;color:var(--amber)}
.att-file .fn{font-size:11px;font-weight:500;font-family:'Orbitron',monospace;letter-spacing:.04em}
.att-file .fs{font-size:9px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.08em}
.voice{display:flex;align-items:center;gap:10px;min-width:200px}
.voice .play{width:28px;height:28px;background:var(--amber);color:#000;display:grid;place-items:center;flex:0 0 28px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:2.5px;background:currentColor;opacity:.3;display:block}
.wave i.p{opacity:1;animation:wavePlay .5s ease-in-out infinite}
.spd{font-size:9px;font-weight:800;padding:2px 6px;cursor:pointer;font-family:'Orbitron',monospace;letter-spacing:.06em;color:var(--ink-3)}
.poll{min-width:230px}
.poll .q{font-weight:500;margin-bottom:9px;font-size:12.5px}
.poll .opt{padding:7px 10px;margin-bottom:5px;position:relative;overflow:hidden;cursor:pointer;font-size:11.5px;transition:border-color .2s var(--ease);border:1px solid var(--line)}
.poll .opt .bar{position:absolute;inset:0;background:var(--amber-soft);z-index:0;transition:width .55s var(--ease)}
.poll .opt .lab{position:relative;z-index:1;display:flex;justify-content:space-between}
.poll-bar{display:flex;gap:8px;margin-top:4px;font-size:8.5px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase}

.typingrow{display:flex;gap:9px;align-items:center;padding:6px 18px 0;height:22px}
.tdots{display:flex;gap:3px}
.tdots i{width:5px;height:5px;background:var(--amber);animation:bnc 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.16s}
.tdots i:nth-child(3){animation-delay:.32s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* Composer */
.composer{padding:8px 18px 16px;position:relative}
.fmtbar{display:flex;gap:2px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.fmtbar button{width:24px;height:24px;display:grid;place-items:center;color:var(--ink-4);font-size:10.5px;font-weight:700;transition:color .15s var(--ease), background .15s var(--ease);border-radius:2px}
.fmtbar button:hover{color:var(--amber);background:var(--amber-soft)}
.fmtbar .sep{width:1px;height:14px;background:var(--line);margin:0 5px}
.replystrip{display:flex;align-items:center;gap:10px;padding:6px 0 6px 10px;margin-bottom:8px;font-size:11.5px;border-left:2px solid var(--amber)}
.replystrip .x{margin-left:auto}
.inputrow{display:flex;align-items:flex-end;gap:8px}
.inputbox{flex:1;display:flex;align-items:flex-end;padding:4px 0;gap:2px;border-bottom:1px solid var(--line-strong);transition:border-color .25s var(--ease)}
.inputbox:focus-within{border-bottom-color:var(--amber)}
.inputbox textarea{flex:1;resize:none;max-height:150px;min-height:24px;padding:6px 4px;font-size:13px;line-height:1.5;background:transparent}
.sendbtn{width:36px;height:36px;background:var(--amber);color:#000;display:grid;place-items:center;flex:0 0 36px;transition:background .2s var(--ease), transform .2s var(--ease)}
.sendbtn:not(:disabled){animation:sendReady 2.4s ease-in-out infinite}
.sendbtn:hover{background:var(--amber-bright);transform:scale(1.06)}
.sendbtn:active{transform:scale(.9);animation:sendPress .3s var(--ease)}
.sendbtn:disabled{opacity:.22;cursor:not-allowed;animation:none}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);transition:color .18s var(--ease), background .18s var(--ease);border-radius:2px}
.iconbtn:hover{color:var(--amber);background:var(--amber-soft)}
.iconbtn.on{color:var(--amber);background:var(--amber-soft)}

.pop{position:absolute;bottom:calc(100% + 8px);background:#0a0a0a;border:1px solid var(--line-strong);z-index:60;overflow:hidden}
.pop.emoji{left:18px;width:310px;padding:10px}
.emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-height:200px;overflow-y:auto}
.emoji-grid button{font-size:19px;height:32px;display:grid;place-items:center;transition:.15s var(--ease)}
.emoji-grid button:hover{background:rgba(255,255,255,.05);transform:scale(1.15)}
.pop.attach{left:18px;width:210px;padding:6px}
.pop.attach button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;font-size:11px;text-align:left;transition:background .15s var(--ease), padding-left .2s var(--ease);font-family:'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.pop.attach button:hover{background:rgba(255,255,255,.05);color:#fff;padding-left:14px}
.pop.attach .ic{color:var(--amber)}
.pophead{padding:6px 10px 4px;font-size:8px;letter-spacing:.2em;color:var(--ink-4);font-weight:700;font-family:'Orbitron',monospace;text-transform:uppercase}

/* VIEWS */
.view{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.vhead{padding:18px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;position:relative}
.vhead::before, .vhead::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--amber-line);border-style:solid;pointer-events:none}
.vhead::before{top:6px;left:6px;border-width:1px 0 0 1px}
.vhead::after{bottom:6px;right:6px;border-width:0 1px 1px 0}
.vhead h2{font-size:14px;font-weight:700;letter-spacing:.22em;flex:1;text-transform:uppercase;font-family:'Orbitron',monospace}
.vbody{flex:1;overflow-y:auto;padding:22px 28px 40px}
.grid{display:grid;gap:0}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{padding:14px 0;position:relative;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:none}
.card h4{font-size:9px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-family:'Orbitron',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.card h4 .ic{color:var(--amber)}
.stat{font-size:22px;font-weight:700;letter-spacing:-.4px;font-family:'Orbitron',monospace}
.stat small{font-size:8.5px;color:var(--ink-4);font-weight:600;display:block;letter-spacing:.14em;font-family:'Orbitron',monospace;margin-top:3px;text-transform:uppercase}
.itable{width:100%;border-collapse:collapse;font-size:11.5px}
.itable th{text-align:left;padding:8px 0;color:var(--ink-4);font-size:8.5px;text-transform:uppercase;letter-spacing:.16em;border-bottom:1px solid var(--line);font-weight:700;font-family:'Orbitron',monospace}
.itable td{padding:10px 0;border-bottom:1px solid var(--line);transition:background .18s var(--ease)}
.itable tbody tr:hover td{background:rgba(255,255,255,.015)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:8px;font-weight:700;padding:3px 8px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;transition:color .18s var(--ease), border-color .18s var(--ease);border:1px solid var(--line)}
.chip:hover{color:#fff;border-color:var(--line-strong)}
.chip.on{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.tlitem{position:relative;padding:0 0 16px}
.tlitem::before{content:"";position:absolute;left:-19px;top:6px;width:7px;height:7px;background:var(--amber);border-radius:50%}
.tlitem b{font-size:11px;font-family:'Orbitron',monospace;letter-spacing:.04em}
.tlitem p{font-size:11px;color:var(--ink-4);margin-top:2px}
.empty{display:grid;place-items:center;height:100%;color:var(--ink-4);text-align:center;gap:12px}
.empty .ic{width:40px;height:40px;opacity:.28}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;transition:padding-left .2s var(--ease);border-bottom:1px solid var(--line)}
.listrow:hover{padding-left:6px}
.listrow:last-child{border-bottom:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:11.5px;border-bottom:1px solid var(--line)}
.kv:last-child{border:none}
.kv span:first-child{color:var(--ink-4);font-family:'Orbitron',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}

/* Branded buttons */
.btn{
  padding:8px 14px;font-size:9px;font-weight:700;
  transition:color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
  font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line-strong);
  display:inline-flex;align-items:center;gap:7px;border-radius:3px;
}
.btn:hover{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.btn.primary:hover{background:rgba(232,182,76,.18);color:var(--amber-bright);border-color:var(--amber)}
.btn.danger{color:var(--bad);border-color:rgba(224,88,88,.4);background:rgba(224,88,88,.05)}
.btn.danger:hover{background:rgba(224,88,88,.14);color:#ff8f8f;border-color:var(--bad)}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

.prow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:11.5px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .k{color:var(--ink-4);flex:1;font-family:'Orbitron',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
.prow .v{color:var(--ink-1);text-align:right;font-weight:500}
.switch{width:32px;height:16px;background:rgba(255,255,255,.06);position:relative;transition:background .25s var(--ease);flex:0 0 32px;border:1px solid var(--line-strong);cursor:pointer;border-radius:8px}
.switch.on{background:var(--amber-soft);border-color:var(--amber-line)}
.switch i{position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--ink-4);transition:left .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);border-radius:5px}
.switch.on i{left:17px;background:var(--amber);box-shadow:0 0 10px rgba(232,182,76,.6)}
.field{margin-bottom:16px}
.field label{display:block;font-size:8.5px;color:var(--ink-4);margin-bottom:6px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-family:'Orbitron',monospace}
.field input[type=text],.field input[type=time],.field input[type=date],.field textarea,.field select{width:100%;background:transparent;border-bottom:1px solid var(--line-strong);padding:8px 0;font-size:12.5px;transition:border-color .25s var(--ease)}
.field input:focus,.field textarea:focus,.field select:focus{border-bottom-color:var(--amber)}
.field textarea{resize:vertical;min-height:70px}
.field input[type=range]{width:100%;accent-color:var(--amber)}

/* PROFILE */
.profile-hero{position:relative;padding:28px 28px 20px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;background:radial-gradient(circle at 15% 40%, rgba(232,182,76,.06), transparent 45%),radial-gradient(circle at 85% 60%, rgba(127,184,216,.05), transparent 45%)}
.profile-hero::before, .profile-hero::after{content:'';position:absolute;width:14px;height:14px;border-color:var(--amber-line);border-style:solid;pointer-events:none}
.profile-hero::before{top:8px;left:8px;border-width:1px 0 0 1px}
.profile-hero::after{bottom:8px;right:8px;border-width:0 1px 1px 0}
.profile-hero .back{position:absolute;top:16px;left:16px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);transition:color .2s var(--ease), background .2s var(--ease);border-radius:2px;z-index:2}
.profile-hero .back:hover{color:#fff;background:rgba(255,255,255,.05)}
.profile-main{display:flex;gap:20px;align-items:flex-start;flex:1;min-width:0;padding-top:14px}
.profile-id{flex:1;min-width:0}
.profile-id h2{font-size:18px;font-weight:700;letter-spacing:.06em;font-family:'Orbitron',monospace;margin-bottom:5px;text-transform:uppercase}
.profile-id .handle{font-size:11px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.1em;margin-bottom:10px}
.profile-id .status{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-family:'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.profile-id .status .dot{width:6px;height:6px;border-radius:50%}
.profile-id .status .dot.online{background:var(--ok);color:var(--ok);animation:dotBreathe 2.4s ease-in-out infinite}
.profile-id .status .dot.offline{background:var(--ink-4)}
.profile-id .status .dot.away{background:var(--amber);color:var(--amber);animation:dotBreathe 2.4s ease-in-out infinite}
.profile-id .bio{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:14px;max-width:520px}
.profile-acts{display:flex;gap:8px;flex-wrap:wrap}
.profile-tabs{display:flex;gap:18px;padding:0 28px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0;background:#000}
.profile-tab{padding:13px 0;font-size:9px;font-weight:600;color:var(--ink-4);white-space:nowrap;position:relative;transition:color .2s var(--ease);cursor:pointer;font-family:'Orbitron',monospace;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.profile-tab:hover{color:var(--ink-2)}
.profile-tab.on{color:var(--amber)}
.profile-tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--amber);transform-origin:left;animation:underlineSlide .35s var(--ease) both}
.profile-tab .cnt{font-size:8px;color:var(--ink-4);font-family:'Orbitron',monospace;background:rgba(255,255,255,.05);padding:1px 5px}
.profile-tab.on .cnt{color:var(--amber);background:var(--amber-soft)}
.profile-body{flex:1;overflow-y:auto;padding:22px 28px 40px}
.profile-info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0}
.info-item{padding:12px 0;border-bottom:1px solid var(--line)}
.info-item .k{font-size:8.5px;color:var(--ink-4);font-family:'Orbitron',monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.info-item .v{font-size:12.5px;color:var(--ink-1);word-break:break-word}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px}
.media-grid .mtile{aspect-ratio:1;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s var(--ease), filter .3s var(--ease);display:grid;place-items:center;color:rgba(255,255,255,.5);font-size:9px;font-family:'Orbitron',monospace;letter-spacing:.1em}
.media-grid .mtile:hover{transform:scale(1.04);filter:brightness(1.2);z-index:2}
.media-grid .mtile .lbl-badge{position:absolute;bottom:5px;left:5px;font-size:7px;padding:1px 5px;background:rgba(0,0,0,.65);color:var(--ink-2);font-family:'Orbitron',monospace;letter-spacing:.1em;opacity:0;transition:opacity .2s var(--ease)}
.media-grid .mtile:hover .lbl-badge{opacity:1}

/* ============================================================
   PURGE CONFIRM — AMBER THEMED
   ============================================================ */
.keys-confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:900;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);animation:modalFade .2s ease;
}
.keys-confirm-box{
  background:#080808;
  border:1px solid var(--amber-line);
  width:360px;max-width:92vw;padding:32px 28px 24px;position:relative;
  animation:modalSlide .25s cubic-bezier(.22,1,.36,1);
  border-radius:4px;
  box-shadow:0 0 60px rgba(0,0,0,.5), 0 0 0 1px rgba(232,182,76,.04);
}
.keys-confirm-box::before,.keys-confirm-box::after{
  content:'';position:absolute;width:18px;height:18px;
  border-color:var(--amber);border-style:solid;pointer-events:none;
}
.keys-confirm-box::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.keys-confirm-box::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.keys-confirm-icon{display:flex;justify-content:center;margin-bottom:16px}
.keys-confirm-icon svg{
  filter:drop-shadow(0 0 12px rgba(232,182,76,.18));
  stroke:var(--amber);
}
.keys-confirm-label{
  font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.25em;
  color:var(--amber);text-align:center;margin-bottom:8px;
}
.keys-confirm-title{
  font-size:15px;color:var(--ink-1);text-align:center;margin-bottom:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-weight:600;
}
.keys-confirm-sub{
  font-size:9px;color:var(--ink-4);text-align:center;
  letter-spacing:.15em;margin-bottom:24px;font-family:'JetBrains Mono',monospace;
}
.keys-confirm-actions{display:flex;gap:10px}
.keys-confirm-btn{
  flex:1;padding:11px;font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.15em;cursor:pointer;border:none;
  transition:all .2s;border-radius:4px;
}
.keys-confirm-btn-cancel{
  background:transparent;border:1px solid var(--line-strong) !important;
  color:var(--ink-3);
}
.keys-confirm-btn-cancel:hover{
  background:rgba(255,255,255,.04);color:#fff;
  border-color:var(--line-strong) !important;
}
.keys-confirm-btn-delete{
  background:var(--amber-soft);
  border:1px solid var(--amber-line) !important;
  color:var(--amber);
}
.keys-confirm-btn-delete:hover{
  background:rgba(232,182,76,.2);
  border-color:var(--amber) !important;
  box-shadow:0 0 20px rgba(232,182,76,.15);
}

/* MODALS */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);z-index:500;display:grid;place-items:center;padding:20px;animation:scrimIn .22s var(--ease) both}
.modal{background:#080808;border:1px solid var(--line-strong);width:min(520px,100%);max-height:86vh;overflow-y:auto;position:relative;animation:modalIn .28s var(--ease) both}
.modal::before,.modal::after{content:'';position:absolute;width:14px;height:14px;border-color:var(--amber-line);border-style:solid;pointer-events:none}
.modal::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.modal::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.modal.sm{width:min(420px,100%)}
.modal.wide{width:min(780px,100%)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#080808;z-index:2}
.modal header h3{font-size:11px;font-weight:700;flex:1;font-family:'Orbitron',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-1)}
.modal .mbody{padding:18px}

.toasts{position:fixed;top:14px;right:14px;z-index:1100;display:flex;flex-direction:column;gap:8px;width:320px;max-width:calc(100vw - 28px)}
.toast{background:#080808;border:1px solid var(--line-strong);border-left:2px solid var(--amber);padding:12px 14px;display:flex;gap:11px;position:relative;overflow:hidden;animation:toastIn .32s var(--ease) both;border-radius:3px}
.toast.dismiss{animation:toastOut .25s var(--ease) both}
.toast .ic{color:var(--amber);margin-top:2px;animation:pulseDot 1.6s ease-in-out infinite}
.toast .tt{flex:1;min-width:0}
.toast .tt b{font-size:9.5px;display:block;margin-bottom:3px;font-family:'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase}
.toast .tt p{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.callui::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px}

.callui .call-rings i{position:absolute;top:0;left:0;width:190px;height:190px;border-radius:50%;border:1px solid currentColor;opacity:0;animation:ringOut 3s ease-out infinite;display:block}
.callui .call-rings i:nth-child(2){animation-delay:1s}
.callui .call-rings i:nth-child(3){animation-delay:2s}
.callui.voice .call-rings{color:rgba(232,182,76,.5)}

.callui .call-info{text-align:center;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px}
.callui .call-name{font-size:22px;font-weight:700;font-family:'Orbitron',monospace;letter-spacing:.18em;text-transform:uppercase}

.callui .call-state{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:100px;background:rgba(255,255,255,.02);backdrop-filter:blur(8px);font-size:9.5px;font-family:'Orbitron',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}

.callui .call-state .pulse{display:inline-block;width:6px;height:6px;background:currentColor;border-radius:50%;animation:pulseDot 1.4s ease-in-out infinite}

.callui.video{background:#000;padding:0}
.callui.video .call-stage{flex:1;position:relative;overflow:hidden;background:#080808}
.callui.video .call-remote{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(232,182,76,.05), transparent 60%),linear-gradient(135deg,#0d0d0d 0%,#050505 100%);overflow:hidden}

.callui.video .call-remote-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:2}

.callui .call-ctl-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.callui .call-ctl{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:all .2s var(--ease);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative}
.callui .call-ctl:hover{background:rgba(255,255,255,.14);transform:translateY(-3px)}
.callui .call-ctl:active{transform:translateY(0) scale(.94)}
.callui .call-ctl.on{background:var(--amber);color:#000;border-color:var(--amber);box-shadow:0 0 24px rgba(232,182,76,.35)}
.callui .call-ctl.on:hover{background:var(--amber-bright)}
.callui .call-ctl.end{background:var(--bad);border-color:var(--bad);width:66px;height:66px}
.callui .call-ctl.end:hover{background:#ef6b6b;box-shadow:0 0 24px rgba(224,88,88,.4)}
.callui .call-ctl.accept{background:var(--ok);border-color:var(--ok);width:66px;height:66px}
.callui .call-ctl.accept:hover{background:#7fd09a;box-shadow:0 0 24px rgba(109,191,138,.5)}
.callui .call-ctl .lbl{font-size:8px;font-family:'Orbitron',monospace;letter-spacing:.16em;color:var(--ink-4);text-transform:uppercase;user-select:none}
.callui.incoming .call-controls{gap:100px;padding:34px 24px 56px}
@media(max-width:520px){
  .callui.incoming .call-controls{gap:52px}
  .callui .call-ctl{width:52px;height:52px}
  .callui .call-ctl.end,.callui .call-ctl.accept{width:60px;height:60px}
  .callui .call-avatar{width:130px;height:130px;font-size:44px}
  .callui .call-rings i{width:160px;height:160px}
  .callui .call-pip{width:104px;height:142px;top:78px;right:16px}
  .callui .call-pip-avatar{width:48px;height:48px;font-size:15px}
  .callui .call-name{font-size:18px}
}
@media(max-width:720px){
  .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:80;background:#000;width:290px}
  .sidebar.hide{display:none}
  .main{padding-left:0}
  .keys-confirm-box{width:92vw;padding:24px 18px 20px}
}

function buildMessages(convo){
  const seed = SEEDS[convo.id] || [];
  const base = Date.now();
  const out = [];
  seed.forEach((s, i)=>{
    const [sender, text, mins, extra] = s;
    const ex = extra || {};
    out.push({
      id: convo.id + '_m' + i, sender, text, ts: base - mins*60000,
      status: ex.status || (sender === 'u0' ? (i % 3 === 0 ? 'read' : i % 3 === 1 ? 'delivered' : 'sent') : null),
      edited: !!ex.edited, deleted:false, type: ex.type || 'text',
      reactions: ex.reactions || {}, replyTo: ex.replyTo || null,
      pinned: !!ex.pinned, starred:false, dur: ex.dur || null,
      fname: ex.fname || null, fsize: ex.fsize || null, label: ex.label || null,
      mentions: ex.mentions || [], q: ex.q || null, opts: ex.opts || null, voted:null
    });
  });
  return out;
}

function fmtTime(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDay(ts){
  const d = new Date(ts), n = new Date();
  const same = (a,b)=>a.toDateString()===b.toDateString();
  if(same(d,n)) return 'TODAY';
  const y = new Date(n.getTime()-86400000);
  if(same(d,y)) return 'YESTERDAY';
  return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'}).toUpperCase();
}
function fmtRel(ts){
  const s = (Date.now()-ts)/1000;
  if(s < 60) return 'now';
  if(s < 3600) return Math.floor(s/60)+'m';
  if(s < 86400) return Math.floor(s/3600)+'h';
  if(s < 604800) return Math.floor(s/86400)+'d';
  return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'}).toUpperCase();
}
function fmtDur(sec){
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}

function lastMsg(cid){ const arr = state.messages[cid]||[]; return arr.length ? arr[arr.length-1] : null; }
function previewOf(cid){
  const m = lastMsg(cid);
  if(!m) return {text:'No messages yet', who:''};
  const c = convo(cid);
  const who = m.sender === 'u0' ? 'You:' : (c.type==='group' ? contact(m.sender).name.split(' ')[0] + ':' : '');
  let t = m.text;
  if(m.deleted) t = 'This message was deleted';
  else if(m.type === 'voice') t = '🎤 Voice · ' + m.dur + 's';
  else if(m.type === 'file') t = '📎 ' + m.fname;
  else if(m.type === 'image') t = '🖼 ' + m.label;
  else if(m.type === 'poll') t = '📊 ' + m.q;
  return {text:t, who};
}

function toast(title, body, opts){
  opts = opts || {};
  if(!state.notifications && !opts.force) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    ${ic(opts.icon||'chat')}
    <div class="tt">
      <b>${esc(title)}</b>
      <p>${esc(body||'')}</p>
    </div>
    <button class="iconbtn" data-act="toast-close">${ic('x','sm')}</button>`;
  $('#toasts').appendChild(el);
  const timeout = opts.sticky ? 9000 : 4600;
  setTimeout(()=>{
    if(el.parentNode){
      el.classList.add('dismiss');
      setTimeout(()=>el.remove(), 250);
    }
  }, timeout);
}

      <div class="keys-confirm-sub">${esc(opts.sub||'THIS ACTION CANNOT BE UNDONE')}</div>
      <div class="keys-confirm-actions">
        <button class="keys-confirm-btn keys-confirm-btn-cancel" data-confirm-cancel>ABORT</button>
        <button class="keys-confirm-btn keys-confirm-btn-delete" data-confirm-go>${esc(opts.confirmLabel||'PURGE')}</button>
      </div>
    </div>`;
  overlay.addEventListener('click', e=>{
    if(e.target === overlay || e.target.closest('[data-confirm-cancel]')) overlay.remove();
  });
  overlay.querySelector('.keys-confirm-box').addEventListener('click', e=>e.stopPropagation());
  overlay.querySelector('[data-confirm-go]').onclick = ()=>{
    overlay.remove();
    onConfirm();
  };

}

      if(state.folder === 'priority') list = list.filter(c=>c.priority);
      if(state.folder === 'work')     list = list.filter(c=>c.folders.includes('work'));
      if(state.folder === 'personal') list = list.filter(c=>c.folders.includes('personal'));
    }
  }
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    list = list.filter(c=>{
      const msgs = state.messages[c.id]||[];
      return c.name.toLowerCase().includes(q) ||
             (c.handle||'').toLowerCase().includes(q) ||
             msgs.some(m=>!m.deleted && (m.text||'').toLowerCase().includes(q));
    });
  }
  const cmp = {
    recent: (a,b)=> (lastMsg(b.id)?.ts||0) - (lastMsg(a.id)?.ts||0),
    unread: (a,b)=> b.unread - a.unread,
    alpha:  (a,b)=> a.name.localeCompare(b.name),
    priority:(a,b)=> (b.priority?1:0)-(a.priority?1:0) || (lastMsg(b.id)?.ts||0)-(lastMsg(a.id)?.ts||0)
  }[state.sort];
  list.sort(cmp);
  const pinned = list.filter(c=>c.pinned);
  const rest   = list.filter(c=>!c.pinned);
  return pinned.concat(rest);
}

function renderMain(){
  if(state.profileId) return renderProfile();
  if(state.view === 'chats' || state.view === 'groups'){
    if(!state.activeConvo) return renderPlaceholder(state.view);
    return renderChat();
  }
  if(state.view === 'contacts')  return renderContactsEmpty();
  if(state.view === 'deleted')   return renderDeleted();
  if(state.view === 'settings')  return renderSettings();

}

function msgHTML(m, prev, c){
  const mine = m.sender === 'u0';
  const s = contact(m.sender);
  const grouped = prev && prev.sender === m.sender && (m.ts - prev.ts) < 5*60000 && !m.pinned && prev.type!=='poll';
  const showName = c.type === 'group' && !mine && !grouped;
  const isSelected = state.bulkMode && state.bulkSelected.has(m.id);
  const bulkClass = state.bulkMode ? ' bulk' + (isSelected?' selected':'') : '';
  let inner = '';
  if(m.deleted){
    inner = `<span style="font-style:italic;opacity:.6">${mine?'You deleted this message':'This message was deleted'}</span>`;
  } else {
    if(m.replyTo){
      const r = (state.messages[c.id]||[]).find(x=>x.id===m.replyTo);
      if(r) inner += `<div class="quote"><b>${esc(r.sender==='u0'?'You':contact(r.sender).name)}</b>${esc((r.text||'').slice(0,110))}</div>`;
    }
    if(m.type === 'text'){ inner += linkify(esc(m.text)); }
    if(m.type === 'voice'){
      const bars = Array.from({length:32},(_,i)=>`<i style="height:${6+((i*7+13)%18)}px"></i>`).join('');
      inner += `<div class="voice">
        <button class="play" data-act="play-voice">${ic('send','sm')}</button>
        <div class="wave">${bars}</div>
        <span style="font-size:10px;opacity:.7;font-family:'Orbitron'">${m.dur}s</span>
        <button class="spd" data-act="voice-speed">1x</button>
      </div>`;
    }
    if(m.type === 'file'){
      inner += `<div class="att-file">
        <div class="fi">${ic('file')}</div>
        <div style="flex:1;min-width:0">
          <div class="fn">${esc(m.fname)}</div>
          <div class="fs">${esc(m.fsize)} · ${fmtTime(m.ts)}</div>
        </div>
        <button class="iconbtn" data-act="download">${ic('download','sm')}</button>
      </div>`;
    }
    if(m.type === 'image'){
      const g = ['linear-gradient(135deg,#2a2416,#0a0a0a)','linear-gradient(135deg,#142a1c,#0a0a0a)','linear-gradient(135deg,#2a1414,#0a0a0a)','linear-gradient(135deg,#14202a,#0a0a0a)'][m.id.length%4];
      inner += `<div class="att-img" style="background:${g}" data-act="open-media" data-label="${esc(m.label)}">${esc(m.label)}</div>`;
    }
    if(m.type === 'poll'){
      const total = m.opts.reduce((a,o)=>a+o[1],0);
      inner += `<div class="poll"><div class="q">${esc(m.q)}</div>
        ${m.opts.map((o,i)=>`
          <div class="opt" data-act="vote" data-id="${m.id}" data-i="${i}">
            <div class="bar" style="width:${Math.round(o[1]/total*100)}%"></div>
            <div class="lab"><span>${esc(o[0])} ${m.voted===i?'✔':''}</span><span>${Math.round(o[1]/total*100)}%</span></div>
          </div>`).join('')}
        <div class="poll-bar">${total} VOTES</div>
      </div>`;
    }
  }
  const reacts = Object.entries(m.reactions||{});
  const reactHTML = reacts.length ? `<div class="reacts">${reacts.map(([e,n])=>
    `<button class="react ${m.mineReact===e?'mine':''}" data-act="react" data-id="${m.id}" data-e="${e}">${e}<span class="n">${n}</span></button>`).join('')}</div>` : '';
  const meta = [];
  if(m.edited) meta.push('<span class="edited">EDITED</span>');
  meta.push(fmtTime(m.ts));
  if(mine && m.status) meta.push(`<span class="tick ${m.status==='read'?'read':''}">${ic(m.status==='sent'?'check':'checks','sm')}</span>`);
  if(m.pinned) meta.push(`<span style="color:var(--amber)">${ic('pin','sm')}</span>`);
  if(m.starred) meta.push(`<span style="color:var(--amber)">${ic('star','sm')}</span>`);
  return `
  <div class="mrow ${mine?'out':'in'} ${grouped?'grouped':''}${bulkClass}" data-mid="${m.id}">
    ${state.bulkMode ? `<div class="bulk-check">${isSelected?ic('check','sm'):''}</div>` : ''}
    ${c.type==='group' && !mine ? `<div class="av sm" style="background:${s.color}18;border-color:${s.color}50;color:${s.color}">${av(s.name,s.color)}</div>` : (c.type==='group' ? '<div style="width:26px;flex:0 0 26px"></div>' : '')}
    <div class="mbody">
      ${showName ? `<div class="mname" style="color:${s.color}">${esc(s.name)}</div>` : ''}
      <div class="bub">${inner}</div>
      ${reactHTML}
      <div class="meta">${meta.join(' ')}</div>
      <div class="mtools">
        <button data-act="quick-react" data-id="${m.id}" title="React">${ic('smile','sm')}</button>
        <button data-act="reply" data-id="${m.id}" title="Reply">${ic('reply','sm')}</button>
        <button data-act="edit" data-id="${m.id}" title="Edit">${ic('edit','sm')}</button>
        <button data-act="forward" data-id="${m.id}" title="Forward">${ic('forward','sm')}</button>
        <button data-act="pin-msg" data-id="${m.id}" title="Pin">${ic('pin','sm')}</button>
        <button data-act="star-msg" data-id="${m.id}" title="Star">${ic('star','sm')}</button>
        <button data-act="msg-menu" data-id="${m.id}" title="More">${ic('more','sm')}</button>
      </div>
    </div>
  </div>`;
}

function linkify(t){
  return t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/(@[a-z0-9_.]+)/gi, '<span style="color:var(--amber);font-weight:600">$1</span>');
}

function renderMessages(){
  const box = $('#msgs'); if(!box) return;
  const c = convo(state.activeConvo);
  const list = state.messages[c.id] || [];
  let html = '', lastDay = '', prev = null;
  list.forEach(m=>{
    const d = fmtDay(m.ts);
    if(d !== lastDay){ html += `<div class="daysep">${d}</div>`; lastDay = d; prev = null; }
    html += msgHTML(m, prev, c);
    prev = m;
  });
  if(!list.length) html = `<div class="empty">${ic('chat')}<div class="lbl">NO MESSAGES</div></div>`;
  box.innerHTML = html;
  requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
}

function renderComposer(){
  const c = convo(state.activeConvo);
  if(!c) return;

  if(state.bulkMode){
    const count = state.bulkSelected.size;
    $('#composer').innerHTML = `
      <div class="bulk-bar">
        <div class="bulk-count">${count} SELECTED</div>
        <div class="bulk-actions">
          <button class="btn" data-act="bulk-forward" ${count?'':'disabled'}>${ic('forward','sm')} FORWARD</button>
          <button class="btn" data-act="bulk-star" ${count?'':'disabled'}>${ic('star','sm')} STAR</button>
          <button class="btn danger" data-act="bulk-delete" ${count?'':'disabled'}>${ic('trash','sm')} DELETE</button>
          <button class="btn" data-act="bulk-cancel">${ic('x','sm')} CANCEL</button>
        </div>
      </div>`;
    return;
  }

  const draft = state.drafts[c.id] || '';
  const rep = state.replyTo ? (state.messages[c.id]||[]).find(m=>m.id===state.replyTo) : null;
  const ed  = state.editing ? (state.messages[c.id]||[]).find(m=>m.id===state.editing) : null;
  $('#composer').innerHTML = `
    <div class="fmtbar">
      <button data-act="fmt" data-f="**" title="Bold"><b>B</b></button>
      <button data-act="fmt" data-f="*" title="Italic"><i>I</i></button>
      <button data-act="fmt" data-f="~~" title="Strikethrough"><s>S</s></button>
      <button data-act="fmt" data-f="\`" title="Code">&lt;/&gt;</button>
      <button data-act="fmt" data-f="> " title="Quote">❝</button>
      <span class="sep"></span>
      <button data-act="mention" title="Mention">@</button>
      <span class="sep"></span>
      <button data-act="poll" title="Create poll">${ic('poll','sm')}</button>
      <span style="flex:1"></span>
      <button data-act="tts" title="Read aloud">${ic('volume','sm')}</button>
      <button data-act="stt" title="Dictate">${ic('mic','sm')}</button>
    </div>
    ${ed ? `<div class="replystrip">
        ${ic('edit','sm')}<span style="font-family:'Orbitron';font-size:9px;letter-spacing:.12em;text-transform:uppercase">Editing message</span>
        <button class="iconbtn x" data-act="cancel-edit">${ic('x','sm')}</button></div>` : ''}
    ${rep && !ed ? `<div class="replystrip">
        ${ic('reply','sm')}
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          <b style="color:var(--amber);font-family:'Orbitron';font-size:9px;letter-spacing:.1em">${esc(rep.sender==='u0'?'YOU':contact(rep.sender).name.toUpperCase())}</b> · ${esc((rep.text||'').slice(0,80))}
        </span>
        <button class="iconbtn x" data-act="cancel-reply">${ic('x','sm')}</button></div>` : ''}
    <div class="inputrow">
      <div class="inputbox">
        <button class="iconbtn" data-act="emoji" title="Emoji">${ic('smile')}</button>
        <button class="iconbtn" data-act="attach" title="Attach">${ic('clip')}</button>
        <button class="iconbtn" data-act="camera" title="Camera">${ic('camera')}</button>
        <textarea id="composerInput" rows="1" placeholder="${state.enterToSend?'MESSAGE — ENTER TO SEND':'MESSAGE'}"
          aria-label="Message input">${esc(ed ? ed.text : draft)}</textarea>
        <button class="iconbtn" data-act="gif" title="Stickers">${ic('image')}</button>
      </div>
      <button class="iconbtn" data-act="record" title="Record" id="recBtn">${ic('mic')}</button>
      <button class="sendbtn" data-act="send" id="sendBtn" ${(ed||draft.trim())?'':'disabled'}>${ic('send')}</button>
    </div>
    <div id="popRoot"></div>`;
  const ta = $('#composerInput');
  if(ta){
    autosize(ta);
    ta.addEventListener('input', ()=>{
      autosize(ta);
      state.drafts[c.id] = ta.value;
      const sb = $('#sendBtn'); if(sb) sb.disabled = !ta.value.trim();
    });
    ta.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        if(state.enterToSend && !e.shiftKey){ e.preventDefault(); doSend(); }
        else if(!state.enterToSend && (e.ctrlKey||e.metaKey)){ e.preventDefault(); doSend(); }
      }
    });
    ta.focus();
    ta.selectionStart = ta.selectionEnd = ta.value.length;
  }
}
function autosize(ta){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight, 150) + 'px'; }
function closePop(){ const r = $('#popRoot'); if(r) r.innerHTML=''; }

/* ============================================================
   SEND
   ============================================================ */
function doSend(){
  const ta = $('#composerInput'); if(!ta) return;
  const c = convo(state.activeConvo);
  if(!c) return;
  let text = ta.value.trim();
  if(!text && !state.editing) return;
  if(state.editing){
    const m = state.messages[c.id].find(x=>x.id===state.editing);
    if(m){ m.text = text; m.edited = true; }
    state.editing = null;
    ta.value = ''; renderMessages(); renderComposer();
    toast('MESSAGE EDITED','', {icon:'edit'});
    return;
  }
  const msg = {
    id: c.id + '_' + Date.now(), sender:'u0', text, ts: Date.now(),
    status:'sent', edited:false, deleted:false, type:'text', reactions:{},
    replyTo: state.replyTo || null, pinned:false, starred:false, mentions:[]
  };
  state.messages[c.id].push(msg);
  state.replyTo = null;
  ta.value = ''; state.drafts[c.id] = '';
  renderMessages(); renderComposer();
  simulateDelivery(c, msg);
}
function simulateDelivery(c, msg){
  setTimeout(()=>{ if(msg.status==='sent'){ msg.status='delivered'; if(state.activeConvo===c.id) renderMessages(); } }, 900);
  setTimeout(()=>{ if(msg.status==='delivered'){ msg.status='read'; if(state.activeConvo===c.id) renderMessages(); } }, 2400);
  setTimeout(()=>{
    if(c.type==='dm' && !c.blocked && Math.random() > .4){
      state.typing[c.id] = contact(c.members.find(m=>m!=='u0')).name.split(' ')[0];
      if(state.activeConvo===c.id) renderTypingRow();
      setTimeout(()=>{ delete state.typing[c.id]; if(state.activeConvo===c.id) renderTypingRow(); autoReply(c); }, 2200);
    }
  }, 1800);
}
const AUTOREPLIES = ['Copy that.','Understood — will action.','Thanks, reviewing now.','Noted. Standing by.','Acknowledged.'];
function autoReply(c){
  const other = c.members.find(m=>m!=='u0');
  if(!other) return;
  const m = {
    id: c.id+'_'+Date.now(), sender: other,
    text: AUTOREPLIES[Math.floor(Math.random()*AUTOREPLIES.length)],
    ts: Date.now(), status:null, edited:false, deleted:false, type:'text',
    reactions:{}, replyTo:null, pinned:false, starred:false, mentions:[]
  };
  state.messages[c.id].push(m);
  if(state.activeConvo === c.id && (state.view==='chats'||state.view==='groups')) renderMessages();
  else { c.unread++; renderSidebar(); }
  if(state.notifications && !state.dnd && !c.muted){
    toast(c.name, m.text, {icon:'chat'});
  }
}

/* ============================================================
   BULK SELECT
   ============================================================ */
function toggleBulkMode(){
  state.bulkMode = !state.bulkMode;
  state.bulkSelected.clear();
  renderChat();
}
function exitBulk(){
  state.bulkMode = false;
  state.bulkSelected.clear();
  renderChat();
}
function toggleBulkSelect(mid){
  if(state.bulkSelected.has(mid)) state.bulkSelected.delete(mid);
  else state.bulkSelected.add(mid);
  renderMessages();
  renderComposer();
}
function bulkForward(){
  const ids = Array.from(state.bulkSelected);
  if(!ids.length) return;
  state.forwardMsg = ids[0];
  openForwardModal(true);
}
function bulkStar(){
  const c = convo(state.activeConvo);
  if(!c) return;
  const count = state.bulkSelected.size;
  state.bulkSelected.forEach(mid=>{
    const m = state.messages[c.id].find(x=>x.id===mid);
    if(m){ m.starred = true; if(!state.saved.includes(mid)) state.saved.push(mid); }
  });
  exitBulk();
  toast('STARRED', `${count} message${count>1?'s':''} saved`, {icon:'star'});
}
function bulkDelete(){
  const c = convo(state.activeConvo);
  if(!c) return;
  const count = state.bulkSelected.size;
  if(!count) return;
  purgeConfirm(`${count} message${count>1?'s':''}`, ()=>{
    const ids = Array.from(state.bulkSelected);
    ids.forEach(mid=>{
      const m = state.messages[c.id].find(x=>x.id===mid);
      if(m) state.deletedMsgs.push({msg: m, convoId: c.id, convoName: c.name, deletedAt: Date.now()});
    });
    state.messages[c.id] = state.messages[c.id].filter(x=>!state.bulkSelected.has(x.id));
    state.bulkSelected.clear();
    state.bulkMode = false;
    renderMessages();
    renderComposer();
    renderChat();
    toast('DELETED', `${count} message${count>1?'s':''} moved to deleted`, {icon:'trash'});
  }, {label:'PURGE MESSAGES', confirmLabel:'PURGE'});
}

function collectShared(cid){
  const out = { media:[], files:[], voice:[], links:[], calls:[], all:[] };
  CONVOS.forEach(c=>{
    if(!c.members.includes(cid)) return;
    (state.messages[c.id]||[]).forEach(m=>{
      if(m.deleted) return;
      const item = { ...m, convoName:c.name, convoId:c.id };
      out.all.push(item);
      if(m.type === 'image') out.media.push(item);
      if(m.type === 'file') out.files.push(item);
      if(m.type === 'voice') out.voice.push(item);
      if(m.type === 'text' && /https?:\/\//.test(m.text||'')) out.links.push(item);
    });
  });
  CALLS.filter(k=>k.who === cid).forEach(k=>out.calls.push(k));
  out.all.sort((a,b)=>b.ts-a.ts);
  out.media.sort((a,b)=>b.ts-a.ts);
  out.files.sort((a,b)=>b.ts-a.ts);
  out.voice.sort((a,b)=>b.ts-a.ts);
  out.links.sort((a,b)=>b.ts-a.ts);
  return out;
}

/* ============================================================
   CALLS
   ============================================================ */
const callSystem = {
  active:false, direction:null, mode:'voice', contactId:null,
  status:'ringing', startTime:null, timerInterval:null,
  muted:false, speaker:false, cameraOn:true, layer:null
};

function startCall(mode){
  if(callSystem.active) return;
  const c = state.activeConvo ? convo(state.activeConvo) : null;
  const contactId = c && c.type==='dm' ? c.members.find(m=>m!=='u0') : (state.profileId || 'u2');
  startCallWith(contactId, mode);
}
function startCallWith(contactId, mode){
  if(callSystem.active) return;
  callSystem.active = true;
  callSystem.direction = 'outgoing';
  callSystem.mode = mode;
  callSystem.contactId = contactId;
  callSystem.status = 'ringing';
  callSystem.startTime = null;
  callSystem.muted = false;
  callSystem.speaker = false;
  callSystem.cameraOn = mode === 'video';
  renderCallUI();
  setTimeout(()=>{
    if(callSystem.active && callSystem.status === 'ringing'){
      callSystem.status = 'connected';
      callSystem.startTime = Date.now();
      renderCallUI();
    }
  }, 3800);
}
function simulateIncomingCall(mode){
  if(callSystem.active) return;
  mode = mode || 'voice';
  const online = CONTACTS.filter(c=>c.presence==='online' && !c.blocked);
  const target = online[Math.floor(Math.random()*online.length)] || CONTACTS[0];
  callSystem.active = true;
  callSystem.direction = 'incoming';
  callSystem.mode = mode;
  callSystem.contactId = target.id;
  callSystem.status = 'ringing';
  callSystem.startTime = null;
  callSystem.muted = false;
  callSystem.speaker = false;
  callSystem.cameraOn = mode === 'video';
  renderCallUI();
}
function acceptCall(){
  if(!callSystem.active) return;
  callSystem.direction = 'outgoing';
  callSystem.status = 'connected';
  callSystem.startTime = Date.now();
  renderCallUI();
  toast('CALL ACCEPTED', contact(callSystem.contactId).name, {icon:'phone'});
}
function declineCall(){
  const c = contact(callSystem.contactId);
  endCall();
  toast('CALL DECLINED', c.name, {icon:'phoneoff'});
}
function toggleCallMute(){ callSystem.muted = !callSystem.muted; renderCallUI(); }
function toggleCallSpeaker(){ callSystem.speaker = !callSystem.speaker; renderCallUI(); }
function toggleCallCamera(){ callSystem.cameraOn = !callSystem.cameraOn; renderCallUI(); }
function endCall(){
  if(callSystem.timerInterval){ clearInterval(callSystem.timerInterval); callSystem.timerInterval = null; }
  const wasActive = callSystem.active;
  const c = callSystem.contactId ? contact(callSystem.contactId) : null;
  const dur = callSystem.startTime ? Math.floor((Date.now() - callSystem.startTime)/1000) : 0;
  callSystem.active = false;
  callSystem.direction = null;
  callSystem.status = 'ringing';
  callSystem.startTime = null;
  if(callSystem.layer){ callSystem.layer.remove(); callSystem.layer = null; }
  if(wasActive && dur > 0 && c){
    toast('CALL ENDED', `${c.name} · ${fmtDur(dur)}`, {icon:'phoneoff'});
  } else if(wasActive){
    toast('CALL ENDED', '', {icon:'phoneoff'});
  }
}
function renderCallUI(){
  if(callSystem.layer) callSystem.layer.remove();
  const c = contact(callSystem.contactId);
  const isIncoming = callSystem.direction === 'incoming';
  const isConnected = callSystem.status === 'connected';
  const isVideo = callSystem.mode === 'video';
  const layer = document.createElement('div');
  layer.className = 'callui ' + callSystem.mode + (isIncoming ? ' incoming' : '');
  if(!isVideo){
    layer.innerHTML = `
      <div class="call-stage">
        <div class="call-rings"><i></i><i></i><i></i></div>
        <div class="call-avatar-wrap">
          <div class="call-avatar" style="color:${c.color}">
            ${av(c.name,c.color)}
            <span class="dot ${c.presence||'offline'}"></span>
          </div>
        </div>
        <div class="call-info">
          <div class="call-name">${esc(c.name)}</div>
          <div class="call-handle">${esc(c.handle)}</div>
          <div class="call-state ${isConnected?'live':''}" id="callState">
            ${isConnected?'<span class="pulse"></span>':''}
            <span id="callStateLabel">${isIncoming ? 'INCOMING VOICE CALL' : (isConnected ? 'CONNECTED · 00:00' : 'CALLING')}</span>
          </div>
        </div>
      </div>
      ${renderControls(isIncoming, isConnected, false)}`;
  } else {
    const meAcc = me();
    layer.innerHTML = `
      <div class="call-stage">
        <div class="call-remote">
          <div class="call-remote-inner">
            <div class="call-remote-avatar" style="color:${c.color}">${av(c.name,c.color)}</div>
            <div class="call-remote-label">${isConnected ? 'REMOTE VIDEO · LIVE' : 'AWAITING CONNECTION'}</div>
          </div>
        </div>
        <div class="call-pip">
          <div class="call-pip-inner">
            <div class="call-pip-avatar">${meAcc.init}</div>
            <div class="call-pip-name">YOU</div>
          </div>
          ${!callSystem.cameraOn ? '<div class="cam-off">CAM OFF</div>' : ''}
        </div>
      </div>
      <div class="call-top">
        <div class="call-top-left">
          <div class="avatar-sm">${av(c.name,c.color)}</div>
          <div class="info">
            <div class="name">${esc(c.name)}</div>
            <div class="sub">
              ${isConnected?'<span class="dot-live"></span>':(isIncoming?'':'<span class="dot-wait"></span>')}
              <span id="callStateLabel">${isIncoming ? 'INCOMING VIDEO CALL' : (isConnected ? 'CONNECTED · 00:00' : 'CALLING')}</span>
            </div>
          </div>
        </div>
        <div class="quality"><span>LINK</span><span class="bar"><i></i><i></i><i></i><i></i></span></div>
      </div>
      ${renderControls(isIncoming, isConnected, true)}`;
  }
  document.getElementById('layers').appendChild(layer);
  callSystem.layer = layer;
  layer.querySelectorAll('[data-call]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.call;
      if(k === 'end') return endCall();
      if(k === 'accept') return acceptCall();
      if(k === 'decline') return declineCall();
      if(k === 'mute') return toggleCallMute();
      if(k === 'speaker') return toggleCallSpeaker();
      if(k === 'camera') return toggleCallCamera();
    };
  });
  if(callSystem.timerInterval){ clearInterval(callSystem.timerInterval); callSystem.timerInterval = null; }
  if(isConnected){
    const tick = ()=>{
      if(!callSystem.active || callSystem.status !== 'connected') return;
      const el = document.getElementById('callStateLabel');
      if(el){
        const sec = Math.floor((Date.now() - callSystem.startTime)/1000);
        el.textContent = 'CONNECTED · ' + fmtDur(sec);
      }
    };
    tick();
    callSystem.timerInterval = setInterval(tick, 1000);
  }
}
function renderControls(isIncoming, isConnected, isVideo){
  if(isIncoming && !isConnected){
    return `
      <div class="call-controls">
        <div class="call-ctl-wrap">
          <button class="call-ctl end" data-call="decline">${ic('phoneoff')}</button>
          <div class="lbl">DECLINE</div>
        </div>
        <div class="call-ctl-wrap">
          <button class="call-ctl accept" data-call="accept">${ic('phone')}</button>
          <div class="lbl">ACCEPT</div>
        </div>
      </div>`;
  }
  const muteIcon = callSystem.muted ? 'micoff' : 'mic';
  const camIcon = callSystem.cameraOn ? 'video' : 'videooff';
  const ctlButtons = isVideo
    ? `
      <div class="call-ctl-wrap"><button class="call-ctl ${callSystem.muted?'on':''}" data-call="mute">${ic(muteIcon)}</button><div class="lbl">${callSystem.muted?'MUTED':'MUTE'}</div></div>
      <div class="call-ctl-wrap"><button class="call-ctl ${callSystem.cameraOn?'on':''}" data-call="camera">${ic(camIcon)}</button><div class="lbl">${callSystem.cameraOn?'CAM ON':'CAM OFF'}</div></div>

    <div class="view">

                <div style="font-size:9.5px;color:var(--ink-4);font-family:'Orbitron';letter-spacing:.08em">DELETED ${fmtRel(it.deletedAt).toUpperCase()} AGO</div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">

                <button class="btn danger" data-act="purge-msg" data-id="${m.id}">${ic('trash','sm')} DELETE FOREVER</button>
              </div>

        }).join('') : `<div class="empty" style="height:300px">${ic('trash2')}<div class="lbl">NOTHING DELETED</div></div>`}
      </div>
    </div>`;
}
