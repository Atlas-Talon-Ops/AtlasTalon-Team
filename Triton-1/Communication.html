/* ============================================================
   CALLS
   ============================================================ */
function startCall(mode){
  const c = state.activeConvo ? convo(state.activeConvo) : null;
  const other = c && c.type === 'dm' ? contact(c.members.find(m=>m!=='u0')) : (c ? {name:c.name, color:c.color, init:av(c.name,c.color)} : {name:'Unknown', color:'#e8b64c', init:'?'});
  const layer = document.createElement('div');
  layer.className = 'callui';
  layer.innerHTML = `
    <div class="ring"></div><div class="ring" style="animation-delay:1.3s"></div>
    <div class="cav" style="background:${other.color}18;border-color:${other.color}50;color:${other.color}">${other.init || av(other.name, other.color)}</div>
    <div style="text-align:center;z-index:2">
      <div style="font-size:16px;font-weight:700;font-family:'Orbitron';letter-spacing:.16em;text-transform:uppercase">${esc(other.name)}</div>
      <div style="font-size:10px;color:#94a3b8;margin-top:5px;font-family:'Orbitron';letter-spacing:.12em;text-transform:uppercase" id="callStatus">${mode==='video'?'VIDEO':'VOICE'} CALL · CONNECTING…</div>
    </div>
    <div class="callbar">
      <button class="cbtn" data-ct="mute">${ic('mic')}</button>
      <button class="cbtn" data-ct="spk">${ic('volume')}</button>
      <button class="cbtn" data-ct="cam">${ic('video')}</button>
      <button class="cbtn" data-ct="screen">${ic('monitor')}</button>
      <button class="cbtn end" data-ct="end">${ic('phoneoff')}</button>
    </div>`;
  document.getElementById('layers').appendChild(layer);

  setTimeout(()=>{ const s = document.getElementById('callStatus'); if(s) s.textContent = (mode==='video'?'VIDEO':'VOICE') + ' CALL · 00:00'; }, 1400);

  let sec = 0;
  const iv = setInterval(()=>{
    sec++;
    const s = document.getElementById('callStatus');
    if(s) s.textContent = (mode==='video'?'VIDEO':'VOICE') + ' CALL · ' + String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
  }, 1000);

  layer.querySelectorAll('[data-ct]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.ct;
      if(k === 'end'){ clearInterval(iv); layer.remove(); toast('CALL ENDED', 'Duration ' + String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'), {icon:'phoneoff'}); return; }
      b.classList.toggle('on');
    };
  });
}

/* ============================================================
   EXPORTS
   ============================================================ */
function download(filename, content, type){
  const blob = new Blob([content], {type: type||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast('EXPORT READY', filename, {icon:'download'});
}
function exportCSV(cid){
  let rows = [['timestamp','conversation','sender','type','direction','size','duration']];
  CONVOS.filter(c=>!cid || c.id===cid).forEach(c=>{
    (state.messages[c.id]||[]).forEach(m=>{
      rows.push([new Date(m.ts).toISOString(), c.name, m.sender==='u0'?'Me':contact(m.sender).name, m.type, m.sender==='u0'?'out':'in', m.fsize||'', m.dur||'']);
    });
  });
  download('sentinel_metadata_export.csv', rows.map(r=>r.join(',')).join('\n'), 'text/csv');
}
function exportJSON(){
  const data = CONVOS.map(c=>({
    conversation:c.name, type:c.type, members:c.members.map(m=>contact(m).name),
    events:(state.messages[c.id]||[]).map(m=>({ts:new Date(m.ts).toISOString(), sender:m.sender, type:m.type}))
  }));
  download('sentinel_timeline.json', JSON.stringify(data,null,2), 'application/json');
}
function exportTXT(){
  const lines = ['SENTINEL AUDIT LOG','Generated ' + new Date().toISOString(),''];
  CONVOS.forEach(c=>{
    lines.push('--- ' + c.name + ' ---');
    (state.messages[c.id]||[]).forEach(m=>{
      lines.push(`[${fmtFull(m.ts)}] ${m.sender==='u0'?'Me':contact(m.sender).name} · ${m.type}`);
    });
    lines.push('');
  });
  download('sentinel_audit_log.txt', lines.join('\n'));
}

function openPalette(){
  const layer = document.createElement('div');
  layer.className = 'scrim';
  layer.style.alignItems = 'flex-start';
  layer.innerHTML = `
    <div class="palette">
      <input id="palQ" placeholder="TYPE A COMMAND OR SEARCH…" autocomplete="off"/>
      <div class="plist" id="palList"></div>
    </div>`;
  document.getElementById('layers').appendChild(layer);

  const input = layer.querySelector('#palQ');
  const list = layer.querySelector('#palList');
  let sel = 0, filtered = COMMANDS.slice();

  function draw(){
    list.innerHTML = filtered.map((c,i)=>`
      <div class="pitem ${i===sel?'sel':''}" data-i="${i}">
        ${ic(c.icon,'sm')}<span>${esc(c.label)}</span>
      </div>`).join('') || '<div class="lbl" style="padding:14px">No matches</div>';
    list.querySelectorAll('[data-i]').forEach(el=>{
      el.onclick = ()=>{ filtered[+el.dataset.i].run(); layer.remove(); };
    });
  }
  function filter(){
    const q = input.value.toLowerCase().trim();
    filtered = COMMANDS.filter(c=>c.label.toLowerCase().includes(q));
    sel = 0; draw();
  }
  input.addEventListener('input', filter);
  input.addEventListener('keydown', e=>{
    if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel+1, filtered.length-1); draw(); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel-1, 0); draw(); }
    if(e.key === 'Enter'){ e.preventDefault(); if(filtered[sel]){ filtered[sel].run(); layer.remove(); } }
    if(e.key === 'Escape') layer.remove();
  });
  layer.addEventListener('click', e=>{ if(e.target === layer) layer.remove(); });
  draw();
  setTimeout(()=>input.focus(), 40);
}

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', e=>{
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); return; }
  if(mod && e.key.toLowerCase() === 'f'){ e.preventDefault(); const s = $('#globalSearch'); if(s){ s.focus(); s.select(); } return; }
  if(mod && e.key === '/'){ e.preventDefault(); state.dnd = !state.dnd; toast('DO NOT DISTURB', state.dnd?'ENABLED':'DISABLED', {icon:'belloff'}); return; }
  if(mod && e.key === ','){ e.preventDefault(); state.view = 'settings'; renderAll(); return; }
  if(e.altKey && e.key === 'ArrowDown'){
    e.preventDefault();
    const list = sortedConvos();
    const i = list.findIndex(c=>c.id===state.activeConvo);
    const n = list[Math.min(i+1, list.length-1)];
    if(n){ state.activeConvo = n.id; n.unread = 0; renderAll(); }
    return;
  }
  if(e.altKey && e.key === 'ArrowUp'){
    e.preventDefault();
    const list = sortedConvos();
    const i = list.findIndex(c=>c.id===state.activeConvo);
    const n = list[Math.max(i-1, 0)];
    if(n){ state.activeConvo = n.id; n.unread = 0; renderAll(); }
    return;
  }
  if(e.key === 'Escape'){
    closePop(); closeCtx(); closeModal();
    const s = $('.scrim'); if(s) s.remove();
    if(state.activeConvo && document.activeElement && document.activeElement.tagName !== 'TEXTAREA'){
      if(document.activeElement === document.body){ state.activeConvo = null; renderAll(); }
    }
  }
});
