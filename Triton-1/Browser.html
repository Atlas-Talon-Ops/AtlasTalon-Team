<body>

    <div id="root" class="br-root">
        <!-- The app will be rendered here -->
    </div>

    <script>
        // ================================================================
        //  DATA HELPERS
        // ================================================================
        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function rnd(n) { return Math.floor(Math.random() * n); }

        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        // ================================================================
        //  STATE
        // ================================================================
        let tabIdCounter = 0;

        function makeTab(url) {
            return {
                id: ++tabIdCounter,
                title: 'New Tab',
                url: url || 'obsidian://newtab',
                history: url ? [url] : [],
                historyIndex: url ? 0 : -1
            };
        }

        let state = {
            tabs: [makeTab()],
            activeTabId: 1,
            bookmarks: [],
            downloads: [],
            networkLog: [],
            torEnabled: false,
            ghostMode: false,
            deepScrape: false,
            sidebarType: null, // 'history' | 'bookmarks' | null
            networkPanelOpen: false,
            dlPanelOpen: false,
            loading: false,
            loadingPct: 0,
            statusText: 'Ready',
            statusType: 'secure',
            currentIp: '192.168.14.7',
            nodeCount: 14,
            contextMenu: null,
            modal: null,
            urlInput: 'obsidian://newtab',
            findBarVisible: false,
            findQuery: '',
            currentHtml: '',
            proxyPort: 8080,
            ghostInterval: null,
        };

        let rootEl = document.getElementById('root');

        // ================================================================
        //  PERSISTENCE
        // ================================================================
        function loadBookmarks() {
            try {
                const raw = localStorage.getItem('obsidian_bookmarks');
                if (raw) {
                    state.bookmarks = JSON.parse(raw);
                } else {
                    state.bookmarks = [
                        { id: 1, title: 'GitHub', url: 'https://github.com', icon: 'GH' },
                        { id: 2, title: 'DuckDuckGo', url: 'https://duckduckgo.com', icon: 'DD' },
                        { id: 3, title: 'Wikipedia', url: 'https://en.wikipedia.org', icon: 'WI' },
                        { id: 4, title: 'Reddit', url: 'https://reddit.com', icon: 'RD' },
                    ];
                    saveBookmarks();
                }
            } catch (_) { state.bookmarks = []; }
        }

        function saveBookmarks() {
            try {
                localStorage.setItem('obsidian_bookmarks', JSON.stringify(state.bookmarks));
            } catch (_) {}
        }

        function loadDownloads() {
            try {
                const raw = localStorage.getItem('obsidian_downloads');
                if (raw) {
                    state.downloads = JSON.parse(raw);
                } else {
                    state.downloads = [];
                    saveDownloads();
                }
            } catch (_) { state.downloads = []; }
        }

        function saveDownloads() {
            try {
                localStorage.setItem('obsidian_downloads', JSON.stringify(state.downloads));
            } catch (_) {}
        }

        function addBookmarkToDB(title, url, icon) {
            const id = Date.now();
            state.bookmarks.push({ id, title: title || url.split('/')[2] || 'Bookmark', url, icon: icon || 'BK' });
            saveBookmarks();
        }

        function addDownloadToDB(filename, size, url) {
            const id = Date.now();
            const entry = { id, filename, size, url, progress: 0, status: 'downloading' };
            state.downloads.push(entry);
            saveDownloads();
            return id;
        }

        function updateDownloadProgress(id, progress, status) {
            const idx = state.downloads.findIndex(d => d.id === id);
            if (idx === -1) return;
            state.downloads[idx].progress = progress;
            if (status) state.downloads[idx].status = status;
            saveDownloads();
        }

        function clearDownloads() {
            state.downloads = [];
            saveDownloads();
        }

        // ================================================================
        //  NAVIGATION / LOADING
        // ================================================================
        function getActiveTab() {
            return state.tabs.find(t => t.id === state.activeTabId);
        }

        function addLog(method, status, url) {
            state.networkLog.push({ method, status, url, time: new Date().toLocaleTimeString() });
            if (state.networkLog.length > 50) state.networkLog.shift();
        }

        function updateStatus(text, type) {
            state.statusText = text;
            state.statusType = type || 'secure';
        }

        function getTabIcon(url) {
            if (url.includes('newtab')) return 'O';
            if (url.includes('images')) return 'IMG';
            if (url.includes('videos')) return 'VID';
            if (url.includes('news')) return 'N';
            return 'W';
        }

        function securityInfo(url) {
            if (!url) return { cls: '', icon: null };
            if (url.startsWith('https://')) return { cls: 'secure',
                icon: '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>' };
            if (url.startsWith('http://')) return { cls: 'warning',
                icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>' };
            return { cls: '', icon: null };
        }

        // ----- Proxy URL rewriting (simulated) -----
        function rewriteUrlsForProxy(html, baseUrl, port, useTor) {
            if (!port) return html;
            const proxyBase = `http://127.0.0.1:${port}/proxy`;
            const torParam = useTor ? '&tor=true' : '';

            function proxyUrl(url) {
                if (!url || url.startsWith('data:') || url.startsWith('blob:') ||
                    url.startsWith('javascript:') || url.startsWith('#') ||
                    url.startsWith('mailto:')) {
                    return url;
                }
                try {
                    const absolute = new URL(url, baseUrl).href;
                    return `${proxyBase}?url=${encodeURIComponent(absolute)}${torParam}`;
                } catch {
                    return url;
                }
            }

            let result = html.replace(/<meta[^>]+http-equiv=["']Content-Security-Policy["'][^>]*>/gi, '');
            result = result.replace(/<meta[^>]+http-equiv=["']X-Frame-Options["'][^>]*>/gi, '');

            result = result.replace(/\ssrc=["']([^"']+)["']/gi, (match, url) => ` src="${proxyUrl(url)}"`);
            result = result.replace(/\shref=["']([^"']+)["']/gi, (match, url) => {
                if (url.startsWith('#') || url.startsWith('mailto:')) return match;
                return ` href="${proxyUrl(url)}"`;
            });
            result = result.replace(/url\(["']?([^)"']+)["']?\)/gi, (match, url) => `url("${proxyUrl(url)}")`);
            result = result.replace(/\ssrcset=["']([^"']+)["']/gi, (match, srcset) => {
                const rewritten = srcset.split(',').map(part => {
                    const [u, descriptor] = part.trim().split(/\s+/);
                    const rewrittenUrl = proxyUrl(u);
                    return descriptor ? `${rewrittenUrl} ${descriptor}` : rewrittenUrl;
                }).join(', ');
                return ` srcset="${rewritten}"`;
            });
            result = result.replace(/\saction=["']([^"']+)["']/gi, (match, url) => ` action="${proxyUrl(url)}"`);
            result = result.replace(/<a\s+([^>]*?)href=["']([^"']+)["']([^>]*)>/gi, (match, before, href, after) => {
                return `<a ${before}href="${href}" target="_blank"${after}>`;
            });

            return result;
        }

        // ----- Fetch URL (simulated with fetch or fallback) -----
        async function loadUrl(url, updateTitle) {
            if (url === 'obsidian://newtab' || url.startsWith('obsidian://')) {
                state.currentHtml = '';
                render();
                return;
            }

            state.loading = true;
            state.loadingPct = 0;
            let pct = 0;
            const interval = setInterval(() => {
                pct += Math.random() * 30;
                if (pct > 100) pct = 100;
                state.loadingPct = pct;
                if (pct >= 100) clearInterval(interval);
                render();
            }, 100);

            try {
                // Try to fetch the URL directly (may hit CORS issues)
                let html = '';
                try {
                    const response = await fetch(url, {
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });
                    if (response.ok) {
                        html = await response.text();
                    } else {
                        html = `<html><body style="background:#0a0a0a;color:#ff6666;font-family:monospace;padding:40px;">
                            <h2>⚠️ FETCH FAILED</h2>
                            <p style="color:#aaa;">Status: ${response.status} ${response.statusText}</p>
                            <p style="color:#888;font-size:12px;margin-top:20px;">URL: ${url}</p>
                            <p style="color:#555;font-size:11px;margin-top:12px;">Try using a search query instead.</p>
                        </body></html>`;
                    }
                } catch (fetchErr) {
                    // Fallback: generate a simulated page
                    const domain = url.split('/')[2] || 'unknown';
                    html = `<html><head><title>${domain}</title></head>
                        <body style="background:#0a0a0a;color:#e0e0e0;font-family:'JetBrains Mono',monospace;padding:40px;max-width:800px;margin:0 auto;">
                            <h1 style="color:var(--cyan);">${domain}</h1>
                            <p style="color:#888;font-size:14px;">URL: ${escHtml(url)}</p>
                            <hr style="border-color:#333;margin:24px 0;" />
                            <p style="color:#666;font-size:13px;">This page was loaded through the Obsidian OS browser.</p>
                            <p style="color:#555;font-size:12px;margin-top:12px;">🔒 TOR: ${state.torEnabled ? 'ACTIVE' : 'OFF'} | 🌐 Proxy: ${state.proxyPort}</p>
                            <div style="margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;">
                                <a href="#" onclick="event.preventDefault();window.downloadUrl('${url}')" style="color:var(--cyan);text-decoration:none;border:1px solid var(--cyan-dim);padding:8px 16px;">⬇ DOWNLOAD</a>
                                <a href="#" onclick="event.preventDefault();window.scrapeUrl('${url}')" style="color:var(--amber);text-decoration:none;border:1px solid var(--grey-400);padding:8px 16px;">📡 SCRAPE</a>
                            </div>
                        </body></html>`;
                }

                const urlObj = new URL(url);
                const baseUrl = `${urlObj.protocol}//${urlObj.host}`;
                const modifiedHtml = rewriteUrlsForProxy(html, baseUrl, state.proxyPort, state.torEnabled);
                state.currentHtml = modifiedHtml;

                if (updateTitle) {
                    const titleMatch = html.match(/<title[^>]*>(.*?)<\/title>/is);
                    if (titleMatch) {
                        const title = titleMatch[1].replace(/<[^>]+>/g, '').trim();
                        state.tabs = state.tabs.map(t =>
                            t.id === state.activeTabId ? { ...t, title } : t
                        );
                    }
                }

                addLog('GET', 200, url + (state.torEnabled ? ' (via Tor)' : ''));

            } catch (err) {
                console.error('Load error:', err);
                const errHtml = `<html><body style="background:#0a0a0a;color:#ff4444;font-family:monospace;padding:40px;">
                    <h2 style="color:#ff6666;margin-bottom:16px;">LOAD FAILED</h2>
                    <p style="margin-bottom:8px;color:#aaa;">URL: ${url}</p>
                    <p style="color:#ff4444;">${String(err)}</p>
                </body></html>`;
                state.currentHtml = errHtml;
            } finally {
                setTimeout(() => {
                    state.loading = false;
                    render();
                }, 200);
                clearInterval(interval);
            }
        }

        // ----- Navigation -----
        function navigateTo(rawUrl) {
            let url = rawUrl.trim();
            if (!url) return;
            if (!url.includes('://') && !url.startsWith('obsidian://')) {
                url = url.includes('.') && !url.includes(' ') ?
                    'https://' + url :
                    'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(url);
            }

            const active = getActiveTab();
            if (!active) return;

            const newHist = active.historyIndex < active.history.length - 1 ?
                [...active.history.slice(0, active.historyIndex + 1), url] :
                [...active.history, url];

            state.tabs = state.tabs.map(t => {
                if (t.id !== state.activeTabId) return t;
                return {
                    ...t,
                    url,
                    title: url.split('/')[2] || 'Loading...',
                    history: newHist,
                    historyIndex: newHist.length - 1
                };
            });

            state.urlInput = url;
            addLog('GET', 200, url);
            loadUrl(url, true);
            render();
        }

        function goBack() {
            const active = getActiveTab();
            if (!active || active.historyIndex <= 0) return;
            const prevIndex = active.historyIndex - 1;
            const prevUrl = active.history[prevIndex];
            state.tabs = state.tabs.map(t =>
                t.id === state.activeTabId ? { ...t, url: prevUrl, historyIndex: prevIndex } : t
            );
            state.urlInput = prevUrl;
            loadUrl(prevUrl, true);
            render();
        }

        function goForward() {
            const active = getActiveTab();
            if (!active || active.historyIndex >= active.history.length - 1) return;
            const nextIndex = active.historyIndex + 1;
            const nextUrl = active.history[nextIndex];
            state.tabs = state.tabs.map(t =>
                t.id === state.activeTabId ? { ...t, url: nextUrl, historyIndex: nextIndex } : t
            );
            state.urlInput = nextUrl;
            loadUrl(nextUrl, true);
            render();
        }

        function refreshPage() {
            const active = getActiveTab();
            if (active) loadUrl(active.url, true);
        }

        function goHome() {
            navigateTo('obsidian://newtab');
        }

        // ================================================================
        //  TABS
        // ================================================================
        function createNewTab(url) {
            const tab = makeTab(url);
            state.tabs.push(tab);
            state.activeTabId = tab.id;
            if (url) navigateTo(url);
            render();
        }

        function closeTab(id) {
            if (state.tabs.length === 1) {
                const t = makeTab();
                state.tabs = [t];
                state.activeTabId = t.id;
                render();
                return;
            }
            const idx = state.tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const next = [...state.tabs];
            next.splice(idx, 1);
            state.tabs = next;
            if (state.activeTabId === id) {
                state.activeTabId = next[Math.min(idx, next.length - 1)].id;
            }
            render();
        }

        function switchTab(id) {
            state.activeTabId = id;
            const tab = getActiveTab();
            if (tab) {
                state.urlInput = tab.url;
                if (tab.url !== 'obsidian://newtab' && !tab.url.startsWith('obsidian://')) {
                    loadUrl(tab.url, false);
                } else {
                    state.currentHtml = '';
                }
            }
            render();
        }

        // ================================================================
        //  GHOST MODE
        // ================================================================
        function toggleGhostMode() {
            state.ghostMode = !state.ghostMode;
            if (state.ghostMode) {
                if (state.ghostInterval) clearInterval(state.ghostInterval);
                state.ghostInterval = setInterval(() => {
                    state.currentIp = `${rnd(255)}.${rnd(255)}.${rnd(255)}.${rnd(255)}`;
                    state.nodeCount = Math.floor(Math.random() * 30) + 5;
                    addLog('POST', 200, '/tunnel/rotate');
                    render();
                }, 60000);
                updateStatus('Ghost mode active', 'warning');
            } else {
                if (state.ghostInterval) {
                    clearInterval(state.ghostInterval);
                    state.ghostInterval = null;
                }
                updateStatus('Ghost mode disabled', 'secure');
            }
            render();
        }

        // ================================================================
        //  DOWNLOADS
        // ================================================================
        function downloadUrl(url) {
            const filename = url.split('/').pop() || 'download_' + Date.now();
            const size = (Math.random() * 5 + 0.5).toFixed(1);
            const id = addDownloadToDB(filename, parseFloat(size), url);
            state.dlPanelOpen = true;
            let progress = 0;
            const iv = setInterval(() => {
                progress += Math.random() * 20;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(iv);
                    updateDownloadProgress(id, progress, 'complete');
                } else {
                    updateDownloadProgress(id, progress, 'downloading');
                }
                render();
            }, 200);
            addLog('GET', 200, url);
            render();
        }

        // Expose download functions to inline onclick
        window.downloadUrl = downloadUrl;

        function scrapeUrl(url) {
            addLog('POST', 200, '/scrape?url=' + encodeURIComponent(url));
            const filename = 'scrape_' + (url.split('/')[2] || 'file') + '_' + Date.now() + '.json';
            const id = addDownloadToDB(filename, 0.8, url);
            state.dlPanelOpen = true;
            updateStatus('Scraping...', 'warning');
            setTimeout(() => {
                updateDownloadProgress(id, 100, 'complete');
                updateStatus('Scrape complete', 'secure');
                render();
            }, 1500);
            render();
        }
        window.scrapeUrl = scrapeUrl;

        function sendToImint(url) {
            addLog('POST', 200, '/imint/capture');
            updateStatus('Sent to IMINT Hub', 'secure');
            render();
        }

        // ================================================================
        //  BOOKMARKS
        // ================================================================
        function addBookmark() {
            const active = getActiveTab();
            if (!active || active.url.includes('newtab')) {
                updateStatus('Cannot bookmark new tab', 'warning');
                render();
                return;
            }
            state.modal = {
                title: 'ADD BOOKMARK',
                fields: [
                    { id: 'bmTitle', label: 'TITLE', value: active.title },
                    { id: 'bmUrl', label: 'URL', value: active.url },
                    { id: 'bmIcon', label: 'ICON (2 chars)', value: active.title.substring(0, 2).toUpperCase(),
                    maxLength: 2 },
                ],
                onConfirm: function(vals) {
                    addBookmarkToDB(vals.bmTitle, vals.bmUrl, vals.bmIcon.toUpperCase());
                    updateStatus('Bookmark added', 'secure');
                    state.modal = null;
                    render();
                }
            };
            render();
        }

        // ================================================================
        //  PURGE
        // ================================================================
        function purgeSession() {
            state.networkLog = [];
            clearDownloads();
            state.tabs = [makeTab()];
            state.activeTabId = 1;
            state.sidebarType = null;
            state.currentHtml = '';
            state.urlInput = 'obsidian://newtab';
            updateStatus('Session purged', 'secure');
            addLog('POST', 200, '/session/purge');
            render();
        }

        // ================================================================
        //  RENDER
        // ================================================================
        function render() {
            const s = state;
            const active = getActiveTab();

            // --- Security info ---
            const sec = securityInfo(active ? active.url : '');
            const canBack = active && active.historyIndex > 0;
            const canForward = active && active.historyIndex < active.history.length - 1;
            const showTunnel = active && (active.url.startsWith('https://') || active.url.startsWith('http://'));
            const urlDisplay = active ? active.url : '';

            // --- Build tabs ---
            let tabsHtml = '';
            s.tabs.forEach(tab => {
                const isActive = tab.id === s.activeTabId;
                tabsHtml += `
                    <div class="br-tab ${isActive ? 'active' : ''}" data-tabid="${tab.id}">
                        <div class="br-tab-icon">${getTabIcon(tab.url)}</div>
                        <span class="br-tab-title">${escHtml(tab.title)}</span>
                        <span class="br-tab-close" data-closeid="${tab.id}">×</span>
                    </div>
                `;
            });

            // --- Build bookmarks bar ---
            let bookmarksHtml = '';
            s.bookmarks.forEach(b => {
                bookmarksHtml += `
                    <div class="br-bookmark-item" data-bmurl="${escHtml(b.url)}">
                        <div class="br-bookmark-icon">${escHtml(b.icon)}</div>
                        <span>${escHtml(b.title)}</span>
                    </div>
                `;
            });

            // --- Build sidebar ---
            let sidebarHtml = '';
            let sidebarContentHtml = '';
            if (s.sidebarType === 'history') {
                const allUrls = [];
                s.tabs.forEach(t => { t.history.forEach(u => { if (!allUrls.includes(u)) allUrls.push(u); }); });
                const recent = allUrls.slice(-20).reverse();
                recent.forEach((url, i) => {
                    sidebarContentHtml += `
                        <div class="br-sidebar-item" data-nav="${escHtml(url)}">
                            <div class="br-sidebar-item-title">${escHtml(url.split('/').pop() || url.split('/')[2] || 'page')}</div>
                            <div class="br-sidebar-item-url">${escHtml(url)}</div>
                            <div class="br-sidebar-item-time">${new Date().toLocaleTimeString()}</div>
                        </div>
                    `;
                });
            } else if (s.sidebarType === 'bookmarks') {
                s.bookmarks.forEach(b => {
                    sidebarContentHtml += `
                        <div class="br-sidebar-item" data-nav="${escHtml(b.url)}">
                            <div class="br-sidebar-item-title">${escHtml(b.title)}</div>
                            <div class="br-sidebar-item-url">${escHtml(b.url)}</div>
                        </div>
                    `;
                });
            }

            if (s.sidebarType) {
                sidebarHtml = `
                    <div class="br-sidebar open">
                        <div class="br-sidebar-header">
                            <span class="br-sidebar-title">${s.sidebarType.toUpperCase()}</span>
                            <span class="br-sidebar-close" data-action="closeSidebar">×</span>
                        </div>
                        <div class="br-sidebar-content">${sidebarContentHtml || '<div style="padding:12px;color:var(--grey-400);font-size:10px;">No entries</div>'}</div>
                    </div>
                `;
            } else {
                sidebarHtml = `<div class="br-sidebar"><div class="br-sidebar-header"><span class="br-sidebar-title">EMPTY</span><span class="br-sidebar-close" data-action="closeSidebar">×</span></div><div class="br-sidebar-content"></div></div>`;
            }

            // --- Build viewport ---
            let viewportHtml = '';
            if (!active) {
                viewportHtml = `<div style="padding:40px;color:var(--grey-400);text-align:center;">No active tab</div>`;
            } else if (active.url === 'obsidian://newtab') {
                // New tab page
                let quickLinksHtml = '';
                s.bookmarks.slice(0, 8).forEach(b => {
                    quickLinksHtml += `
                        <div class="br-quick-link" data-nav="${escHtml(b.url)}">
                            <div class="br-quick-link-icon">${escHtml(b.icon)}</div>
                            <span class="br-quick-link-title">${escHtml(b.title)}</span>
                        </div>
                    `;
                });
                viewportHtml = `
                    <div class="br-ntp">
                        <div class="br-ntp-logo">O</div>
                        <div class="br-ntp-search-container">
                            <div class="br-ntp-search-bar">
                                <input class="br-ntp-input" id="ntpSearchInput" placeholder="Search the network or enter URL..." />
                                <button class="br-ntp-search-btn" id="ntpSearchBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="16" height="16"><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" /></svg>
                                </button>
                            </div>
                        </div>
                        <div class="br-quick-links">${quickLinksHtml}</div>
                    </div>
                `;
            } else if (active.url.startsWith('obsidian://')) {
                viewportHtml = `<div style="padding:40px;color:var(--grey-400);text-align:center;">${escHtml(active.url)}</div>`;
            } else {
                const headerTitle = active.url.split('/')[2] || 'unknown';
                viewportHtml = `
                    <div class="br-webpage">
                        <div class="br-webpage-header">
                            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--grey-400);">
                                ${s.torEnabled ? 'TOR ACTIVE' : 'CLEARNET'} | SOURCE:
                            </span>
                            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cyan);margin-left:4px;">
                                ${escHtml(headerTitle)}
                            </span>
                        </div>
                        <div class="br-webpage-body">
                            <iframe srcdoc="${escHtml(s.currentHtml)}" title="webpage" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
                        </div>
                    </div>
                `;
            }

            // --- Build network panel ---
            let networkHtml = '';
            [...s.networkLog].reverse().forEach(e => {
                const statusClass = e.status < 300 ? 'br-log-success' : e.status < 400 ? 'br-log-redirect' :
                'br-log-error';
                networkHtml += `
                    <div class="br-log-entry">
                        <span class="br-log-method br-log-${e.method.toLowerCase()}">${e.method}</span>
                        <span class="br-log-status ${statusClass}">${e.status}</span>
                        <span class="br-log-url">${escHtml(e.url.substring(0, 50))}${e.url.length > 50 ? '...' : ''}</span>
                        <span class="br-log-time">${e.time}</span>
                    </div>
                `;
            });

            // --- Build downloads panel ---
            let downloadsHtml = '';
            s.downloads.forEach(d => {
                downloadsHtml += `
                    <div class="br-dl-item">
                        <div class="br-dl-filename">${escHtml(d.filename)}</div>
                        <div class="br-dl-bar"><div class="br-dl-fill" style="width:${d.progress}%;"></div></div>
                        <div class="br-dl-info"><span>${d.size} MB</span><span>${d.progress}%</span></div>
                    </div>
                `;
            });
            if (s.downloads.length === 0) {
                downloadsHtml =
                    `<div style="padding:12px;font-size:10px;color:var(--grey-400);font-family:'JetBrains Mono',monospace;">No downloads</div>`;
            }

            // --- Build modal ---
            let modalHtml = '';
            if (s.modal) {
                let fieldsHtml = '';
                (s.modal.fields || []).forEach(f => {
                    fieldsHtml += `
                        <div>
                            <label class="br-form-label">${f.label}</label>
                            <input class="br-form-input" id="modalField_${f.id}" value="${escHtml(f.value || '')}" ${f.maxLength ? `maxlength="${f.maxLength}"` : ''} />
                        </div>
                    `;
                });
                modalHtml = `
                    <div class="br-modal-overlay visible">
                        <div class="br-modal">
                            <div class="br-modal-header">
                                <span class="br-modal-title">${s.modal.title}</span>
                                <button class="br-modal-close" data-action="closeModal">×</button>
                            </div>
                            <div class="br-modal-body">${fieldsHtml}</div>
                            <div class="br-modal-footer">
                                <button class="br-btn" data-action="closeModal">CANCEL</button>
                                <button class="br-btn primary" data-action="confirmModal">SAVE</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- Build context menu ---
            let contextHtml = '';
            if (s.contextMenu) {
                contextHtml = `
                    <div class="br-context-menu" style="left:${s.contextMenu.x}px;top:${s.contextMenu.y}px;">
                        <div class="br-context-item" data-action="goBack">Back <span class="br-context-shortcut">Alt+←</span></div>
                        <div class="br-context-item" data-action="goForward">Forward <span class="br-context-shortcut">Alt+→</span></div>
                        <div class="br-context-item" data-action="refreshPage">Refresh <span class="br-context-shortcut">F5</span></div>
                        <div class="br-context-divider"></div>
                        <div class="br-context-item" data-action="addBookmark">Add Bookmark <span class="br-context-shortcut">Ctrl+D</span></div>
                        <div class="br-context-divider"></div>
                        <div class="br-context-item" data-action="inspect">Inspect Element <span class="br-context-shortcut">F12</span></div>
                    </div>
                `;
            }

            // --- Status dot ---
            const dotClass = s.statusType === 'warning' ? 'warning' : s.statusType === 'danger' ? 'danger' : '';

            // --- Security icon ---
            let secIconHtml = '';
            if (sec.icon) {
                secIconHtml = `<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">${sec.icon}</svg>`;
            }

            // --- Assemble ---
            rootEl.innerHTML = `
                <!-- TITLE BAR -->
                <div class="br-title-bar">
                    <div class="br-title-left">
                        <div class="br-os-logo">O</div>
                        <span class="br-title-text">NETWORK RECON // OBSIDIAN OS v2.4.1</span>
                    </div>
                    <div class="br-window-controls">
                        <div class="br-win-btn"></div>
                        <div class="br-win-btn"></div>
                        <div class="br-win-btn close-btn"></div>
                    </div>
                </div>

                <!-- TAB BAR -->
                <div class="br-tab-bar" id="tabBar">
                    ${tabsHtml}
                    <div class="br-new-tab-btn" id="newTabBtn">+</div>
                </div>

                <!-- NAV BAR -->
                <div class="br-nav-bar">
                    <div class="br-nav-group">
                        <button class="br-nav-btn" id="backBtn" ${canBack ? '' : 'disabled'}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
                        </button>
                        <button class="br-nav-btn" id="forwardBtn" ${canForward ? '' : 'disabled'}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
                        </button>
                        <button class="br-nav-btn" id="refreshBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 4v6h-6M1 20v-6h6" /><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" /></svg>
                        </button>
                        <button class="br-nav-btn" id="homeBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" /><polyline points="9,22 9,12 15,12 15,22" /></svg>
                        </button>
                    </div>

                    <div class="br-url-bar-container">
                        <div class="br-security-indicator ${sec.cls}">${secIconHtml}</div>
                        <div class="br-url-bar">
                            ${showTunnel ? '<span class="br-url-tunnel-badge">TUNNEL</span>' : ''}
                            <input class="br-url-input" id="urlInput" value="${escHtml(urlDisplay)}" placeholder="Enter URL or search query..." spellcheck="false" autocomplete="off" />
                        </div>
                    </div>

                    <div class="br-action-group">
                        <button class="br-action-btn ${s.ghostMode ? 'active' : ''}" id="ghostBtn">
                            <span class="br-indicator"></span>GHOST
                        </button>
                        <button class="br-action-btn ${s.torEnabled ? 'active' : ''}" id="torBtn" style="${s.torEnabled ? 'border-color:#00ffcc;' : ''}">
                            TOR ${s.torEnabled ? 'ON' : 'OFF'}
                        </button>
                        <button class="br-action-btn ${s.deepScrape ? 'active' : ''}" id="scrapeBtn">SCRAPE</button>
                        <button class="br-action-btn" id="bookmarkBtn" title="Ctrl+D">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" /></svg>
                        </button>
                        <button class="br-action-btn" id="historyBtn" title="History">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><circle cx="12" cy="12" r="10" /><polyline points="12,6 12,12 16,14" /></svg>
                        </button>
                        <button class="br-action-btn" id="downloadsBtn" title="Downloads">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" /></svg>
                        </button>
                        <button class="br-action-btn" id="netBtn">NET</button>
                        <button class="br-action-btn danger" id="purgeBtn">PURGE</button>
                    </div>
                </div>

                <!-- BOOKMARKS BAR -->
                <div class="br-bookmarks-bar">${bookmarksHtml}</div>

                <!-- MAIN CONTENT -->
                <div class="br-main-content" id="mainContent">
                    ${sidebarHtml}
                    <div class="br-viewport" id="viewport">
                        <div class="br-loading-bar ${s.loading ? 'active' : ''}">
                            <div class="br-loading-progress" style="width:${s.loadingPct}%;"></div>
                        </div>
                        ${viewportHtml}
                    </div>
                </div>

                <!-- STATUS BAR -->
                <div class="br-status-bar">
                    <div class="br-status-left">
                        <div class="br-status-item">
                            <div class="br-status-dot ${dotClass}"></div>
                            <span>${escHtml(s.statusText)}</span>
                        </div>
                        <div class="br-status-item">NODES: ${s.nodeCount}</div>
                        <div class="br-status-item">TUNNEL: ACTIVE</div>
                    </div>
                    <div class="br-status-right">
                        <span>${s.currentIp}</span>
                        <span>OBSIDIAN_BROWSER/2.4</span>
                    </div>
                </div>

                <!-- NETWORK PANEL -->
                <div class="br-network-panel ${s.networkPanelOpen ? 'open' : ''}">
                    <div class="br-network-panel-header">
                        <span class="br-network-panel-title">NETWORK ACTIVITY</span>
                        <span class="br-sidebar-close" id="closeNetPanel">×</span>
                    </div>
                    <div class="br-network-content">${networkHtml}</div>
                </div>

                <!-- DOWNLOAD PANEL -->
                <div class="br-dl-panel ${s.dlPanelOpen ? 'open' : ''}">
                    <div class="br-dl-panel-header">
                        <span class="br-dl-panel-title">DOWNLOADS</span>
                        <span class="br-sidebar-close" id="closeDlPanel">×</span>
                    </div>
                    <div class="br-dl-list">${downloadsHtml}</div>
                </div>

                <!-- FIND BAR (hidden by default, accessible via Ctrl+F) -->
                <div class="br-find-bar" id="findBar">
                    <input class="br-find-input" id="findInput" placeholder="Find in page..." />
                    <span class="br-find-count">0/0</span>
                    <div class="br-find-nav">
                        <button class="br-nav-btn" id="findPrev">▲</button>
                        <button class="br-nav-btn" id="findNext">▼</button>
                    </div>
                    <button class="br-nav-btn" id="closeFindBtn">×</button>
                </div>

                ${contextHtml}
                ${modalHtml}
            `;

            // ============================================================
            //  EVENT BINDING
            // ============================================================

            // --- Tab switching ---
            document.querySelectorAll('.br-tab[data-tabid]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.br-tab-close')) return;
                    const id = parseInt(el.dataset.tabid, 10);
                    switchTab(id);
                });
            });

            // --- Tab close ---
            document.querySelectorAll('.br-tab-close[data-closeid]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(el.dataset.closeid, 10);
                    closeTab(id);
                });
            });

            // --- New tab ---
            const newTabBtn = document.getElementById('newTabBtn');
            if (newTabBtn) newTabBtn.addEventListener('click', () => createNewTab());

            // --- Navigation ---
            document.getElementById('backBtn')?.addEventListener('click', goBack);
            document.getElementById('forwardBtn')?.addEventListener('click', goForward);
            document.getElementById('refreshBtn')?.addEventListener('click', refreshPage);
            document.getElementById('homeBtn')?.addEventListener('click', goHome);

            // --- URL input ---
            const urlInput = document.getElementById('urlInput');
            if (urlInput) {
                urlInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') navigateTo(urlInput.value);
                });
            }

            // --- Bookmark bar clicks ---
            document.querySelectorAll('.br-bookmark-item[data-bmurl]').forEach(el => {
                el.addEventListener('click', () => {
                    navigateTo(el.dataset.bmurl);
                });
            });

            // --- Sidebar items ---
            document.querySelectorAll('.br-sidebar-item[data-nav]').forEach(el => {
                el.addEventListener('click', () => {
                    navigateTo(el.dataset.nav);
                    state.sidebarType = null;
                    render();
                });
            });

            // --- Sidebar close ---
            document.querySelectorAll('[data-action="closeSidebar"]').forEach(el => {
                el.addEventListener('click', () => {
                    state.sidebarType = null;
                    render();
                });
            });

            // --- Action buttons ---
            document.getElementById('ghostBtn')?.addEventListener('click', toggleGhostMode);

            document.getElementById('torBtn')?.addEventListener('click', () => {
                state.torEnabled = !state.torEnabled;
                updateStatus(state.torEnabled ? 'Tor active' : 'Tor disabled', state.torEnabled ? 'warning' : 'secure');
                render();
            });

            document.getElementById('scrapeBtn')?.addEventListener('click', () => {
                state.deepScrape = !state.deepScrape;
                updateStatus(state.deepScrape ? 'Deep scrape enabled' : 'Deep scrape disabled', state.deepScrape ?
                    'warning' : 'secure');
                render();
            });

            document.getElementById('bookmarkBtn')?.addEventListener('click', addBookmark);

            document.getElementById('historyBtn')?.addEventListener('click', () => {
                state.sidebarType = state.sidebarType === 'history' ? null : 'history';
                render();
            });

            document.getElementById('downloadsBtn')?.addEventListener('click', () => {
                state.dlPanelOpen = !state.dlPanelOpen;
                render();
            });

            document.getElementById('netBtn')?.addEventListener('click', () => {
                state.networkPanelOpen = !state.networkPanelOpen;
                render();
            });

            document.getElementById('purgeBtn')?.addEventListener('click', purgeSession);

            // --- Network panel close ---
            document.getElementById('closeNetPanel')?.addEventListener('click', () => {
                state.networkPanelOpen = false;
                render();
            });

            // --- Download panel close ---
            document.getElementById('closeDlPanel')?.addEventListener('click', () => {
                state.dlPanelOpen = false;
                render();
            });

            // --- NTP search ---
            const ntpInput = document.getElementById('ntpSearchInput');
            const ntpBtn = document.getElementById('ntpSearchBtn');
            if (ntpInput) {
                ntpInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && ntpInput.value) navigateTo(ntpInput.value);
                });
            }
            if (ntpBtn) {
                ntpBtn.addEventListener('click', () => {
                    if (ntpInput && ntpInput.value) navigateTo(ntpInput.value);
                });
            }

            // --- Quick links ---
            document.querySelectorAll('.br-quick-link[data-nav]').forEach(el => {
                el.addEventListener('click', () => {
                    navigateTo(el.dataset.nav);
                });
            });

            // --- Context menu ---
            const mainContent = document.getElementById('mainContent');
            if (mainContent) {
                mainContent.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    state.contextMenu = { x: Math.min(e.clientX, window.innerWidth - 200), y: Math.min(e.clientY, window
                            .innerHeight - 250) };
                    render();
                });
                mainContent.addEventListener('click', () => {
                    if (state.contextMenu) {
                        state.contextMenu = null;
                        render();
                    }
                });
            }

            // --- Context menu actions ---
            document.querySelectorAll('.br-context-item[data-action]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = el.dataset.action;
                    switch (action) {
                        case 'goBack':
                            goBack();
                            break;
                        case 'goForward':
                            goForward();
                            break;
                        case 'refreshPage':
                            refreshPage();
                            break;
                        case 'addBookmark':
                            addBookmark();
                            break;
                        case 'inspect':
                            updateStatus('DevTools not available in sandbox', 'warning');
                            break;
                    }
                    state.contextMenu = null;
                    render();
                });
            });

            // --- Modal ---
            document.querySelectorAll('[data-action="closeModal"]').forEach(el => {
                el.addEventListener('click', () => {
                    state.modal = null;
                    render();
                });
            });

            document.querySelectorAll('[data-action="confirmModal"]').forEach(el => {
                el.addEventListener('click', () => {
                    if (!state.modal) return;
                    const vals = {};
                    (state.modal.fields || []).forEach(f => {
                        const input = document.getElementById(`modalField_${f.id}`);
                        if (input) vals[f.id] = input.value;
                    });
                    if (state.modal.onConfirm) state.modal.onConfirm(vals);
                    state.modal = null;
                    render();
                });
            });

            // --- Find bar (Ctrl+F) ---
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    state.findBarVisible = !state.findBarVisible;
                    if (state.findBarVisible) {
                        setTimeout(() => {
                            const fi = document.getElementById('findInput');
                            if (fi) { fi.focus();
                                fi.select(); }
                        }, 50);
                    }
                    render();
                }
                if (e.key === 'Escape') {
                    state.findBarVisible = false;
                    render();
                }
            });

            document.getElementById('closeFindBtn')?.addEventListener('click', () => {
                state.findBarVisible = false;
                render();
            });

            // --- Find bar input ---
            const findInput = document.getElementById('findInput');
            if (findInput) {
                findInput.addEventListener('input', (e) => {
                    state.findQuery = e.target.value;
                    // Update count (simulated)
                    const countEl = document.querySelector('.br-find-count');
                    if (countEl) countEl.textContent = state.findQuery ? '1/1' : '0/0';
                });
            }

            // --- Keyboard shortcuts (global) ---
            // We handle Ctrl+T, Ctrl+W, Ctrl+L, Ctrl+D, F5 elsewhere
            // Additional: F5 refresh, Escape close panels
            const keyHandler = (e) => {
                if (e.key === 'F5') { e.preventDefault();
                    refreshPage(); }
                if (e.key === 'Escape') {
                    state.sidebarType = null;
                    state.networkPanelOpen = false;
                    state.dlPanelOpen = false;
                    state.contextMenu = null;
                    state.findBarVisible = false;
                    if (state.modal) { state.modal = null; }
                    render();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault();
                    createNewTab(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                    e.preventDefault();
                    if (state.tabs.length > 1) closeTab(state.activeTabId);
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                    e.preventDefault();
                    const ui = document.getElementById('urlInput');
                    if (ui) { ui.focus();
                        ui.select(); }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault();
                    addBookmark(); }
            };
            // Remove old listener if any, then add
            document.removeEventListener('keydown', keyHandler);
            document.addEventListener('keydown', keyHandler);

            // --- NTP search button icon fix (already inline) ---
        }

        // ================================================================
        //  INIT
        // ================================================================
        loadBookmarks();
        loadDownloads();

        // Set proxy port (simulated)
        state.proxyPort = 8080;

        // Initial load - show new tab
        state.currentHtml = '';
        render();

        // Add initial log entries
        addLog('GET', 200, '/session/init');
        addLog('POST', 200, '/tunnel/establish');

        // Update status
        updateStatus('Ready', 'secure');
        render();

        // Expose functions to window for inline use
        window.navigateTo = navigateTo;
        window.downloadUrl = downloadUrl;
        window.scrapeUrl = scrapeUrl;
        window.sendToImint = sendToImint;
        window.addBookmark = addBookmark;
        window.purgeSession = purgeSession;
        window.goBack = goBack;
        window.goForward = goForward;
        window.refreshPage = refreshPage;
        window.goHome = goHome;

        console.log('[OBSIDIAN OS] Browser initialized. Proxy port:', state.proxyPort);
    </script>

</body>
</html>
