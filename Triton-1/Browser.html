<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian OS · Browser v2.4.1</title>

    <!-- Google Fonts: IBM Plex Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BRAND COLORS (Original — cyan/white/grey)
           ============================================================ */
        :root {
            --cyan: #00d4d4;
            --cyan-bright: #00ffff;
            --cyan-dim: #006666;
            --white: #e8e8e8;
            --grey-100: #c0c0c0;
            --grey-200: #909090;
            --grey-300: #606060;
            --grey-400: #404040;
            --grey-500: #282828;
            --grey-600: #181818;
            --black: #0a0a0a;
            --black-deep: #050505;
            --red: #ff4040;
            --amber: #d4a000;
            --green: #00d46a;
        }

        /* Hide scrollbar */
        html,
        body,
        .br-root {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        .br-root::-webkit-scrollbar {
            display: none;
            width: 0;
            background: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Sans', 'JetBrains Mono', sans-serif;
            background: var(--black-deep);
            color: var(--white);
            height: 100vh;
            overflow: hidden;
        }

        .br-root {
            font-family: 'IBM Plex Sans', 'JetBrains Mono', sans-serif;
            background: var(--black-deep);
            color: var(--white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            user-select: none;
        }

        /* ============================================================
           ALL ORIGINAL CSS (unchanged)
           ============================================================ */

        .br-title-bar {
            height: 32px;
            background: var(--grey-600);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--grey-400);
            flex-shrink: 0;
        }
        .br-title-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .br-os-logo {
            width: 18px;
            height: 18px;
            border: 1px solid var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            font-weight: 600;
            color: var(--cyan);
        }
        .br-title-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--grey-200);
            letter-spacing: 1px;
        }
        .br-window-controls {
            display: flex;
            gap: 6px;
        }
        .br-win-btn {
            width: 12px;
            height: 12px;
            border: 1px solid var(--grey-300);
            background: var(--grey-500);
            cursor: pointer;
            transition: all 0.1s;
        }
        .br-win-btn:hover {
            border-color: var(--cyan);
        }
        .br-win-btn.close-btn:hover {
            background: var(--red);
            border-color: var(--red);
        }

        .br-tab-bar {
            height: 36px;
            background: var(--grey-600);
            display: flex;
            align-items: flex-end;
            padding: 0 8px;
            gap: 2px;
            border-bottom: 1px solid var(--grey-400);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .br-tab-bar::-webkit-scrollbar {
            height: 2px;
        }
        .br-tab {
            height: 30px;
            min-width: 160px;
            max-width: 240px;
            background: var(--grey-500);
            border: 1px solid var(--grey-400);
            border-bottom: none;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }
        .br-tab:hover {
            background: var(--grey-400);
        }
        .br-tab.active {
            background: var(--black-deep);
            border-color: var(--cyan-dim);
            border-bottom: 1px solid var(--black-deep);
        }
        .br-tab-icon {
            width: 14px;
            height: 14px;
            border: 1px solid var(--grey-300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            color: var(--grey-200);
        }
        .br-tab-title {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--grey-200);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .br-tab.active .br-tab-title {
            color: var(--white);
        }
        .br-tab-close {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--grey-300);
            cursor: pointer;
            transition: color 0.1s;
        }
        .br-tab-close:hover {
            color: var(--red);
        }
        .br-new-tab-btn {
            width: 30px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--grey-300);
            cursor: pointer;
            margin-left: 4px;
            transition: color 0.1s;
        }
        .br-new-tab-btn:hover {
            color: var(--cyan);
        }

        .br-nav-bar {
            height: 44px;
            background: var(--black);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border-bottom: 1px solid var(--grey-400);
            flex-shrink: 0;
        }
        .br-nav-group {
            display: flex;
            gap: 2px;
        }
        .br-nav-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            border: 1px solid var(--grey-500);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            color: var(--grey-200);
            flex-shrink: 0;
        }
        .br-nav-btn svg {
            width: 16px;
            height: 16px;
        }
        .br-nav-btn:hover:not(:disabled) {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .br-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .br-nav-btn.active {
            background: var(--cyan-dim);
            border-color: var(--cyan);
            color: var(--white);
        }

        .br-url-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .br-security-indicator {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .br-security-indicator.secure {
            color: var(--green);
        }
        .br-security-indicator.warning {
            color: var(--amber);
        }
        .br-security-indicator.danger {
            color: var(--red);
        }
        .br-url-bar {
            flex: 1;
            height: 32px;
            background: var(--grey-600);
            border: 1px solid var(--grey-400);
            display: flex;
            align-items: center;
            padding: 0 12px;
        }
        .br-url-bar:focus-within {
            border-color: var(--cyan);
        }
        .br-url-tunnel-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--cyan);
            background: var(--cyan-dim);
            padding: 2px 6px;
            margin-right: 8px;
            white-space: nowrap;
        }
        .br-url-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--white);
            letter-spacing: 0.5px;
        }
        .br-url-input::placeholder {
            color: var(--grey-300);
        }

        .br-action-group {
            display: flex;
            gap: 4px;
        }
        .br-action-btn {
            height: 28px;
            padding: 0 12px;
            background: transparent;
            border: 1px solid var(--grey-500);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--grey-200);
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .br-action-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .br-action-btn.active {
            background: var(--cyan-dim);
            border-color: var(--cyan);
            color: var(--white);
        }
        .br-action-btn.danger:hover {
            border-color: var(--red);
            color: var(--red);
        }
        .br-indicator {
            width: 6px;
            height: 6px;
            background: var(--grey-400);
        }
        .br-action-btn.active .br-indicator {
            background: var(--cyan);
            animation: br-pulse-ind 1.5s infinite;
        }
        @keyframes br-pulse-ind {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .br-bookmarks-bar {
            height: 28px;
            background: var(--grey-600);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 4px;
            border-bottom: 1px solid var(--grey-400);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .br-bookmarks-bar::-webkit-scrollbar {
            height: 2px;
        }
        .br-bookmark-item {
            height: 20px;
            padding: 0 10px;
            background: transparent;
            border: 1px solid transparent;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--grey-200);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.1s;
        }
        .br-bookmark-item:hover {
            background: var(--grey-500);
            border-color: var(--grey-400);
            color: var(--white);
        }
        .br-bookmark-icon {
            width: 12px;
            height: 12px;
            border: 1px solid var(--grey-400);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
        }

        .br-main-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .br-sidebar {
            width: 280px;
            background: var(--grey-600);
            border-right: 1px solid var(--grey-400);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .br-sidebar.open {
            transform: translateX(0);
        }
        .br-sidebar-header {
            height: 40px;
            background: var(--grey-500);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--grey-400);
        }
        .br-sidebar-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--grey-100);
        }
        .br-sidebar-close {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--grey-300);
            cursor: pointer;
            transition: color 0.1s;
            font-size: 14px;
        }
        .br-sidebar-close:hover {
            color: var(--red);
        }
        .br-sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .br-sidebar-item {
            padding: 8px 10px;
            background: transparent;
            border: 1px solid transparent;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .br-sidebar-item:hover {
            background: var(--grey-500);
            border-color: var(--grey-400);
        }
        .br-sidebar-item-title {
            font-size: 11px;
            color: var(--grey-100);
            margin-bottom: 4px;
        }
        .br-sidebar-item-url {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--cyan-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .br-sidebar-item-time {
            font-size: 9px;
            color: var(--grey-400);
            margin-top: 4px;
        }

        .br-viewport {
            flex: 1;
            background: var(--black);
            position: relative;
            overflow: hidden;
            overflow-y: auto;
        }

        .br-status-bar {
            height: 24px;
            background: var(--grey-600);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-top: 1px solid var(--grey-400);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--grey-300);
            flex-shrink: 0;
        }
        .br-status-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .br-status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .br-status-dot {
            width: 6px;
            height: 6px;
            background: var(--green);
        }
        .br-status-dot.warning {
            background: var(--amber);
        }
        .br-status-dot.danger {
            background: var(--red);
        }
        .br-status-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .br-network-panel {
            position: fixed;
            bottom: 24px;
            right: 0;
            width: 400px;
            height: 300px;
            background: var(--grey-600);
            border: 1px solid var(--grey-400);
            border-right: none;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .br-network-panel.open {
            transform: translateX(0);
        }
        .br-network-panel-header {
            height: 32px;
            background: var(--grey-500);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--grey-400);
            flex-shrink: 0;
        }
        .br-network-panel-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--grey-100);
        }
        .br-network-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }
        .br-log-entry {
            padding: 6px 12px;
            border-bottom: 1px solid var(--grey-500);
            display: flex;
            gap: 8px;
            animation: br-log-appear 0.2s ease-out;
        }
        @keyframes br-log-appear {
            from {
                opacity: 0;
                background: rgba(0, 212, 212, 0.1);
            }
            to {
                opacity: 1;
                background: transparent;
            }
        }
        .br-log-method {
            width: 45px;
            font-weight: 600;
        }
        .br-log-get {
            color: var(--cyan);
        }
        .br-log-post {
            color: var(--amber);
        }
        .br-log-put {
            color: var(--green);
        }
        .br-log-delete {
            color: var(--red);
        }
        .br-log-success {
            color: var(--green);
        }
        .br-log-redirect {
            color: var(--amber);
        }
        .br-log-error {
            color: var(--red);
        }
        .br-log-status {
            width: 35px;
        }
        .br-log-url {
            flex: 1;
            color: var(--grey-200);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .br-log-time {
            color: var(--grey-400);
            width: 60px;
            text-align: right;
        }

        .br-dl-panel {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 320px;
            max-height: 250px;
            background: var(--grey-600);
            border: 1px solid var(--grey-400);
            border-left: none;
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .br-dl-panel.open {
            transform: translateX(0);
        }
        .br-dl-panel-header {
            height: 32px;
            background: var(--grey-500);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--grey-400);
            flex-shrink: 0;
        }
        .br-dl-panel-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--grey-100);
        }
        .br-dl-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .br-dl-item {
            padding: 10px;
            background: var(--grey-500);
            border: 1px solid var(--grey-400);
            margin-bottom: 6px;
        }
        .br-dl-filename {
            font-size: 11px;
            color: var(--white);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .br-dl-bar {
            height: 3px;
            background: var(--grey-400);
            margin-bottom: 6px;
        }
        .br-dl-fill {
            height: 100%;
            background: var(--cyan);
            transition: width 0.3s;
        }
        .br-dl-info {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--grey-300);
        }

        .br-loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 1000;
            display: none;
        }
        .br-loading-bar.active {
            display: block;
        }
        .br-loading-progress {
            height: 100%;
            background: var(--cyan);
            transition: width 0.3s;
        }

        .br-find-bar {
            position: fixed;
            top: 140px;
            right: 20px;
            background: var(--grey-600);
            border: 1px solid var(--grey-400);
            padding: 8px 12px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }
        .br-find-bar.visible {
            display: flex;
        }
        .br-find-input {
            width: 200px;
            height: 28px;
            background: var(--grey-500);
            border: 1px solid var(--grey-400);
            padding: 0 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--white);
            outline: none;
        }
        .br-find-input:focus {
            border-color: var(--cyan);
        }
        .br-find-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--grey-300);
        }
        .br-find-nav {
            display: flex;
            gap: 2px;
        }

        .br-context-menu {
            position: fixed;
            background: var(--grey-600);
            border: 1px solid var(--grey-400);
            min-width: 180px;
            z-index: 2000;
        }
        .br-context-item {
            padding: 8px 12px;
            font-size: 11px;
            color: var(--grey-100);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.1s;
            font-family: 'JetBrains Mono', monospace;
        }
        .br-context-item:hover {
            background: var(--grey-500);
        }
        .br-context-shortcut {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--grey-400);
        }
        .br-context-divider {
            height: 1px;
            background: var(--grey-400);
            margin: 4px 0;
        }

        .br-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .br-modal-overlay.visible {
            display: flex;
        }
        .br-modal {
            background: var(--grey-600);
            border: 1px solid var(--grey-400);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .br-modal-header {
            height: 40px;
            background: var(--grey-500);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--grey-400);
        }
        .br-modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--grey-100);
        }
        .br-modal-close {
            color: var(--grey-300);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.1s;
            background: transparent;
            border: none;
        }
        .br-modal-close:hover {
            color: var(--red);
        }
        .br-modal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .br-modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--grey-400);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .br-form-label {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--grey-300);
            margin-bottom: 6px;
            display: block;
            font-family: 'JetBrains Mono', monospace;
        }
        .br-form-input {
            width: 100%;
            height: 36px;
            background: var(--grey-500);
            border: 1px solid var(--grey-400);
            padding: 0 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--white);
            outline: none;
            margin-bottom: 12px;
        }
        .br-form-input:focus {
